const VER = { tag:'正式', code:'v1.0.3', name:'元初·万素始源' };
function gearBtnPos(){ return { x: W - 26*S, y: 26*S, r: 18*S }; }

function drawGearBtn(){
  const g = gearBtnPos();
  ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(30,38,56,0.85)'; ctx.fill();
  ctx.strokeStyle = 'rgba(120,145,185,0.5)'; ctx.lineWidth = 1.2*S; ctx.stroke();

  // 齿轮：外圈 8 齿 + 中心孔
  ctx.save();
  ctx.translate(g.x, g.y);
  ctx.fillStyle = '#cfdcf2';
  for (let i=0; i<8; i++){
    ctx.save();
    ctx.rotate(i * Math.PI/4);
    ctx.beginPath();
    ctx.rect(-g.r*0.11, -g.r*0.68, g.r*0.22, g.r*0.30);
    ctx.fill();
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(0, 0, g.r*0.46, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(30,38,56,0.95)';
  ctx.beginPath(); ctx.arc(0, 0, g.r*0.22, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawVersionTag(){
  ctx.textAlign = 'left';
  font(9, 500);
  ctx.fillStyle = 'rgba(140,158,190,0.7)';
  ctx.fillText(VER.code + ' · ' + VER.tag + '版', 14*S, H - 12*S);
}

  'v0.7.9：风元素技能按新设定重做（本体与蓄风普攻不动）。被动改为「游风引势」：命中叠一层游风标记，上限 5 层、持续 3.3 秒，每层不再拉扯减速，而是留下可见「风迹」供风刃折射与斩节点偏轨；每层提升 7% 风伤害；叠满触发「风蚀」1 秒，周身生成紊乱交叉的短气流斩线快速来回扫动（透明度 0.58），并迸射 26 片风刃碎片沿随机切线高速飞旋 0.48 秒，风蚀期间细碎风刃切削每 0.25 秒掉血、不封锁技能，结束清空标记；受火直接清空并封锁 0.7 秒；接触雷/水/冰标记时叠速翻倍。',
  'v0.7.9：二技能改为「逐风折刃」——总时长 620ms：0~150ms 蓄刃（风晶外延凝聚三道狭长风刃、各自独立方位不绕圈，地面只留半径 24px 的短暂气流印记）；150~410ms 三刃**依次先后发射**（间隔 120ms，各自细长半透明气流拖尾、沿途持续掉落风絮粒子），命中带游风标记的目标或标记点位会**折射一次、自动转向最近的另一标记目标**，每道最多折射 2 次，命中稳定叠一层游风；410~620ms 拖尾自末端向前消散，不再收拢、不做环形爆炸。实测贴脸三刃吃满 16.2。',
  'v0.7.9：大招改为「长风溯旅」——总时长 3050ms + 600ms 收尾（共 3650ms）：0~430ms 长风起势（由风晶向外拉出一条长条蜿蜒风轨，五组斩风节点悬浮分布在轨上，上方流云雾顺着轨道流向飘动）；430~1850ms 巡风掠斩（节点沿整条风轨**往复高速巡行**，扫到即伤并叠一层游风，轨内游风标记暂停衰减、带标记目标会牵引节点偏轨）；1850~2420ms 聚斩蓄势（节点停止巡行、向风晶依次汇集、斩面加厚，并生成指向标记目标的细风引线）；2420~3050ms 万刃溯斩（沿风轨一次性释放**贯通式长距纵向斩面**，中心轴线最高、向两侧衰减，叠加淡青闪光蒙版 0.25 持续 5 帧）；3050~3650ms 长风远逝（斩面自远端向风晶熄灭、轨道纹路依次熄灭）。站中心吃满实测 82.9，剩 17%，不会直接秒杀。大招期间本体不被锁定，可自由移动（等效沿风轨滑移）。',
  'v0.7.8：风元素按设定文档补齐全套技能（本体与原有蓄风普攻不动）。被动「紊风缠袭」：命中叠加紊风标记，上限 5 层、持续 3.3 秒、每层减速 5% 并小幅把敌方往风晶方向拉扯，每层提升 7% 风伤害；叠满触发「紊裂」1 秒，周身三层旋转气流环（透明度 0.58）顺时针流动，同时迸发 26 片轻薄风刃碎片沿切线高速飞旋、0.48 秒内衰减，紊裂期间气流撕扯每 0.25 秒掉血但不封锁技能，结束清空标记；受火命中直接吹散全部紊风并封锁 0.7 秒，接触雷感电 / 潮湿 / 寒霜标记时叠加速度翻倍；风晶待机持续螺旋飘散风絮粒子（每帧上限 6）。',
  'v0.7.8：风二技能「旋刃风涡」——总时长 620ms：0~150ms 涡风蓄聚（气流丝收缩、地面气流基底扩至 58px、4 片风刃逆时针预备）；150~410ms 涡旋成型（风刃涡环半径 68px、每秒 5 圈、每 130ms 结算 2.4 点并稳定叠一层紊风，切线甩出螺旋风絮）；410~620ms 涡崩刃散（向内收拢后爆出环形切割风压，半径 88px、中心 8 点并向外衰减）。实测贴脸吃满 15.9 点。',
  'v0.7.8：风大招「罡风千旋」——总时长 3650ms：0~430ms 罡域启旋（风域扩至 168px、6 根风刃柱悬浮）；430~1850ms 紊域锁缚（每 205ms 结算 2.9 点并叠紊风，风刃柱每秒 1.7 圈逆时针旋转、域内紊风标记衰减暂停并受微弱向内拉扯）；1850~2420ms 罡风增压（风刃柱收拢增厚 33%、风絮密度提升）；2420~3050ms 千刃坍旋（6 根风刃柱依次落点、每根额外叠一层紊风，全部落地后中心绽开风旋花并叠一层淡青闪光蒙版）；3050~3650ms 长风消散。全程站中心吃满实测 82 点，剩 18%，不会直接秒杀。',
  'v0.7.7：黑洞新增被动「奇点吞噬」——敌方只要踏进黑洞身边 2.35 球范围，立刻被吞噬秒杀（伤害为直接掏空血量，不看剩余血量、不触发格挡免伤），触发时播放空间扭曲特效：脚下奇点边界暗环与扭曲弧线、吞噬瞬间三道向中心塌缩的折叠环、12 道径向吸入拉伸光丝、4 帧白闪，并弹「奇点吞噬 · 秒杀」提示。',
  'v0.7.7：黑洞改为解锁制——选人页默认锁定，卡片显示「🔒 三人混战胜场 x / 200」，点击会提示还差多少胜；随机按钮与电脑 P3 的抽取池都会跳过未解锁元素。胜场计数新增并本地存档：选人页中部与结算页显示「三人混战胜场 x / 200 · 累计 y 胜」，三人混战获胜记 ffa 胜场、1v1 记 duel 胜场，满 200 混战胜场即解锁黑洞。',
  'v0.7.6：修复黑洞普攻「引力矢」一打出就整局崩溃的问题（弹道绘制里引用了不存在的帧时间变量，导致每次投出引力矢必抛异常）。重建为黑洞自身外观：斜置 -0.42 弧度的迷你吸积盘随飞行旋转、暖金内核 + 紫晕引力场、纯黑事件视界与光子环，不再沿用暗元素的黑雾模型；伤害 3 点、间隔 0.55 秒、射程 4.6 球不变。另按你的要求删除中子星那个生成在画布外、完全打不到人的越界一技能（配置/发射/结算/绘制四处代码一并清掉），技能槽回到「待定」，留待后续设定。黑洞一技能「奇点坍缩」保留可用。',
  'v0.7.5：新增两个可选元素「黑洞」与「中子星」（选人页第 9、10 格，可滚动查看）。黑洞本体：整体斜置 -0.42 弧度，吸积盘为压扁椭圆、14 道亮斑沿轨道持续流动旋转（1.15 圈/秒），盘面内外两道流动细弧，纯黑事件视界 + 双圈光子环（暖金 #FFE4B4 / 紫晕 #8A5CFF）+ 上下两道引力透镜弧 + 外围引力场晕。中子星本体：亮蓝星体（#3EA6FF 到 #FFFFFF 内核）持续自转，表面四层能量带随自转周向滚动，两侧磁极对射光束以 1.9 圈/秒扫动，三层磁力线环缓慢环绕，外圈光子环 + 磁层辉光。',

  'v0.7.2：冰元素被动「霜凝积寒」实装。冰晶本体所有特效锚点锁在多面冰晶几何中心（冰晶本体 #D6F7FF／寒霜印记 #87CEF8／冻结冰层 #52A8D8／霜花粒子 #F0FCFF）。敌方被冰伤命中叠一层寒霜标记，上限 5 层、每层 −7% 移速、单层 3.2 秒；叠满 5 层触发凝霜 1.1 秒，凝霜期间禁止移动但不封技能，结束清空全部标记。凝霜瞬间生成六边形薄冰壳（透明度 0.65）＋边缘锐利冰棱，霜纹自接触点向外蔓延，同时迸发 22 片 2~5px 冰晶碎片，0.45 秒淡出。冰伤打带标记目标每层 +8% 伤害；本体持续飘 1~2px 霜花（每帧 ≤6 颗、横向微摆、无伤害）。受雷击时标记清零并封锁 0.8 秒叠加；与水潮湿接触叠加速度翻倍、凝霜 +0.4 秒。',
  'v0.7.2：冰元素大招「永寂冰原」实装。总长 3.7 秒（0~3.1s 结算、3.1~3.7s 收尾）。阶段1 0~450ms 前摇无伤：冰晶棱角脉动冰刺、地面冰域 0→170px 扩张、放射冰裂纹、寒雾＋大雪片、8 根预备冰棱。阶段2 450~1900ms：冰域固定，每 210ms 结算冰伤并稳定叠一层寒霜，8 根冰棱顺时针 1.8 圈/秒旋转、靠近敌人弹冰刺额外叠层，冰域内标记暂停衰减，暴雪粒子＋冷调波纹。阶段3 1900~2500ms：冰棱收拢、宽度 +30%，暴雪上限升至 110，地面冰格全亮，带标记敌人脚下收缩冰环，本体高光频闪加快。阶段4 2500~3100ms：8 根巨型冰棱依次砸落（落地前 80ms 白色预警圈），冲击波厚度 18px 并留 0.7 秒厚冰壳，全部落地后中心冰花逐层绽放、峰值叠加 0.28 透明度淡蓝闪光（5 帧），碎片上限 140，伤害由中心向外衰减。阶段5 3100~3700ms 收尾无伤，花瓣与冰棱消融、冰域收缩熄灭、寒雾淡出、滤镜恢复。渲染顺序严格为：地面冰裂纹与冰格→寒雾层→旋转/坠落冰棱→暴雪与碎片→冰花→冲击波→冰晶本体→冰晶 bloom→闪光蒙版与冷调滤镜。联动：遇水潮湿 → 冰域扩张更快、半径 +25px 量级、冰棱 8→12 根；遇雷感电 → 当场小型冰爆并清空寒霜；遇火灼烧 → 收缩加快、时长缩短、亮度降低、爆发伤害 −22%。CD 42 秒。',

  'v0.7.1：雷元素大招「天罚·紫雷星狱」实装。总长 3400ms，四个结算点满吃合计 27+12+18+3＝60 点，属全屏级引导大招。①蓄力 0~400ms：地面法阵渐显，三圈光环向内收束，8 道逆向电弧从外环汇回菱形晶，22 颗光尘同步内聚；此段无伤害。②环形雷压 400~1600ms：判定半径 5.2 球，环墙贴地展开并脉动，12 道雷柱自环上竖直劈落，每道落点炸火花；结算 27 点。③雷星过载 1600~2200ms：星核从 1.2 球鼓胀到 3.1 球，6 条直芒绕轴旋转切割，对范围内敌人持续拉出主电弧并挂 3 道贴轮廓弧；结算 12 点，全屏泛紫雾。④紫雷星陨爆发 2200~2800ms：18 道紫雷全向喷射、地面菱形炸痕、紫闪 120ms；结算 18 点，且此阶段跑出 3.6 球外环只吃 40%（×0.4 衰减）。⑤余雷收束 2800~3400ms：环体收缩、10 道余电飘散；结算 3 点。星狱压制：进入阶段后每 350ms 叠一层，上限 6 层，每层减速 8%，引导结束立即清空。引导全程自身不可移动（摇杆输入被清零），可被格挡与暗罩照常判定；菱形雷晶本体依旧置顶渲染。CD 38 秒。',
  'v0.6.9：雷元素二技能「环雷崩涡」实装，雷元素本体改为菱形透明电光晶核。技能总长 720ms，所有特效锚点都锁在菱形几何中心。①蓄力 0~180ms：四条棱线指数增亮、棱上随机弹分叉电刺，正中收缩光球 22px→8px，四个顶点向外迸发 10~14 根 6~14px 短电弧（每 2~3 帧刷新），沿棱飘出 35 个淡蓝电离微尘，仅菱形周围有噪点扰动。②展开 180~360ms：能量球炸开成三层涡环——底层半透明淡紫电离雾环厚 24px、逆时针 5.2 圈/秒、透明度 0.28；中层分形电弧环主干 4px、分支 1.5~2.5px，每半圈甩 3~6 根 15~35px 外伸闪电；菱形晶始终压在涡层之上，中心每 16ms 爆一次纯白高光。涡内每 0.12s 结算一次伤害并挂【感电】标记（脚下旋转淡紫环，2.2 秒），链式电弧从菱形顶点连到敌人、离场延迟 4 帧断开，环切线持续甩金白火花。③爆发 360~540ms：涡环从 85px 收回到 20px，上顶点拉出 8px 粗、120px 长的主雷击，四顶点朝四个对角射出 4 道 70px 定向电弧，全局闪白 0.32 持续 6 帧，一次性迸发 120 颗火花，带感电的目标与顶点间来回跳电 2 次，地面留下暗紫焦痕与菱形纹路。④消散 540~720ms：主干闪电从远端分段熄灭收回顶点，顶点间残留细丝越来越短，微尘上浮褪灰，焦痕 720ms 完全消失。渲染层级严格为 焦痕→雾环→电弧→火花→菱形本体→中心高光→全局闪光。元素反应：自身潮湿时四棱加粗、分支翻倍、涡半径 +20%、感电 +1 秒；对手带冰则电弧裹淡冰蓝、抖动减弱、闪光减弱；对手带火则爆发额外炸橙红爆粒、判定范围再扩 1.4 倍。CD 12 秒。',

  'v0.6.6：暗、光二技能实装。暗·「噬影突袭」：沿朝向突进 3.4 球，穿透路径 7 点暗伤、终点再爆 5 点，命中带蚀影立即引爆（+8 爆发 + 减速），穿火池会带灼烧，撞光柱/耀光结界直接被打断失效，CD 12 秒。光·「曜断光柱」：锁定对手站位降下垂直光柱，0.6 秒预警圈可走位躲，命中 14 点光伤 + 带显影追加 10 点审判，扫过暗雾/影蚀区直接清除，命中冰附着折射扩范围，CD 12 秒。',

function wrapText(text, maxW, size, weight){
  const words = text.length ? Array.from(text) : [''];
  const lines = [];
  let line = '';
  font(size, weight);
  for (const ch of words){
    const test = line + ch;
    if (ctx.measureText(test).width > maxW && line.length){
      lines.push(line); line = ch;
    } else line = test;
  }
  if (line.length) lines.push(line);
  return lines;
}

function drawSettings(){
  // 蒙层
  ctx.fillStyle = 'rgba(4,6,12,0.86)';
  ctx.fillRect(0, 0, W, H);

  const p = settingsRect();
  rrPath(p.x, p.y, p.w, p.h, 16*S);
  ctx.fillStyle = 'rgba(16,22,34,0.98)'; ctx.fill();
  ctx.strokeStyle = 'rgba(90,120,170,0.55)'; ctx.lineWidth = 1.5*S; ctx.stroke();

  // 标题
  ctx.textAlign = 'left';
  font(16); ctx.fillStyle = '#e8f0ff';
  ctx.fillText('设置', p.x + 18*S, p.y + 30*S);

  // 版本徽标
  ctx.textAlign = 'right';
  font(10, 500); ctx.fillStyle = 'rgba(150,168,200,0.85)';
  ctx.fillText(VER.code + ' · ' + VER.tag + ' · ' + VER.name, p.x + p.w - 18*S, p.y + 30*S);

  // 分隔线
  ctx.strokeStyle = 'rgba(90,110,150,0.35)'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(p.x + 18*S, p.y + 42*S);
  ctx.lineTo(p.x + p.w - 18*S, p.y + 42*S);
  ctx.stroke();

  // 公告：单栏大字，上下滑动查看（不再挤成两栏小字）
  const box = {
    x: p.x + 16*S,
    y: p.y + 52*S,
    w: p.w - 32*S - 8*S,
    h: settingsBtns()[0].y - (p.y + 52*S) - 12*S
  };
  noticeRect = box;

  // 先排版，算出总高度（用于滚动上限）
  const FS = 15, LH = 25*S, TITLE_GAP = 14*S;
  const blocks = [];
  let total = 0;
  const pushSection = (title, color)=>{
    const tLines = wrapText(title, box.w - 10*S, 17);
    blocks.push({ lines: tLines, size: 17, color, lh: 28*S, kind: 'head' });
    total += 28*S * tLines.length + TITLE_GAP;
  };
  const pushList = (list, color, kind)=>{
    for (const raw of list){
      if (raw === ''){
        blocks.push({ blank: true, h: LH*0.5 }); total += LH*0.5; continue;
      }
      const lines = wrapText(raw, box.w - 22*S, FS);
      /* 超长公告：按 18 行切块，避免整条长度超过视口高度后渲染被跳过、文字消失 */
      const CHUNK = 18;
      for (let ci = 0; ci < lines.length; ci += CHUNK){
        const part = lines.slice(ci, ci + CHUNK);
        blocks.push({ lines: part, size: FS, color, lh: LH, kind,
                      first: ci === 0, more: ci + CHUNK >= lines.length });
        total += part.length * LH;
      }
    }
  };

  pushSection('更新记录', '#9ec9ff');
  pushList(CHANGELOG, 'rgba(198,214,238,0.94)', 'change');
  pushSection('当前机制', '#9df0d5');
  pushList(NOTICE, 'rgba(190,214,206,0.92)', 'notice');
  total += 10*S;

  noticeMaxScroll = Math.max(0, total - box.h + 14*S);
  noticeScroll = clamp(noticeScroll, 0, noticeMaxScroll);

  // 内容区裁剪 + 滚动渲染
  ctx.save();
  rrPath(box.x, box.y, box.w, box.h, 10*S);
  ctx.clip();
  let ly = box.y + 6*S - noticeScroll;
  for (const b of blocks){
    if (b.blank){ ly += b.h; continue; }
    // 头部（段标题）：左侧色条
    if (b.kind === 'head'){
      if (ly + 24*S >= box.y && ly <= box.y + box.h){
        ctx.fillStyle = b.color;
        ctx.fillRect(box.x + 2*S, ly - 12*S, 3*S, 16*S);
        font(17); ctx.textAlign = 'left'; ctx.fillStyle = b.color;
        b.lines.forEach((ln, k)=> ctx.fillText(ln, box.x + 12*S, ly + k*28*S));
      }
      ly += 28*S * b.lines.length + TITLE_GAP;
      continue;
    }
    if (ly < box.y + box.h && ly + b.lh > box.y - b.lh){
      font(b.size, 500);
      ctx.textAlign = 'left';
      b.lines.forEach((ln, k)=>{
        // 版本号行高亮
        const isVer = (b.kind === 'change') && /^v0\./.test(ln);
        ctx.fillStyle = isVer ? '#8fd0ff' : b.color;
        ctx.fillText(ln, box.x + (isVer ? 8*S : 18*S), ly + k*b.lh);
      });
      // 每条记录前的项目点
      if (b.kind === 'change' || b.kind === 'notice'){
        ctx.fillStyle = 'rgba(120,150,190,0.6)';
        ctx.beginPath();
        ctx.arc(box.x + 8*S, ly - 4*S, 2*S, 0, Math.PI*2);
        ctx.fill();
      }
    }
    ly += b.lh * b.lines.length;
  }
  ctx.restore();

  // 滚动条
  if (noticeMaxScroll > 1){
    const trackX = box.x + box.w - 3*S;
    ctx.fillStyle = 'rgba(90,110,150,0.28)';
    rrPath(trackX, box.y, 4*S, box.h, 2*S); ctx.fill();
    const thumbH = Math.max(28*S, box.h * (box.h / (box.h + noticeMaxScroll)));
    const thumbY = box.y + (box.h - thumbH) * (noticeScroll / noticeMaxScroll);
    ctx.fillStyle = 'rgba(140,185,240,0.85)';
    rrPath(trackX, thumbY, 4*S, thumbH, 2*S); ctx.fill();
  }

  // 顶部/底部渐隐，暗示可继续滚
  const fadeH = 14*S;
  const gt = ctx.createLinearGradient(0, box.y, 0, box.y + fadeH);
  gt.addColorStop(0, 'rgba(16,22,34,0.95)');
  gt.addColorStop(1, 'rgba(16,22,34,0)');
  ctx.fillStyle = gt; ctx.fillRect(box.x, box.y, box.w - 6*S, fadeH);
  const gb = ctx.createLinearGradient(0, box.y + box.h - fadeH, 0, box.y + box.h);
  gb.addColorStop(0, 'rgba(16,22,34,0)');
  gb.addColorStop(1, 'rgba(16,22,34,0.95)');
  ctx.fillStyle = gb; ctx.fillRect(box.x, box.y + box.h - fadeH, box.w - 6*S, fadeH);

  // 滑动提示
  ctx.textAlign = 'right';
  font(9, 500); ctx.fillStyle = 'rgba(130,150,185,0.7)';
  ctx.fillText('↕ 上下滑动', p.x + p.w - 18*S, p.y + 48*S);

  settingsBtns().forEach(b=>{
    rrPath(b.x, b.y, b.w, b.h, b.h/2);
    ctx.fillStyle = 'rgba(38,48,70,0.95)'; ctx.fill();
    ctx.strokeStyle = 'rgba(110,140,185,0.7)'; ctx.lineWidth = 1.2*S; ctx.stroke();
    ctx.textAlign = 'center';
    font(12); ctx.fillStyle = '#dfe8f8';
    ctx.fillText(b.label, b.x + b.w/2, b.y + b.h*0.62);
  });

  ctx.textAlign = 'center';
  font(9, 500); ctx.fillStyle = 'rgba(130,145,175,0.7)';
  ctx.fillText('点击面板外区域也可关闭', W/2, p.y + p.h + 16*S <= H - 6*S ? p.y + p.h + 16*S : H - 6*S);
}

let selScroll1 = 0, selScroll2 = 0, selDrag = null, selTap = null;

function selectLayout(){
  const pad = Math.round(18*S);
  const midW = Math.round(150*S);
  const panelW = (W - pad*2 - midW) / 2;
  const top = UI.hud + Math.round(10*S);
  const h = H - top - Math.round(80*S);
  const gap = Math.round(10*S);
  const cols = 3;
  const headH = Math.round(30*S);                    // 面板顶部标题条
  const bodyY = top + pad + headH;
  const bodyH = h - pad*2 - headH;
  const cw = (panelW - pad*2 - gap*(cols-1)) / cols;
  const rowsVisible = 3;                              // 一屏露 3 行，多了往下滑
  const ch = (bodyH - gap*(rowsVisible-1)) / rowsVisible;
  const mk = (px)=> ALL_KEYS.map((k,i)=>({
    key:k,
    x: px + pad + (i%cols)*(cw+gap),
    y: bodyY + Math.floor(i/cols)*(ch+gap),
    w: cw, h: ch
  }));
  const rows = Math.ceil(ALL_KEYS.length / cols);
  const contentH = rows*(ch+gap) - gap;
  const card1 = mk(pad), card2 = mk(W-pad-panelW);
  // 随机按钮：贴在各自面板「外侧」，P1 在面板右边、P2 在面板左边，都朝中间但不越过 VS 中线
  const rbW = Math.round(Math.min(52*S, midW*0.40));
  const rbH = Math.round(Math.min(52*S, h*0.26));
  const rbY = top + h*0.58;
  const rand1 = { x: pad + panelW + Math.round(6*S), y: rbY, w: rbW, h: rbH };
  const rand2 = { x: W - pad - panelW - Math.round(6*S) - rbW, y: rbY, w: rbW, h: rbH };
  return {
    p1:{ x:pad, y:top, w:panelW, h },
    p2:{ x:W-pad-panelW, y:top, w:panelW, h },
    body1:{ x:pad, y:bodyY, w:panelW, h:bodyH },
    body2:{ x:W-pad-panelW, y:bodyY, w:panelW, h:bodyH },
    cards1: card1, cards2: card2,
    rand1, rand2,
    max1: Math.max(0, contentH - bodyH),
    max2: Math.max(0, contentH - bodyH),
    start:{ x: W/2 - Math.round(70*S), y: H - Math.round(70*S), w: Math.round(140*S), h: Math.round(48*S) }
  };
}
let selL = null;

function drawRandBtn(b, col, live, label){

  ctx.fillStyle = live ? 'rgba(30,44,68,0.95)' : 'rgba(18,24,36,0.8)';
  ctx.fill();
  ctx.strokeStyle = live ? col : 'rgba(90,110,150,0.45)';
  ctx.lineWidth = live ? 1.8*S : 1*S;
  ctx.stroke();

  const cx = b.x + b.w/2;
  const cy = b.y + b.h*0.36;
  const d = Math.min(b.w, b.h) * 0.30;
  ctx.fillStyle = live ? 'rgba(200,225,255,0.92)' : 'rgba(140,160,190,0.55)';
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(pt=>{
    ctx.beginPath();
    ctx.arc(cx + pt[0]*d/2, cy + pt[1]*d/2, Math.max(1.4, d*0.16), 0, Math.PI*2);
    ctx.fill();
  });

  ctx.textAlign = 'center';
  font(10.5, 600);
  ctx.fillStyle = live ? '#eaf2ff' : 'rgba(170,190,220,0.75)';
  ctx.fillText(label, cx, b.y + b.h*0.84);
}

    });
    ctx.restore();

    // 滚动条 + 提示

      ctx.textAlign = 'right';

  });

  // 随机按钮（面板外侧，靠中线但不越线）
  drawRandBtn(L.rand1, sel.p1 ? ELEM[sel.p1].color : 'rgba(150,180,225,0.9)', true,

  if (mode === 'ffa'){

/* ========================= 角色本体 ========================= */
/* 五元素各有一套专属剪影：焰灵 / 流体 / 棱体 / 晶簇 / 风灵 */
function bodyPath(R, elem){
  const el = ELEM[elem] || ELEM.fire;
  const w = R * el.bodyW;
  ctx.beginPath();
  if (elem === 'fire'){
    // 焰灵：三焰尖的火焰躯干
    ctx.moveTo(-w*0.34, R*0.86);
    ctx.quadraticCurveTo(-w*0.68, R*0.22, -w*0.38, -R*0.16);
    ctx.quadraticCurveTo(-w*0.16, -R*0.50, -w*0.22, -R*0.96);
    ctx.quadraticCurveTo(0, -R*0.60,  w*0.10, -R*1.30);
    ctx.quadraticCurveTo( w*0.44, -R*0.66,  w*0.38, -R*0.18);
    ctx.quadraticCurveTo( w*0.68, R*0.22,  w*0.34, R*0.86);
    ctx.quadraticCurveTo(0, R*1.04, -w*0.34, R*0.86);
  } else if (elem === 'water'){
    // 流体：饱满水滴
    ctx.moveTo(0, -R*1.22);
    ctx.quadraticCurveTo( w*0.58, -R*0.26,  w*0.46, R*0.40);
    ctx.quadraticCurveTo( w*0.32,  R*0.98, 0, R*0.98);
    ctx.quadraticCurveTo(-w*0.32,  R*0.98, -w*0.46, R*0.40);
    ctx.quadraticCurveTo(-w*0.58, -R*0.26, 0, -R*1.22);
  } else if (elem === 'thunder'){
    // 雷晶：正菱形（四顶点＝上 / 右 / 下 / 左），与 leiVertices 完全对齐
    const pts = [[0,-1.24],[0.72,0],[0,1.04],[-0.72,0]];
    pts.forEach((pt,i)=>{ if(i===0) ctx.moveTo(pt[0]*w, pt[1]*R); else ctx.lineTo(pt[0]*w, pt[1]*R); });
  } else if (elem === 'ice'){
    // 晶簇：六棱晶体
    const pts = [[0,-1.28],[0.46,-0.62],[0.46,0.12],[0,0.94],[-0.46,0.12],[-0.46,-0.62]];
    pts.forEach((pt,i)=>{ if(i===0) ctx.moveTo(pt[0]*w, pt[1]*R); else ctx.lineTo(pt[0]*w, pt[1]*R); });
  } else if (elem === 'wind'){
    // 风灵：带扰动的菱形
    ctx.moveTo(0, -R*1.18);
    ctx.quadraticCurveTo( w*0.32, -R*0.62,  w*0.48, -R*0.10);
    ctx.quadraticCurveTo( w*0.26,  R*0.34, 0, R*0.96);
    ctx.quadraticCurveTo(-w*0.26,  R*0.34, -w*0.48, -R*0.10);
    ctx.quadraticCurveTo(-w*0.32, -R*0.62, 0, -R*1.18);
  } else if (elem === 'rock'){
    // 岩体：粗棱碎石块
    const pts = [[0,-1.16],[0.52,-0.78],[0.80,-0.10],[0.52,0.62],
                 [0.10,1.00],[-0.42,0.86],[-0.78,0.30],[-0.66,-0.42],[-0.30,-0.86]];
    pts.forEach((pt,i)=>{ if(i===0) ctx.moveTo(pt[0]*w, pt[1]*R); else ctx.lineTo(pt[0]*w, pt[1]*R); });
  } else if (elem === 'dark'){
    // 雾影：起伏不定的黑雾团
    const pts = 14;
    for (let i=0; i<pts; i++){
      const a = i/pts*Math.PI*2;
      const rr = 0.86 + 0.20*Math.sin(i*2.7 + 0.6);
      const px = Math.cos(a)*w*rr, py = Math.sin(a)*R*rr*1.02;
      if (i===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
  } else if (elem === 'light'){
    // 光体：八芒光核
    const pts = 16;
    for (let i=0; i<pts; i++){
      const a = i/pts*Math.PI*2 - Math.PI/2;
      const rr = (i%2 === 0) ? 1.16 : 0.66;
      const px = Math.cos(a)*w*rr, py = Math.sin(a)*R*rr;
      if (i===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
  } else {
    // 兜底：圆身
    ctx.arc(0, 0, R*0.78, 0, Math.PI*2);
  }
  ctx.closePath();
}

function drawPlayer(p, now){
  const el = ELEM[p.elem];
  const R = UI.R;
  const bob = Math.sin(now/700 + p.bob) * R * 0.10;
  const stealthOn = p.stealthEnd > now;

  ctx.save();
  if (stealthOn) ctx.globalAlpha = 0.26;
  ctx.translate(p.x, p.y + bob);
  ctx.scale(p.face, 1);

  const skinIce = (p.elem === 'ice' && iceSkinUnlocked && iceSkinOn);
  const auraC = skinIce ? '#ffc7e2' : el.color;
  const shadow = ctx.createRadialGradient(0, R*0.95, 0, 0, R*0.95, R*1.5);
  shadow.addColorStop(0, auraC + '55');
  shadow.addColorStop(1, auraC + '00');
  ctx.fillStyle = shadow;
  ctx.beginPath(); ctx.ellipse(0, R*0.95, R*1.5, R*0.45, 0, 0, Math.PI*2); ctx.fill();

  const aura = ctx.createRadialGradient(0, 0, R*0.2, 0, 0, R*2.1);
  aura.addColorStop(0, auraC + (skinIce ? '44' : '66'));
  aura.addColorStop(0.55, auraC + (skinIce ? '14' : '22'));
  aura.addColorStop(1, auraC + '00');
  ctx.fillStyle = aura;
  ctx.beginPath(); ctx.arc(0, 0, R*2.1, 0, Math.PI*2); ctx.fill();

  if (p.elem === 'wind') vfxWindTrail(now, R, el);
  if (p.elem === 'dark')  vfxDarkBody(p, now, R, el);
  if (p.elem === 'light') vfxLightBody(p, now, R, el);
  const skinned = (p.elem === 'ice' && iceSkinUnlocked && iceSkinOn);

  ctx.globalAlpha = p.dead ? 0.4 : 1;
  if (p.elem === 'light'){
    const fg = ctx.createRadialGradient(0, -R*0.25, R*0.08, 0, 0, R*1.3);
    fg.addColorStop(0, '#fffdf2');
    fg.addColorStop(0.55, '#ffd166');
    fg.addColorStop(1, '#8a5c0d');
    ctx.fillStyle = fg;
  } else if (p.elem === 'thunder'){
    const tg = ctx.createRadialGradient(0, 0, R*0.06, 0, 0, R*1.12);
    tg.addColorStop(0, 'rgba(255,255,255,0.82)');
    tg.addColorStop(0.28, 'rgba(200,170,255,0.60)');
    tg.addColorStop(0.68, 'rgba(54,136,255,0.42)');
    tg.addColorStop(1, 'rgba(42,23,71,0.62)');
    ctx.fillStyle = tg;
  } else if (p.elem === 'dark'){
    const dg = ctx.createRadialGradient(0, -R*0.3, R*0.10, 0, 0, R*1.3);
    dg.addColorStop(0, '#43247a');
    dg.addColorStop(0.5, '#170d2a');
    dg.addColorStop(1, '#05030c');
    ctx.fillStyle = dg;
  } else {
    ctx.fillStyle = '#0b0f1a';
  }
  if (p.elem === 'blackhole' || p.elem === 'neutron'){
    // 专属本体：对战时留到 drawTopBodies 在所有特效之后绘制，保证不被任何元素特效压住
    if (typeof st === 'undefined' || st !== 'battle') drawSingularBody(p, now, R);
  } else {
    bodyPath(R, p.elem); ctx.fill();
    ctx.strokeStyle = el.color;
    ctx.lineWidth = 2*S;
    ctx.globalAlpha = (p.dead ? 0.4 : 0.85);
    bodyPath(R, p.elem); ctx.stroke();
  }
  if (skinned) vfxIceSkin(p, now, R);

  // 雷晶：四条棱线高光 + 晶核内部压缩电光
  if (p.elem === 'thunder'){
    const vts = leiVertices(0, 0, R);
    ctx.lineWidth = 1.2*S;
    ctx.strokeStyle = 'rgba(200,205,255,0.55)';
    for (let i = 0; i < 4; i++){
      const v = vts[i];
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(v.x, v.y); ctx.stroke();
    }
    const tick = Math.floor(now / 70);
    ctx.strokeStyle = 'rgba(54,136,255,0.85)';
    ctx.lineWidth = 1.4*S;
    for (let i = 0; i < 2; i++){
      ctx.beginPath();
      let px = -R*0.34, py = -R*0.5;
      ctx.moveTo(px, py);
      for (let k = 1; k <= 5; k++){
        px = -R*0.34 + (k/5)*R*0.68;
        py = -R*0.5 + (k/5)*R*1.0 + (hash(tick*13 + i*19 + k) - 0.5)*R*0.34;
        ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
  }

  // 受击白闪
  if (p.hitFlash > 0){
    ctx.globalAlpha = clamp(p.hitFlash / 0.26, 0, 1) * 0.75;
    ctx.fillStyle = '#ffffff';
    bodyPath(R, p.elem); ctx.fill();
  }
  ctx.globalAlpha = 1;

  const wet = now < p.wetEnd;
  if (p.elem === 'fire') vfxFire(now, R, el, wet ? 0.42 : 1);
  else if (p.elem === 'water') vfxWater(now, R, el);
  else if (p.elem === 'thunder') vfxThunder(now, R, el);
  else if (p.elem === 'ice') vfxIce(now, R, el);
  else if (p.elem === 'rock') vfxRock(now, R, el);
  else if (p.elem === 'wind') vfxWind(now, R, el);
  // 暗 / 光 的特效在上方已有专属分支，这里不再兜底给风（原兜底导致两者身上带风旋涡）

  if (wet) vfxWet(now, R);
  if (now < p.shockEnd) vfxShock(now, R, el);
  if (now < p.iceArmorEnd) vfxIceArmor(now, R);
  if (now < p.thunderEnd) vfxThunderAura(now, R);
  if (now < p.elecEnd) vfxElec(now, R);
  if (now < p.freezeEnd) vfxFrozen(now, R, p);

  // 普攻出手反馈：身前火团
  if (p.swing > 0){
    const k = clamp(p.swing / 0.2, 0, 1);
    const fx = p.face * R*0.95;
    const g2 = ctx.createRadialGradient(fx, -R*0.1, 0, fx, -R*0.1, R*0.55*k);
    if (p.elem === 'thunder'){
      g2.addColorStop(0, 'rgba(240,235,255,'+(0.9*k)+')');
      g2.addColorStop(0.5, 'rgba(120,80,255,'+(0.7*k)+')');
      g2.addColorStop(1, 'rgba(54,136,255,0)');
    } else if (p.elem === 'water'){
      g2.addColorStop(0, 'rgba(230,250,255,'+(0.9*k)+')');
      g2.addColorStop(0.5, 'rgba(80,180,255,'+(0.7*k)+')');
      g2.addColorStop(1, 'rgba(20,90,200,0)');
    } else if (p.elem === 'rock'){
      g2.addColorStop(0, 'rgba(250,235,180,'+(0.85*k)+')');
      g2.addColorStop(0.5, 'rgba(201,162,39,'+(0.7*k)+')');
      g2.addColorStop(1, 'rgba(90,70,20,0)');
    } else {
      g2.addColorStop(0, 'rgba(255,235,190,'+(0.9*k)+')');
      g2.addColorStop(0.5, 'rgba(255,140,50,'+(0.7*k)+')');
      g2.addColorStop(1, 'rgba(255,60,10,0)');
    }
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(fx, -R*0.1, R*0.55*k, 0, Math.PI*2); ctx.fill();
  }

  // 霜极巨剑：手里那把巨剑
  if (p.elem === 'ice' && p.iceGiantEnd > now) vfxGiantSword(p, now, R, el);

  // 灼烧附着：身上跳动的火苗
  if (now < p.burnEnd){
    const bt = now/1000;
    for (let i=0; i<5; i++){
      const ph = hash(i*7.3) * Math.PI*2;
      const fx = Math.sin(bt*5.2 + ph) * R*0.42;
      const fy = -R*0.9 + (i*0.22)*R + Math.sin(bt*6.1 + ph)*R*0.08;
      const hh = R*(0.30 + 0.12*Math.sin(bt*4 + ph));
      const g3 = ctx.createLinearGradient(0, fy, 0, fy-hh);
      g3.addColorStop(0, 'rgba(255,90,20,0.85)');
      g3.addColorStop(0.6, 'rgba(255,170,60,0.55)');
      g3.addColorStop(1, 'rgba(255,230,150,0)');
      ctx.fillStyle = g3;
      ctx.beginPath();
      ctx.moveTo(fx - R*0.10, fy);
      ctx.quadraticCurveTo(fx - R*0.06, fy - hh*0.6, fx, fy - hh);
      ctx.quadraticCurveTo(fx + R*0.06, fy - hh*0.6, fx + R*0.10, fy);
      ctx.closePath(); ctx.fill();
    }
  }

  ctx.restore();

  // 突进：黑雾残影 + 路径雾带 + 前端雾锋
  if (p.dashEnd > now && p.dashFrom && p.dashTo){
    const k = clamp((now - p.dashStart) / Math.max(1, p.dashEnd - p.dashStart), 0, 1);
    const fx = p.dashFrom.x + (p.dashTo.x - p.dashFrom.x) * k;
    const fy = p.dashFrom.y + (p.dashTo.y - p.dashFrom.y) * k;
    const ang = Math.atan2(p.dashTo.y - p.dashFrom.y, p.dashTo.x - p.dashFrom.x);
    ctx.save();

    // ① 路径雾带：沿 from→当前位置铺一串交叠的椭圆雾，越靠尾越淡越窄
    const steps = 10;
    for (let i = 0; i <= steps; i++){
      const u = (i / steps) * k;
      const px = p.dashFrom.x + (p.dashTo.x - p.dashFrom.x) * u;
      const py = p.dashFrom.y + (p.dashTo.y - p.dashFrom.y) * u;
      const fade = 0.16 + 0.34 * u;                 // 越靠近角色越浓
      const rad = R * (0.72 + 0.55 * u);
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(ang);
      const wg = ctx.createRadialGradient(0, 0, 0, 0, 0, rad);
      wg.addColorStop(0, 'rgba(18,6,38,' + (fade * 0.9) + ')');
      wg.addColorStop(0.45, 'rgba(48,20,92,' + (fade * 0.75) + ')');
      wg.addColorStop(0.8, 'rgba(96,58,180,' + (fade * 0.35) + ')');
      wg.addColorStop(1, 'rgba(110,70,200,0)');
      ctx.fillStyle = wg;
      ctx.beginPath();
      ctx.ellipse(0, 0, rad * 1.35, rad * 0.86, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // ② 黑雾残影：6 段，每段 3 团抖动雾，轮廓不规则、边缘柔化
    for (let i = 1; i <= 6; i++){
      const u = k - i * 0.085;
      if (u < 0) continue;
      const px = p.dashFrom.x + (p.dashTo.x - p.dashFrom.x) * u;
      const py = p.dashFrom.y + (p.dashTo.y - p.dashFrom.y) * u;
      const fade = 0.46 * (1 - i / 7.5);
      for (let j = 0; j < 3; j++){
        const wob = Math.sin(now / 210 + i * 1.7 + j * 2.4);
        const ox = Math.cos(ang + j * 2.1) * R * 0.34 * wob;
        const oy = Math.sin(ang + j * 2.1) * R * 0.34 * wob;
        const rr = R * (1.05 + 0.22 * i + 0.12 * Math.sin(now / 300 + i));
        const g2 = ctx.createRadialGradient(px + ox, py + oy, 0, px + ox, py + oy, rr);
        g2.addColorStop(0, 'rgba(10,3,24,' + (fade * 0.95) + ')');
        g2.addColorStop(0.5, 'rgba(52,22,100,' + (fade * 0.62) + ')');
        g2.addColorStop(0.85, 'rgba(108,68,196,' + (fade * 0.24) + ')');
        g2.addColorStop(1, 'rgba(120,80,210,0)');
        ctx.fillStyle = g2;
        ctx.beginPath(); ctx.arc(px + ox, py + oy, rr, 0, Math.PI * 2); ctx.fill();
      }
    }

    // ③ 起点余雾（起手炸开的一小簇）
    const sg = ctx.createRadialGradient(p.dashFrom.x, p.dashFrom.y, 0, p.dashFrom.x, p.dashFrom.y, R * 1.6);
    sg.addColorStop(0, 'rgba(20,8,42,' + (0.30 * (1 - k)) + ')');
    sg.addColorStop(0.6, 'rgba(60,28,110,' + (0.18 * (1 - k)) + ')');
    sg.addColorStop(1, 'rgba(80,40,150,0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(p.dashFrom.x, p.dashFrom.y, R * 1.6, 0, Math.PI * 2); ctx.fill();

    // ④ 前端雾锋：贴着角色前方的一道亮紫雾边
    const nfx = fx + Math.cos(ang) * R * 0.9;
    const nfy = fy + Math.sin(ang) * R * 0.9;
    const ng = ctx.createRadialGradient(nfx, nfy, 0, nfx, nfy, R * 1.7);
    ng.addColorStop(0, 'rgba(58,26,110,0.55)');
    ng.addColorStop(0.45, 'rgba(120,78,220,0.32)');
    ng.addColorStop(1, 'rgba(140,100,240,0)');
    ctx.fillStyle = ng;
    ctx.beginPath(); ctx.arc(nfx, nfy, R * 1.7, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }

  // 格挡：身前一道弧形光盾；完美格挡瞬间镀一层金白
  if (p.guardEnd > now || p.guardPfEnd > now){
    const R2 = UI.R;
    const on = p.guardEnd > now;
    const el2 = on ? (now - p.guardStart) : 0;
    const inPerfect = on && el2 >= GUARD.perfectFrom && el2 <= GUARD.perfectTo;
    const pfLeft = Math.max(0, ((p.guardPfEnd || 0) - now) / 700);
    const a0 = (p.face > 0 ? 0 : Math.PI);   // 盾面朝角色正面
    const spread = 0.62;
    const rad = R2 * (on ? 1.85 : 2.2);
    ctx.save();
    const gc = inPerfect ? '255,246,200' : '150,226,255';
    const alpha = (on ? 0.55 : 0.30 * pfLeft) + pfLeft * 0.35;
    const grd = ctx.createRadialGradient(p.x, p.y, rad*0.55, p.x, p.y, rad);
    grd.addColorStop(0, 'rgba(' + gc + ',0)');
    grd.addColorStop(0.75, 'rgba(' + gc + ',' + (alpha*0.55) + ')');
    grd.addColorStop(1, 'rgba(' + gc + ',0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(p.x, p.y, rad, a0 - spread, a0 + spread);
    ctx.arc(p.x, p.y, rad*0.55, a0 + spread, a0 - spread, true);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(' + gc + ',' + Math.min(1, alpha + 0.25) + ')';
    ctx.lineWidth = 3*UI.S;
    ctx.beginPath();
    ctx.arc(p.x, p.y, rad*0.86, a0 - spread, a0 + spread);
    ctx.stroke();
    if (inPerfect){
      ctx.strokeStyle = 'rgba(255,252,226,0.95)';
      ctx.lineWidth = 5*UI.S;
      ctx.beginPath();
      ctx.arc(p.x, p.y, rad*0.86, a0 - spread*0.9, a0 + spread*0.9);
      ctx.stroke();
    }
    ctx.restore();
  }

  // 隐身：黑雾团裹住（半透明本体之上再压一层流动雾）
  if (stealthOn){
    ctx.save();
    ctx.globalAlpha = 0.55;
    const mg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R*2.3);
    mg.addColorStop(0, 'rgba(30,12,58,0.85)');
    mg.addColorStop(0.6, 'rgba(46,20,92,0.45)');
    mg.addColorStop(1, 'rgba(60,28,120,0)');
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(p.x, p.y, R*2.3, 0, Math.PI*2); ctx.fill();
    for (let i=0; i<7; i++){
      const a = now/900 + i*0.9;
      const rr = R*(1.1 + 0.35*Math.sin(now/500 + i));
      ctx.fillStyle = 'rgba(140,100,240,0.20)';
      ctx.beginPath(); ctx.arc(p.x + Math.cos(a)*rr, p.y + Math.sin(a)*rr*0.8, R*0.22, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  // 暗 / 光的普攻标记挂在头顶
  if (p.shadowEnd > now) drawMarkBadge(p, 'shadow', now);
  if (p.revealEnd > now) drawMarkBadge(p, 'reveal', now);

  ctx.textAlign = 'center';
  font(9, 600); ctx.fillStyle = 'rgba(190,205,230,0.75)';
  ctx.fillText('P' + p.i, p.x, p.y + R*1.55);
}

/* 头顶标记：蚀影（紫菱）/ 显影（金芒） */
function drawMarkBadge(p, kind, now){
  const R = UI.R;
  const x = p.x + (kind === 'shadow' ? -R*0.5 : R*0.5);
  const y = p.y - R*2.0 + Math.sin(now/420 + (kind === 'shadow' ? 0 : 1.6))*R*0.08;
  const bob = 1 + 0.06*Math.sin(now/260);
  ctx.save();
  ctx.translate(x, y);
  if (kind === 'shadow'){
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R*0.5);
    g.addColorStop(0, 'rgba(120,70,220,0.85)');
    g.addColorStop(1, 'rgba(40,14,80,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, R*0.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(16,6,32,0.95)';
    ctx.beginPath();
    ctx.moveTo(0, -R*0.30*bob); ctx.lineTo(R*0.21*bob, 0);
    ctx.lineTo(0, R*0.30*bob); ctx.lineTo(-R*0.21*bob, 0);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(178,140,255,0.85)';
    ctx.lineWidth = 1.2*S; ctx.stroke();
    const n = Math.max(1, p.shadowStacks || 1);
    for (let i=0; i<n; i++){
      ctx.fillStyle = 'rgba(196,168,255,0.95)';
      ctx.beginPath();
      ctx.arc(-((n-1)*R*0.13)/2 + i*R*0.13, R*0.46, R*0.055, 0, Math.PI*2);
      ctx.fill();
    }
  } else {
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R*0.52);
    g.addColorStop(0, 'rgba(255,248,214,0.55)');
    g.addColorStop(1, 'rgba(255,220,120,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, R*0.52, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,246,208,0.98)';
    ctx.beginPath();
    for (let i=0; i<8; i++){
      const a = i*Math.PI/4 - Math.PI/2;
      const rr = (i%2 === 0) ? R*0.30*bob : R*0.11*bob;
      const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
      if (i===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,220,140,0.9)';
    ctx.lineWidth = 1*S; ctx.stroke();
  }
  ctx.restore();
}

/* 暗：黑雾缠身 + 四颗暗球环绕（消耗后球数变少） */
function vfxDarkBody(p, now, R, el){
  const t = now / 1000;
  // 缠身黑雾
  for (let i=0; i<5; i++){
    const a = t*0.55 + i*Math.PI*2/5;
    const rr = R*0.75 + Math.sin(t*1.4 + i)*R*0.12;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr*0.9 - R*0.1;
    const g = ctx.createRadialGradient(px, py, 0, px, py, R*0.95);
    g.addColorStop(0, 'rgba(120,70,210,0.30)');
    g.addColorStop(0.6, 'rgba(60,30,120,0.18)');
    g.addColorStop(1, 'rgba(20,8,40,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, py, R*0.95, 0, Math.PI*2); ctx.fill();
  }
  // 暗球（还剩几颗就飘几颗）
  const total = (ELEM.dark.passive && ELEM.dark.passive.orbs) || 4;
  for (let i=0; i<total; i++){
    if (i >= p.orbs) continue;
    const a = t*1.15 + i*Math.PI*2/total;
    const orbR = R*1.62;
    const px = Math.cos(a)*orbR, py = Math.sin(a)*orbR*0.86;
    const shell = p.darkShellEnd > now;
    const g = ctx.createRadialGradient(px - R*0.08, py - R*0.08, 0, px, py, R*0.42);
    g.addColorStop(0, shell ? 'rgba(255,255,255,0.95)' : 'rgba(226,210,255,0.95)');
    g.addColorStop(0.45, shell ? 'rgba(203,168,255,0.85)' : 'rgba(150,104,240,0.80)');
    g.addColorStop(1, 'rgba(58,24,110,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, py, R*0.42, 0, Math.PI*2); ctx.fill();

    ctx.strokeStyle = shell ? 'rgba(240,232,255,0.9)' : 'rgba(180,140,255,0.55)';
    ctx.lineWidth = 1.3*S;
    ctx.beginPath(); ctx.arc(px, py, R*0.30, 0, Math.PI*2); ctx.stroke();
  }

  // 暗罩：裹满全身的黑雾 + 紫边
  if (p.darkShellEnd > now){
    const k = clamp((p.darkShellEnd - now)/2000, 0, 1);
    const g = ctx.createRadialGradient(0, 0, R*0.2, 0, 0, R*2.7);
    g.addColorStop(0, 'rgba(30,10,60,0.92)');
    g.addColorStop(0.62, 'rgba(78,38,150,' + (0.62*k + 0.18) + ')');
    g.addColorStop(0.92, 'rgba(160,110,255,' + (0.35*k) + ')');
    g.addColorStop(1, 'rgba(120,70,220,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, R*2.7, 0, Math.PI*2); ctx.fill();

    ctx.strokeStyle = 'rgba(210,180,255,' + (0.55*k + 0.25) + ')';
    ctx.lineWidth = 3*S;
    ctx.beginPath(); ctx.arc(0, 0, R*2.5*(1 + 0.02*Math.sin(now/180)), 0, Math.PI*2); ctx.stroke();
  }
}

/* 光：多层光晕 + 旋转十字光刺 + 上升光粒 */
function vfxLightBody(p, now, R, el){
  const t = now/1000;
  const pulse = 0.5 + 0.5*Math.sin(t*2.2);
  const g = ctx.createRadialGradient(0, 0, R*0.15, 0, 0, R*(2.4 + pulse*0.35));
  g.addColorStop(0, 'rgba(255,252,235,0.55)');
  g.addColorStop(0.35, 'rgba(255,214,120,0.32)');
  g.addColorStop(1, 'rgba(255,190,80,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, R*(2.4 + pulse*0.35), 0, Math.PI*2); ctx.fill();

  ctx.save();
  ctx.rotate(t*0.35);
  for (let i=0; i<8; i++){
    ctx.rotate(Math.PI/4);
    ctx.fillStyle = 'rgba(255,248,220,' + (0.18 + 0.12*pulse) + ')';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(R*0.16, -R*1.9);
    ctx.lineTo(-R*0.16, -R*1.9);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  for (let i=0; i<7; i++){
    const k = (t*0.55 + i*0.14) % 1;
    const px = Math.sin(t*1.3 + i*2.1) * R*1.1;
    const py = -k * R*3.0;
    ctx.fillStyle = 'rgba(255,246,206,' + (0.75*(1-k)) + ')';
    ctx.beginPath(); ctx.arc(px, py, R*0.09*(1-k*0.6), 0, Math.PI*2); ctx.fill();
  }
}

/* 霜极巨剑：手中巨剑（随三段动作摆动） */
function vfxGiantSword(p, now, R, el){
  const swingK = clamp(p.swing / 0.26, 0, 1);
  let ang = -0.62;
  if (p.giantStage === 1) ang = -1.55 + (1 - swingK) * 1.6;      // 横劈：高举 → 水平扫过
  else if (p.giantStage === 2) ang = -1.2 + (1 - swingK) * 1.35; // 竖劈：从上砸下
  else ang = -0.95;

  const L = R * 3.0;
  ctx.save();
  ctx.translate(R*0.42, -R*0.28);
  ctx.rotate(ang);

  // 剑气光晕
  const gl = ctx.createRadialGradient(0, 0, 0, 0, 0, L*0.95);
  gl.addColorStop(0, 'rgba(180,242,255,0.30)');
  gl.addColorStop(0.6, 'rgba(140,225,255,0.12)');
  gl.addColorStop(1, 'rgba(120,220,255,0)');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(0, 0, L*0.95, 0, Math.PI*2); ctx.fill();

  // 刃
  const bg = ctx.createLinearGradient(0, 0, L, 0);
  bg.addColorStop(0, 'rgba(150,230,255,0.60)');
  bg.addColorStop(0.45, 'rgba(238,252,255,0.97)');
  bg.addColorStop(1, 'rgba(126,215,248,0.80)');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(L*0.14, -R*0.36);
  ctx.lineTo(L, -R*0.11);
  ctx.lineTo(L*1.05, 0);
  ctx.lineTo(L, R*0.11);
  ctx.lineTo(L*0.14, R*0.36);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.92)';
  ctx.lineWidth = 1.8*S;
  ctx.stroke();

  // 刃上寒光
  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.lineWidth = 1.2*S;
  ctx.beginPath();
  ctx.moveTo(L*0.22, -R*0.12); ctx.lineTo(L*0.94, -R*0.03);
  ctx.stroke();

  // 护手
  ctx.fillStyle = 'rgba(120,216,245,0.92)';
  rrPath(-R*0.14, -R*0.52, R*0.18, R*1.04, 3*S); ctx.fill();
  // 柄
  ctx.fillStyle = 'rgba(34,70,96,0.96)';
  rrPath(-R*0.92, -R*0.14, R*0.80, R*0.28, 3*S); ctx.fill();

  // 飘散的冰屑
  for (let i=0; i<6; i++){
    const k = ((now/520) + i*0.17) % 1;
    const px = L * (0.35 + i*0.11);
    const py = -R*0.2 + Math.sin(k*Math.PI*2)*R*0.35;
    ctx.fillStyle = 'rgba(215,248,255,' + (0.7*(1-k)) + ')';
    ctx.beginPath();
    ctx.arc(px, py, R*0.075*(1-k*0.5), 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

/* 雷附着：身上跳的紫电 */
function vfxThunderAura(now, R){
  const t = now / 1000;
  ctx.strokeStyle = 'rgba(200,160,255,0.75)';
  ctx.lineWidth = 1.2*S;
  for (let i=0; i<4; i++){
    const a = t*4 + i*Math.PI/2;
    const x1 = Math.cos(a)*R*0.7, y1 = -R*0.3 + Math.sin(a)*R*0.5;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x1 + Math.cos(a+1.2)*R*0.35, y1 + Math.sin(a+1.2)*R*0.3);
    ctx.lineTo(x1 + Math.cos(a+0.3)*R*0.6, y1 + Math.sin(a+0.3)*R*0.5);
    ctx.stroke();
  }
}

/* 水被雷附着：持续电击的细弧 */
function vfxElec(now, R){
  const t = now/1000;
  ctx.strokeStyle = 'rgba(190,150,255,'+(0.4 + 0.35*Math.abs(Math.sin(t*7))+')');
  ctx.lineWidth = 1.4*S;
  for (let i=0; i<3; i++){
    const ph = t*11 + i*2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(ph)*R*0.8, -R*0.5);
    ctx.lineTo(Math.cos(ph)*R*0.4, -R*0.1);
    ctx.lineTo(Math.cos(ph+1)*R*0.75, R*0.4);
    ctx.stroke();
  }
}

/* 冻结：整块冰封 + 挣扎进度条 */
function vfxFrozen(now, R, p){
  const t = now/1000;
  // 冰壳
  const g = ctx.createLinearGradient(0, -R*1.5, 0, R*1.3);
  g.addColorStop(0, 'rgba(225,252,255,0.55)');
  g.addColorStop(0.45, 'rgba(140,225,245,0.34)');
  g.addColorStop(1, 'rgba(70,180,215,0.5)');
  ctx.fillStyle = g;
  ctx.beginPath();
  const wHalf = R*1.16, hTop = -R*1.5, hBot = R*1.25;
  ctx.moveTo(-wHalf, hBot);
  ctx.lineTo(-wHalf*0.92, hTop + R*0.2);
  ctx.lineTo(-wHalf*0.35, hTop);
  ctx.lineTo(wHalf*0.42, hTop + R*0.12);
  ctx.lineTo(wHalf*0.95, hTop + R*0.35);
  ctx.lineTo(wHalf, hBot);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(235,255,255,0.75)';
  ctx.lineWidth = 2*S;
  ctx.stroke();

  // 内部裂纹
  ctx.strokeStyle = 'rgba(255,255,255,'+(0.25+0.15*Math.sin(t*5))+')';
  ctx.lineWidth = 1*S;
  ctx.beginPath();
  ctx.moveTo(-R*0.5, -R*0.8); ctx.lineTo(-R*0.15, -R*0.2); ctx.lineTo(-R*0.5, R*0.35);
  ctx.moveTo(R*0.3, -R*1.1); ctx.lineTo(R*0.1, -R*0.5); ctx.lineTo(R*0.55, -R*0.1);
  ctx.stroke();

  // 挣扎条（不随镜像翻转，所以反向 scale）
  ctx.save();
  ctx.scale(p.face, 1);
  const bw = R*1.8, bh = 5*S, by = -R*1.95;
  ctx.fillStyle = 'rgba(6,12,20,0.75)';
  ctx.fillRect(-bw/2, by, bw, bh);
  ctx.fillStyle = '#8fe8ff';
  ctx.fillRect(-bw/2, by, bw*clamp(p.struggle,0,1), bh);
  ctx.strokeStyle = 'rgba(200,245,255,0.7)';
  ctx.lineWidth = 1;
  ctx.strokeRect(-bw/2, by, bw, bh);
  ctx.restore();
}

/* 冰甲：水冻结后的冰块护壳 */
function vfxIceArmor(now, R){
  const t = now / 1000;
  const puls = 0.55 + 0.25*Math.sin(t*6);
  ctx.strokeStyle = 'rgba(205,246,255,'+puls+')';
  ctx.lineWidth = 2*S;
  for (let i=0; i<6; i++){
    const a = i*Math.PI/3 + t*0.4;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*R*1.05, Math.sin(a)*R*0.72 - R*0.15);
    ctx.lineTo(Math.cos(a)*R*1.42, Math.sin(a)*R*0.98 - R*0.15);
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(150,230,255,'+(0.10*puls)+')';
  ctx.beginPath(); ctx.ellipse(0, -R*0.15, R*1.42, R*1.05, 0, 0, Math.PI*2); ctx.fill();
}

/* 水附着：湿润水膜 + 环绕水滴 */
function vfxWet(now, R){
  const t = now / 1000;
  const g = ctx.createRadialGradient(0, 0, R*0.1, 0, 0, R*1.15);
  g.addColorStop(0, 'rgba(120,210,255,0.08)');
  g.addColorStop(0.8, 'rgba(90,190,255,0.26)');
  g.addColorStop(1, 'rgba(60,160,240,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, R*1.15, 0, Math.PI*2); ctx.fill();

  for (let i=0; i<5; i++){
    const a = t*1.9 + i*Math.PI*2/5;
    const rx = Math.cos(a) * R*0.95;
    const ry = Math.sin(a) * R*0.42 + Math.sin(t*3 + i)*R*0.06;
    const size = R*0.10 * (0.8 + 0.4*Math.sin(t*5 + i));
    const gg = ctx.createRadialGradient(rx, ry, 0, rx, ry, size*2.2);
    gg.addColorStop(0, 'rgba(220,248,255,0.85)');
    gg.addColorStop(1, 'rgba(90,190,255,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(rx, ry, size*2.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(240,252,255,0.8)';
    ctx.beginPath(); ctx.arc(rx, ry, size, 0, Math.PI*2); ctx.fill();
  }
}

/* 感电：身上乱窜的紫电 + 地面电环 */
function vfxShock(now, R, el){
  const t = now / 1000;
  ctx.strokeStyle = 'rgba(215,180,255,0.9)';
  ctx.lineWidth = 1.6*S;
  for (let i=0; i<3; i++){
    const ph = t*9 + i*2.1;
    ctx.beginPath();
    let px = Math.cos(ph) * R*0.75, py = -R*0.4 + Math.sin(ph*1.7)*R*0.45;
    ctx.moveTo(px, py);
    for (let j=1; j<=4; j++){
      px += Math.cos(ph + j*1.3) * R*0.22;
      py += Math.sin(ph*1.4 + j) * R*0.20;
      ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(180,140,255,'+(0.25 + 0.2*Math.sin(t*8))+')';
  ctx.lineWidth = 1.4*S;
  ctx.beginPath();
  ctx.ellipse(0, R*0.95, R*1.9, R*0.55, 0, 0, Math.PI*2);
  ctx.stroke();
}

/* 火：躯干燃烧 + 双肩火焰 + 上升火星 */
function vfxFire(now, R, el, k){
  k = (k === undefined) ? 1 : k;
  const t = now / 1000;
  const flames = [
    { x:-R*0.30, y:-R*0.18, w:R*0.26, h:R*0.62, ph:0 },
    { x: R*0.26, y:-R*0.26, w:R*0.22, h:R*0.54, ph:1.3 },
    { x: 0,      y:-R*1.16, w:R*0.20, h:R*0.50, ph:2.2 }
  ];
  flames.forEach(f=>{
    const sw = Math.sin(t*4.2 + f.ph) * 0.10 + 1;
    const hh = f.h * sw * k;
    ctx.globalAlpha = 0.45 + 0.55 * k;
    const g = ctx.createLinearGradient(f.x, f.y, f.x, f.y - hh);
    g.addColorStop(0, 'rgba(255,80,20,0.95)');
    g.addColorStop(0.5, 'rgba(255,150,50,0.75)');
    g.addColorStop(1, 'rgba(255,230,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(f.x - f.w/2, f.y);
    ctx.quadraticCurveTo(f.x - f.w*0.62, f.y - hh*0.55, f.x, f.y - hh);
    ctx.quadraticCurveTo(f.x + f.w*0.62, f.y - hh*0.55, f.x + f.w/2, f.y);
    ctx.closePath();
    ctx.fill();
  });
  for (let i=0; i<7; i++){
    const life = (t*0.9 + i*0.37) % 1;
    const px = Math.sin((i*3.1) + t*1.4) * R*0.5;
    const py = R*0.2 - life * R*2.2;
    const a = 1 - life;
    ctx.fillStyle = 'rgba(255,'+Math.round(140+90*a)+',80,'+a+')';
    ctx.beginPath(); ctx.arc(px, py, (1.6 + 2.2*a)*S, 0, Math.PI*2); ctx.fill();
  }
  const heat = ctx.createRadialGradient(0, -R*0.2, 0, 0, -R*0.2, R*0.9);
  heat.addColorStop(0, 'rgba(255,120,40,0.30)');
  heat.addColorStop(1, 'rgba(255,60,0,0)');
  ctx.fillStyle = heat;
  ctx.beginPath(); ctx.arc(0, -R*0.2, R*0.9, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
}

/* 水：环身水流 + 脚边涟漪 + 悬浮水滴 */
function vfxWater(now, R, el){
  const t = now / 1000;
  for (let k=0; k<2; k++){
    ctx.beginPath();
    for (let i=0; i<=24; i++){
      const u = i/24;
      const ang = u * Math.PI * 2 + k*Math.PI + t*1.1;
      const rr = R*0.62 + Math.sin(ang*2 + t*2.2)*R*0.10;
      const x = Math.cos(ang) * rr * 1.15;
      const y = Math.sin(ang) * rr * 0.85 - R*0.24;
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.strokeStyle = k===0 ? 'rgba(120,210,255,0.85)' : 'rgba(60,150,255,0.55)';
    ctx.lineWidth = (k===0?2.4:1.6)*S;
    ctx.stroke();
  }
  for (let i=0; i<3; i++){
    const life = (t*0.55 + i*0.33) % 1;
    const rr = R*0.4 + life*R*1.15;
    ctx.strokeStyle = 'rgba(140,220,255,'+(0.5*(1-life))+')';
    ctx.lineWidth = 2*S;
    ctx.beginPath(); ctx.ellipse(0, R*0.9, rr, rr*0.32, 0, 0, Math.PI*2); ctx.stroke();
  }
  for (let i=0; i<6; i++){
    const ang = t*1.3 + i*1.05;
    const rr = R*0.85 + Math.sin(t*1.7+i)*R*0.12;
    const x = Math.cos(ang)*rr, y = Math.sin(ang)*rr*0.7 - R*0.35;
    ctx.fillStyle = 'rgba(170,230,255,0.85)';
    ctx.beginPath();
    ctx.moveTo(x, y - 3.2*S);
    ctx.quadraticCurveTo(x + 2.4*S, y + 1.6*S, x, y + 3.2*S);
    ctx.quadraticCurveTo(x - 2.4*S, y + 1.6*S, x, y - 3.2*S);
    ctx.fill();
  }
  const sheen = ctx.createLinearGradient(-R*0.4, -R*0.6, R*0.4, R*0.2);
  sheen.addColorStop(0, 'rgba(140,220,255,0.32)');
  sheen.addColorStop(0.55, 'rgba(140,220,255,0)');
  sheen.addColorStop(1, 'rgba(90,180,255,0.22)');
  ctx.fillStyle = sheen;
  bodyPath(R, 'water'); ctx.fill();
}

/* 雷：身上爬动电弧 + 电压脉冲 + 溅射电花 */
function vfxThunder(now, R, el){
  const tick = Math.floor(now / 90);
  const pulse = 0.55 + 0.45*Math.abs(Math.sin(now/260));
  const g = ctx.createRadialGradient(0, -R*0.15, 0, 0, -R*0.15, R*1.0);
  g.addColorStop(0, 'rgba(190,130,255,'+(0.30*pulse)+')');
  g.addColorStop(1, 'rgba(120,60,220,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, -R*0.15, R*1.0, 0, Math.PI*2); ctx.fill();

  for (let a=0; a<3; a++){
    const segs = 6;
    ctx.beginPath();
    for (let i=0; i<=segs; i++){
      const u = i/segs;
      const bx = -R*0.45 + u*R*0.9;
      const by = -R*0.55 + hash(tick*17 + a*29 + i*7) * R*0.95;
      const jx = (hash(tick*31 + a*11 + i*5) - 0.5) * R*0.22;
      const jy = (hash(tick*41 + a*13 + i*3) - 0.5) * R*0.22;
      if (i===0) ctx.moveTo(bx + jx, by + jy); else ctx.lineTo(bx + jx, by + jy);
    }
    ctx.strokeStyle = a===0 ? 'rgba(235,210,255,0.95)' : 'rgba(170,110,255,0.8)';
    ctx.lineWidth = (a===0 ? 2.4 : 1.6)*S;
    ctx.shadowColor = '#a765ff'; ctx.shadowBlur = 10*S;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.strokeStyle = 'rgba(240,225,255,0.95)'; ctx.lineWidth = 2*S;
  ctx.beginPath();
  ctx.moveTo(-R*0.10, -R*1.30); ctx.lineTo(R*0.02, -R*1.06);
  ctx.lineTo(-R*0.08, -R*1.02); ctx.lineTo(R*0.08, -R*0.76);
  ctx.stroke();
  for (let i=0; i<5; i++){
    const life = (now/700 + i*0.21) % 1;
    const ang = hash(i*7 + tick*3) * Math.PI*2;
    const rr = R*0.55 + life*R*0.9;
    ctx.fillStyle = 'rgba(230,205,255,'+(1-life)+')';
    ctx.beginPath();
    ctx.arc(Math.cos(ang)*rr, Math.sin(ang)*rr*0.8 - R*0.2, 1.8*S, 0, Math.PI*2);
    ctx.fill();
  }
}

/* 冰：身上结霜 + 环绕冰棱 + 脚下寒雾 */
function vfxIce(now, R, el){
  const t = now/1000;
  for (let i=0; i<4; i++){
    const ph = (t*0.35 + i*0.25) % 1;
    const x = Math.sin(i*2.1 + t*0.8) * R*0.7;
    const y = R*0.85 - ph*R*0.5;
    const g = ctx.createRadialGradient(x, y, 0, x, y, R*0.55);
    g.addColorStop(0, 'rgba(190,245,255,'+(0.22*(1-ph))+')');
    g.addColorStop(1, 'rgba(120,220,240,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, R*0.55, 0, Math.PI*2); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(200,250,255,0.75)';
  ctx.lineWidth = 1.4*S;
  ctx.beginPath();
  ctx.moveTo(-R*0.28, -R*0.55); ctx.lineTo(R*0.18, -R*0.10);
  ctx.lineTo(-R*0.10, R*0.14);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(R*0.30, -R*0.52); ctx.lineTo(-R*0.06, -R*0.16);
  ctx.stroke();

  for (let i=0; i<6; i++){
    const ang = t*0.9 + i*Math.PI/3;
    const rr = R*1.02 + Math.sin(t*1.4 + i)*R*0.08;
    const x = Math.cos(ang)*rr, y = Math.sin(ang)*rr*0.62 - R*0.28;
    const size = (4.2 + Math.sin(t*2 + i))*S;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.fillStyle = 'rgba(170,240,255,0.85)';
    ctx.beginPath();
    ctx.moveTo(0, -size*1.6); ctx.lineTo(size*0.5, 0);
    ctx.lineTo(0, size*1.6); ctx.lineTo(-size*0.5, 0);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(235,255,255,0.9)'; ctx.lineWidth = 1*S; ctx.stroke();
    ctx.restore();
  }
  const cold = ctx.createRadialGradient(0, -R*0.2, 0, 0, -R*0.2, R*1.05);
  cold.addColorStop(0, 'rgba(170,240,255,0.24)');
  cold.addColorStop(1, 'rgba(90,200,230,0)');
  ctx.fillStyle = cold;
  ctx.beginPath(); ctx.arc(0, -R*0.2, R*1.05, 0, Math.PI*2); ctx.fill();
}

/* --- 风：身后残影拖尾（先于本体绘制） --- */
function vfxWindTrail(now, R, el){
  const t = now/1000;
  const sway = Math.sin(t*2.2) * R*0.06;
  for (let i=1; i<=3; i++){
    ctx.save();
    ctx.globalAlpha = 0.20 / i;
    ctx.translate(-i*R*0.24, sway*i);
    const k = 1 - i*0.14;
    ctx.scale(k, k);
    bodyPath(R, 'wind');
    ctx.fillStyle = el.color;
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* --- 风：环绕风刃 + 脚下气流环 + 弧形风带 + 旋风粒子 --- */
function vfxRock(now, R, el){
  if (!ROCK_SHAPE) ROCK_SHAPE = makeRockShape();
  ROCK_SHAPE.forEach((st, i)=>{
    const a = st.ang + now/1400 * (i%2 ? -1 : 1);
    const bob = Math.sin(now/520 + st.bob) * R*0.10;
    const x = Math.cos(a) * st.rad;
    const y = Math.sin(a) * st.rad * 0.72 - R*0.15 + bob;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(a*0.6 + now/2600);
    // 石块本体（形状每局随机，尺寸恒定上限）
    ctx.beginPath();
    st.pts.forEach((pt, k)=>{ if(k===0) ctx.moveTo(pt[0], pt[1]); else ctx.lineTo(pt[0], pt[1]); });
    ctx.closePath();
    const g = ctx.createLinearGradient(-st.rr, -st.rr, st.rr, st.rr);
    g.addColorStop(0, 'rgba(120,98,44,0.95)');
    g.addColorStop(0.55, 'rgba(201,162,39,0.9)');
    g.addColorStop(1, 'rgba(52,40,14,0.95)');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(240,215,138,0.55)';
    ctx.lineWidth = 1.1*S;
    ctx.stroke();
    ctx.restore();
  });
}

function vfxWind(now, R, el){
  const t = now/1000;

  // 脚下环形气流（三圈扩散）
  for (let i=0; i<3; i++){
    const ph = (t*0.62 + i*0.34) % 1;
    const rr = R*0.46 + ph*R*1.18;
    ctx.strokeStyle = 'rgba(160,255,220,'+(0.42*(1-ph))+')';
    ctx.lineWidth = 2*S;
    ctx.beginPath(); ctx.ellipse(0, R*0.88, rr, rr*0.30, 0, 0, Math.PI*2); ctx.stroke();
  }

  // 三片环绕风刃
  for (let i=0; i<3; i++){
    const ang = t*2.1 + i*Math.PI*2/3;
    const rr = R*0.95 + Math.sin(t*3 + i)*R*0.08;
    const x = Math.cos(ang)*rr, y = Math.sin(ang)*rr*0.58 - R*0.16;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang*1.5);
    ctx.strokeStyle = 'rgba(200,255,238,0.9)';
    ctx.lineWidth = 2.2*S;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 0, R*0.30, -0.85, 0.95); ctx.stroke();
    // 刃尖
    ctx.fillStyle = 'rgba(230,255,246,0.95)';
    ctx.beginPath();
    ctx.moveTo(R*0.20, R*0.26);
    ctx.lineTo(R*0.36, R*0.12);
    ctx.lineTo(R*0.14, R*0.09);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // 左右弧形风带
  [-1, 1].forEach((sgn, idx)=>{
    const off = Math.sin(t*2.4 + idx*1.7) * R*0.10;
    ctx.strokeStyle = 'rgba(150,250,215,0.5)';
    ctx.lineWidth = 2*S;
    ctx.beginPath();
    ctx.moveTo(sgn*R*0.28, -R*0.56 + off);
    ctx.quadraticCurveTo(sgn*R*0.92, -R*0.14 + off, sgn*R*0.36, R*0.40 + off);
    ctx.stroke();
  });

  // 旋风粒子（沿旋涡上升）
  for (let i=0; i<8; i++){
    const life = (t*0.9 + i*0.125) % 1;
    const a = t*3 + i*0.8;
    const rr = R*(0.34 + life*1.0);
    const x = Math.cos(a)*rr;
    const y = Math.sin(a)*rr*0.55 - R*0.10 - life*R*0.55;
    ctx.fillStyle = 'rgba(222,255,244,'+(1-life)+')';
    ctx.beginPath(); ctx.arc(x, y, 1.6*S, 0, Math.PI*2); ctx.fill();
  }

  // 风息冷光
  const g = ctx.createRadialGradient(0, -R*0.2, 0, 0, -R*0.2, R*1.0);
  g.addColorStop(0, 'rgba(120,255,208,0.22)');
  g.addColorStop(1, 'rgba(60,220,180,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, -R*0.2, R*1.0, 0, Math.PI*2); ctx.fill();
}

/* ========================= 战场 ========================= */
function drawHUD(){
  const nowHud = performance.now();   // 冷却读秒用
  ctx.fillStyle = 'rgba(8,11,19,0.92)';
  ctx.fillRect(0, 0, W, UI.hud);
  ctx.strokeStyle = 'rgba(70,90,130,0.45)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, UI.hud); ctx.lineTo(W, UI.hud); ctx.stroke();

  const barW = Math.min(W*0.26, 260*S), barH = Math.round(7*S);
  const y = Math.round(UI.hud*0.42);

  font(12); ctx.textAlign = 'left'; ctx.fillStyle = '#ff4d4d';
  ctx.fillText('P1', 12*S, y + barH);
  const x1 = 12*S + 26*S;
  const r1 = p1 ? clamp(p1.hpShow / p1.maxHp, 0, 1) : 1;
  drawBar(x1, y, barW, barH, '#ff4d4d', r1);
  font(13); ctx.fillStyle = '#e8eeff'; ctx.textAlign = 'left';
  ctx.fillText(p1 ? String(Math.ceil(p1.hpShow)) : String(MAX_HP), x1 + barW + 8*S, y + barH);
  drawFreezeChip(x1 + 6*S, y + barH + 9*S, p1, nowHud);
  drawOrbChips(p1, x1 + barW + 36*S, y + barH + 9*S, nowHud, false);

  font(12); ctx.textAlign = 'right'; ctx.fillStyle = '#4da6ff';
  ctx.fillText('P2', W - 12*S, y + barH);
  const x2 = W - 12*S - 26*S - barW;
  const r2 = p2 ? clamp(p2.hpShow / p2.maxHp, 0, 1) : 1;
  drawBar(x2, y, barW, barH, '#4da6ff', r2);
  font(13); ctx.fillStyle = '#e8eeff'; ctx.textAlign = 'right';
  ctx.fillText(p2 ? String(Math.ceil(p2.hpShow)) : String(MAX_HP), x2 - 8*S, y + barH);
  drawFreezeChip(x2 + barW - 6*S, y + barH + 9*S, p2, nowHud);
  drawOrbChips(p2, x2 + 6*S - 32*S, y + barH + 9*S, nowHud, true);

  if (p3){
    const bw3 = Math.min(W*0.30, 300*S);
    const x3 = W/2 - bw3/2;
    const y3 = y + barH + 6*S;
    font(10, 600); ctx.textAlign = 'left'; ctx.fillStyle = '#a765ff';
    ctx.fillText('电脑', x3, y3 + barH*0.85);
    drawBar(x3 + 26*S, y3, bw3 - 26*S, barH, '#a765ff', clamp(p3.hpShow/p3.maxHp, 0, 1));
    font(9, 500); ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(150,165,195,0.6)';
    ctx.fillText('三人混战', W/2, y3 + barH*2.9);
  } else {
    ctx.textAlign = 'center';
    font(10, 500); ctx.fillStyle = 'rgba(150,165,195,0.8)';
    ctx.fillText('▲ 克制 ×1.35 ｜ ▽ 被克 ×0.78 ｜ ' + ELEM_RING_TEXT, W/2, y + barH);
  }

  drawBHKillChip();
  drawRoundBtn(UI.musicX, UI.musicY, UI.btnR, musicOn ? 'music' : 'mute');
  drawRoundBtn(UI.pauseX, UI.pauseY, UI.btnR, 'pause');

}

function drawMapBtn(){

function drawOrbChips(p, x, y, now, alignRight){
  if (!p || p.elem !== 'dark') return;
  const total = (ELEM.dark.passive && ELEM.dark.passive.orbs) || 4;
  const r = 4.2*S, gap = 11*S;
  const shell = p.darkShellEnd > now;
  for (let i=0; i<total; i++){
    const cx = alignRight ? (x - i*gap) : (x + i*gap);
    const alive = i < p.orbs;
    if (alive){
      const g = ctx.createRadialGradient(cx - r*0.35, y - r*0.35, 0, cx, y, r*1.6);
      g.addColorStop(0, shell ? 'rgba(255,255,255,0.95)' : 'rgba(226,208,255,0.95)');
      g.addColorStop(0.5, shell ? 'rgba(203,168,255,0.85)' : 'rgba(150,104,240,0.85)');
      g.addColorStop(1, 'rgba(70,34,140,0.10)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, y, r*1.25, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(202,168,255,0.9)';
    } else {
      ctx.fillStyle = 'rgba(70,70,92,0.35)';
      ctx.beginPath(); ctx.arc(cx, y, r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(110,110,136,0.35)';
    }
    ctx.lineWidth = 1.1*S;
    ctx.beginPath(); ctx.arc(cx, y, r, 0, Math.PI*2); ctx.stroke();
  }
}

function drawFreezeChip(cx, cy, p, now){
  if (!p || p.elem !== 'ice') return;
  const cd = Math.max(0, (p.freezeLockEnd || 0) - now);
  const ready = cd <= 0;
  const r = 5.5*S;
  ctx.strokeStyle = ready ? 'rgba(150,225,255,0.95)' : 'rgba(120,140,175,0.55)';
  ctx.lineWidth = 1.2*S;
  ctx.beginPath();
  for (let i=0;i<6;i++){
    const a = -Math.PI/2 + i*Math.PI/3;
    const px = cx + Math.cos(a)*r, py = cy + Math.sin(a)*r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r);
  ctx.moveTo(cx - r*0.87, cy - r*0.5); ctx.lineTo(cx + r*0.87, cy + r*0.5);
  ctx.moveTo(cx - r*0.87, cy + r*0.5); ctx.lineTo(cx + r*0.87, cy - r*0.5);
  ctx.stroke();
  font(8, 500); ctx.textAlign = 'left';
  ctx.fillStyle = ready ? 'rgba(150,225,255,0.9)' : 'rgba(150,165,190,0.75)';
  ctx.fillText(ready ? '冻' : Math.ceil(cd/1000) + 's', cx + r + 3*S, cy + 3*S);
}

function drawBar(x, y, w, h, col, ratio){
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  rrPath(x, y, w, h, h/2); ctx.fill();
  const fillW = Math.max(0, w * clamp(ratio, 0, 1));
  if (fillW < 1) return;
  const g = ctx.createLinearGradient(x, y, x+fillW, y);
  g.addColorStop(0, col); g.addColorStop(1, col+'99');
  ctx.fillStyle = g;
  rrPath(x, y, Math.max(fillW, h), h, h/2); ctx.fill();
}
function drawRoundBtn(cx, cy, r, icon){
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(35,44,64,0.95)'; ctx.fill();
  ctx.strokeStyle = 'rgba(120,145,185,0.55)'; ctx.lineWidth = 1.2*S; ctx.stroke();
  ctx.strokeStyle = '#dce7ff'; ctx.lineWidth = 1.8*S;
  if (icon === 'music' || icon === 'mute'){
    ctx.beginPath(); ctx.arc(cx - r*0.22, cy + r*0.25, r*0.20, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - r*0.05, cy + r*0.25); ctx.lineTo(cx - r*0.05, cy - r*0.30);
    ctx.lineTo(cx + r*0.32, cy - r*0.40); ctx.stroke();
    if (icon === 'mute'){
      ctx.strokeStyle = '#ff6b6b';
      ctx.beginPath(); ctx.moveTo(cx - r*0.6, cy - r*0.6); ctx.lineTo(cx + r*0.6, cy + r*0.6); ctx.stroke();
    }
  } else {
    ctx.beginPath(); ctx.moveTo(cx - r*0.18, cy - r*0.34); ctx.lineTo(cx - r*0.18, cy + r*0.34); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + r*0.22, cy - r*0.34); ctx.lineTo(cx + r*0.22, cy + r*0.34); ctx.stroke();
  }
}

/* ========================= 地图绘制：元素遗迹 ========================= */
function paintBrickFloor(g, cw, ch, R){
  const bw = Math.round(R * 1.55);          // 砖宽
  const bh = Math.round(bw * 0.55);         // 砖高
  const rows = Math.ceil(ch / bh) + 1;
  const cols = Math.ceil(cw / bw) + 2;

  const fg = g.createLinearGradient(0, 0, 0, ch);
  fg.addColorStop(0, 'rgba(26,31,45,1)');
  fg.addColorStop(0.5, 'rgba(21,26,38,1)');
  fg.addColorStop(1, 'rgba(16,20,30,1)');
  g.fillStyle = fg;
  g.fillRect(0, 0, cw, ch);

  // 砖块：明暗按行列哈希固定（同一块砖永远一样，绝不闪）
  for (let r=0; r<rows; r++){
    const y = r*bh;
    const off = (r % 2) ? -bw/2 : 0;
    for (let c=-1; c<cols; c++){
      const x = c*bw + off;
      if (x > cw || x + bw < 0) continue;
      const hsh = ((r*11 + c*7) % 9) / 9;
      const rr = Math.round(36 + hsh*12);
      const gg = Math.round(44 + hsh*14);
      const bb = Math.round(60 + hsh*16);
      g.fillStyle = 'rgba(' + rr + ',' + gg + ',' + bb + ',1)';
      g.fillRect(x+1, y+1, bw-2, bh-2);
      g.fillStyle = 'rgba(150,180,220,0.06)';
      g.fillRect(x+2, y+2, bw-4, Math.max(1, bh*0.18));
    }
  }

  // 砖缝
  g.strokeStyle = 'rgba(70,88,120,0.45)';
  g.lineWidth = 1;
  g.beginPath();
  for (let r=0; r<=rows; r++){
    const y = r*bh;
    g.moveTo(0, y); g.lineTo(cw, y);
  }
  g.stroke();
  g.beginPath();
  for (let r=0; r<rows; r++){
    const y = r*bh;
    const off = (r % 2) ? -bw/2 : 0;
    for (let c=-1; c<=cols; c++){
      const x = c*bw + off;
      g.moveTo(x, y); g.lineTo(x, y + bh);
    }
  }
  g.stroke();
}

function drawBrickFloor(top, bot){
  const cw = Math.max(1, Math.round(W));
  const ch = Math.max(1, Math.round(bot - top));
  const key = cw + 'x' + ch + '_' + Math.round(UI.R) + '_' + MAP.id;
  if (!_floorCache || _floorKey !== key){
    try {
      const cv = document.createElement('canvas');
      cv.width = cw; cv.height = ch;
      paintBrickFloor(cv.getContext('2d'), cw, ch, UI.R);
      _floorCache = cv; _floorKey = key;
    } catch(e){
      _floorCache = null; _floorKey = '';
    }
  }
  if (_floorCache){
    ctx.drawImage(_floorCache, 0, top);      // 纹理一次成像，每帧只贴一张图：稳、省、绝不闪
  } else {
    ctx.save(); ctx.translate(0, top);
    paintBrickFloor(ctx, cw, ch, UI.R);
    ctx.restore();
  }
}

/* 霜极巨剑：整张地板强制结冰（浅蓝冰面 + 裂纹 + 反光带），一次成像缓存，每帧贴图不闪 */
function paintIceFloor(g, cw, ch, R){
  const bg = g.createLinearGradient(0, 0, 0, ch);
  bg.addColorStop(0, 'rgba(' + iceRgb(30,54,74) + ',1)');
  bg.addColorStop(0.5, 'rgba(' + iceRgb(25,48,68) + ',1)');
  bg.addColorStop(1, 'rgba(' + iceRgb(19,40,58) + ',1)');
  g.fillStyle = bg;
  g.fillRect(0, 0, cw, ch);

  // 冰面板：错缝多边形，明暗按行列哈希固定（绝不随机、不闪）
  const bw = Math.round(R*3.2), bh = Math.round(R*2.3);
  const rows = Math.ceil(ch / bh) + 1, cols = Math.ceil(cw / bw) + 1;
  for (let r=0; r<rows; r++){
    for (let c=-1; c<cols; c++){
      const x = c*bw + ((r%2) ? bw*0.36 : 0);
      const y = r*bh;
      if (x > cw || x + bw < 0 || y > ch) continue;
      const h2 = ((r*13 + c*17) % 11) / 11;
      g.fillStyle = 'rgba(' + Math.round(104 + h2*44) + ',' +
                             Math.round(168 + h2*48) + ',' +
                             Math.round(196 + h2*54) + ',0.26)';
      g.beginPath();
      g.moveTo(x + bw*0.05, y + bh*0.09);
      g.lineTo(x + bw*0.93, y + bh*0.04);
      g.lineTo(x + bw*0.86, y + bh*0.93);
      g.lineTo(x + bw*0.11, y + bh*0.86);
      g.closePath();
      g.fill();
      // 高光边（固定位置）
      g.strokeStyle = 'rgba(' + iceRgb(214,246,255) + ',0.16)';
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(x + bw*0.05, y + bh*0.09);
      g.lineTo(x + bw*0.93, y + bh*0.04);
      g.stroke();
    }
  }

  // 冰裂纹：由行列哈希决定方向，永久固定
  g.strokeStyle = 'rgba(' + iceRgb(226,250,255) + ',0.20)';
  g.lineWidth = 1.2;
  for (let i=0; i<26; i++){
    const x0 = ((i*97) % cw);
    const y0 = ((i*61) % ch);
    const len = 30 + ((i*23) % 90);
    const ang = ((i*37) % 360) * Math.PI / 180;
    g.beginPath();
    g.moveTo(x0, y0);
    g.lineTo(x0 + Math.cos(ang)*len, y0 + Math.sin(ang)*len);
    g.stroke();
  }

  // 斜向反光带
  for (let i=0; i<3; i++){
    const x = cw * (0.12 + i*0.3);
    const lg = g.createLinearGradient(x, 0, x + cw*0.16, ch);
    lg.addColorStop(0, 'rgba(' + iceRgb(220,248,255) + ',0)');
    lg.addColorStop(0.5, 'rgba(' + iceRgb(220,248,255) + ',0.10)');
    lg.addColorStop(1, 'rgba(' + iceRgb(220,248,255) + ',0)');
    g.fillStyle = lg;
    g.beginPath();
    g.moveTo(x, 0); g.lineTo(x + cw*0.16, 0);
    g.lineTo(x + cw*0.16 - cw*0.10, ch); g.lineTo(x - cw*0.10, ch);
    g.closePath(); g.fill();
  }
}

function drawIceFloor(top, bot){
  const cw = Math.max(1, Math.round(W));
  const ch = Math.max(1, Math.round(bot - top));
  const key = cw + 'x' + ch + '_' + Math.round(UI.R) + '_ice' + (iceSkinUnlocked && iceSkinOn ? '_pink' : '');
  if (!_iceCache || _iceKey !== key){
    try {
      const cv = document.createElement('canvas');
      cv.width = cw; cv.height = ch;
      paintIceFloor(cv.getContext('2d'), cw, ch, UI.R);
      _iceCache = cv; _iceKey = key;
    } catch(e){ _iceCache = null; _iceKey = ''; }
  }
  if (_iceCache){
    ctx.drawImage(_iceCache, 0, top);
  } else {
    ctx.save(); ctx.translate(0, top);
    paintIceFloor(ctx, cw, ch, UI.R);
    ctx.restore();
  }
}

function drawMap(now){
  const R = UI.R;
  const top = UI.top, bot = UI.bottom;

  // 地面：深色渐变
  const g = ctx.createLinearGradient(0, top, 0, bot);
  g.addColorStop(0, 'rgba(16,20,32,0.96)');
  g.addColorStop(0.55, 'rgba(13,17,27,0.97)');
  g.addColorStop(1, 'rgba(9,12,20,0.99)');
  ctx.fillStyle = g;
  ctx.fillRect(0, top, W, bot - top);

  if (anyGiantActive(performance.now())) drawIceFloor(top, bot);   // 霜极巨剑期间：地板强制结冰
  else if (MAP.id === 'ruins') drawBrickFloor(top, bot);
  else {
    // 试验场：细网格（静态，不闪）
    const step = Math.round(R * 2.2);
    ctx.strokeStyle = 'rgba(78,98,135,0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = step/2; x < W; x += step){
      ctx.moveTo(x, top); ctx.lineTo(x, bot);
    }
    for (let y = top + step/2; y < bot; y += step){
      ctx.moveTo(0, y); ctx.lineTo(W, y);
    }
    ctx.stroke();
  }

  // 中线与中央圈
  const cx = W*0.5, cy = (top + bot)/2;

  // 符文（坐标固定、透明度固定：不再每帧抖动，杜绝闪烁）
  MAP.decals.forEach(d=>{
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.strokeStyle = 'rgba(120,170,240,0.20)';
    ctx.lineWidth = 1.4*S;
    ctx.beginPath(); ctx.arc(0, 0, d.s, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = 'rgba(150,195,255,0.16)';
    ctx.beginPath(); ctx.arc(0, 0, d.s*0.72, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = 'rgba(150,195,255,0.14)';
    ctx.beginPath();
    ctx.moveTo(-d.s, 0); ctx.lineTo(d.s, 0);
    ctx.moveTo(0, -d.s); ctx.lineTo(0, d.s);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(150,195,255,0.12)';
    ctx.beginPath();
    ctx.moveTo(-d.s*0.62, -d.s*0.62); ctx.lineTo(d.s*0.62, d.s*0.62);
    ctx.moveTo(d.s*0.62, -d.s*0.62); ctx.lineTo(-d.s*0.62, d.s*0.62);
    ctx.stroke();
    ctx.restore();
  });

  // 石柱（实体碰撞：柱体、底座、顶部符文环都是固定参数）
  MAP.pillars.forEach(o=>{
    const r = o.r;
    ctx.fillStyle = 'rgba(0,0,0,0.34)';
    ctx.beginPath(); ctx.ellipse(o.x, o.y + r*0.55, r*1.20, r*0.42, 0, 0, Math.PI*2); ctx.fill();

    const pg = ctx.createLinearGradient(o.x - r, 0, o.x + r, 0);
    pg.addColorStop(0, 'rgba(34,43,64,0.98)');
    pg.addColorStop(0.45, 'rgba(80,99,134,0.98)');
    pg.addColorStop(1, 'rgba(28,36,55,0.98)');
    ctx.fillStyle = pg;
    rrPath(o.x - r*0.72, o.y - r*1.15, r*1.44, r*1.70, r*0.26);
    ctx.fill();
    ctx.strokeStyle = 'rgba(140,175,235,0.55)';
    ctx.lineWidth = 1.4*S;
    rrPath(o.x - r*0.72, o.y - r*1.15, r*1.44, r*1.70, r*0.26);
    ctx.stroke();

    // 柱身刻痕
    ctx.strokeStyle = 'rgba(150,190,245,0.30)';
    ctx.lineWidth = 1.1*S;
    for (let i=0; i<3; i++){
      const ty = o.y - r*0.55 + i*r*0.62;
      ctx.beginPath();
      ctx.moveTo(o.x - r*0.44, ty); ctx.lineTo(o.x + r*0.44, ty);
      ctx.stroke();
    }

    // 顶部符文环：按 now 缓慢转，频率很低（0.5 圈/秒以下），不会闪
    const spin = now / 2600;
    ctx.strokeStyle = 'rgba(160,205,255,0.42)';
    ctx.lineWidth = 1.6*S;
    ctx.beginPath(); ctx.arc(o.x, o.y - r*1.15, r*0.46, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = 'rgba(190,225,255,0.55)';
    for (let i=0; i<3; i++){
      const a = spin + i*Math.PI*2/3;
      ctx.beginPath();
      ctx.moveTo(o.x + Math.cos(a)*r*0.18, o.y - r*1.15 + Math.sin(a)*r*0.18);
      ctx.lineTo(o.x + Math.cos(a)*r*0.46, o.y - r*1.15 + Math.sin(a)*r*0.46);
      ctx.stroke();
    }
  });
  ctx.strokeStyle = 'rgba(110,150,210,0.16)';
  ctx.lineWidth = 1.5*S;
  ctx.beginPath(); ctx.moveTo(cx, top + 6*S); ctx.lineTo(cx, bot - 6*S); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx, cy, R*6.4, R*4.4, 0, 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([10*S, 9*S]);
  ctx.strokeStyle = 'rgba(110,150,210,0.10)';
  ctx.beginPath(); ctx.ellipse(cx, cy, R*3.2, R*2.2, 0, 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);

  // 出生地标（静态环）
  allPlayers().forEach(pl=>{
    const col = pl.i === 1 ? '#ff4d4d' : (pl.i === 2 ? '#4da6ff' : '#a765ff');
    ctx.strokeStyle = col + '44';
    ctx.lineWidth = 2*S;
    ctx.beginPath(); ctx.arc(pl.x, pl.y, R*1.9, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = col + '1a';
    ctx.setLineDash([6*S, 6*S]);
    ctx.beginPath(); ctx.arc(pl.x, pl.y, R*2.6, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  });

  // 四角标线（不出屏，也不闪）
  ctx.strokeStyle = 'rgba(120,150,200,0.22)';
  ctx.lineWidth = 2*S;
  const m = 10*S, L2 = 26*S;
  [[m, top+m, 1, 1], [W-m, top+m, -1, 1], [m, bot-m, 1, -1], [W-m, bot-m, -1, -1]].forEach(([x, y, sx, sy])=>{
    ctx.beginPath();
    ctx.moveTo(x + L2*sx, y); ctx.lineTo(x, y); ctx.lineTo(x, y + L2*sy);
    ctx.stroke();
  });

  // 地图名
  ctx.textAlign = 'center';
  font(9, 600); ctx.fillStyle = 'rgba(120,140,180,0.6)';
  ctx.fillText(MAP.name + (mode === 'ffa' ? ' · 三人混战' : ' · 1v1'), W*0.5, bot + 13*S);
}

function drawWhips(){
  whips.forEach(w=>{
    const k = clamp(w.t / w.life, 0, 1);
    const grow = Math.min(1, k*2.6);                 // 抽出去的那一下
    const len = w.reach * grow;
    const alpha = (1 - k) * 0.95;
    ctx.save();
    ctx.globalAlpha = alpha;
    for (let layer=0; layer<3; layer++){
      const cx = w.x, cy = w.y - UI.R*0.15;
      const wdt = (layer === 0 ? 5 : layer === 1 ? 2.4 : 1.2) * S;
      ctx.strokeStyle = layer === 0 ? 'rgba(150,90,255,0.55)' : (layer === 1 ? 'rgba(215,180,255,0.9)' : '#ffffff');
      ctx.lineWidth = wdt;
      ctx.beginPath();
      const segs = 9;
      for (let i=0; i<=segs; i++){
        const u = i/segs;
        const bend = Math.sin(u*Math.PI) * (w.owner.face || 1) * UI.R*0.14;
        const nx = -Math.sin(w.ang), ny = Math.cos(w.ang);
        const jitter = (i===0 || i===segs) ? 0 : Math.sin(w.seed + i*2.7 + layer) * UI.R*0.16;
        const px = cx + Math.cos(w.ang)*len*u + nx*(bend + jitter);
        const py = cy + Math.sin(w.ang)*len*u + ny*(bend + jitter);
        if (i===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    // 鞭梢电球
    const tipX = w.x + Math.cos(w.ang)*len, tipY = w.y - UI.R*0.15 + Math.sin(w.ang)*len;
    const g = ctx.createRadialGradient(tipX, tipY, 0, tipX, tipY, UI.R*0.6);
    g.addColorStop(0, 'rgba(235,215,255,0.95)');
    g.addColorStop(1, 'rgba(150,90,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(tipX, tipY, UI.R*0.6, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  });
}

function drawIceFx(now){
  iceFx.forEach(fx=>{
    const k = clamp(fx.t / fx.life, 0, 1);
    ctx.save();
    ctx.globalAlpha = 1 - k;
    if (fx.kind === 'giantH'){
      // 横劈：面前 3.9R 的巨大扇面剑光
      const prog = Math.min(1, k*1.8);
      const reach = UI.R*3.9 * Math.max(0.4, prog);
      const arc = 1.45;
      const g = ctx.createRadialGradient(fx.x, fx.y, UI.R*0.3, fx.x, fx.y, reach);
      g.addColorStop(0, 'rgba(' + iceRgb(215,250,255) + ',0)');
      g.addColorStop(0.65, 'rgba(' + iceRgb(160,238,255) + ','+(0.42*(1-k))+')');
      g.addColorStop(1, 'rgba(' + iceRgb(80,200,235) + ','+(0.12*(1-k))+')');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(fx.x, fx.y);
      ctx.arc(fx.x, fx.y, reach, fx.ang - arc, fx.ang + arc);
      ctx.closePath(); ctx.fill();

      ctx.strokeStyle = 'rgba(' + iceRgb(240,253,255) + ','+(0.95*(1-k))+')';
      ctx.lineWidth = 6*S*(1-k*0.6);
      ctx.beginPath();
      ctx.arc(fx.x, fx.y, reach*1.02, fx.ang - arc, fx.ang + arc);
      ctx.stroke();

      // 弧形冰屑
      for (let i=0; i<9; i++){
        const a = fx.ang - arc + (2*arc)*(i/8);
        const rr = reach*0.95;
        const px = fx.x + Math.cos(a)*rr, py = fx.y + Math.sin(a)*rr;
        ctx.fillStyle = 'rgba(' + iceRgb(226,250,255) + ','+(0.9*(1-k))+')';
        ctx.beginPath();
        ctx.moveTo(px, py - 8*S); ctx.lineTo(px + 4*S, py);
        ctx.lineTo(px, py + 8*S); ctx.lineTo(px - 4*S, py);
        ctx.closePath(); ctx.fill();
      }
    } else if (fx.kind === 'giantV'){
      // 竖劈：从天上砸下贯穿整屏的光柱（落在角色前方）
      const px = fx.x + (fx.ang === 0 ? UI.R*1.15 : -UI.R*1.15);
      const wcol = UI.R*1.5 * (1 - k*0.55);
      const lg = ctx.createLinearGradient(px - wcol, 0, px + wcol, 0);
      lg.addColorStop(0, 'rgba(' + iceRgb(150,235,255) + ',0)');
      lg.addColorStop(0.42, 'rgba(' + iceRgb(200,245,255) + ','+(0.28*(1-k))+')');
      lg.addColorStop(0.5, 'rgba(' + iceRgb(255,255,255) + ','+(0.95*(1-k))+')');
      lg.addColorStop(0.58, 'rgba(' + iceRgb(200,245,255) + ','+(0.28*(1-k))+')');
      lg.addColorStop(1, 'rgba(' + iceRgb(150,235,255) + ',0)');
      ctx.fillStyle = lg;
      ctx.fillRect(px - wcol, UI.top, wcol*2, UI.bottom - UI.top);

      // 落点冰爆
      const r2 = UI.R*1.1 * (1 + k*2.2);
      ctx.strokeStyle = 'rgba(' + iceRgb(235,252,255) + ','+(0.8*(1-k))+')';
      ctx.lineWidth = 3*S;
      ctx.beginPath();
      ctx.ellipse(px, fx.y + UI.R*0.9, r2, r2*0.38, 0, 0, Math.PI*2);
      ctx.stroke();
      for (let i=0; i<7; i++){
        const a = (i/7)*Math.PI*2;
        const rr = r2*1.15;
        const qx = px + Math.cos(a)*rr, qy = fx.y + UI.R*0.9 + Math.sin(a)*rr*0.38;
        ctx.fillStyle = 'rgba(' + iceRgb(220,248,255) + ','+(0.85*(1-k))+')';
        ctx.beginPath();
        ctx.moveTo(qx, qy - 7*S); ctx.lineTo(qx + 3.5*S, qy);
        ctx.lineTo(qx, qy + 7*S); ctx.lineTo(qx - 3.5*S, qy);
        ctx.closePath(); ctx.fill();
      }
    } else if (fx.kind === 'iceSword'){
      // 万剑：5 把巨冰剑横扫过整张地图
      const kk = clamp((fx.t - (fx.delay || 0)) / Math.max(0.05, fx.life - (fx.delay || 0)), 0, 1);
      const dir = fx.ang === 0 ? 1 : -1;
      const xFrom = dir > 0 ? -UI.R*1.6 : W + UI.R*1.6;
      const xTo = dir > 0 ? W + UI.R*1.6 : -UI.R*1.6;
      const px = xFrom + (xTo - xFrom) * kk * kk * 0.9;
      const len = fx.len || UI.R*2.6;

      ctx.save();
      ctx.translate(px, fx.y);
      if (dir < 0) ctx.scale(-1, 1);
      // 拖尾
      const tg = ctx.createLinearGradient(-len*1.4, 0, len, 0);
      tg.addColorStop(0, 'rgba(' + iceRgb(150,235,255) + ',0)');
      tg.addColorStop(1, 'rgba(' + iceRgb(235,252,255) + ','+(0.75*(1-kk*0.5))+')');
      ctx.fillStyle = tg;
      ctx.fillRect(-len*1.4, -UI.R*0.18, len*2.4, UI.R*0.36);
      // 剑身
      ctx.fillStyle = 'rgba(' + iceRgb(230,251,255) + ',0.95)';
      ctx.beginPath();
      ctx.moveTo(len, 0);
      ctx.lineTo(len*0.1, -UI.R*0.30);
      ctx.lineTo(-len*0.2, 0);
      ctx.lineTo(len*0.1, UI.R*0.30);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(' + iceRgb(255,255,255) + ',0.9)';
      ctx.lineWidth = 1.4*S;
      ctx.stroke();
      ctx.restore();
    } else if (fx.kind === 'slash'){
      const prog = Math.min(1, k*2.0);
      const reach = (fx.stage === 1 ? 2.35 : 2.5) * UI.R;
      const arc = fx.stage === 2 ? 0.62 : 1.18;
      // 扫过的剑光扇面
      const g = ctx.createRadialGradient(fx.x, fx.y - UI.R*0.2, UI.R*0.2, fx.x, fx.y - UI.R*0.2, reach);
      g.addColorStop(0, 'rgba(' + iceRgb(210,250,255) + ',0)');
      g.addColorStop(0.6, 'rgba(' + iceRgb(150,235,255) + ','+(0.35*(1-k))+')');
      g.addColorStop(1, 'rgba(' + iceRgb(90,215,240) + ','+(0.1*(1-k))+')');
      ctx.fillStyle = g;
      ctx.beginPath();
      const a0 = fx.ang - arc + (2*arc)*0.15;
      ctx.moveTo(fx.x, fx.y - UI.R*0.2);
      ctx.arc(fx.x, fx.y - UI.R*0.2, reach*Math.max(0.35, prog), a0, fx.ang + arc - (2*arc)*0.15);
      ctx.closePath(); ctx.fill();

      // 剑刃弧线
      ctx.strokeStyle = 'rgba(' + iceRgb(230,252,255) + ',0.9)';
      ctx.lineWidth = 3*S;
      ctx.beginPath();
      ctx.arc(fx.x, fx.y - UI.R*0.2, reach*Math.max(0.35, prog), a0, fx.ang + arc);
      ctx.stroke();
      // 冰晶碎屑
      for (let i=0; i<7; i++){
        const a = fx.ang - arc + (2*arc)*(i/6);
        const rr = reach*Math.max(0.35, prog)*0.92;
        const px = fx.x + Math.cos(a)*rr, py = fx.y - UI.R*0.2 + Math.sin(a)*rr;
        ctx.fillStyle = 'rgba(' + iceRgb(200,245,255) + ','+(0.85*(1-k))+')';
        ctx.beginPath();
        ctx.moveTo(px, py - 6*S);
        ctx.lineTo(px + 3*S, py);
        ctx.lineTo(px, py + 6*S);
        ctx.lineTo(px - 3*S, py);
        ctx.closePath(); ctx.fill();
      }
    } else {
      // 前刺冰痕
      const rr = (fx.r || UI.R*0.5) * (1 + k*0.6);
      const g = ctx.createRadialGradient(fx.x, fx.y, 0, fx.x, fx.y, rr*1.6);
      g.addColorStop(0, 'rgba(' + iceRgb(235,252,255) + ','+(0.55*(1-k))+')');
      g.addColorStop(0.5, 'rgba(' + iceRgb(120,225,245) + ','+(0.35*(1-k))+')');
      g.addColorStop(1, 'rgba(' + iceRgb(60,180,220) + ',0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(fx.x, fx.y, rr*1.6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(' + iceRgb(225,250,255) + ','+(0.8*(1-k))+')';
      for (let i=0; i<3; i++){
        const a = i*2.1 + fx.t*3;
        const px = fx.x + Math.cos(a)*rr*0.5, py = fx.y + Math.sin(a)*rr*0.5;
        ctx.beginPath();
        ctx.moveTo(px, py - 5*S); ctx.lineTo(px + 3*S, py); ctx.lineTo(px, py + 5*S); ctx.lineTo(px - 3*S, py);
        ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();
  });
}

function drawBursts(){
  bursts.forEach(b=>{
    const k = clamp(b.t / b.life, 0, 1);
    ctx.save();
    ctx.globalAlpha = 1 - k;
    // 闪光
    const R0 = UI.R*3.6;
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, R0*(0.4 + k));
    g.addColorStop(0, 'rgba(255,250,215,0.95)');
    g.addColorStop(0.35, 'rgba(255,190,90,0.7)');
    g.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x, b.y, R0*(0.4 + k), 0, Math.PI*2); ctx.fill();

    // 冲击波环
    ctx.strokeStyle = 'rgba(255,225,170,'+(0.75*(1-k))+')';
    ctx.lineWidth = 3*S;
    ctx.beginPath();
    ctx.ellipse(b.x, b.y, UI.R*(1.6 + k*2.2), UI.R*(0.6 + k*0.9), 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  });
}

function drawProjs(){
  projs.forEach(pr=>{
    const rr = pr.r;
    if (pr.type === 'dark'){
      // 影蚀：墨黑柔和轮廓暗影弹 + 消散黑雾拖尾
      const ang = Math.atan2(pr.vy, pr.vx);
      ctx.save();
      for (let i=1; i<=4; i++){
        const u = i/4;
        const px = pr.x - Math.cos(ang)*rr*2.4*u;
        const py = pr.y - Math.sin(ang)*rr*2.4*u;
        ctx.fillStyle = 'rgba(48,20,86,' + (0.34*(1-u)) + ')';
        ctx.beginPath(); ctx.arc(px, py, rr*(1.9 - u*0.9), 0, Math.PI*2); ctx.fill();
      }
      const gd = ctx.createRadialGradient(pr.x, pr.y, 0, pr.x, pr.y, rr*2.0);
      gd.addColorStop(0, 'rgba(6,2,14,0.98)');
      gd.addColorStop(0.5, 'rgba(44,18,92,0.92)');
      gd.addColorStop(0.82, 'rgba(96,58,180,0.55)');
      gd.addColorStop(1, 'rgba(140,96,240,0)');
      ctx.fillStyle = gd;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, rr*2.0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(160,120,255,0.40)';
      ctx.lineWidth = 1.2*S;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, rr*1.2, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
      return;
    }
    if (pr.type === 'light'){
      // 光粒：白金小光点 + 柔光拖尾
      const ang = Math.atan2(pr.vy, pr.vx);
      ctx.save();
      const tg = ctx.createLinearGradient(pr.x - Math.cos(ang)*rr*5, pr.y - Math.sin(ang)*rr*5, pr.x, pr.y);
      tg.addColorStop(0, 'rgba(255,236,170,0)');
      tg.addColorStop(1, 'rgba(255,248,222,0.60)');
      ctx.strokeStyle = tg;
      ctx.lineWidth = rr*1.05;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(pr.x - Math.cos(ang)*rr*5, pr.y - Math.sin(ang)*rr*5);
      ctx.lineTo(pr.x, pr.y);
      ctx.stroke();

      const gl = ctx.createRadialGradient(pr.x, pr.y, 0, pr.x, pr.y, rr*3.0);
      gl.addColorStop(0, 'rgba(255,255,252,0.98)');
      gl.addColorStop(0.32, 'rgba(255,236,178,0.60)');
      gl.addColorStop(1, 'rgba(255,214,120,0)');
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, rr*3.0, 0, Math.PI*2); ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,1)';
      ctx.beginPath(); ctx.arc(pr.x, pr.y, rr*0.58, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      return;
    }
    if (pr.type === 'iceSpike'){
      const ang = Math.atan2(pr.vy, pr.vx);
      ctx.save();
      ctx.translate(pr.x, pr.y); ctx.rotate(ang);
      const g2 = ctx.createLinearGradient(-rr*3.2, 0, rr*1.6, 0);
      g2.addColorStop(0, 'rgba(' + iceRgb(120,220,255) + ',0)');
      g2.addColorStop(0.6, 'rgba(' + iceRgb(120,225,255) + ',0.55)');
      g2.addColorStop(1, 'rgba(' + iceRgb(240,255,255) + ',0.95)');
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.moveTo(rr*1.7, 0);
      ctx.lineTo(-rr*0.6, -rr*0.62);
      ctx.lineTo(-rr*2.8, 0);
      ctx.lineTo(-rr*0.6, rr*0.62);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(' + iceRgb(255,255,255) + ',0.9)';
      ctx.beginPath(); ctx.arc(0, 0, rr*0.28, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      return;
    }
    if (pr.type === 'cyclone'){
      pr.spin = (pr.spin || 0) + 0.35;
      ctx.save();
      ctx.translate(pr.x, pr.y);
      ctx.strokeStyle = 'rgba(140,255,215,0.75)';
      for (let a=0; a<3; a++){
        ctx.lineWidth = rr*0.28;
        ctx.beginPath();
        for (let u=0; u<20; u++){
          const th = pr.spin + a*2.1 + u*0.35;
          const rr2 = rr * (0.15 + u/20 * 0.95);
          const xx = Math.cos(th)*rr2, yy = Math.sin(th)*rr2*0.9;
          if (u===0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
        }
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(200,255,235,0.16)';
      ctx.beginPath(); ctx.arc(0, 0, rr*1.05, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      return;
    }
    if (pr.type === 'blackhole'){
      // 引力矢：迷你斜置黑洞（自带旋转吸积盘 + 光子环），不使用暗元素外观
      pr.spin = (pr.spin || 0) + 0.075;
      ctx.save();
      ctx.translate(pr.x, pr.y);
      ctx.rotate(-0.42);
      // 引力场晕
      const gh = ctx.createRadialGradient(0, 0, rr*0.4, 0, 0, rr*2.1);
      gh.addColorStop(0, 'rgba(255,190,120,0.30)');
      gh.addColorStop(0.55, 'rgba(140,80,230,0.22)');
      gh.addColorStop(1, 'rgba(60,20,120,0)');
      ctx.fillStyle = gh;
      ctx.beginPath(); ctx.arc(0, 0, rr*2.1, 0, Math.PI*2); ctx.fill();
      // 吸积盘（压扁 + 旋转）
      ctx.save();
      ctx.scale(1, 0.34);
      const dg = ctx.createRadialGradient(0, 0, rr*0.42, 0, 0, rr*1.9);
      dg.addColorStop(0, 'rgba(255,244,214,0.95)');
      dg.addColorStop(0.35, 'rgba(255,178,92,0.9)');
      dg.addColorStop(0.72, 'rgba(255,110,50,0.6)');
      dg.addColorStop(1, 'rgba(120,60,200,0)');
      ctx.fillStyle = dg;
      ctx.beginPath(); ctx.arc(0, 0, rr*1.9, 0, Math.PI*2); ctx.fill();
      const a0 = pr.spin;
      for (let i = 0; i < 5; i++){
        const a = a0 + i*(Math.PI*2/5);
        const px = Math.cos(a)*rr*1.25, py = Math.sin(a)*rr*1.25;
        const gg = ctx.createRadialGradient(px, py, 0, px, py, rr*0.55);
        gg.addColorStop(0, 'rgba(255,238,196,0.85)');
        gg.addColorStop(1, 'rgba(255,150,60,0)');
        ctx.fillStyle = gg;
        ctx.beginPath(); ctx.arc(px, py, rr*0.55, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
      // 事件视界 + 光子环
      ctx.fillStyle = '#04030a';
