        const rr = R*1.55;
        ctx.fillStyle = M.c;
        ctx.beginPath();
        ctx.arc(p.x + Math.cos(a)*rr*0.62, p.y - R*1.25 + Math.sin(a)*rr*0.24, 2.6*S, 0, Math.PI*2);
        ctx.fill();
      }
      // 潮湿：脚边水痕；灼烧：脚下焦痕
      ctx.save();
      ctx.translate(p.x, p.y + R*0.92);
      ctx.scale(1, 0.36);
      const soil = { burn:'rgba(68,24,8,', soak:'rgba(34,119,187,', wind:'rgba(24,150,178,',
                     rock:'rgba(74,60,46,', collapse:'rgba(10,2,22,', irrad:'rgba(80,140,220,' }[kind] || 'rgba(34,119,187,';
      ctx.fillStyle = soil + (0.14 + n*0.05) + ')';
      ctx.beginPath(); ctx.arc(0, 0, R*1.2, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    });
    // 视界坍缩：向内不断收缩的球形暗环
    if (p.collapseRuptureEnd > now){
      const k = clamp((p.collapseRuptureEnd - now) / MARK.collapse.ruptureMs, 0, 1);
      ctx.save();
      for (let i = 0; i < 3; i++){
        const ph = ((now/420) + i/3) % 1;
        ctx.strokeStyle = 'rgba(41,8,66,' + (0.8*(1-ph)) + ')';
        ctx.lineWidth = 2.4*S;
        ctx.beginPath(); ctx.arc(p.x, p.y, R*1.75*(1-ph), 0, Math.PI*2); ctx.stroke();
      }
      ctx.globalAlpha = 0.55*k;
      ctx.strokeStyle = '#9389ff';
      ctx.lineWidth = 1.2*S;
      ctx.beginPath(); ctx.arc(p.x, p.y, R*1.15, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }
    // 星爆辐照：体表高频蓝光闪烁 + 辐射侵蚀
    if (p.irradRuptureEnd > now){
      const k = clamp((p.irradRuptureEnd - now) / MARK.irrad.ruptureMs, 0, 1);
      ctx.save();
      const flick = 0.5 + 0.5*Math.abs(Math.sin(now/45));
      ctx.globalAlpha = (0.35 + 0.35*flick) * k;
      const g = ctx.createRadialGradient(p.x, p.y, R*0.5, p.x, p.y, R*1.7);
      g.addColorStop(0, 'rgba(230,239,255,0.8)');
      g.addColorStop(0.6, 'rgba(148,184,255,0.5)');
      g.addColorStop(1, 'rgba(148,184,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, R*1.7, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
    // 风蚀：周身紊乱交叉的短气流斩线，快速来回扫动（透明度 0.58）
    if (p.windRuptureEnd > now){
      const k = clamp((p.windRuptureEnd - now) / MARK.wind.ruptureMs, 0, 1);
      const seed = p.windCutSeed || 0;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.globalAlpha = 0.58 * k;
      for (let i = 0; i < 5; i++){
        const a0 = seed + i * (Math.PI/5);
        const sw = Math.sin(now/95 + i*1.7) * 0.5;            // 来回快速扫动
        const ang = a0 + sw;
        const rr = R * (0.55 + (i % 3) * 0.42);
        const len = R * (0.9 + (i % 2) * 0.7);
        ctx.strokeStyle = i % 2 ? '#D8FBFF' : '#80E8F8';
        ctx.lineWidth = (1.1 + (i%2)*0.5) * S;
        ctx.beginPath();
        ctx.moveTo(Math.cos(ang)*rr - Math.cos(ang+Math.PI/2)*len,
                   Math.sin(ang)*rr - Math.sin(ang+Math.PI/2)*len*0.7);
        ctx.lineTo(Math.cos(ang)*rr + Math.cos(ang+Math.PI/2)*len,
                   Math.sin(ang)*rr + Math.sin(ang+Math.PI/2)*len*0.7);
        ctx.stroke();
      }
      ctx.restore();
    }
    // 浸滞水膜
    if (p.soakStunEnd > now){
      const k = clamp((p.soakStunEnd - now) / 1200, 0, 1);
      ctx.save();
      ctx.globalAlpha = 0.6 * k;
      ctx.strokeStyle = '#BBE8FF';
      ctx.lineWidth = 2*S;
      ctx.beginPath(); ctx.arc(p.x, p.y, R*1.15, 0, Math.PI*2); ctx.stroke();
      for (let i = 0; i < 3; i++){
        const ph = ((now/700) + i/3) % 1;
        ctx.globalAlpha = 0.45 * k * (1 - ph);
        ctx.beginPath(); ctx.arc(p.x, p.y, R*(1.15 + 0.7*ph), 0, Math.PI*2); ctx.stroke();
      }
      ctx.restore();
    }
  });

  // 焚爆 / 浸滞 冲击波
  markRings.forEach(r2=>{
    const a = 1 - r2.t / r2.life;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.strokeStyle = r2.kind === 'burn' ? '#FF5522' : (r2.kind === 'wind' ? '#80E8F8' : '#77CCFF');
    ctx.lineWidth = (r2.kind === 'burn' ? 4 : (r2.kind === 'wind' ? 2 : 3)) * S * a + 1;
    ctx.beginPath(); ctx.arc(r2.x, r2.y, r2.r, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  });

  // 粒子
  markFx.forEach(f=>{
    const a = 1 - f.t / f.life;
    if (f.kind === 'wind'){
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate((f.ang || 0) + (f.spun || 0));
      ctx.fillStyle = 'rgba(216,251,255,' + (0.9*a) + ')';
      ctx.beginPath();
      ctx.moveTo(-f.r*1.6, 0); ctx.lineTo(0, -f.r*0.5); ctx.lineTo(f.r*1.6, 0); ctx.lineTo(0, f.r*0.5);
      ctx.closePath(); ctx.fill();
      ctx.restore();
      return;
    }
    if (f.kind === 'windIdle'){ ctx.fillStyle = 'rgba(216,251,255,' + (0.55*a) + ')'; }
    else if (f.kind === 'burn') ctx.fillStyle = 'rgba(255,204,68,' + (0.9*a) + ')';
    else if (f.kind === 'soak') ctx.fillStyle = 'rgba(187,232,255,' + (0.85*a) + ')';
    else if (f.kind === 'burnIdle') ctx.fillStyle = 'rgba(255,204,68,' + (0.6*a) + ')';
    else ctx.fillStyle = 'rgba(187,232,255,' + (0.55*a) + ')';
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.6 + 0.4*a), 0, Math.PI*2); ctx.fill();
  });
}

/* ================= 火 / 水 二技能：旋涡类 ================= */
const VORTEX = {
  fire: { dur:640, p1:160, p2:420, ring:72, spin:4.8, tickGap:140, tickDmg:2.4, tickR:2.6,
          burstR:90, burstDmg:8, mark:'burn', warm:true,
          core:'#FFEE99', main:'#FF5522', outer:'#FF9933', scar:'#331005', bloom:'rgba(255,85,34,' },
  water:{ dur:660, p1:170, p2:440, ring:75, spin:4.5, tickGap:130, tickDmg:2.4, tickR:2.7,
          burstR:95, burstDmg:8, mark:'soak', warm:false,
          core:'#FFFFFF', main:'#3399EE', outer:'#77BBFF', scar:'#1A66AA', bloom:'rgba(51,153,238,' },
};
let vortexes = [];

function updateVortexes(now, dt){
  const R = UI.R;
  for (let i = vortexes.length - 1; i >= 0; i--){
    const v = vortexes[i];
    const cfg = v.cfg, p = v.owner;
    const t = now - v.t0;
    if (t >= cfg.dur || !p || p.dead){ vortexes.splice(i, 1); continue; }

    /* 阶段2：涡环持续结算 */
    if (t >= cfg.p1 && t < cfg.p2 + 40){
      if (now - v.lastTick >= cfg.tickGap){
        v.lastTick = now;
        enemiesOf(p).forEach(q=>{
          if (q.dead) return;
          if (Math.hypot(q.x - v.x, q.y - v.y) <= cfg.tickR * R){
            hitEnemy(p, q, now, { type: cfg.type || (cfg.warm ? 'fire' : 'water'), dmg: cfg.tickDmg });
          }
        });
      }
    }
    /* 阶段3：环形爆焰 / 水浪，中心最高向外衰减 */
    if (t >= cfg.p2 && !v.burst){
      v.burst = true;
      bursts.push({ x:v.x, y:v.y, r:R*0.4, to:cfg.burstR*S, t:0, life:0.4,
                    col: cfg.warm ? '#FF7722' : (cfg.type === 'wind' ? '#44C8E8' : '#55BBFF'), ring:true });
      for (let k = 0; k < 26; k++){
        const a = Math.random()*Math.PI*2, sp = (40 + Math.random()*90) * S;
        markFx.push({ x:v.x, y:v.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp*0.75,
                      r:(2 + Math.random()*3)*S, t:0, life:0.55,
                      kind: cfg.type === 'wind' ? 'wind' : (cfg.warm ? 'burn' : 'soak') });
      }
      enemiesOf(p).forEach(q=>{
        if (q.dead) return;
        const dd = Math.hypot(q.x - v.x, q.y - v.y) / Math.max(1, cfg.burstR*S);
        if (dd > 1) return;
        const fall = 1 - 0.45 * dd;
        hitEnemy(p, q, now, { type: cfg.type || (cfg.warm ? 'fire' : 'water'), dmg: cfg.burstDmg * fall });
      });
      blip(180, 0.14, 0.36);
    }
  }
}

function drawVortexLow(now){
  const R = UI.R;
  vortexes.forEach(v=>{
    const t = now - v.t0, cfg = v.cfg;
    if (t < 0 || t >= cfg.dur) return;
    const cyc = Math.floor(now/16);

    /* 地面焦痕 / 水痕基底 */
    ctx.save();
    ctx.translate(v.x, v.y + R*0.95);
    ctx.scale(1, 0.36);
    const base = t < cfg.p1 ? 60 * S * clamp(t/cfg.p1, 0, 1) : (t > cfg.p2 ? 60*S*(1 - (t-cfg.p2)/120) : 60*S);
    const isWind = cfg.type === 'wind';
    const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, Math.max(8, base*1.6));
    rg.addColorStop(0, isWind ? 'rgba(17,120,140,0.55)' : (cfg.warm ? 'rgba(51,16,5,0.75)' : 'rgba(26,102,170,0.55)'));
    rg.addColorStop(1, isWind ? 'rgba(17,120,140,0)' : (cfg.warm ? 'rgba(51,16,5,0)' : 'rgba(26,102,170,0)'));
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(0, 0, Math.max(8, base*1.6), 0, Math.PI*2); ctx.fill();
    ctx.restore();

    /* 预备小火团 / 水团（阶段1） */
    if (t < cfg.p1){
      const k = clamp(t/cfg.p1, 0, 1);
      const n = 6;
      for (let i = 0; i < n; i++){
        const a = -now/700 + i*(Math.PI*2/n);
        const rr = R*1.3;
        ctx.fillStyle = isWind ? 'rgba(114,226,245,' + (0.35 + 0.5*k) + ')'
                     : (cfg.warm ? 'rgba(255,85,34,' + (0.35 + 0.5*k) + ')' : 'rgba(68,187,255,' + (0.35 + 0.5*k) + ')');
        ctx.beginPath(); ctx.arc(v.x + Math.cos(a)*rr, v.y + Math.sin(a)*rr*0.9, (3 + 4*k)*S, 0, Math.PI*2); ctx.fill();
      }
    }

    /* 涡环主体（阶段2~3） */
    if (t >= cfg.p1 && t < cfg.dur){
      const rad = cfg.ring * S * (t < cfg.p2 ? 1 : Math.max(0.25, 1 - (t - cfg.p2)/(cfg.dur - cfg.p2)*0.9));
      const spin = (cfg.spinDir || -1) * now/1000 * cfg.spin * Math.PI*2; 
      ctx.save();
      ctx.globalAlpha = t > cfg.p2 ? clamp(1 - (t-cfg.p2)/140, 0, 1) : 1;
      // 外层松散
      ctx.strokeStyle = isWind ? 'rgba(168,240,251,0.55)'
                     : (cfg.warm ? 'rgba(255,153,51,0.55)' : 'rgba(119,187,255,0.55)');
      ctx.lineWidth = 9*S;
      ctx.beginPath(); ctx.arc(v.x, v.y, rad*1.06, spin, spin + Math.PI*1.4); ctx.stroke();
      // 内层致密
      ctx.strokeStyle = cfg.main;
      ctx.lineWidth = 5*S;
      ctx.beginPath(); ctx.arc(v.x, v.y, rad, spin, spin + Math.PI*1.5); ctx.stroke();
      ctx.strokeStyle = cfg.core;
      ctx.lineWidth = 2*S;
      ctx.beginPath(); ctx.arc(v.x, v.y, rad*0.72, -spin*1.3, -spin*1.3 + Math.PI*1.2); ctx.stroke();
      // 切线甩出火星 / 水珠
      for (let i = 0; i < 10; i++){
        const a = spin + i*(Math.PI*2/10);
        const px = v.x + Math.cos(a)*rad, py = v.y + Math.sin(a)*rad*0.98;
        const len = (10 + (i%4)*6) * S;
        drawBolt(px, py, px + Math.cos(a+1.2)*len, py + Math.sin(a+1.2)*len, 3, 3*S, cyc + i*7,
                 cfg.outer, 1.4*S, null);
      }
      ctx.restore();
    }
  });
}

function drawVortexHigh(now){
  const R = UI.R;
  vortexes.forEach(v=>{
    const t = now - v.t0, cfg = v.cfg;
    if (t < 0 || t >= cfg.dur) return;
    // 中心 bloom
    const k2 = t < cfg.p1 ? 0.35 + 0.5*clamp(t/cfg.p1,0,1)
              : (t < cfg.p2 ? 0.9 : Math.max(0, 1 - (t-cfg.p2)/180));
    const br = R * (1.1 + 0.7*k2);
    const g = ctx.createRadialGradient(v.x, v.y, 0, v.x, v.y, br);
    g.addColorStop(0, 'rgba(255,255,255,' + (0.30 + 0.35*k2) + ')');
    g.addColorStop(0.45, cfg.bloom + (0.22*k2) + ')');
    g.addColorStop(1, cfg.bloom + '0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(v.x, v.y, br, 0, Math.PI*2); ctx.fill();
  });
}

/* ================= 火 / 水 大招：域类 ================= */
const FIELD_E = {
  fire: { kind:'elemField', dur:3600, p1:420, p2:1820, p3:2400, p4:3000, radius:165,
          tickGap:200, tickDmg:4.6, cols:7, spin:1.7, burstCount:7, burstGap:75, burstDmg:9.5,
          burstHitR:1.8, lotusDmg:14, warnMs:75, mark:'burn', type:'fire', warm:true, cd:40,
          core:'#FFFFFF', main:'#FF4418', col:'#FF7722', fog:'#FFAA66', crack:'#3B1206', dust:'#FFDD77',
          flash:'255,90,40', name:'焚天烬域' },
  water:{ kind:'elemField', dur:3800, p1:460, p2:1960, p3:2550, p4:3200, radius:175,
          tickGap:220, tickDmg:5.0, cols:8, spin:1.6, burstCount:8, burstGap:80, burstDmg:5.5,
          burstHitR:2.0, lotusDmg:17, warnMs:85, mark:'soak', type:'water', warm:false, cd:40,
          core:'#FFFFFF', main:'#3399DD', col:'#55BBFF', fog:'#99DDFF', crack:'#185E99', dust:'#CCEEFF',
          flash:'150,220,255', name:'瀚海囚澜' },
};
let elemFields = [];

function useElemField(p, now, ult){
  const cfg = FIELD_E[p.elem];
  if (!cfg) return false;
  const R = UI.R;
  const impacts = [];
  const inner = cfg.type === 'wind';
  for (let i = 0; i < cfg.burstCount; i++){
    const a = Math.random()*Math.PI*2;
    const rr = cfg.radius * S * (inner ? (0.28 + Math.random()*0.42) : (0.3 + Math.random()*0.6));
    impacts.push({ x: p.x + Math.cos(a)*rr, y: p.y + Math.sin(a)*rr*0.85 });
  }
  const f = { owner:p, x:p.x, y:p.y, t0:now, cfg, D:cfg.dur, p1:cfg.p1, p2:cfg.p2, p3:cfg.p3, p4:cfg.p4,
              impacts, done:{}, lastTick:now, burstDone:0, lotus:false,
              caps:[], shards:[], dust:[] };
  // 元素反应：遇雷 → 额外大范围爆炸；遇冰 → 爆发伤害 -24%；遇水 → 蒸发 +40%
  let elec = false, iceOn = false, wet = false;
  enemiesOf(p).forEach(q=>{
    if (q.dead) return;
    if (q.elecEnd > now || q.elem === 'thunder') elec = true;
    if (q.frostStacks > 0 || q.elem === 'ice') iceOn = true;
    if (q.wetEnd > now || q.elem === 'water') wet = true;
  });
  f.reactElec = elec; f.reactIce = iceOn; f.reactWet = wet;
  elemFields.push(f);

  p.ultActive = true; p.ultStart = now; p.ultEnd = now + (ult.cd || cfg.cd) * 1000;
  pushFloat(p.x, p.y - R*2.3, cfg.name, cfg.core, true);
  blip(180, 0.14, 0.42);
  if (elec){
    enemiesOf(p).forEach(q=>{
      if (q.dead) return;
      hitEnemy(p, q, now, { type: cfg.type, dmg: 5 });
    });
    bursts.push({ x:p.x, y:p.y, r:R, to:R*4.2, t:0, life:0.45, col:cfg.col, ring:true });
    pushFloat(p.x, p.y - R*2.0, '超载爆炸', '#FFD780', true);
  }
  return true;
}

function updateElemFields(now, dt){
  const R = UI.R;
  for (let i = elemFields.length - 1; i >= 0; i--){
    const f = elemFields[i], p = f.owner, cfg = f.cfg;
    const t = now - f.t0;
    if (t >= cfg.dur || !p || p.dead){
      if (p) p.ultActive = false;
      elemFields.splice(i, 1);
      continue;
    }
    const rad = cfg.radius * S * (t < cfg.p1 ? (t/cfg.p1) : (t < cfg.p4 ? 1 : Math.max(0, 1 - (t-cfg.p4)/(cfg.dur-cfg.p4))));

    /* 阶段2：域内持续结算 */
    if (t >= cfg.p1 && t < cfg.p2){
      if (now - f.lastTick >= cfg.tickGap){
        f.lastTick = now;
        enemiesOf(p).forEach(q=>{
          if (q.dead) return;
          const dd = Math.hypot(q.x - f.x, q.y - f.y);
          if (dd <= rad){
            hitEnemy(p, q, now, { type: cfg.type, dmg: cfg.tickDmg });
            if (cfg.holdMark && q.windStacks) q.windEnd = Math.max(q.windEnd || 0, now + 900);
            if (cfg.type === 'wind' && dd > 1){          // 风域：微弱向内拉扯
              q.x -= (q.x - f.x) / dd * 2.2 * S;
              q.y -= (q.y - f.y) / dd * 2.2 * S;
            }
          }
        });
      }
    }
    /* 阶段4：火柱 / 水墙依次砸落 */
    if (t >= cfg.p3){
      const need = Math.min(cfg.burstCount, Math.floor((t - cfg.p3)/cfg.burstGap) + 1);
      while (f.burstDone < need){
        const pt = f.impacts[f.burstDone];
        f.burstDone++;
        f.caps.push({ x:pt.x, y:pt.y, t:0, life:0.65 });
        bursts.push({ x:pt.x, y:pt.y, r:R*0.3, to:R*2.2, t:0, life:0.4, col:cfg.col, ring:true });
        for (let k = 0; k < 10; k++){
          const a = Math.random()*Math.PI*2, sp = (35 + Math.random()*85) * S;
          f.shards.push({ x:pt.x, y:pt.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp*0.7, r:(2 + Math.random()*4)*S, t:0, life:0.6 });
        }
        enemiesOf(p).forEach(q=>{
          if (q.dead) return;
          let dd = Math.hypot(q.x - pt.x, q.y - pt.y);
          let fall;
          if (cfg.type === 'wind'){
            /* 风刃柱：命中判定以风域中心为基准，越靠中心伤害越高（落点只决定视觉） */
            const dc = Math.hypot(q.x - f.x, q.y - f.y);
            if (dc > cfg.radius * S * 1.05) return;
            fall = 1 - 0.42 * (dc / (cfg.radius * S));
          } else {
            const hr = cfg.burstHitR * R;
            if (dd > hr) return;
            fall = 1 - 0.4 * (dd/hr);
          }
          hitEnemy(p, q, now, { type: cfg.type, dmg: cfg.burstDmg * fall * (f.reactIce ? 0.76 : 1) * (f.reactWet && cfg.warm ? 1.4 : 1) });
          if (cfg.type === 'wind') markAdd(q, now, 'wind', 1);      // 风刃柱甩出旋刃：额外叠一层紊风
        });
        blip(140, 0.13, 0.36);
      }
    }
    /* 全部落地后：中心莲体爆发 */
    if (t >= cfg.p4 - 60 && !f.lotus){
      f.lotus = true;
      f.lotusAt = t;
      enemiesOf(p).forEach(q=>{
        if (q.dead) return;
        const dd = Math.hypot(q.x - f.x, q.y - f.y) / Math.max(1, cfg.radius*S);
        if (dd > 1.05) return;
        hitEnemy(p, q, now, { type: cfg.type, dmg: cfg.lotusDmg * (1 - 0.5*dd) * (f.reactIce ? 0.76 : 1) });
      });
      for (let k = 0; k < 18; k++){
        const a = Math.random()*Math.PI*2, sp = (30 + Math.random()*70) * S;
        f.shards.push({ x:f.x, y:f.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp*0.7, r:(2 + Math.random()*4)*S, t:0, life:0.7 });
      }
      blip(90, 0.16, 0.5);
    }

    f.caps.forEach(c=> c.t += dt);
    f.caps = f.caps.filter(c=> c.t < c.life);
    f.shards.forEach(s=>{ s.x += s.vx*dt; s.y += s.vy*dt; s.vx *= 0.9; s.vy *= 0.9; s.t += dt; });
    f.shards = f.shards.filter(s=> s.t < s.life);
  }
}

function drawFieldLow(now){
  const R = UI.R;
  elemFields.forEach(f=>{
    const t = now - f.t0, cfg = f.cfg;
    if (t < 0 || t >= cfg.dur) return;
    const rad = cfg.radius * S * (t < cfg.p1 ? (t/cfg.p1) : (t < cfg.p4 ? 1 : Math.max(0, 1 - (t-cfg.p4)/(cfg.dur-cfg.p4))));
    const a0 = t < cfg.p1 ? t/cfg.p1 : clamp(1 - (t - cfg.p4)/(cfg.dur - cfg.p4), 0, 1);

    /* 地面域：熔岩 / 水波纹 + 放射焦纹 */
    ctx.save();
    ctx.translate(f.x, f.y + R*0.95);
    ctx.scale(1, 0.34);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, Math.max(10, rad*1.05));
    g.addColorStop(0, (cfg.type === 'wind' ? 'rgba(56,196,224,' : (cfg.warm ? 'rgba(255,68,24,' : 'rgba(51,153,221,')) + (0.30*a0) + ')');
    g.addColorStop(0.7, (cfg.type === 'wind' ? 'rgba(102,224,242,' : (cfg.warm ? 'rgba(255,119,34,' : 'rgba(85,187,255,')) + (0.16*a0) + ')');
    g.addColorStop(1, (cfg.type === 'wind' ? 'rgba(40,136,170,0)' : (cfg.warm ? 'rgba(59,18,6,0)' : 'rgba(24,94,153,0)')));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, Math.max(10, rad*1.05), 0, Math.PI*2); ctx.fill();
    // 放射裂纹
    for (let i = 0; i < 16; i++){
      const a = i*(Math.PI*2/16);
      ctx.strokeStyle = (cfg.type === 'wind' ? 'rgba(102,224,242,' : (cfg.warm ? 'rgba(255,119,34,' : 'rgba(85,187,255,')) + (0.35*a0) + ')';
      ctx.lineWidth = 1.6*S;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*rad*0.18, Math.sin(a)*rad*0.18);
      ctx.lineTo(Math.cos(a)*rad*0.95, Math.sin(a)*rad*0.95);
      ctx.stroke();
    }
    ctx.restore();

    /* 旋转火柱 / 水墙 */
    if (t >= cfg.p1){
      const spin = now/1000 * cfg.spin * Math.PI*2 * (cfg.spinDir || (cfg.warm ? 1 : -1));
      const shrink = t >= cfg.p3 ? clamp((t - cfg.p3)/(cfg.p4 - cfg.p3), 0, 1) : 0;
      const rr = rad * (0.82 - 0.42*shrink);
      const hgt = R * (2.2 + 0.9*shrink);
      for (let i = 0; i < cfg.cols; i++){
        const a = spin + i*(Math.PI*2/cfg.cols);
        const px = f.x + Math.cos(a)*rr, py = f.y + Math.sin(a)*rr*0.8;
        const flick = 0.65 + 0.35*Math.abs(Math.sin(now/220 + i));
        ctx.save();
        ctx.globalAlpha = 0.55 * a0;
        const lg = ctx.createLinearGradient(px, py, px, py - hgt);
        lg.addColorStop(0, cfg.col);
        lg.addColorStop(0.55, cfg.main);
        lg.addColorStop(1, cfg.core);
        ctx.fillStyle = lg;
        const wid = (7 + 4*shrink) * S;
        ctx.beginPath();
        ctx.moveTo(px - wid, py);
        ctx.lineTo(px - wid*0.4, py - hgt*flick);
        ctx.lineTo(px + wid*0.4, py - hgt*flick);
        ctx.lineTo(px + wid, py);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    /* 粒子：烬粒上浮 / 水沫下沉 */
    for (let i = 0; i < 24; i++){
      const ph = ((now/1200) + i*0.05) % 1;
      const a = i*(Math.PI*2/24);
      const rr = rad * (0.3 + (i % 5) * 0.14);
      const px = f.x + Math.cos(a)*rr;
      const py = cfg.warm ? (f.y + R*0.95 - ph*R*2.2) : (f.y - R*1.2 + ph*R*2.2);
      ctx.fillStyle = (cfg.type === 'wind' ? 'rgba(208,249,255,' : (cfg.warm ? 'rgba(255,221,119,' : 'rgba(204,238,255,')) + (0.55*(1-ph)*a0) + ')';
      ctx.beginPath(); ctx.arc(px, py, (1 + (i%3))*S*0.7, 0, Math.PI*2); ctx.fill();
    }

    /* 冲击波 / 落点厚层 / 碎片 */
    f.caps.forEach(c=>{
      const k = 1 - c.t/c.life;
      ctx.fillStyle = (cfg.type === 'wind' ? 'rgba(56,196,224,' : (cfg.warm ? 'rgba(255,68,24,' : 'rgba(51,153,221,')) + (0.45*k) + ')';
      ctx.beginPath(); ctx.arc(c.x, c.y + R*0.9, R*1.2, 0, Math.PI*2); ctx.fill();
    });
    f.shards.forEach(s=>{
      const k = 1 - s.t/s.life;
      ctx.fillStyle = (cfg.type === 'wind' ? 'rgba(208,249,255,' : (cfg.warm ? 'rgba(255,221,119,' : 'rgba(204,238,255,')) + (0.85*k) + ')';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r*(0.6 + 0.4*k), 0, Math.PI*2); ctx.fill();
    });
  });
}

function drawFieldHigh(now){
  const R = UI.R;
  elemFields.forEach(f=>{
    const t = now - f.t0, cfg = f.cfg;
    if (t < 0 || t >= cfg.dur) return;
    /* 莲体 bloom */
    let bloom = 0.35;
    if (t >= cfg.p2) bloom = 0.75;
    if (t >= cfg.p4) bloom = 1;
    if (t >= cfg.p4 + 300) bloom = Math.max(0.1, 1 - (t - cfg.p4 - 300)/600);
    const br = R * (1.4 + bloom*1.3);
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, br);
    g.addColorStop(0, 'rgba(255,255,255,' + (0.28 + 0.34*bloom) + ')');
    g.addColorStop(0.42, (cfg.type === 'wind' ? 'rgba(56,196,224,' : (cfg.warm ? 'rgba(255,68,24,' : 'rgba(51,153,221,')) + (0.20*bloom) + ')');
    g.addColorStop(1, (cfg.type === 'wind' ? 'rgba(102,224,242,0)' : (cfg.warm ? 'rgba(255,119,34,0)' : 'rgba(85,187,255,0)')));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(f.x, f.y, br, 0, Math.PI*2); ctx.fill();

    /* 莲体绽放（阶段4 收尾） */
    if (f.lotus){
      const k = clamp(t - cfg.p4, 0, 260) / 260;
      const petal = R * (0.6 + 3.2*k);
      ctx.save();
      ctx.globalAlpha = 0.8 * (1 - clamp((t - cfg.p4 - 260)/500, 0, 1));
      for (let layer = 0; layer < 3; layer++){
        const rr = petal * (1 - layer*0.26);
        const n = 8 - layer*2;
        for (let i = 0; i < n; i++){
          const a = (i/n)*(Math.PI*2) + layer*0.4 + now/900;
          const px = f.x + Math.cos(a)*rr, py = f.y + Math.sin(a)*rr*0.75;
          ctx.fillStyle = layer === 0 ? cfg.main : (layer === 1 ? cfg.col : cfg.core);
          ctx.beginPath();
          ctx.ellipse(px, py, rr*0.22, rr*0.11, a, 0, Math.PI*2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    /* 全图暖/冷色渐变覆盖（阶段1 渐入 → 收尾渐出，大招结束消失） */
    const inK = clamp(t/cfg.p1, 0, 1);
    const outK = clamp(1 - (t - cfg.p4)/(cfg.dur - cfg.p4), 0, 1);
    const aOv = 0.18 * Math.min(inK, outK);
    if (aOv > 0){
      ctx.save();
      const vg = ctx.createLinearGradient(0, 0, 0, H);
      vg.addColorStop(0, 'rgba(' + cfg.flash + ',' + aOv + ')');
      vg.addColorStop(1, (cfg.type === 'wind' ? 'rgba(40,136,170,' : (cfg.warm ? 'rgba(59,18,6,' : 'rgba(24,94,153,')) + (aOv*0.75) + ')');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
      const rv = ctx.createRadialGradient(W*0.5, H*0.5, Math.min(W,H)*0.32, W*0.5, H*0.5, Math.max(W,H)*0.8);
      rv.addColorStop(0, 'rgba(' + cfg.flash + ',0)');
      rv.addColorStop(1, 'rgba(' + cfg.flash + ',' + (aOv*1.1) + ')');
      ctx.fillStyle = rv;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    /* 莲体绽放峰值闪光蒙版 5 帧 */
    if (f.lotus && t - cfg.p4 < 84){
      ctx.save();
      ctx.fillStyle = 'rgba(' + cfg.flash + ',' + (0.26 * (1 - (t - cfg.p4)/84)) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  });
}

/* ================= 黑洞 / 中子星：本体与专属技能 ================= */
function drawSingularBody(p, now, R){
  if (p.elem === 'blackhole') drawBlackHoleBody(p, now, R);
  else if (p.elem === 'neutron') drawNeutronBody(p, now, R);
}

/* 黑洞：斜置的吸积盘 + 纯黑事件视界 + 光子环 + 引力透镜弧 */
function drawBlackHoleBody(p, now, R){
  const spin = now / 1000;
  ctx.save();
  ctx.rotate(-0.42);

  /* 引力场外晕 */
  const halo = ctx.createRadialGradient(0, 0, R*0.8, 0, 0, R*2.3);
  halo.addColorStop(0, 'rgba(140,90,255,0)');
  halo.addColorStop(0.42, 'rgba(82,26,120,0.28)');
  halo.addColorStop(1, 'rgba(2,0,4,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(0, 0, R*2.3, 0, Math.PI*2); ctx.fill();

  /* 吸积盘：压扁椭圆 + 沿轨道流动的亮斑（动态旋转） */
  ctx.save();
  ctx.scale(1, 0.30);
  const dR = R * 2.05;
  const dg = ctx.createRadialGradient(0, 0, R*0.75, 0, 0, dR);
  dg.addColorStop(0,    'rgba(211,182,255,0.92)');
  dg.addColorStop(0.24, 'rgba(138,92,255,0.82)');
  dg.addColorStop(0.52, 'rgba(82,26,120,0.78)');
  dg.addColorStop(0.80, 'rgba(41,8,66,0.52)');
  dg.addColorStop(1,    'rgba(2,0,4,0)');
  ctx.fillStyle = dg;
  ctx.beginPath(); ctx.arc(0, 0, dR, 0, Math.PI*2); ctx.fill();

  const a0 = spin * 1.15;
  const nflow = 14;
  for (let i = 0; i < nflow; i++){
    const a = a0 + i*(Math.PI*2/nflow);
    const rr2 = R * (1.02 + 0.60*((i % 4)/3));
    const px = Math.cos(a)*rr2, py = Math.sin(a)*rr2;
    const al = 0.26 + 0.42*Math.abs(Math.sin(a*2 + spin*2.4));
    const gg = ctx.createRadialGradient(px, py, 0, px, py, R*0.52);
    gg.addColorStop(0, 'rgba(226,208,255,' + al + ')');
    gg.addColorStop(1, 'rgba(82,26,120,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(px, py, R*0.52, 0, Math.PI*2); ctx.fill();
  }
  /* 盘面流动细弧 */
  ctx.strokeStyle = 'rgba(180,140,255,0.55)';
  ctx.lineWidth = 2*S;
  ctx.beginPath(); ctx.arc(0, 0, R*1.34, a0, a0 + Math.PI*1.05); ctx.stroke();
  ctx.strokeStyle = 'rgba(71,24,107,0.62)';
  ctx.lineWidth = 1.6*S;
  ctx.beginPath(); ctx.arc(0, 0, R*1.76, -a0*1.25, -a0*1.25 + Math.PI*0.85); ctx.stroke();
  ctx.restore();

  /* 事件视界 */
  const eh = R*0.78;
  const core = ctx.createRadialGradient(0, 0, eh*0.4, 0, 0, eh*1.05);
  core.addColorStop(0, '#050108');
  core.addColorStop(0.86, '#050108');
  core.addColorStop(1, 'rgba(41,8,66,0.98)');
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(0, 0, eh, 0, Math.PI*2); ctx.fill();
  /* 暗涡晶核：向内旋的暗紫涡纹 */
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, eh, 0, Math.PI*2); ctx.clip();
  for (let i = 0; i < 4; i++){
    ctx.strokeStyle = 'rgba(82,26,120,' + (0.55 - i*0.1) + ')';
    ctx.lineWidth = (2.4 - i*0.4)*S;
    ctx.beginPath();
    for (let k = 0; k <= 26; k++){
      const th = k/26 * Math.PI*1.8 + now/520 + i*1.2;
      const rr2 = eh*0.9 * (k/26);
      const px = Math.cos(th)*rr2, py = Math.sin(th)*rr2;
      if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  ctx.restore();

  /* 光子环 */
  ctx.strokeStyle = 'rgba(226,208,255,0.95)';
  ctx.lineWidth = 2.4*S;
  ctx.beginPath(); ctx.arc(0, 0, eh + 1.8*S, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = 'rgba(138,92,255,0.55)';
  ctx.lineWidth = 5*S;
  ctx.beginPath(); ctx.arc(0, 0, eh + 5*S, 0, Math.PI*2); ctx.stroke();

  /* 透镜弧：上下]被拉弯的光 */
  ctx.strokeStyle = 'rgba(180,140,255,0.42)';
  ctx.lineWidth = 3*S;
  ctx.beginPath(); ctx.arc(0, 0, R*1.56, -Math.PI*0.87, -Math.PI*0.13); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, R*1.56, Math.PI*0.13, Math.PI*0.87); ctx.stroke();
  ctx.restore();
}

/* 中子星：亮蓝球体 + 自转表面能量带 + 磁极对射光束 + 磁力线环 */
function drawNeutronBody(p, now, R){
  const spin = now / 1000;

  /* 磁层辉光 */
  const ng = ctx.createRadialGradient(0, 0, R*0.5, 0, 0, R*3.0);
  ng.addColorStop(0, 'rgba(230,239,255,0.62)');
  ng.addColorStop(0.34, 'rgba(148,184,255,0.38)');
  ng.addColorStop(1, 'rgba(48,80,132,0)');
  ctx.fillStyle = ng;
  ctx.beginPath(); ctx.arc(0, 0, R*3.0, 0, Math.PI*2); ctx.fill();

  /* 磁极对射光束（随自转扫动） */
  const beamA = spin * 1.9;
  for (let s2 = 0; s2 < 2; s2++){
    ctx.save();
    ctx.rotate(beamA + s2*Math.PI);
    const bg = ctx.createLinearGradient(0, 0, R*3.4, 0);
    bg.addColorStop(0, 'rgba(224,248,255,0.5)');
    bg.addColorStop(0.55, 'rgba(120,205,255,0.20)');
    bg.addColorStop(1, 'rgba(60,150,255,0)');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(0, -R*0.16);
    ctx.lineTo(R*3.4, -R*0.66);
    ctx.lineTo(R*3.4,  R*0.66);
    ctx.lineTo(0,  R*0.16);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  /* 磁力线环 */
  ctx.save();
  ctx.rotate(spin*0.5);
  for (let i = 0; i < 3; i++){
    ctx.strokeStyle = 'rgba(150,220,255,' + (0.30 - i*0.07) + ')';
    ctx.lineWidth = 1.6*S;
    ctx.beginPath();
    ctx.ellipse(0, 0, R*(1.25 + i*0.32), R*(0.54 + i*0.20), i*0.36, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.restore();

  /* 星体 */
  const core = ctx.createRadialGradient(-R*0.12, -R*0.18, R*0.04, 0, 0, R*0.95);
  core.addColorStop(0, '#ffffff');
  core.addColorStop(0.30, '#E6EFFF');
  core.addColorStop(0.70, '#94B8FF');
  core.addColorStop(1, '#5078B8');
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(0, 0, R*0.92, 0, Math.PI*2); ctx.fill();

  /* 自转表面能量带 */
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, R*0.92, 0, Math.PI*2); ctx.clip();
  ctx.rotate(spin*0.9);
  for (let i = 0; i < 4; i++){
    ctx.strokeStyle = 'rgba(190,235,255,' + (0.14 + 0.06*i) + ')';
    ctx.lineWidth = (2 + i)*S;
    ctx.beginPath();
    ctx.ellipse(0, 0, R*0.9, R*(0.20 + i*0.14), 0, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.restore();

  /* 光子环 + 高光 */
  ctx.strokeStyle = 'rgba(235,250,255,0.95)';
  ctx.lineWidth = 2.2*S;
  ctx.beginPath(); ctx.arc(0, 0, R*0.97, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.arc(-R*0.28, -R*0.32, R*0.15, 0, Math.PI*2); ctx.fill();
}

/* 顶层本体：其他元素的高层特效先画完，这两个元素最后再画一遍本体，绝不被压住 */
function drawTopBodies(now){
  const R = UI.R;
  allPlayers().forEach(p=>{
    if (!p || p.dead) return;
    if (p.elem !== 'blackhole' && p.elem !== 'neutron') return;
    const bob = Math.sin(now/700 + p.bob) * R * 0.10;
    ctx.save();
    ctx.translate(p.x, p.y + bob);
    ctx.scale(p.face, 1);
    drawSingularBody(p, now, R);
    ctx.restore();
  });
}

const ICE_SKIN_KEY = 'ed_ice_skin';       // 是否解锁

/* ---------- 粉晶皮肤：冰系色板整体转柔粉 ---------- */
function iceRgb(r, g, b){
  if (!(iceSkinUnlocked && iceSkinOn)) return r + ',' + g + ',' + b;
  const k = 0.66;   // 往柔粉混色，保留明暗层次
  const nr = Math.round(r*(1-k) + 255*k);
  const ng = Math.round(g*(1-k) + 214*k);
  const nb = Math.round(b*(1-k) + 236*k);
  return nr + ',' + ng + ',' + nb;
}
function IC(c){
  if (!(iceSkinUnlocked && iceSkinOn)) return c;
  if (typeof c !== 'string') return c;
  let m = c.match(/^#([0-9a-fA-F]{6})$/);
  if (m){
    const hex = m[1];
    const rgb = iceRgb(parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16)).split(',');
    return '#' + rgb.map(v=>Number(v).toString(16).padStart(2,'0')).join('');
  }
  m = c.match(/^rgba?\((\d+),(\d+),(\d+)(?:,([0-9.]+))?\)$/);
  if (m){
    const rgb = iceRgb(+m[1], +m[2], +m[3]);
    return (m[4] !== undefined ? 'rgba(' + rgb + ',' + m[4] + ')' : 'rgb(' + rgb + ')');
  }
  return c;
}

function saveIceSkin(){
  try {
    localStorage.setItem(ICE_SKIN_KEY, iceSkinUnlocked ? '1' : '0');
    localStorage.setItem(ICE_SKIN_ON, iceSkinOn ? '1' : '0');
  } catch(e){}
}
function unlockIceSkin(){
  iceSkinUnlocked = true; iceSkinOn = true;
  saveIceSkin();
}
function toggleIceSkin(){
  if (!iceSkinUnlocked){ toast('冰元素粉晶皮肤尚未解锁：可在兑换码里领取'); blip(220,0.06,0.14); return false; }
  iceSkinOn = !iceSkinOn;
  saveIceSkin();

}
/* 本局是否呈现粉晶皮肤（战斗里只要有冰元素且已启用） */
function iceSkinActive(){

function elemLocked(k){

function elemLockText(k){

}

/* 奇点边界：脚下暗环 + 空间被拉扯的扭曲感（低层，画在本体之下） */
function drawDevourLow(now){

/* 空间扭曲高光层：吞噬瞬间的折叠环 / 径向拉伸 / 闪光（在全部特效之后、本体之前） */
function drawDevourHigh(now){
  const R = UI.R;
  devourFx.forEach(f=>{
    const t = now - f.t0;
    const k = clamp(t / (BH_DEVOUR.fxLife*1000), 0, 1);
    ctx.save();
    // 从吞噬者向外一圈被「吸走」的折叠环
    for (let i = 0; i < 3; i++){
      const u = clamp(k*1.4 - i*0.18, 0, 1);
      const rr = (R*2.6) * (1 - u) + R*0.5;
      ctx.strokeStyle = 'rgba(211,182,255,' + (0.55*(1-u)) + ')';
      ctx.lineWidth = 3*S*(1-u) + 1;
      ctx.beginPath();
      ctx.ellipse(f.x, f.y, rr, rr*0.42, -0.42, 0, Math.PI*2);
      ctx.stroke();
    }
    // 径向吸入的拉伸丝
    const nDir = 12;
    for (let i = 0; i < nDir; i++){
      const a = i*(Math.PI*2/nDir) + now/700;
      const r0 = R*3.0*(1-k), r1 = R*0.8;
      const grad = ctx.createLinearGradient(f.x + Math.cos(a)*r0, f.y + Math.sin(a)*r0*0.6,
                                            f.x + Math.cos(a)*r1, f.y + Math.sin(a)*r1*0.6);
      grad.addColorStop(0, 'rgba(150,100,255,0)');
      grad.addColorStop(1, 'rgba(255,225,255,' + (0.5*(1-k)) + ')');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2*S;
      ctx.beginPath();
      ctx.moveTo(f.x + Math.cos(a)*r0, f.y + Math.sin(a)*r0*0.6);
      ctx.lineTo(f.x + Math.cos(a)*r1, f.y + Math.sin(a)*r1*0.6);
      ctx.stroke();
    }
    // 中央白闪（吞噬瞬间 4 帧）
    if (t < 70){
      ctx.fillStyle = 'rgba(240,225,255,' + (0.55 * (1 - t/70)) + ')';
      ctx.beginPath(); ctx.arc(f.x, f.y, R*1.5, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  });
}

/* ================= 风·游风引势 / 逐风折刃 / 长风溯旅 ================= */
const WIND_BLADE = { dur:620, p1:150, p2:410, gap:120, speedR:26, life:0.46, dmg:5.4,
                     hitR:1.15, refractMax:2, traceSearch:13 };
let windBlades = [];
let windTraces = [];           // 游风标记留下的「风迹」：可被风刃折射 / 斩节点偏轨

const WIND_TRACK = { dur:3650, p1:430, p2:1850, p3:2420, p4:3050, lenR:9.0, nodes:5,
                     nodeSpeed:0.62, sweepR:1.45, tickGap:130, tickDmg:2.45,
                     slashWidth:2.7, slashDmg:35, cd:40, name:'长风溯旅' };
let windTracks = [];

function windTracePush(p, now){
  if (!p || p.dead) return;
  if (now < (p.windTraceAt || 0) - 0) { /* 节流 */ }
  if (now - (p.windTraceAt || 0) < 180 && p.windTraceAt) return;
  p.windTraceAt = now;
  windTraces.push({ x:p.x, y:p.y, owner:p, t0:now, end:now + MARK.wind.dur });
  if (windTraces.length > 26) windTraces.shift();
}

function updateWindTraces(now){
  windTraces = windTraces.filter(tr=> tr.end > now);
  windTraces.forEach(tr=>{ if (tr.owner && !tr.owner.dead){ tr.x = tr.owner.x; tr.y = tr.owner.y; } });
}

/* ---------- 二技能：逐风折刃（三刃依次射出，命中标记可折射两次） ---------- */
function spawnWindBlade(p, now, delayMs, angleHint){
  const R = UI.R;
  const foes = enemiesOf(p).filter(q=> !q.dead);
  let ang = angleHint;
  if (ang === null || ang === undefined){
    if (foes.length){
      let best = null, bd = 1e9;
      foes.forEach(q=>{ const d = Math.hypot(q.x - p.x, q.y - p.y); if (d < bd){ bd = d; best = q; } });
      ang = Math.atan2(best.y - p.y, best.x - p.x);
    } else ang = p.face > 0 ? 0 : Math.PI;
  }
  windBlades.push({ owner:p, born:now + delayMs, live:false, x:p.x, y:p.y,
                    ang, t:0, life:WIND_BLADE.life, refr:0, segs:[], tick:{} });
}

function useWindBlades(p, now, sk2){
  const R = UI.R;
  for (let i = 0; i < 3; i++) spawnWindBlade(p, now, i * WIND_BLADE.gap, null);
  p.skill2End = now + (sk2.cd || 11) * 1000;
  p.swing = 0.18;
  pushFloat(p.x, p.y - R*1.8, '逐风折刃', '#ffffff', true);
  blip(760, 0.10, 0.22);
  return true;
}

function updateWindBlades(now, dt){
  const R = UI.R;
  windBlades.forEach(b=>{
    if (!b.live){
      if (now >= b.born){ b.live = true; b.t = 0; blip(820 + (b.refr||0)*0, 0.07, 0.14); }
      else return;
    }
    b.t += dt;
    const spd = WIND_BLADE.speedR * R * (b.refr ? 1.08 : 1);
    const px = b.x, py = b.y;
    b.x += Math.cos(b.ang) * spd * dt;
    b.y += Math.sin(b.ang) * spd * dt;
    b.segs.push({ x:b.x, y:b.y, t:0 });
    if (b.segs.length > 26) b.segs.shift();
    // 沿途风絮
    if (Math.random() < 0.5){
      markFx.push({ x:b.x + rnd(-4,4)*S, y:b.y + rnd(-4,4)*S,
                    vx:rnd(-16,16)*S, vy:rnd(-16,16)*S, r:(2 + Math.random()*2)*S,
                    t:0, life:0.52, kind:'windIdle' });
    }
    // 碰撞：敌方
    enemiesOf(b.owner).forEach(q=>{
      if (q.dead) return;
      const key = 'b' + (q.i || 0);
      if (b.tick[key] && now - b.tick[key] < 300) return;
      if (Math.hypot(q.x - b.x, q.y - b.y) > R * WIND_BLADE.hitR) return;
      const had = (q.windStacks || 0) > 0;
      b.tick[key] = now;
      hitEnemy(b.owner, q, now, { type:'wind', dmg: WIND_BLADE.dmg });
      markAdd(q, now, 'wind', 1);
      bursts.push({ x:b.x, y:b.y, r:R*0.2, to:R*0.9, t:0, life:0.26, col:'#B8F4FF', ring:true });
      if (had && b.refr < WIND_BLADE.refractMax) windBladeRefract(b, q, now);
    });
    // 标记点位折射
    if (b.refr < WIND_BLADE.refractMax){
      for (const tr of windTraces){
        if (tr.owner === b.owner && !tr.owner.dead && tr.owner === b.owner && false) continue;
        if (Math.hypot(tr.x - b.x, tr.y - b.y) < R * 0.9){
          const targets = enemiesOf(b.owner).filter(q=> !q.dead && (q.windStacks || 0) > 0 && q !== tr.owner);
          if (targets.length && tr.owner !== b.owner) { windBladeRefract(b, null, now); break; }
        }
      }
    }
  });
  windBlades = windBlades.filter(b=>{
    if (b.live && b.t >= b.life) return false;
    if (!b.live && now > b.born + 700) return false;
    return true;
  });
}

function windBladeRefract(b, fromQ, now){
  const R = UI.R;
  const foes = enemiesOf(b.owner).filter(q=> !q.dead && q !== fromQ && (q.windStacks || 0) > 0);
  let best = null, bd = 1e9;
  foes.forEach(q=>{ const d = Math.hypot(q.x - b.x, q.y - b.y); if (d < bd && d < R*WIND_BLADE.traceSearch){ bd = d; best = q; } });
  if (!best) return false;
  b.ang = Math.atan2(best.y - b.y, best.x - b.x);
  b.refr++;
  b.life = Math.max(b.life, b.t + 0.22);
  bursts.push({ x:b.x, y:b.y, r:R*0.2, to:R*1.1, t:0, life:0.3, col:'#72E2F5', ring:true });
  blip(880, 0.07, 0.12);
  return true;
}

/* ---------- 大招：长风溯旅（长条蜿蜒风轨 + 五组巡行斩节点 + 贯通斩） ---------- */
function polyOfTrack(tr){
  return tr.pts;
}

function trackPointAt(pts, u){
  const n = pts.length - 1;
  const f = clamp(u, 0, 1) * n;
  const i = Math.min(n - 1, Math.floor(f));
  const k = f - i;
  return { x: pts[i].x + (pts[i+1].x - pts[i].x) * k,
           y: pts[i].y + (pts[i+1].y - pts[i].y) * k };
}

function distToTrack(pts, x, y){
  let best = 1e9;
  for (let i = 0; i < pts.length - 1; i++){
    const ax = pts[i].x, ay = pts[i].y, bx = pts[i+1].x, by = pts[i+1].y;
    const dx = bx - ax, dy = by - ay;
    const l2 = dx*dx + dy*dy || 1;
    let t = ((x - ax)*dx + (y - ay)*dy) / l2;
    t = Math.max(0, Math.min(1, t));
    const px = ax + dx*t, py = ay + dy*t;
    const d = Math.hypot(x - px, y - py);
    if (d < best) best = d;
  }
  return best;
}

function useWindTrack(p, now, ult){
  const R = UI.R;
  const foes = enemiesOf(p).filter(q=> !q.dead);
  let dir = p.face > 0 ? 0 : Math.PI;
  if (foes.length){
    let best = null, bd = 1e9;
    foes.forEach(q=>{ const d = Math.hypot(q.x - p.x, q.y - p.y); if (d < bd){ bd = d; best = q; } });
    dir = Math.atan2(best.y - p.y, best.x - p.x);
  }
  // 长条蜿蜒风轨：由风晶向外延伸，路径带正弦摆动
  const len = WIND_TRACK.lenR * R;
  const segs = 7;
  const pts = [];
  const nx = Math.cos(dir + Math.PI/2), ny = Math.sin(dir + Math.PI/2);
  for (let i = 0; i <= segs; i++){
    const t = i / segs;
    const sway = Math.sin(t * Math.PI * 2.2) * R * 1.35;
    pts.push({ x: clamp(p.x + Math.cos(dir)*len*t + nx*sway, R, W - R),
               y: clamp(p.y + Math.sin(dir)*len*t + ny*sway, UI.top + R, UI.bottom - R) });
  }
  const nodes = [];
  for (let i = 0; i < WIND_TRACK.nodes; i++) nodes.push({ u: (i + 0.5) / WIND_TRACK.nodes, slashAt:0 });
  // 元素反应：火 → 时长 -20%；水 → 轨道水膜减速 15%；雷 → 斩节点链电；冰 → 冰痕减速 20%
  let fireOn = false, wetOn = false, elecOn = false, iceOn = false;
  foes.forEach(q=>{
    if (q.burnEnd > now || q.elem === 'fire') fireOn = true;
    if (q.waterStacks > 0 || q.elem === 'water') wetOn = true;
    if (q.elecEnd > now || q.elem === 'thunder') elecOn = true;
    if (q.frostStacks > 0 || q.elem === 'ice') iceOn = true;
  });
  const dur = fireOn ? WIND_TRACK.dur * 0.8 : WIND_TRACK.dur;
  windTracks.push({ owner:p, pts, nodes, t0:now, dur,
                    lastTick:{}, slashDone:false, slashAt:0, shards:[], flashAt:0, dir,
                    reactFire:fireOn, reactWet:wetOn, reactElec:elecOn, reactIce:iceOn });
  if (fireOn){
    foes.forEach(q=>{                       // 灼烧沿风轨扩散，游风标记转为灼烧
      if (q.dead) return;
      if (q.windStacks){ markClear(q, 'wind'); markAdd(q, now, 'burn', 1); }
    });
    pushFloat(p.x, p.y - R*1.6, '灼烧扩散 · 时长 -20%', '#ff9a5c', true);
  }
  p.ultEnd = now + (ult.cd || WIND_TRACK.cd) * 1000;
  pushFloat(p.x, p.y - R*2.3, WIND_TRACK.name, '#ffffff', true);
  blip(200, 0.13, 0.40);
  return true;
}

function updateWindTracks(now, dt){
  const R = UI.R;
  for (let i = windTracks.length - 1; i >= 0; i--){
    const tr = windTracks[i];
    const t = now - tr.t0;
    if (t >= WIND_TRACK.dur){ windTracks.splice(i,1); continue; }
    const owner = tr.owner;
    if (!owner) continue;

    /* 阶段2：斩节点沿风轨往复巡行，扫到即伤 */
    if (t >= WIND_TRACK.p1 && t < WIND_TRACK.p3){
      tr.nodes.forEach((nd, idx)=>{
        const ph = now / 1000 * WIND_TRACK.nodeSpeed * 2 + idx * 0.42;
        const tri = Math.abs(((ph % 2) + 2) % 2 - 1);          // 0→1→0 往复
        nd.u = tri;
        nd.x = trackPointAt(tr.pts, nd.u).x;
        nd.y = trackPointAt(tr.pts, nd.u).y;
      });
      enemiesOf(owner).forEach(q=>{
        if (q.dead) return;
        const key = 'n' + (q.i || 0);
        if (tr.lastTick[key] && now - tr.lastTick[key] < WIND_TRACK.tickGap) return;
        let hit = false;
        tr.nodes.forEach(nd=>{
          if (Math.hypot(q.x - nd.x, q.y - nd.y) <= R * WIND_TRACK.sweepR) hit = true;
        });
        if (!hit) return;
        tr.lastTick[key] = now;
        hitEnemy(owner, q, now, { type:'wind', dmg: WIND_TRACK.tickDmg });
        markAdd(q, now, 'wind', 1);
        if (q.windStacks) q.windEnd = Math.max(q.windEnd || 0, now + 700);   // 轨道内标记不衰减
        if (tr.reactWet) q.slowEnd = Math.max(q.slowEnd || 0, now + 260);     // 水膜：减速提升 15%
        if (tr.reactIce) q.mildSlowEnd = Math.max(q.mildSlowEnd || 0, now + 300);  // 冰痕：减速提升 20%
        if (tr.reactElec && Math.random() < 0.35){                              // 引雷：小链式跳电
          hitEnemy(owner, q, now, { type:'thunder', dmg: 1.6 });
          markRings.push({ x:q.x, y:q.y, r:R*0.3, to:R*1.1, t:0, life:0.22, kind:'wind' });
        }
      });
    }

    /* 阶段3：节点向风晶方向汇集 */
    if (t >= WIND_TRACK.p3 && t < WIND_TRACK.p4){
      const k = clamp((t - WIND_TRACK.p3) / (WIND_TRACK.p4 - WIND_TRACK.p3), 0, 1);
      tr.nodes.forEach((nd, idx)=>{
        const target = idx / (WIND_TRACK.nodes * 3);
        nd.u = nd.u + (target - nd.u) * (0.08 + 0.25*k);
        nd.x = trackPointAt(tr.pts, nd.u).x;
        nd.y = trackPointAt(tr.pts, nd.u).y;
      });
      enemiesOf(owner).forEach(q=>{
        if (!q.dead && q.windStacks) q.windEnd = Math.max(q.windEnd || 0, now + 500);
      });
    }

    /* 阶段4：贯通式长距纵向斩 */
    if (t >= WIND_TRACK.p4 && !tr.slashDone){
      tr.slashDone = true;
      tr.slashAt = t;
      tr.flashAt = now;
      const wHalf = WIND_TRACK.slashWidth * R;
      enemiesOf(owner).forEach(q=>{
        if (q.dead) return;
        const d = distToTrack(tr.pts, q.x, q.y);
        if (d > wHalf) return;
        const fall = 1 - 0.45 * (d / wHalf);
        hitEnemy(owner, q, now, { type:'wind', dmg: WIND_TRACK.slashDmg * fall });
      });
      for (let s2 = 0; s2 < 26; s2++){
        const u = Math.random();
        const pt = trackPointAt(tr.pts, u);
        tr.shards.push({ x:pt.x, y:pt.y,
                         vx:Math.cos(tr.dir)*(60 + Math.random()*130)*S,
                         vy:Math.sin(tr.dir)*(60 + Math.random()*130)*S + rnd(-30,30)*S,
                         r:(2 + Math.random()*6)*S, t:0, life:0.62 });
      }
      blip(120, 0.16, 0.5);
    }
    tr.shards.forEach(s=>{ s.x += s.vx*dt; s.y += s.vy*dt; s.vx *= 0.9; s.vy *= 0.9; s.t += dt; });
    tr.shards = tr.shards.filter(s=> s.t < s.life);
  }
}

/* ---------- 绘制：低层（风轨 / 地面印记 / 拖尾路径） ---------- */
function drawWindLow(now){
  const R = UI.R;
  /* 逐风折刃·蓄刃：地面小气流印记（半径 24px，不扩散）+ 三道独立方位悬浮风刃 */
  const pending = windBlades.filter(b=> !b.live);
  if (pending.length){
    const ow = pending[0].owner;
    ctx.save();
    ctx.translate(ow.x, ow.y + R*0.95);
    ctx.scale(1, 0.36);
    ctx.fillStyle = 'rgba(80,184,208,0.35)';
    ctx.beginPath(); ctx.arc(0, 0, 24*S, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    pending.forEach((b, i)=>{
      const ang = -Math.PI/2 + i * 2.1;
      const rr = R * 1.15;
      const px = ow.x + Math.cos(ang)*rr, py = ow.y + Math.sin(ang)*rr*0.85;
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(ang + Math.PI/2);
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 1.6*S;
      ctx.beginPath(); ctx.moveTo(0, -R*0.42); ctx.lineTo(R*0.10, 0); ctx.lineTo(0, R*0.42);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(114,226,245,0.65)';
      ctx.lineWidth = 3.2*S;
      ctx.beginPath(); ctx.moveTo(0, -R*0.42); ctx.lineTo(0, R*0.42); ctx.stroke();
      ctx.restore();
    });
  }
  /* 逐风折刃：地面小气流印记 + 风刃弹道与拖尾 */
  windBlades.forEach(b=>{
    if (!b.live) return;
    ctx.save();
    const tail = b.segs[b.segs.length - 1];
    const from = b.segs[Math.max(0, b.segs.length - 9)];
    if (from){
      const gx = ctx.createLinearGradient(from.x, from.y, b.x, b.y);
      gx.addColorStop(0, 'rgba(68,200,232,0)');
      gx.addColorStop(0.55, 'rgba(114,226,245,0.42)');
      gx.addColorStop(1, 'rgba(255,255,255,0.92)');
      ctx.strokeStyle = gx;
      ctx.lineWidth = 3.4*S;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      ctx.lineWidth = 1.4*S;
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    ctx.restore();
  });

  /* 长风溯旅：长条风轨纹路 */
  windTracks.forEach(tr=>{
    const t = now - tr.t0;
    if (t < 0) return;
    const fade = t < WIND_TRACK.p1 ? clamp(t / WIND_TRACK.p1, 0, 1)
               : (t > WIND_TRACK.p4 ? clamp(1 - (t - WIND_TRACK.p4) / (WIND_TRACK.dur - WIND_TRACK.p4), 0, 1) : 1);
    ctx.save();
    ctx.globalAlpha = 0.9 * fade;
    // 轨道路面
    ctx.beginPath();
    ctx.moveTo(tr.pts[0].x, tr.pts[0].y);
    tr.pts.forEach(pt=> ctx.lineTo(pt.x, pt.y));
    ctx.strokeStyle = 'rgba(40,136,170,0.55)';
    ctx.lineWidth = 3.4*R*0.22;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(102,224,242,0.75)';
    ctx.lineWidth = 1.6*R*0.22;
    ctx.stroke();
    // 纹路
    for (let i = 0; i < tr.pts.length - 1; i++){
      const a = tr.pts[i], b2 = tr.pts[i+1];
      const ma = now/260 + i;
      for (let k = 0; k < 3; k++){
        const ph = ((ma + k*0.33) % 1);
        const px = a.x + (b2.x - a.x) * ph, py = a.y + (b2.y - a.y) * ph;
        ctx.fillStyle = 'rgba(168,240,251,' + (0.5*fade) + ')';
        ctx.beginPath(); ctx.arc(px, py, (1 + (k%2))*S*0.9, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.restore();
  });
}

function drawWindHigh(now){
  const R = UI.R;
  /* 长风溯旅：巡行斩节点 / 贯通斩面 / 碎片 / 闪光 */
  windTracks.forEach(tr=>{
    const t = now - tr.t0;
    if (t < 0) return;
    // 斩节点：薄斩面（阶段4 之后淡出）
    const nodeFade = t > WIND_TRACK.p4 ? clamp(1 - (t - WIND_TRACK.p4) / 520, 0, 1) : 1;
    tr.nodes.forEach((nd, idx)=>{
      if (nd.x === undefined || nodeFade <= 0) return;
      ctx.globalAlpha = nodeFade;
      const wide = t >= WIND_TRACK.p3 ? 1 + 0.33 * clamp((t - WIND_TRACK.p3)/(WIND_TRACK.p4 - WIND_TRACK.p3), 0, 1) : 1;
      ctx.save();
      ctx.translate(nd.x, nd.y);
      ctx.rotate(tr.dir + Math.PI/2);
      ctx.globalAlpha = 0.85;
      const g = ctx.createLinearGradient(-R*0.2, 0, R*0.2, 0);
      g.addColorStop(0, 'rgba(56,196,224,0)');
      g.addColorStop(0.5, 'rgba(255,255,255,0.85)');
      g.addColorStop(1, 'rgba(56,196,224,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(0, 0, R*0.24*wide, R*1.15*wide, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    });
    ctx.globalAlpha = 1;
    // 阶段3：带游风标记的目标与斩节点之间的细风引线
    if (t >= WIND_TRACK.p3 && t < WIND_TRACK.p4){
      const owner = tr.owner;
      enemiesOf(owner).forEach(q=>{
        if (q.dead || !q.windStacks) return;
        tr.nodes.forEach(nd=>{
          if (nd.x === undefined) return;
          ctx.strokeStyle = 'rgba(168,240,251,0.5)';
          ctx.lineWidth = 1.1*S;
          ctx.beginPath(); ctx.moveTo(nd.x, nd.y); ctx.lineTo(q.x, q.y); ctx.stroke();
        });
      });
    }
    // 贯通斩面
    if (tr.slashDone){
      const k = clamp((now - tr.flashAt) / 420, 0, 1);
      ctx.save();
      ctx.globalAlpha = 1 - k;
      ctx.beginPath();
      ctx.moveTo(tr.pts[0].x, tr.pts[0].y);
      tr.pts.forEach(pt=> ctx.lineTo(pt.x, pt.y));
      ctx.strokeStyle = 'rgba(210,250,255,0.95)';
      ctx.lineWidth = WIND_TRACK.slashWidth * R * 2 * (1 - 0.3*k);
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.restore();
    }
    tr.shards.forEach(s=>{
      const a = 1 - s.t/s.life;
      ctx.fillStyle = 'rgba(208,249,255,' + (0.9*a) + ')';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r*a, 0, Math.PI*2); ctx.fill();
    });
    // 斩击峰值：淡青闪光蒙版（0.25，5 帧）
    if (tr.flashAt && now - tr.flashAt < 90){
      ctx.save();
      ctx.fillStyle = 'rgba(176,240,251,0.25)';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  });
  /* 逐风折刃：沿弹道局部气流扭曲 */
  windBlades.forEach(b=>{
    if (!b.live) return;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.ang);
    for (let i = 0; i < 2; i++){
      ctx.strokeStyle = 'rgba(168,240,251,' + (0.35 - i*0.12) + ')';
      ctx.lineWidth = (1.2 + i)*S;
      ctx.beginPath();
      ctx.arc(-R*0.6, 0, R*1.1, -0.8, 0.8);
      ctx.stroke();
    }
    ctx.restore();
  });
}

/* ================= 火·燎原引焰 / 飞火播种 / 野火漫疆 ================= */
const FIRE_SEED = { dur:640, p1:160, p2:420, gap:130, fly:0.40, dmg:5.2,
                    distR:5.4, r:40, life:2600, tickGap:200, tickDmg:1.7, cd:11,
                    core:'#FFEE99', main:'#FF5522', base:'#FF9933', scorch:'#331005' };
let firePts = [];      // 地面火种点位（二技能 / 大招 / 爆燃掉落共用）
let fireSeeds = [];    // 抛物线飞行火种

const WILDFIRE = { dur:3600, p1:420, p2:1820, p3:2400, p4:3000, srcR:70, nodeR:34,
                   tongueGap:320, tongueFast:180, tongueLen:90, tickGap:200, tickDmg:5.0,
                   burstR:45, burstDmg:13, cd:40, maxPts:16,
                   core:'#FFFFFF', band:'#FF4418', tongue:'#FF7722', fog:'#FFAA66',
                   ground:'#3B1206', ash:'#FFDD77' };
let wildFires = [];
let fireSeedsFly = [];   // 母火种 / 子火种（高空抛物线）
let emberFx = [];        // 烬粒

function firePointPush(owner, x, y, r, life, sys, now){
  firePts.push({ owner, x, y, r, born:now, end:now + life, sys, tick:{}, conduct:{},
                 tickGap:200, burstAt:0, burstDone:false });
  if (firePts.length > 60) firePts.shift();
}

function updateFirePts(now, dt){
  const R = UI.R;
  firePts = firePts.filter(pt=> pt.end > now);
  firePts.forEach(pt=>{
    const owner = pt.owner;
    if (!owner) return;
    enemiesOf(owner).forEach(q=>{
      if (q.dead) return;
      const dd = Math.hypot(q.x - pt.x, q.y - pt.y);
      if (dd > pt.r * S) return;
      // 地面火种传导：靠近火点即被种下火种，雷接触时翻倍
      const key = 'c' + (q.i || 0);
      if (!pt.conduct[key] || now - pt.conduct[key] >= ((q.elecEnd > now) ? 300 : 600)){
        pt.conduct[key] = now;
        markAdd(q, now, 'burn', 1);
      }
      if (pt.sys === 'ult' && q.burnStacks) q.burnEnd = Math.max(q.burnEnd || 0, now + 400);
      // 火点灼烧结算（同一敌人 200ms 内只吃一次，避免多点火点叠乘）
      const gap = pt.tickGap || (pt.sys === 'ult' ? WILDFIRE.tickGap : FIRE_SEED.tickGap);
      if (!q.firePtAt || now - q.firePtAt >= gap){
        q.firePtAt = now;
        hitEnemy(owner, q, now, { type:'fire', dmg: pt.sys === 'ult' ? WILDFIRE.tickDmg : FIRE_SEED.tickDmg });
        markAdd(q, now, 'burn', 1);
      }
    });
  });
}

/* 二技能：飞火播种 */
function useFireSeeds(p, now, sk2){
  const R = UI.R;
  const foes = enemiesOf(p).filter(q=> !q.dead);
  let dir = p.face > 0 ? 0 : Math.PI;
  if (foes.length){
    let best = null, bd = 1e9;
    foes.forEach(q=>{ const d = Math.hypot(q.x - p.x, q.y - p.y); if (d < bd){ bd = d; best = q; } });
    dir = Math.atan2(best.y - p.y, best.x - p.x);
  }
  for (let i = 0; i < 3; i++){
    const spread = (i - 1) * 0.34;
    const a = dir + spread;
    const L = FIRE_SEED.distR * R * (0.82 + i * 0.12);
    fireSeeds.push({ owner:p, born: now + FIRE_SEED.p1 + i * FIRE_SEED.gap,
                     x0:p.x, y0:p.y, x:p.x, y:p.y,
                     x1: clamp(p.x + Math.cos(a)*L, R, W - R),
                     y1: clamp(p.y + Math.sin(a)*L, UI.top + R, UI.bottom - R),
                     t:0, fly: FIRE_SEED.fly, done:false, hit:{} });
  }
  p.skill2End = now + (sk2.cd || FIRE_SEED.cd) * 1000;
  p.swing = 0.2;
  pushFloat(p.x, p.y - R*1.9, '飞火播种', '#ffffff', true);
  blip(300, 0.10, 0.24);
  return true;
}

function updateFireSeeds(now, dt){
  const R = UI.R;
  fireSeeds.forEach(sd=>{
    if (sd.done) return;
    if (now < sd.born) return;
    sd.t += dt;
    const k = clamp(sd.t / sd.fly, 0, 1);
    sd.x = sd.x0 + (sd.x1 - sd.x0) * k;
    sd.y = sd.y0 + (sd.y1 - sd.y0) * k - Math.sin(Math.PI * k) * R * 1.9;   // 抛物线
    if (Math.random() < 0.6){
      markFx.push({ x:sd.x + rnd(-3,3)*S, y:sd.y + rnd(-3,3)*S, vx:rnd(-20,20)*S, vy:(-10 + rnd(-18,10))*S,
                    r:(2 + Math.random()*3)*S, t:0, life:0.55, kind:'burn' });
    }
    enemiesOf(sd.owner).forEach(q=>{
      if (q.dead) return;
      const key = 'e' + (q.i || 0);
      if (sd.hit[key]) return;
      if (Math.hypot(q.x - sd.x, q.y - sd.y) > R * 1.1) return;
      sd.hit[key] = true;
      hitEnemy(sd.owner, q, now, { type:'fire', dmg: FIRE_SEED.dmg });
      markAdd(q, now, 'burn', 1);
      bursts.push({ x:sd.x, y:sd.y, r:R*0.2, to:R*0.9, t:0, life:0.26, col:'#FFCC44', ring:true });
      // 命中不减飞行：继续抛物线，落地依旧生成火点
    });
    if (k >= 1){
      sd.done = true;
      firePointPush(sd.owner, sd.x1, sd.y1, FIRE_SEED.r, FIRE_SEED.life, 's2', now);
      bursts.push({ x:sd.x1, y:sd.y1, r:R*0.3, to:R*1.2, t:0, life:0.3, col:'#FF9933', ring:true });
      blip(200, 0.12, 0.2);
    }
  });
  fireSeeds = fireSeeds.filter(sd=> !sd.done);
}

/* 大招：野火漫疆（链式蔓延） */
function useWildFire(p, now, ult){
  const R = UI.R;
  const foes = enemiesOf(p).filter(q=> !q.dead);
  let dir = p.face > 0 ? 0 : Math.PI;
  if (foes.length){
    let best = null, bd = 1e9;
    foes.forEach(q=>{ const d = Math.hypot(q.x - p.x, q.y - p.y); if (d < bd){ bd = d; best = q; } });
    dir = Math.atan2(best.y - p.y, best.x - p.x);
  }
  const L = R * 4.6;
  wildFires.push({ owner:p, t0:now, dur:WILDFIRE.dur, dir,
                   pts:[], tongues:[], lastSpawn:0, burstAt:0, flashAt:0,
                   seed:{ x0:p.x, y0:p.y,
                          x1: clamp(p.x + Math.cos(dir)*L, R, W - R),
                          y1: clamp(p.y + Math.sin(dir)*L, UI.top + R, UI.bottom - R), t:0 } });
  p.ultEnd = now + (ult.cd || WILDFIRE.cd) * 1000;
  pushFloat(p.x, p.y - R*2.2, '野火漫疆', '#ffffff', true);
  blip(160, 0.14, 0.44);
  return true;
}

function updateWildFires(now, dt){
  const R = UI.R;
  for (let i = wildFires.length - 1; i >= 0; i--){
    const wf = wildFires[i];
    const t = now - wf.t0;
    if (t >= WILDFIRE.dur){ wildFires.splice(i,1); continue; }
    const owner = wf.owner;
    // 母火种飞行 → 落地生成核心火源点
    if (t < WILDFIRE.p1){
      const k = clamp(t / WILDFIRE.p1, 0, 1);
      wf.seed.x = wf.seed.x0 + (wf.seed.x1 - wf.seed.x0) * k;
      wf.seed.y = wf.seed.y0 + (wf.seed.y1 - wf.seed.y0) * k - Math.sin(Math.PI * k) * R * 1.6;
      if (!wf.pts.length && t >= WILDFIRE.p1 - dt - 1){
        firePointPush(owner, wf.seed.x1, wf.seed.y1, WILDFIRE.srcR, WILDFIRE.dur - t, 'ult', now);
        wf.pts.push({ x:wf.seed.x1, y:wf.seed.y1, r:WILDFIRE.srcR, born:now,
                      end: now + WILDFIRE.dur - t, tick:{}, conduct:{}, burstAt:0 });
        bursts.push({ x:wf.seed.x1, y:wf.seed.y1, r:R*0.3, to:R*1.6, t:0, life:0.34, col:'#FF4418', ring:true });
      }
    }
    // 母火种落地：生成初始核心火源点（半径 70px）
    if (t >= WILDFIRE.p1 && !wf.pts.length){
      firePointPush(owner, wf.seed.x1, wf.seed.y1, WILDFIRE.srcR, WILDFIRE.dur - t, 'ult', now);
      wf.pts.push({ x:wf.seed.x1, y:wf.seed.y1, r:WILDFIRE.srcR, born:now,
                    end: now + WILDFIRE.dur - t, tick:{}, conduct:{}, burstAt:0 });
      bursts.push({ x:wf.seed.x1, y:wf.seed.y1, r:R*0.3, to:R*1.6, t:0, life:0.34, col:'#FF4418', ring:true });
    }
    if (t >= WILDFIRE.p1){
      // 链式蔓延：定时从现有火点边缘随机外延一条火舌 → 生成子火种
      const gap = (t >= WILDFIRE.p2) ? WILDFIRE.tongueFast : WILDFIRE.tongueGap;
      if (t < WILDFIRE.p3 && now - (wf.lastSpawn || 0) >= gap && wf.pts.length && wf.pts.length < WILDFIRE.maxPts){
        wf.lastSpawn = now;
        const src = wf.pts[Math.floor(Math.random()*wf.pts.length)];
        const a = Math.random() * Math.PI * 2;
        const widen = (t >= WILDFIRE.p2) ? 1.32 : 1;
        const len = WILDFIRE.tongueLen * S * (0.7 + Math.random()*0.6);
        const nx = clamp(src.x + Math.cos(a)*len, R*0.6, W - R*0.6);
        const ny = clamp(src.y + Math.sin(a)*len, UI.top + R*0.6, UI.bottom - R*0.6);
        const nr = WILDFIRE.nodeR * widen;
        wf.tongues.push({ x0:src.x, y0:src.y, x1:nx, y1:ny, born:now, life:0.32 });
        const pt = { x:nx, y:ny, r:nr, born:now, end: now + WILDFIRE.dur - t, tick:{}, conduct:{}, burstAt:0 };
        wf.pts.push(pt);
        firePointPush(owner, nx, ny, nr/S, WILDFIRE.dur - t, 'ult', now);
      }
      // 阶段4：全点火点同步爆燃（每个都向外炸一圈 45px 冲击波）
      if (t >= WILDFIRE.p3 && !wf.burstAt){
        wf.burstAt = now;
        wf.flashAt = now;
        wf.pts.forEach(pt=>{ pt.burstAt = now; });
        enemiesOf(owner).forEach(q=>{
          if (q.dead) return;
          let near = 1e9;
          wf.pts.forEach(pt=>{ const d = Math.hypot(q.x - pt.x, q.y - pt.y); if (d < near) near = d; });
          if (near > (WILDFIRE.burstR + 20) * S) return;
          const fall = clamp(1 - near / ((WILDFIRE.burstR + 30) * S), 0.2, 1);
          hitEnemy(owner, q, now, { type:'fire', dmg: WILDFIRE.burstDmg * fall });
        });
        for (let s2 = 0; s2 < 40; s2++){
          const pt = wf.pts[Math.floor(Math.random()*wf.pts.length)] || { x:wf.seed.x1, y:wf.seed.y1 };
          markFx.push({ x:pt.x + rnd(-20,20)*S, y:pt.y + rnd(-14,10)*S,
                        vx:rnd(-70,70)*S, vy:rnd(-80,-20)*S, r:(2 + Math.random()*6)*S,
                        t:0, life:0.7, kind:'burnFrag' });
        }
        blip(90, 0.16, 0.5);
      }
    }
    wf.tongues.forEach(tg=> tg.born && tg.born);
    wf.tongues = wf.tongues.filter(tg=> now - tg.born < 340);
    // 烬粒
    if (wf.pts.length && Math.random() < 0.55){
      const pt = wf.pts[Math.floor(Math.random()*wf.pts.length)];
      markFx.push({ x:pt.x + rnd(-pt.r, pt.r)*S*0.9, y:pt.y + rnd(-pt.r*0.4, pt.r*0.5)*S,
                    vx:rnd(-10,10)*S, vy:(-30 - Math.random()*40)*S, r:(1 + Math.random()*3)*S,
                    t:0, life:0.9, kind:'burnIdle' });
    }
  }
}

/* ================= 水·潮汐归流 / 溯潮之索 / 汐潮往复 ================= */
const WATER_TETHER = { dur:660, p1:170, p2:440, link:240, tickGap:130, tickDmg:2.2,
                       speedR:20, cd:11, pull:0.55 };
let tethers = [];

const TIDE = { dur:3800, p1:460, p2:1960, p3:2550, p4:3200, lenR:9.2, halfW:1.55,
               tickGap:130, tickDmg:13.1, backMul:1.3, cd:40, shards:145,
               core:'#FFFFFF', main:'#3399DD', wall:'#55BBFF', fog:'#99DDFF',
               vein:'#185E99', foam:'#CCEEFF' };
let tides = [];

function useWaterTether(p, now, sk2){
  const R = UI.R;
  const foes = enemiesOf(p).filter(q=> !q.dead);
  let ang = p.face > 0 ? 0 : Math.PI;
  if (foes.length){
    let best = null, bd = 1e9;
    foes.forEach(q=>{ const d = Math.hypot(q.x - p.x, q.y - p.y); if (d < bd){ bd = d; best = q; } });
    ang = Math.atan2(best.y - p.y, best.x - p.x);
  }
  // 潮汐标记回流牵引：已带标记的敌人被小幅拽向水凝晶
  foes.forEach(q=>{
    if ((q.waterStacks||0) > 0){
      const a = Math.atan2(p.y - q.y, p.x - q.x);
      q.x += Math.cos(a) * R * 0.28;
      q.y += Math.sin(a) * R * 0.28;
      markRings.push({ x:q.x, y:q.y, r:R*0.4, to:R*1.0, t:0, life:0.3, kind:'soak' });
    }
  });
  tethers.push({ owner:p, born:now, ang, x:p.x, y:p.y, live:false,
                 hitQ:null, linkEnd:0, lastTick:{}, pullAt:0 });
  p.skill2End = now + (sk2.cd || WATER_TETHER.cd) * 1000;
  p.swing = 0.2;
  pushFloat(p.x, p.y - R*1.9, '溯潮之索', '#ffffff', true);
  blip(520, 0.09, 0.2);
  return true;
}

function updateTethers(now, dt){
  const R = UI.R;
  for (let i = tethers.length - 1; i >= 0; i--){
    const th = tethers[i];
    const t = now - th.born;
    if (t >= WATER_TETHER.dur){ tethers.splice(i,1); continue; }
    const owner = th.owner;
    if (!th.hitQ){
      if (t < WATER_TETHER.p1) continue;
      // 水锚直线射出
      const spd = WATER_TETHER.speedR * R;
      th.x += Math.cos(th.ang) * spd * dt;
      th.y += Math.sin(th.ang) * spd * dt;
      const q = enemiesOf(owner).find(q2=> !q2.dead && Math.hypot(q2.x - th.x, q2.y - th.y) < R*1.25);
      if (q){
        th.hitQ = q;
        th.linkEnd = now + WATER_TETHER.link;
        bursts.push({ x:q.x, y:q.y, r:R*0.3, to:R*1.1, t:0, life:0.28, col:'#77BBFF', ring:true });
      }
      if (Math.random() < 0.5){
        markFx.push({ x:th.x, y:th.y, vx:rnd(-8,8)*S, vy:rnd(4,20)*S, r:(2 + Math.random()*3)*S,
                      t:0, life:0.6, kind:'soak' });
      }
    } else {
      const q = th.hitQ;
      if (q.dead || now >= th.linkEnd){ th.hitQ = null; continue; }
      // 连接期间每 0.13s 结算一次并叠一层潮汐
      if (now - (th.lastTick.t || 0) >= WATER_TETHER.tickGap){
        th.lastTick.t = now;
        hitEnemy(owner, q, now, { type:'water', dmg: WATER_TETHER.tickDmg });
        markAdd(q, now, 'soak', 1);
        markFx.push({ x:q.x + rnd(-6,6)*S, y:q.y + rnd(-8,4)*S, vx:rnd(-10,10)*S, vy:rnd(6,24)*S,
                      r:(2 + Math.random()*3)*S, t:0, life:0.6, kind:'soak' });
      }
      // 小幅回流拉扯
      if (now - (th.pullAt || 0) >= 110){
        th.pullAt = now;
        const a = Math.atan2(owner.y - q.y, owner.x - q.x);
        q.x += Math.cos(a) * R * 0.06;
        q.y += Math.sin(a) * R * 0.06;
      }
    }
  }
}

function useTide(p, now, ult){
  const R = UI.R;
  const foes = enemiesOf(p).filter(q=> !q.dead);
  let dir = p.face > 0 ? 0 : Math.PI;
  if (foes.length){
    let best = null, bd = 1e9;
    foes.forEach(q=>{ const d = Math.hypot(q.x - p.x, q.y - p.y); if (d < bd){ bd = d; best = q; } });
    dir = Math.atan2(best.y - p.y, best.x - p.x);
  }
  const len = TIDE.lenR * R;
  tides.push({ owner:p, t0:now, dur:TIDE.dur, dir, len,
               lastTick:{}, backDone:false, flashAt:0, shards:[], pullAt:0 });
  p.ultEnd = now + (ult.cd || TIDE.cd) * 1000;
  pushFloat(p.x, p.y - R*2.2, '汐潮往复', '#ffffff', true);
  blip(140, 0.13, 0.4);
  return true;
}

function updateTides(now, dt){
  const R = UI.R;
  const cosD = Math.cos, sinD = Math.sin;
  for (let i = tides.length - 1; i >= 0; i--){
    const td = tides[i];
    const t = now - td.t0;
    if (t >= TIDE.dur){ tides.splice(i,1); continue; }
    const owner = td.owner;
    const halfW = TIDE.halfW * R * (t >= TIDE.p3 ? 1.3 : 1);
    // 潮浪前沿位置
    let front = null, dirSign = 1, power = 1;
    if (t >= TIDE.p1 && t < TIDE.p2){
      front = clamp((t - TIDE.p1) / (TIDE.p2 - TIDE.p1), 0, 1) * td.len;   // 前潮推击
    } else if (t >= TIDE.p3 && t < TIDE.p4){
      front = (1 - clamp((t - TIDE.p3) / (TIDE.p4 - TIDE.p3), 0, 1)) * td.len;  // 回流反噬
      dirSign = -1; power = TIDE.backMul;
    } else if (t >= TIDE.p2 && t < TIDE.p3){
      front = td.len;
    }
    if (front === null) continue;
    enemiesOf(owner).forEach(q=>{
      if (q.dead) return;
      // 投影到潮道坐标系
      const rx = q.x - owner.x, ry = q.y - owner.y;
      const along = rx * cosD(td.dir) + ry * sinD(td.dir);
      const perp = Math.abs(-rx * sinD(td.dir) + ry * cosD(td.dir));
      if (perp > halfW || along < -R || along > td.len + R) return;
      if (Math.abs(along - front) > R * (1.5 + 0.35*power)) return;
      const key = 'q' + (q.i || 0);
      if (td.lastTick[key] && now - td.lastTick[key] < TIDE.tickGap) return;
      td.lastTick[key] = now;
      const center = 1 - Math.abs(perp) / halfW * 0.35;
      hitEnemy(owner, q, now, { type:'water', dmg: TIDE.tickDmg * power * center });
      markAdd(q, now, 'soak', 1);
      if (q.waterStacks) q.waterEnd = Math.max(q.waterEnd || 0, now + 500);   // 潮道内标记不衰减
      // 前潮推送 / 回流拽向水凝晶
      q.x += cosD(td.dir) * dirSign * R * 0.16 * power;
      q.y += sinD(td.dir) * dirSign * R * 0.16 * power;
    });
    // 水沫
    if (Math.random() < 0.6){
      const a = td.dir + rnd(-0.35, 0.35);
      const dist = front + rnd(-R, R);
      markFx.push({ x: owner.x + cosD(td.dir)*dist + rnd(-10,10)*S,
                    y: owner.y + sinD(td.dir)*dist + rnd(-halfW*0.6, halfW*0.6),
                    vx: cosD(td.dir)*rnd(20,60)*S, vy: rnd(-14,14)*S,
                    r:(1 + Math.random()*3)*S, t:0, life:0.7, kind:'soak' });
    }
    // 阶段4 末端：水昙绽放 + 闪光蒙版
    if (t >= TIDE.p4 && !td.backDone){
      td.backDone = true;
      td.flashAt = now;
      for (let s2 = 0; s2 < 30; s2++){
        const pt = { x: owner.x + cosD(td.dir)*rnd(-R, R*1.4), y: owner.y + sinD(td.dir)*rnd(-R, R*1.4) };
        td.shards.push({ x:pt.x, y:pt.y, vx:rnd(-60,60)*S, vy:rnd(-20,40)*S,
                         r:(2 + Math.random()*6)*S, t:0, life:0.7 });
      }
      blip(300, 0.12, 0.34);
    }
    td.shards.forEach(s2=>{ s2.x += s2.vx*dt; s2.y += s2.vy*dt; s2.vy += 8*dt*S; s2.t += dt; });
    td.shards = td.shards.filter(s2=> s2.t < s2.life);
  }
}

/* ---------- 绘制：火/水的低层（地面火点 / 潮道 / 拖尾） ---------- */
function drawFireWaterLow(now){
  const R = UI.R;
  // 二技能火种拖尾
  fireSeeds.forEach(sd=>{
    if (now < sd.born) return;
    ctx.save();
    for (let i = 1; i <= 5; i++){
      const kk = clamp(sd.t / sd.fly - i*0.05, 0, 1);
      const px = sd.x0 + (sd.x1 - sd.x0)*kk;
      const py = sd.y0 + (sd.y1 - sd.y0)*kk - Math.sin(Math.PI*kk)*R*1.9;
      ctx.fillStyle = 'rgba(255,85,34,' + (0.5 - i*0.08) + ')';
      ctx.beginPath(); ctx.arc(px, py, (3 - i*0.4)*S, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  });
  // 地面火种点位：焦痕基底 + 火焰
  firePts.forEach(pt=>{
    const a = clamp((pt.end - now) / 400, 0, 1);
    const flick = 0.75 + 0.25*Math.sin(now/120 + pt.x);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(51,16,5,0.85)';
    ctx.beginPath(); ctx.ellipse(pt.x, pt.y + R*0.7, pt.r*S, pt.r*S*0.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,153,51,' + (0.5*flick) + ')';
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r*S*0.9, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,119,34,0.85)';
    ctx.lineWidth = 2.2*S;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r*S*0.92, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  });
  // 潮汐涌道
  tides.forEach(td=>{
    const t = now - td.t0;
    if (t < 0) return;
    const fade = t < TIDE.p1 ? clamp(t / TIDE.p1, 0, 1)
               : (t > TIDE.p4 ? clamp(1 - (t - TIDE.p4) / (TIDE.dur - TIDE.p4), 0, 1) : 1);
    const halfW = TIDE.halfW * R * (t >= TIDE.p3 ? 1.3 : 1);
    ctx.save();
    ctx.globalAlpha = 0.85 * fade;
    ctx.translate(td.owner.x, td.owner.y);
    ctx.rotate(td.dir);
    const g = ctx.createLinearGradient(0, -halfW, 0, halfW);
    g.addColorStop(0, 'rgba(153,221,255,0.15)');
    g.addColorStop(0.5, 'rgba(51,153,221,0.45)');
    g.addColorStop(1, 'rgba(153,221,255,0.15)');
    ctx.fillStyle = g;
    ctx.fillRect(0, -halfW, td.len, halfW*2);
    // 水纹
    for (let i = 0; i < 22; i++){
      const px = ((now/900 + i/22) % 1) * td.len;
      ctx.strokeStyle = 'rgba(24,94,153,0.5)';
      ctx.lineWidth = 1.2*S;
      ctx.beginPath();
      ctx.moveTo(px, -halfW*0.8); ctx.lineTo(px, halfW*0.8);
      ctx.stroke();
    }
    ctx.restore();
  });
}

function drawFireWaterHigh(now){
  const R = UI.R;
  // 二技能水索
  tethers.forEach(th=>{
    const t = now - th.born;
    if (t < 0) return;
    const q = th.hitQ;
    ctx.save();
    if (q && !q.dead){
      const g = ctx.createLinearGradient(th.owner.x, th.owner.y, q.x, q.y);
      g.addColorStop(0, 'rgba(255,255,255,0.9)');
      g.addColorStop(0.6, 'rgba(51,153,238,0.85)');
      g.addColorStop(1, 'rgba(119,187,255,0.9)');
      ctx.strokeStyle = g;
      ctx.lineWidth = 3.2*S;
      ctx.beginPath(); ctx.moveTo(th.owner.x, th.owner.y); ctx.lineTo(q.x, q.y); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.75)';
      ctx.lineWidth = 1.2*S;
      ctx.beginPath(); ctx.moveTo(th.owner.x, th.owner.y); ctx.lineTo(q.x, q.y); ctx.stroke();
      // 水沫沿线
      for (let i = 0; i < 4; i++){
        const k = ((now/420 + i/4) % 1);
        const px = th.owner.x + (q.x - th.owner.x)*k, py = th.owner.y + (q.y - th.owner.y)*k + Math.sin(k*Math.PI)*6*S;
        ctx.fillStyle = 'rgba(204,238,255,0.8)';
        ctx.beginPath(); ctx.arc(px, py, 2.4*S, 0, Math.PI*2); ctx.fill();
      }
    } else if (!q){
      // 水锚飞行
      ctx.fillStyle = 'rgba(51,153,238,0.9)';
      ctx.beginPath(); ctx.arc(th.x, th.y, 5*S, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 1.6*S;
      ctx.beginPath(); ctx.arc(th.x, th.y, 7.5*S, 0, Math.PI*2); ctx.stroke();
    }
    ctx.restore();
  });
  // 火大招：母火种 / 火舌 / 爆燃冲击波 / 焰屑
  wildFires.forEach(wf=>{
    const t = now - wf.t0;
    if (t < WILDFIRE.p1){
      const k = clamp(t / WILDFIRE.p1, 0, 1);
      const px = wf.seed.x0 + (wf.seed.x1 - wf.seed.x0)*k;
      const py = wf.seed.y0 + (wf.seed.y1 - wf.seed.y0)*k - Math.sin(Math.PI*k)*R*1.6;
      ctx.save();
      ctx.fillStyle = 'rgba(255,238,153,0.95)';
      ctx.beginPath(); ctx.arc(px, py, R*0.45, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,68,24,0.8)';
      ctx.lineWidth = 3*S;
      ctx.beginPath(); ctx.arc(px, py, R*0.62, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }
    // 火舌
    wf.tongues.forEach(tg=>{
      const a = clamp(1 - (now - tg.born)/340, 0, 1);
      ctx.strokeStyle = 'rgba(255,119,34,' + (0.85*a) + ')';
      ctx.lineWidth = (3.4*a + 1)*S;
      ctx.beginPath(); ctx.moveTo(tg.x0, tg.y0); ctx.lineTo(tg.x1, tg.y1); ctx.stroke();
    });
    // 爆燃冲击波
    if (wf.burstAt){
      const k = clamp((now - wf.burstAt) / 460, 0, 1);
      ctx.save();
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = 'rgba(255,170,102,0.9)';
      ctx.lineWidth = 4*S;
      wf.pts.forEach(pt=>{
        ctx.beginPath(); ctx.arc(pt.x, pt.y, WILDFIRE.burstR*S*(0.4 + k), 0, Math.PI*2); ctx.stroke();
      });
      ctx.restore();
    }
    // 全局闪光蒙版
    if (wf.flashAt && now - wf.flashAt < 90){
      ctx.save();
      ctx.fillStyle = 'rgba(255,120,60,0.26)';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  });
  // 水大招：潮墙 / 回流潮墙 / 水昙 / 碎片 / 蒙版
  tides.forEach(td=>{
    const t = now - td.t0;
    const halfW = TIDE.halfW * R * (t >= TIDE.p3 ? 1.3 : 1);
    let front = null, thick = 1;
    if (t >= TIDE.p1 && t < TIDE.p2) front = clamp((t - TIDE.p1)/(TIDE.p2 - TIDE.p1), 0, 1) * td.len;
    else if (t >= TIDE.p3 && t < TIDE.p4){ front = (1 - clamp((t - TIDE.p3)/(TIDE.p4 - TIDE.p3), 0, 1)) * td.len; thick = TIDE.backMul; }
    if (front !== null){
      ctx.save();
      ctx.translate(td.owner.x, td.owner.y);
      ctx.rotate(td.dir);
      const wallW = R * 1.15 * thick;
      const g2 = ctx.createLinearGradient(front - wallW, 0, front + wallW*0.4, 0);
      g2.addColorStop(0, 'rgba(51,153,221,0.15)');
      g2.addColorStop(0.5, 'rgba(85,187,255,0.9)');
      g2.addColorStop(1, 'rgba(255,255,255,0.95)');
      ctx.fillStyle = g2;
      ctx.fillRect(front - wallW, -halfW, wallW, halfW*2);
      // 浪头泡沫
      ctx.strokeStyle = 'rgba(204,238,255,0.9)';
      ctx.lineWidth = 2.6*S;
      ctx.beginPath();
      ctx.moveTo(front, -halfW); ctx.lineTo(front, halfW);
      ctx.stroke();
      ctx.restore();
    }
    if (td.flashAt && now - td.flashAt < 90){
      ctx.save();
      ctx.fillStyle = 'rgba(153,221,255,0.27)';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    td.shards.forEach(s2=>{
      const a = 1 - s2.t/s2.life;
      ctx.fillStyle = 'rgba(204,238,255,' + (0.85*a) + ')';
      ctx.beginPath(); ctx.arc(s2.x, s2.y, s2.r*a, 0, Math.PI*2); ctx.fill();
    });
  });
}

/* ================= 岩·凝岩铸甲 / 层岩筑壁 / 裂岩突刺 / 地台沉陆 ================= */
const ROCK_WALL = { dur:580, p1:140, p2:380, w:110, h:70, life:4200, hp:6, spikeDmg:6,
                    spikeR:1.9, cd:11, gapR:3.1 };
let rockWalls = [];

const ROCK_SPIKE = { dur:630, p1:155, p2:405, strikes:[155, 255, 355], dmg:9,
                     hitR:1.8, distR:5.2, cd:11 };
let rockSpikes = [];

const ROCK_PLATE = { dur:3700, p1:440, p2:1880, p3:2450, p4:3100, side:190,
                     tickGap:210, tickDmg:3.4, nodeGap:640, collapseDmg:26,
                     cd:42, name:'地台沉陆' };
let rockPlates = [];

/* 一技能：层岩筑壁 */
function useRockWall(p, now, sk){
  const R = UI.R;
  const dir = p.face > 0 ? 1 : -1;
  const cx = clamp(p.x + dir * R * ROCK_WALL.gapR, R, W - R);
  const cy = p.y;
  const w = ROCK_WALL.w * S / 1.35, h = ROCK_WALL.h * S / 1.35;
  const wall = { owner:p, x:cx, y:cy, w:w, h:h, hp:ROCK_WALL.hp, born:now,
                 end:now + ROCK_WALL.life, spikeDone:false, solid:true, dir };
  rockWalls.push(wall);
  p.skill1End = now + (sk.cd || ROCK_WALL.cd) * 1000;
  p.swing = 0.2;
  pushFloat(p.x, p.y - R*1.8, '层岩筑壁', ELEM.rock.glow, true);
  blip(300, 0.12, 0.28);
  return true;
}

function updateRockWalls(now, dt){
  const R = UI.R;
  for (let i = rockWalls.length - 1; i >= 0; i--){
    const wl = rockWalls[i];
    if (now >= wl.end || wl.hp <= 0){ rockWalls.splice(i,1); continue; }
    const owner = wl.owner;
    if (owner && !wl.spikeDone && now - wl.born >= ROCK_WALL.p2){
      wl.spikeDone = true;
      enemiesOf(owner).forEach(q=>{
        if (q.dead) return;
        const dx = Math.abs(q.x - wl.x);
        if (dx > wl.w/2 + R*ROCK_WALL.spikeR || Math.abs(q.y - wl.y) > wl.h/2 + R*1.2) return;
        hitEnemy(owner, q, now, { type:'rock', dmg: ROCK_WALL.spikeDmg });
        markAdd(q, now, 'rock', 1);
        const n = (q.rockStacks || 0);            // 岩刺命中：目标每层岩蚀给墙加一点耐久
        if (n > 0) wl.hp += 1;
        bursts.push({ x:q.x, y:q.y, r:R*0.2, to:R*1.2, t:0, life:0.28, col:'#C9B896', ring:true });
      });
      blip(420, 0.10, 0.22);
    }
    // 挡弹：敌方弹道撞墙即被削掉，墙掉一点耐久
    if (typeof projs !== 'undefined' && projs.length && owner){
      for (let k = projs.length - 1; k >= 0; k--){
        const pr = projs[k];
        if (!pr || pr.owner === owner) continue;
        if (Math.abs(pr.x - wl.x) > wl.w/2 || Math.abs(pr.y - wl.y) > wl.h/2) continue;
        projs.splice(k,1);
        wl.hp -= 1;
        bursts.push({ x:pr.x, y:pr.y, r:R*0.2, to:R*0.9, t:0, life:0.24, col:'#D4C5B0', ring:true });
        break;
      }
    }
  }
}

/* 二技能：裂岩突刺 */
function useRockSpikes(p, now, sk2){
  const R = UI.R;
  const foes = enemiesOf(p).filter(q=> !q.dead);
  let tx, ty;
  if (foes.length){
    let best = null, bd = 1e9;
    foes.forEach(q=>{ const d = Math.hypot(q.x-p.x, q.y-p.y); if (d < bd){ bd = d; best = q; } });
    tx = best.x; ty = best.y;
  } else {
    const dir = p.face > 0 ? 1 : -1;
    tx = p.x + dir * R * ROCK_SPIKE.distR; ty = p.y;
  }
  rockSpikes.push({ owner:p, x:clamp(tx, R, W-R), y:clamp(ty, UI.top+R, UI.bottom-R),
                    born:now, end:now + ROCK_SPIKE.dur, hitIdx:0, done: {} });
  p.skill2End = now + (sk2.cd || ROCK_SPIKE.cd) * 1000;
  p.swing = 0.2;
  pushFloat(p.x, p.y - R*1.8, '裂岩突刺', ELEM.rock.glow, true);
  blip(260, 0.10, 0.24);
  return true;
}

function updateRockSpikes(now, dt){
  const R = UI.R;
  for (let i = rockSpikes.length - 1; i >= 0; i--){
    const sp = rockSpikes[i];
    if (now >= sp.end){ rockSpikes.splice(i,1); continue; }
    const t = now - sp.born;
    while (sp.hitIdx < ROCK_SPIKE.strikes.length && t >= ROCK_SPIKE.strikes[sp.hitIdx]){
      const idx = sp.hitIdx++;
      enemiesOf(sp.owner).forEach(q=>{
        if (q.dead) return;
        if (sp.done['s'+idx+'-'+(q.i||0)]) return;
        if (Math.hypot(q.x - sp.x, q.y - sp.y) > R * ROCK_SPIKE.hitR) return;
        sp.done['s'+idx+'-'+(q.i||0)] = 1;
        hitEnemy(sp.owner, q, now, { type:'rock', dmg: ROCK_SPIKE.dmg });
        markAdd(q, now, 'rock', 1);
        q.knockY = (q.knockY || 0) - 90*S;        // 岩锥顶端小幅顶起
        bursts.push({ x:q.x, y:q.y, r:R*0.3, to:R*1.4, t:0, life:0.3, col:'#D4C5B0', ring:true });
      });
      blip(340 + idx*60, 0.09, 0.2);
    }
  }
}

/* 大招：地台沉陆 */
function useRockPlate(p, now, ult){
  const R = UI.R;
  const dir = p.face > 0 ? 1 : -1;
  const cx = clamp(p.x + dir * R * 4.2, R + ROCK_PLATE.side*S/2, W - R - ROCK_PLATE.side*S/2);
  const cy = clamp(p.y, UI.top + ROCK_PLATE.side*S/2, UI.bottom - ROCK_PLATE.side*S/2);
  const nodes = [];
  for (let i = 0; i < 5; i++){
    nodes.push({ x: cx + rnd(-1,1)*ROCK_PLATE.side*S*0.35, y: cy + rnd(-1,1)*ROCK_PLATE.side*S*0.35, at:0 });
  }
  rockPlates.push({ owner:p, x:cx, y:cy, t0:now, dur:ROCK_PLATE.dur, nodes,
                    lastTick:{}, nodeAt: now, collapse:false, flashAt:0, shards:[] });
  p.ultEnd = now + (ult.cd || ROCK_PLATE.cd) * 1000;
  p.ultActive = false;                       // 不锁移动（岩台是场地）
  pushFloat(p.x, p.y - R*2.2, ROCK_PLATE.name, '#ffffff', true);
  blip(180, 0.14, 0.42);
  return true;
}

function updateRockPlates(now, dt){
  const R = UI.R;
  const side = ROCK_PLATE.side * S;
  for (let i = rockPlates.length - 1; i >= 0; i--){
    const pl = rockPlates[i];
    const t = now - pl.t0;
    if (t >= pl.dur){ rockPlates.splice(i,1); continue; }
    const owner = pl.owner;
    if (!owner) continue;
    const half = side/2;
    const inPlate = (q)=> Math.abs(q.x - pl.x) <= half && Math.abs(q.y - pl.y) <= half;
    // 阶段2：板面持续结算 + 岩栓
    if (t >= ROCK_PLATE.p1 && t < ROCK_PLATE.p3){
      enemiesOf(owner).forEach(q=>{
        if (q.dead || !inPlate(q)) return;
        const key = 'q' + (q.i || 0);
        if (pl.lastTick[key] && now - pl.lastTick[key] < ROCK_PLATE.tickGap) return;
        pl.lastTick[key] = now;
        hitEnemy(owner, q, now, { type:'rock', dmg: ROCK_PLATE.tickDmg });
        markAdd(q, now, 'rock', 1);
        if (q.rockStacks) q.rockEnd = Math.max(q.rockEnd || 0, now + 600);   // 台内标记不衰减
      });
      if (now - pl.nodeAt > ROCK_PLATE.nodeGap){
        pl.nodeAt = now;
        pl.nodes.forEach(nd=>{
          nd.at = now;
          enemiesOf(owner).forEach(q=>{
            if (q.dead) return;
            if (Math.hypot(q.x - nd.x, q.y - nd.y) > R*1.5) return;
            markAdd(q, now, 'rock', 1);
            q.mildSlowEnd = Math.max(q.mildSlowEnd || 0, now + 400);
          });
        });
      }
    }
    // 阶段4：陆崩
    if (t >= ROCK_PLATE.p4 && !pl.collapse){
      pl.collapse = true;
      pl.flashAt = now;
      enemiesOf(owner).forEach(q=>{
        if (q.dead || !inPlate(q)) return;
        const d = Math.max(Math.abs(q.x - pl.x), Math.abs(q.y - pl.y)) / half;
        const fall = 1 - 0.55 * clamp(d, 0, 1);
        hitEnemy(owner, q, now, { type:'rock', dmg: ROCK_PLATE.collapseDmg * fall });
      });
      for (let k = 0; k < 22; k++){
        pl.shards.push({ x: pl.x + rnd(-1,1)*half, y: pl.y + rnd(-1,1)*half,
                         vx: rnd(-70,70)*S, vy: (-90 - Math.random()*90)*S,
                         r:(2 + Math.random()*6)*S, t:0, life:0.65 });
      }
      blip(120, 0.16, 0.5);
    }
    pl.shards.forEach(s2=>{ s2.x += s2.vx*dt; s2.y += s2.vy*dt; s2.vy += 180*dt*S; s2.t += dt; });
    pl.shards = pl.shards.filter(s2=> s2.t < s2.life);
  }
}

/* ---------- 岩的绘制 ---------- */
function drawRockSkillsLow(now){
  const R = UI.R;
  // 岩墙：地面基座 + 墙身
  rockWalls.forEach(wl=>{
    const a = clamp((wl.end - now) / 300, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(80,66,50,0.55)';
    ctx.beginPath(); ctx.ellipse(wl.x, wl.y + wl.h/2 + 2*S, wl.w*0.62, wl.h*0.22, 0, 0, Math.PI*2); ctx.fill();
    const g = ctx.createLinearGradient(wl.x, wl.y - wl.h/2, wl.x, wl.y + wl.h/2);
    g.addColorStop(0, '#B8A484');
    g.addColorStop(0.55, '#877458');
    g.addColorStop(1, '#504232');
    ctx.fillStyle = g;
    rrPath(wl.x - wl.w/2, wl.y - wl.h/2, wl.w, wl.h, 4*S); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1.4*S;
    rrPath(wl.x - wl.w/2, wl.y - wl.h/2, wl.w, wl.h, 4*S); ctx.stroke();
    // 岩层缝
    for (let i = 1; i < 3; i++){
      ctx.strokeStyle = 'rgba(80,66,50,0.7)';
      ctx.lineWidth = 1.1*S;
      ctx.beginPath();
      ctx.moveTo(wl.x - wl.w/2 + wl.w*i/3, wl.y - wl.h/2);
      ctx.lineTo(wl.x - wl.w/2 + wl.w*i/3, wl.y + wl.h/2);
      ctx.stroke();
    }
    // 破土岩刺
