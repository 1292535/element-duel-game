      ctx.beginPath(); ctx.arc(0, 0, rr*0.62, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,226,178,0.9)';
      ctx.lineWidth = 1.8*S;
      ctx.beginPath(); ctx.arc(0, 0, rr*0.68, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
      return;
    }
    if (pr.type === 'neutron'){
      const ang2 = Math.atan2(pr.vy, pr.vx);
      ctx.save();
      const tg2 = ctx.createLinearGradient(pr.x - Math.cos(ang2)*rr*6, pr.y - Math.sin(ang2)*rr*6, pr.x, pr.y);
      tg2.addColorStop(0, 'rgba(62,166,255,0)');
      tg2.addColorStop(1, 'rgba(200,238,255,0.75)');
      ctx.strokeStyle = tg2;
      ctx.lineWidth = rr*1.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(pr.x - Math.cos(ang2)*rr*6, pr.y - Math.sin(ang2)*rr*6);
      ctx.lineTo(pr.x, pr.y);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.beginPath(); ctx.arc(pr.x, pr.y, rr*0.55, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      return;
    }
    const isWater = pr.type === 'water';
    const g = ctx.createRadialGradient(pr.x, pr.y, 0, pr.x, pr.y, rr*2.6);
    if (isWater){
      g.addColorStop(0, 'rgba(225,248,255,0.95)');
      g.addColorStop(0.40, 'rgba(90,190,255,0.9)');
      g.addColorStop(1, 'rgba(20,110,220,0)');
    } else {
      g.addColorStop(0, 'rgba(255,240,200,0.95)');
      g.addColorStop(0.45, 'rgba(255,140,50,0.85)');
      g.addColorStop(1, 'rgba(255,60,10,0)');
    }
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(pr.x, pr.y, rr*2.6, 0, Math.PI*2); ctx.fill();

    if (isWater){
      // 水球：内核 + 高光
      ctx.fillStyle = 'rgba(235,252,255,0.9)';
      ctx.beginPath(); ctx.arc(pr.x, pr.y, rr*0.62, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.beginPath(); ctx.arc(pr.x - rr*0.30, pr.y - rr*0.34, rr*0.22, 0, Math.PI*2); ctx.fill();
    }

    // 拖尾
    const ang = Math.atan2(pr.vy, pr.vx);
    ctx.strokeStyle = isWater ? 'rgba(70,180,255,0.6)' : 'rgba(255,120,40,0.55)';
    ctx.lineWidth = rr*1.2;
    ctx.beginPath();
    ctx.moveTo(pr.x, pr.y);
    ctx.lineTo(pr.x - Math.cos(ang)*rr*3.2, pr.y - Math.sin(ang)*rr*3.2);
    ctx.stroke();
  });

  // 感电弧光
  sparks.forEach(sp=>{
    const k = clamp(sp.t / sp.life, 0, 1);
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = '#d9b8ff';
    ctx.lineWidth = 2*S;
    ctx.beginPath();
    const segs = 5;
    for (let i=0; i<=segs; i++){
      const u = i/segs;
      const jx = (i === 0 || i === segs) ? 0 : rnd(-8,8)*S;
      const jy = (i === 0 || i === segs) ? 0 : rnd(-8,8)*S;
      const x = sp.x1 + (sp.x2-sp.x1)*u + jx;
      const y = sp.y1 + (sp.y2-sp.y1)*u + jy;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
}

function sparkBetween(a, b, R){
  sparks.push({
    x1: a.x, y1: a.y - R*0.25, x2: b.x, y2: b.y - R*0.25,
    t: 0, life: 0.22
  });
  if (sparks.length > 24) sparks.shift();
}

function drawFloats(){
  floats.forEach(f=>{
    const p = f.t / f.life;
    ctx.globalAlpha = clamp(1 - p, 0, 1);
    ctx.textAlign = 'center';
    font(f.small ? 11 : 15, 700);
    ctx.fillStyle = f.col;
    ctx.fillText(f.txt, f.x, f.y - p*26*S);
  });
  ctx.globalAlpha = 1;
}

function drawJoy(cx, cy, p, col){
  if (!p) return;
  ctx.beginPath(); ctx.arc(cx, cy, UI.jr, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(28,36,54,0.55)'; ctx.fill();
  ctx.strokeStyle = 'rgba(110,135,175,0.45)'; ctx.lineWidth = 1.5*S; ctx.stroke();
  ctx.strokeStyle = col+'44'; ctx.lineWidth = 1*S;
  ctx.beginPath();
  ctx.moveTo(cx, cy - UI.jr*0.7); ctx.lineTo(cx, cy + UI.jr*0.7);
  ctx.moveTo(cx - UI.jr*0.7, cy); ctx.lineTo(cx + UI.jr*0.7, cy);
  ctx.stroke();
  const kx = cx + (p.jx||0) * UI.jr * 0.62;
  const ky = cy + (p.jy||0) * UI.jr * 0.62;
  const g = ctx.createRadialGradient(kx, ky, 0, kx, ky, UI.jr*0.5);
  g.addColorStop(0, col); g.addColorStop(1, col+'00');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(kx, ky, UI.jr*0.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(15,20,32,0.9)';
  ctx.beginPath(); ctx.arc(kx, ky, UI.jr*0.3, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 2*S; ctx.stroke();
}

/* 格挡键：排在技能槽（含大招）正下方 */
function drawGuardBtn(p, x0col, now){
  const x = x0col, y = UI.guardY, w = UI.guardW, h = UI.guardH;
  const cdLeft = p ? Math.max(0, ((p.guardCdEnd || 0) - now) / 1000) : 0;
  const ready = !!p && !p.dead && cdLeft <= 0;
  const active = !!p && p.guardEnd > now;
  const el = active ? (now - p.guardStart) : -1;
  ctx.save();
  const r = Math.round(9*S);
  const bgG = ctx.createLinearGradient(x, y, x, y+h);
  if (ready)      { bgG.addColorStop(0,'rgba(84,196,255,0.22)'); bgG.addColorStop(1,'rgba(24,92,148,0.34)'); }
  else            { bgG.addColorStop(0,'rgba(60,72,96,0.18)');   bgG.addColorStop(1,'rgba(32,40,56,0.28)'); }
  ctx.fillStyle = bgG;
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath(); ctx.fill();
  ctx.lineWidth = 2*S;
  const bc = active ? 'rgba(190,240,255,0.95)' : (ready ? 'rgba(120,210,255,0.7)' : 'rgba(120,140,170,0.35)');
  ctx.strokeStyle = bc; ctx.stroke();

  // 完美格挡区间条：按下后的 100~200ms 高亮
  if (active){
    const pct1 = (GUARD.perfectFrom / GUARD.window), pct2 = (GUARD.perfectTo / GUARD.window);
    ctx.fillStyle = 'rgba(255,236,160,0.9)';
    ctx.fillRect(x + w*pct1 + 2*S, y + 2*S, Math.max(3*S, w*(pct2-pct1)), 3*S);
    const k = clamp(el / GUARD.window, 0, 1);
    ctx.fillStyle = 'rgba(180,240,255,0.55)';
    ctx.fillRect(x + 2*S, y + 2*S, Math.max(0, (w - 4*S) * k), 3*S);
  }
  if (p && p.guardPfEnd > now){
    ctx.strokeStyle = 'rgba(255,248,214,' + (0.85 * ((p.guardPfEnd - now)/700)) + ')';
    ctx.lineWidth = 4*S; ctx.stroke();
  }

  // 小盾图标
  const cx = x + Math.round(18*S), cy = y + h/2, sr = Math.min(h*0.34, 9*S);
  ctx.fillStyle = ready ? 'rgba(200,240,255,0.92)' : 'rgba(150,170,195,0.45)';
  ctx.beginPath();
  ctx.moveTo(cx, cy - sr);
  ctx.lineTo(cx + sr*0.78, cy - sr*0.5);
  ctx.lineTo(cx + sr*0.62, cy + sr*0.55);
  ctx.lineTo(cx, cy + sr);
  ctx.lineTo(cx - sr*0.62, cy + sr*0.55);
  ctx.lineTo(cx - sr*0.78, cy - sr*0.5);
  ctx.closePath(); ctx.fill();

  const label = cdLeft > 0 ? (Math.ceil(cdLeft*10)/10) + 's' : '格挡';
  ctx.fillStyle = ready ? 'rgba(226,246,255,0.96)' : 'rgba(168,182,204,0.6)';
  ctx.font = Math.round(15*S) + 'px system-ui, -apple-system, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(label, cx + Math.round(12*S), cy + 1*S);

  if (active){
    ctx.textAlign = 'right';
    ctx.font = Math.round(12*S) + 'px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = 'rgba(255,236,160,0.9)';
    ctx.fillText('完美', x + w - Math.round(8*S), cy + 1*S);
  }
  ctx.restore();
}

function drawSlots(p, x0, col, now){
  const gap = Math.round(8*S);
  for (let i=0; i<4; i++){
    const x = x0 + i*(UI.slotW+gap), y = UI.slotY, w = UI.slotW, h = UI.slotH;
    const atkDef = p ? ELEM[p.elem].atk : null;
    const hasAtk = !!atkDef;
    const isAtk = i === 0 && hasAtk;
    const skDef = p ? ELEM[p.elem].skill : null;
    const isSkill = i === 1 && !!skDef;
    const skCdLeft = isSkill ? Math.max(0, (p.skill1End - now) / 1000) : 0;
    const skReady = isSkill && skCdLeft <= 0;
    const cdLeft = isAtk ? Math.max(0, (p.atkEnd - now) / 1000) : 0;
    const ready = isAtk && cdLeft <= 0;
    // 皮肤联动：拥有冰系「粉晶流光」皮肤后，技能键的非黑色部分换成皮肤配色
    const skinSlot = !!(p && p.elem === 'ice' && iceSkinUnlocked);
    const slotCol  = skinSlot ? '#ffd0e6' : (p ? ELEM[p.elem].color : '#ff5b2b');
    const slotGlow = skinSlot ? '#ffb2d6' : (p ? ELEM[p.elem].glow : '#ffd9c0');
    const atkCol = slotCol;
    const isWater = p && p.elem === 'water';

    ctx.save();
    if (isAtk) ctx.setLineDash([]); else ctx.setLineDash([5*S, 4*S]);
    rrPath(x, y, w, h, 12*S);
    if (isSkill){
      ctx.fillStyle = skinSlot
        ? (skReady ? 'rgba(72,30,50,0.94)' : 'rgba(44,24,38,0.90)')
        : (skReady ? 'rgba(16,40,52,0.94)' : 'rgba(16,26,38,0.9)');
    } else if (isAtk){
      ctx.fillStyle = skinSlot
        ? (ready ? 'rgba(78,32,52,0.94)' : 'rgba(44,24,36,0.90)')
        : (isWater ? (ready ? 'rgba(14,42,66,0.94)' : 'rgba(18,30,44,0.9)')
                   : (ready ? 'rgba(74,32,14,0.92)' : 'rgba(36,26,22,0.9)'));
    } else {
      ctx.fillStyle = 'rgba(16,21,33,0.75)';
    }
    ctx.fill();
    if (isSkill){
      ctx.strokeStyle = skReady ? slotCol : 'rgba(110,140,175,0.6)';
      ctx.lineWidth = skReady ? 2*S : 1*S;
    } else {
      ctx.strokeStyle = isAtk ? (ready ? atkCol : (skinSlot ? 'rgba(190,150,175,0.7)' : (isWater ? 'rgba(90,140,175,0.7)' : 'rgba(150,110,90,0.7)'))) : 'rgba(110,130,170,0.45)';
      ctx.lineWidth = isAtk ? 2*S : 1*S;
    }
    ctx.stroke();
    ctx.restore();

    ctx.textAlign = 'center';
    if (isAtk){
      font(12); ctx.fillStyle = ready ? '#ffffff' : (skinSlot ? 'rgba(240,205,225,0.8)' : (isWater ? 'rgba(185,215,235,0.75)' : 'rgba(230,200,185,0.75)'));
      ctx.fillText(atkDef.name, x + w/2, y + h*0.48);
      font(9, 500); ctx.fillStyle = skinSlot ? 'rgba(255,190,220,0.9)' : (isWater ? 'rgba(140,205,255,0.85)' : 'rgba(255,170,120,0.85)');
      const gapTxt = (atkDef.kind === 'none')
        ? '待设计'
        : (atkDef.interval !== undefined ? '间隔 ' + atkDef.interval + 's' : '冷却 ' + atkDef.cd + 's');
      let subTxt = ready ? gapTxt : cdLeft.toFixed(1) + 's';
      if (atkDef.kind === 'charge'){
        subTxt = p && p.charging
          ? '蓄力 ' + p.chargeT.toFixed(1) + '/5s'
          : '长按蓄力 0~5s';
      }
      if (atkDef.kind === 'combo' || atkDef.kind === 'rockCombo'){
        const stageNow = atkDef.kind === 'rockCombo' ? p.rockStage : p.comboStage;
        const untilNow = atkDef.kind === 'rockCombo' ? p.rockUntil : p.comboUntil;
        const stageDot = stageNow > 0 && untilNow > now ? (' · ' + stageNow + '段') : '';
        subTxt = ready ? (gapTxt + stageDot) : subTxt;
      }
      ctx.fillText(subTxt, x + w/2, y + h*0.79);
      if (atkDef.kind === 'charge' && p && p.charging){
        const k = Math.min(1, p.chargeT / WIND_CHARGE_MAX);
        ctx.fillStyle = 'rgba(56,217,169,0.18)';
        rrPath(x+4*S, y+h-8*S, w-8*S, 4*S, 2*S); ctx.fill();
        ctx.fillStyle = 'rgba(120,255,205,0.85)';
        rrPath(x+4*S, y+h-8*S, (w-8*S)*k, 4*S, 2*S); ctx.fill();
      }
    } else if (isSkill){
      font(12); ctx.fillStyle = skReady ? '#ffffff' : 'rgba(190,210,235,0.75)';
      ctx.fillText(skillLabel(p), x + w/2, y + h*0.48);
      font(9, 500); ctx.fillStyle = skReady ? slotGlow : 'rgba(150,170,200,0.75)';
      ctx.fillText(skReady ? ('CD ' + skDef.cd + 's') : (skCdLeft.toFixed(1) + 's'), x + w/2, y + h*0.79);
    } else {
      const isSecond = i === 2;
      const sk2Def = p ? ELEM[p.elem].skill2 : null;
      const isUltSlot = i === 3;
      const ultDef = p ? ELEM[p.elem].ult : null;
      if (isUltSlot && ultDef){
        const casting = p && p.ultActive;
        const cdU = p ? Math.max(0, (p.ultEnd - now) / 1000) : 0;
        const readyU = cdU <= 0 && !casting;
        const col = slotCol, glowC = slotGlow;
        ctx.save();
        rrPath(x, y, w, h, 12*S);
        ctx.fillStyle = skinSlot
          ? (casting ? 'rgba(78,32,52,0.96)' : (readyU ? 'rgba(70,28,48,0.94)' : 'rgba(44,24,38,0.90)'))
          : (casting ? 'rgba(28,44,60,0.96)' : (readyU ? 'rgba(18,36,50,0.94)' : 'rgba(18,22,32,0.9)'));
        ctx.fill();
        ctx.strokeStyle = casting ? glowC : (readyU ? col : (skinSlot ? 'rgba(190,150,175,0.6)' : 'rgba(100,120,150,0.6)'));
        ctx.lineWidth = (casting || readyU) ? 2*S : 1*S;
        ctx.stroke();
        ctx.restore();
        font(11.5); ctx.fillStyle = (casting || readyU) ? '#ffffff' : (skinSlot ? 'rgba(238,200,222,0.8)' : 'rgba(180,195,220,0.78)');
        ctx.fillText(ultDef.name, x + w/2, y + h*0.48);
        font(8.5, 500); ctx.fillStyle = skinSlot ? (readyU || casting ? glowC : 'rgba(235,175,205,0.8)') : (casting ? glowC : (readyU ? glowC : 'rgba(150,168,196,0.75)'));
        let subU = 'CD ' + ultDef.cd + 's';
        if (casting) subU = '引导 ' + (Math.max(0, ultDurOf(ultDef) - (now - p.ultStart))/1000).toFixed(1) + 's';
        else if (!readyU) subU = cdU.toFixed(1) + 's';
        ctx.fillText(subU, x + w/2, y + h*0.79);
        if (casting){
          const kk = (now - p.ultStart) / ultDurOf(ultDef);
          ctx.fillStyle = skinSlot ? 'rgba(255,182,217,0.20)' : 'rgba(148,216,240,0.18)';
          rrPath(x+4*S, y+h-8*S, w-8*S, 4*S, 2*S); ctx.fill();
          ctx.fillStyle = glowC;
          rrPath(x+4*S, y+h-8*S, (w-8*S)*clamp(kk,0,1), 4*S, 2*S); ctx.fill();
        }
      } else if (isSecond && sk2Def){
        const active = p && p.iceGiantEnd > now;
        const cd2 = p ? Math.max(0, (p.skill2End - now) / 1000) : 0;
        const ready2 = cd2 <= 0 && !active;
        ctx.save();
        rrPath(x, y, w, h, 12*S);
        ctx.fillStyle = skinSlot
          ? (active ? 'rgba(86,34,56,0.95)' : (ready2 ? 'rgba(72,30,50,0.94)' : 'rgba(44,24,38,0.90)'))
          : (active ? 'rgba(24,62,84,0.95)' : (ready2 ? 'rgba(16,40,52,0.94)' : 'rgba(16,26,38,0.9)'));
        ctx.fill();
        ctx.strokeStyle = active ? '#fff0f7' : (ready2 ? slotCol : (skinSlot ? 'rgba(190,150,175,0.6)' : 'rgba(110,140,175,0.6)'));
        ctx.lineWidth = (active || ready2) ? 2*S : 1*S;
        ctx.stroke();
        ctx.restore();
        font(11.5); ctx.fillStyle = (active || ready2) ? '#ffffff' : (skinSlot ? 'rgba(238,200,222,0.8)' : 'rgba(190,210,235,0.75)');
        ctx.fillText(sk2Def.name, x + w/2, y + h*0.48);
        font(8.5, 500); ctx.fillStyle = skinSlot ? (active || ready2 ? slotGlow : 'rgba(235,175,205,0.8)') : (active ? '#d8fbff' : (ready2 ? ELEM[p.elem].glow : 'rgba(150,170,200,0.75)'));
        let sub2 = 'CD ' + sk2Def.cd + 's';
        if (active) sub2 = '巨剑 ' + ((p.iceGiantEnd - now)/1000).toFixed(1) + 's';
        else if (!ready2) sub2 = cd2.toFixed(1) + 's';
        ctx.fillText(sub2, x + w/2, y + h*0.79);
        if (active){
          const kk = (p.iceGiantEnd - now) / (sk2Def.dur*1000);
          ctx.fillStyle = skinSlot ? 'rgba(255,182,217,0.22)' : 'rgba(120,220,255,0.20)';
          rrPath(x+4*S, y+h-8*S, w-8*S, 4*S, 2*S); ctx.fill();
          ctx.fillStyle = skinSlot ? 'rgba(255,205,230,0.92)' : 'rgba(190,245,255,0.9)';
          rrPath(x+4*S, y+h-8*S, (w-8*S)*clamp(kk,0,1), 4*S, 2*S); ctx.fill();
        }
      } else {
        font(11, 500); ctx.fillStyle = isSecond ? 'rgba(170,190,220,0.78)' : 'rgba(150,168,198,0.62)';
        ctx.fillText('待定', x + w/2, y + h*0.48);
        font(8.5, 500); ctx.fillStyle = isSecond ? 'rgba(130,175,225,0.85)' : 'rgba(130,150,180,0.7)';
        ctx.fillText(i === 1 ? '一技能' : (i === 2 ? '二技能' : '大招'), x + w/2, y + h*0.78);
      }
    }
  }
}

/* ---------- 粉晶皮肤：整张地图的粉嫩配色 + bling 闪光 ---------- */
function drawIceSkinMap(now){
  const top = UI.top, bot = UI.bottom, hh = bot - top;
  ctx.save();
  // 底色：粉紫渐变覆盖地面
  const g = ctx.createLinearGradient(0, top, 0, bot);
  g.addColorStop(0, 'rgba(255,203,228,0.20)');
  g.addColorStop(0.45, 'rgba(255,188,218,0.17)');
  g.addColorStop(1, 'rgba(226,190,250,0.15)');
  ctx.fillStyle = g;
  ctx.fillRect(0, top, W, hh);
  // 中心柔光
  const rv = ctx.createRadialGradient(W*0.5, top + hh*0.5, hh*0.1, W*0.5, top + hh*0.5, W*0.75);
  rv.addColorStop(0, 'rgba(255,238,248,0.12)');
  rv.addColorStop(0.6, 'rgba(255,190,220,0.04)');
  rv.addColorStop(1, 'rgba(200,140,225,0.10)');
  ctx.fillStyle = rv;
  ctx.fillRect(0, top, W, hh);
  // 空气里的 bling 光点（确定性位置，缓慢闪烁）
  const t = now / 1000;
  for (let i = 0; i < 30; i++){
    const seed = i*97.3;
    const px = ((Math.sin(seed)*0.5 + 0.5) * W + Math.sin(t*0.35 + i)*18*S + W) % W;
    const py = top + ((Math.cos(seed*1.7)*0.5 + 0.5) * hh + Math.cos(t*0.42 + i*1.3)*14*S + hh) % hh;
    const tw = 0.35 + 0.65*Math.abs(Math.sin(t*1.6 + i*2.1));
    const rr = (1.2 + (i % 3)*0.9) * S;
    const sg = ctx.createRadialGradient(px, py, 0, px, py, rr*4);
    sg.addColorStop(0, 'rgba(255,255,255,' + (0.60*tw) + ')');
    sg.addColorStop(0.34, 'rgba(255,196,224,' + (0.38*tw) + ')');
    sg.addColorStop(1, 'rgba(255,150,210,0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(px, py, rr*4, 0, Math.PI*2); ctx.fill();
    // 小十字星芒
    ctx.strokeStyle = 'rgba(255,248,252,' + (0.38*tw) + ')';
    ctx.lineWidth = 1*S;
    ctx.beginPath();
    ctx.moveTo(px - rr*1.8, py); ctx.lineTo(px + rr*1.8, py);
    ctx.moveTo(px, py - rr*1.8); ctx.lineTo(px, py + rr*1.8);
    ctx.stroke();
  }
  // 边缘粉色柔光，弱化原本的冷色描边
  const vg = ctx.createLinearGradient(0, top, 0, bot);
  vg.addColorStop(0, 'rgba(255,170,210,0.22)');
  vg.addColorStop(0.18, 'rgba(255,170,210,0)');
  vg.addColorStop(0.82, 'rgba(255,170,210,0)');
  vg.addColorStop(1, 'rgba(255,170,210,0.22)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, top, W, hh);
  ctx.restore();
}

/* ---------- 粉晶皮肤：冰晶本体（粉嫩 + 发光 + bling 环绕） ---------- */
function vfxIceSkin(p, now, R){
  const t = now / 1000;
  ctx.save();
  // 粉色柔光包裹
  const glow = ctx.createRadialGradient(0, 0, R*0.3, 0, 0, R*1.9);
  glow.addColorStop(0, 'rgba(255,236,245,0.30)');
  glow.addColorStop(0.35, 'rgba(255,180,216,0.22)');
  glow.addColorStop(0.72, 'rgba(226,168,246,0.12)');
  glow.addColorStop(1, 'rgba(255,160,214,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(0, 0, R*1.9, 0, Math.PI*2); ctx.fill();
  // 晶面染粉：叠一层透光粉
  ctx.globalAlpha = 0.34;
  const body = ctx.createRadialGradient(-R*0.2, -R*0.3, R*0.05, 0, 0, R*1.0);
  body.addColorStop(0, 'rgba(255,246,251,0.90)');
  body.addColorStop(0.4, 'rgba(255,212,234,0.78)');
  body.addColorStop(1, 'rgba(255,168,212,0.62)');
  ctx.fillStyle = body;
  bodyPath(R, p.elem); ctx.fill();
  ctx.globalAlpha = 1;
  // 发光描边
  ctx.strokeStyle = 'rgba(255,222,240,0.72)';
  ctx.lineWidth = 2*S;
  bodyPath(R, p.elem); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,164,208,0.34)';
  ctx.lineWidth = 4*S;
  bodyPath(R, p.elem); ctx.stroke();
  // 环绕 bling 星芒（一圈 5 个，缓慢反向旋转）
  for (let i = 0; i < 5; i++){
    const a = -t*0.9 + i*(Math.PI*2/5);
    const rr = R*(1.15 + 0.10*Math.sin(t*2 + i));
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr*0.72 - R*0.12;
    const tw = 0.5 + 0.5*Math.abs(Math.sin(t*2.4 + i*1.7));
    const sg = ctx.createRadialGradient(px, py, 0, px, py, R*0.28);
    sg.addColorStop(0, 'rgba(255,252,254,' + (0.62*tw) + ')');
    sg.addColorStop(0.4, 'rgba(255,196,226,' + (0.42*tw) + ')');
    sg.addColorStop(1, 'rgba(255,140,205,0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(px, py, R*0.28, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,250,253,' + (0.45*tw) + ')';
    ctx.lineWidth = 1*S;
    ctx.beginPath();
    ctx.moveTo(px - R*0.16, py); ctx.lineTo(px + R*0.16, py);
    ctx.moveTo(px, py - R*0.16); ctx.lineTo(px, py + R*0.16);
    ctx.stroke();
  }
  // 脚下粉色光环
  ctx.save();
  ctx.translate(0, R*0.95); ctx.scale(1, 0.32);
  const ring = ctx.createRadialGradient(0, 0, R*0.6, 0, 0, R*1.7);
  ring.addColorStop(0, 'rgba(255,170,215,0.05)');
  ring.addColorStop(0.6, 'rgba(255,170,215,' + (0.18 + 0.08*Math.sin(t*2)) + ')');
  ring.addColorStop(1, 'rgba(255,150,210,0)');
  ctx.fillStyle = ring;
  ctx.beginPath(); ctx.arc(0, 0, R*1.7, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.restore();
}

function drawBattle(now){
  drawMap(now);
  if (iceSkinActive()) drawIceSkinMap(now);   // 粉晶皮肤：整张地图换成粉嫩配色

  const lg = ctx.createLinearGradient(0, UI.top, W*0.5, UI.top);
  lg.addColorStop(0, 'rgba(255,77,77,0.06)');
  lg.addColorStop(1, 'rgba(255,77,77,0)');
  ctx.fillStyle = lg; ctx.fillRect(0, UI.top, W/2, UI.bottom - UI.top);
  const rg = ctx.createLinearGradient(W, UI.top, W*0.5, UI.top);
  rg.addColorStop(0, 'rgba(77,166,255,0.06)');
  rg.addColorStop(1, 'rgba(77,166,255,0)');
  ctx.fillStyle = rg; ctx.fillRect(W/2, UI.top, W/2, UI.bottom - UI.top);

  // 霜极巨剑：全场泛淡蓝微光 + 地面缓动反光
  if (anyGiantActive(now)){
    ctx.fillStyle = 'rgba(120,215,255,0.13)';
    ctx.fillRect(0, UI.top, W, UI.bottom - UI.top);
    const span = UI.bottom - UI.top;
    const tt = now / 1000;
    for (let i=0; i<4; i++){
      const y = UI.top + (((i*0.27 + tt*0.05) % 1) * span);
      const lg2 = ctx.createLinearGradient(0, y - 20*S, 0, y + 20*S);
      lg2.addColorStop(0, 'rgba(210,248,255,0)');
      lg2.addColorStop(0.5, 'rgba(210,248,255,0.10)');
      lg2.addColorStop(1, 'rgba(210,248,255,0)');
      ctx.fillStyle = lg2;
      ctx.fillRect(0, y - 20*S, W, 40*S);
    }
  }

  drawFireWaterLow(now);  // 火地面火点 / 水潮道水纹
  drawRockSkillsLow(now);  // 岩：岩墙 / 落点岩缝 / 方形岩台
  drawSingularLow(now);    // 黑洞 / 中子星：视界区 / 折跃锚点 / 扇形辐照区
  drawWindLow(now);    // 风：长条风轨 / 风刃弹道拖尾
  drawDevourLow(now);  // 黑洞奇点边界：脚下暗环与扭曲弧线
  drawLeiLow(now);   // 涡层（焦痕/雾环/电弧/火花）必须压在菱形本体之下
  drawPrisonLow(now); // 大招法阵/环墙/雷柱/星核，同样压在菱形本体之下
  drawIceLow(now);    // 冰原低层：冰面/寒雾/冰棱/暴雪/冰花/冲击波
  drawLightSpectrumLow(now);   // 光：光谱菱形光栅
  drawDarkTrackLow(now);       // 暗：回溯影轨
  drawVortexLow(now); // 火/水二技能：焦痕/涡环/甩出粒子
  drawFieldLow(now);  // 火域/水域：地表/热浪雾/旋转火柱水墙/烬粒
  drawRockCols(now);
  drawLightGlows();
  allPlayers().forEach(pl => drawPlayer(pl, now));
  drawLeiHigh(now);
  drawPrisonHigh(now);
  drawIceHigh(now);
  drawFrostFx(now);   // 寒霜印记 / 凝霜冰壳 / 霜花 / 碎片
  drawLightSpectrumHigh(now);  // 光：分光节点 / 分光断层 / 光屑
  drawDarkTrackHigh(now);      // 暗：滑行节点 / 影链 / 熵冲击
  if (iceSkinActive()) drawIceSkinVeil(now);   // 粉晶皮肤：冰系技能与环绕冰块柔粉
  drawVortexHigh(now);
  drawFieldHigh(now); // 莲体绽放 / 闪光蒙版 / 全图暖冷色渐变
  drawMarkFx(now);    // 灼烧·潮湿层数 / 水膜 / 焦痕 / 焚爆冲击波
  drawLightAuraField(now);

  // 特效加重两倍：正常绘一层 + lighter 亮部再叠一层（同屏特效过多时跳过叠加，防掉帧）
  const fxLoad = bursts.length + fields.length + iceFx.length + projs.length;
  drawElementFx(now);
  if (fxLoad < 130){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.82;
    drawElementFx(now);
    ctx.restore();
  }
  drawFireWaterHigh(now); // 火：母火种/火舌/连片爆燃/蒙版 · 水：潮墙/水昙/碎片
  drawWindHigh(now);    // 风：巡行斩节点 / 贯通斩面 / 弹道路径扭曲
  drawRockSkillsHigh(now);  // 岩：岩锥 / 岩栓 / 断岩块 / 岩花 / 闪光蒙版
  drawSingularHigh(now);    // 黑洞 / 中子星：阱环 / 视界圈层 / 磁脉冲 / 磁轨 / 超耀
  drawDevourHigh(now);  // 吞噬瞬间的空间扭曲 / 吸入拉伸 / 白闪
  drawTopBodies(now);   // 黑洞 / 中子星本体置顶：任何元素的特效都不得盖在它们之上

  drawFloats();

  drawJoy(UI.jx1, UI.jy, p1, '#ff4d4d');
  drawJoy(W - UI.jx1, UI.jy, p2, '#4da6ff');

  drawSlots(p1, Math.round(18*S), '#ff4d4d', now);
  drawSlots(p2, W - Math.round(18*S) - (UI.slotW*4 + Math.round(8*S)*3), '#4da6ff', now);
  drawGuardBtn(p1, Math.round(18*S), now);
  drawGuardBtn(p2, W - Math.round(18*S) - UI.guardW, now);

  drawBlindOverlay(now);
  drawHUD();

  if (toastT > 0){
    ctx.globalAlpha = clamp(toastT, 0, 1);
    ctx.textAlign = 'center';
    font(12); ctx.fillStyle = '#8fb6ff';
    ctx.fillText(toastMsg, W/2, UI.bottom - Math.round(24*S));
    ctx.globalAlpha = 1;
  }
}

/* 元素特效统一绘制层（被 /2 倍加重逻辑复用） */
/* 致盲：被耀光结界照到的对手视野泛白受限 */
function drawBlindOverlay(now){
  let blind = 0;
  allPlayers().forEach(p=>{
    if (!p || p.dead) return;
    if (p.blindEnd > now) blind = Math.max(blind, clamp((p.blindEnd - now)/1100, 0, 1));
  });
  if (blind <= 0) return;
  const W = UI.W, H = UI.H;
  const a = (0.30 + 0.10*Math.sin(now/120)) * blind;
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,252,' + a + ')';
  ctx.fillRect(0, 0, W, H);
  // 中心过曝
  const cg = ctx.createRadialGradient(W*0.5, H*0.5, 0, W*0.5, H*0.5, Math.max(W,H)*0.6);
  cg.addColorStop(0, 'rgba(255,255,255,' + (0.35*blind) + ')');
  cg.addColorStop(0.55, 'rgba(255,255,250,' + (0.10*blind) + ')');
  cg.addColorStop(1, 'rgba(255,255,245,0)');
  ctx.fillStyle = cg;
  ctx.fillRect(0, 0, W, H);
  // 视野边缘压暗，模拟看不清四周
  const vg = ctx.createRadialGradient(W*0.5, H*0.5, Math.min(W,H)*0.28, W*0.5, H*0.5, Math.max(W,H)*0.72);
  vg.addColorStop(0, 'rgba(255,255,255,0)');
  vg.addColorStop(1, 'rgba(250,252,255,' + (0.55*blind) + ')');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

/* 光明元素·被动领域：金色光环 + 旋转光符 + 阴性目标身上的灼蚀金粒 */
function updateLightGlows(dt){
  lightGlows.forEach(g=>{ g.t += dt; });
  lightGlows = lightGlows.filter(g => g.t < g.life);
}

/* 光粒命中后的照亮区（短暂提亮一小片地面） */
function drawLightGlows(){
  lightGlows.forEach(g=>{
    const k = clamp(g.t / g.life, 0, 1);
    const rr = g.r * (0.55 + 0.45*k);
    const a = (1 - k) * 0.42;
    const rg = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, rr);
    rg.addColorStop(0, 'rgba(255,250,226,' + a + ')');
    rg.addColorStop(0.55, 'rgba(255,232,168,' + (a*0.55) + ')');
    rg.addColorStop(1, 'rgba(255,224,150,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(g.x, g.y, rr, 0, Math.PI*2); ctx.fill();
  });
}

function drawLightAuraField(now){
  const R = UI.R;
  allPlayers().forEach(lp=>{
    if (!lp || lp.dead || lp.elem !== 'light') return;
    const r = R * LIGHT_AURA.r;
    const pulse = 0.5 + 0.5*Math.sin(now/900);

    const g = ctx.createRadialGradient(lp.x, lp.y, r*0.35, lp.x, lp.y, r);
    g.addColorStop(0, 'rgba(255,244,200,0.03)');
    g.addColorStop(0.65, 'rgba(255,226,150,' + (0.10 + 0.06*pulse) + ')');
    g.addColorStop(1, 'rgba(255,208,110,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(lp.x, lp.y, r, 0, Math.PI*2); ctx.fill();

    ctx.strokeStyle = 'rgba(255,236,180,' + (0.40 + 0.28*pulse) + ')';
    ctx.lineWidth = 2*S;
    ctx.setLineDash([13*S, 11*S]);
    ctx.beginPath(); ctx.arc(lp.x, lp.y, r, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);

    // 旋转光符
    ctx.save();
    ctx.translate(lp.x, lp.y);
    ctx.rotate(now/2600);
    ctx.strokeStyle = 'rgba(255,238,190,0.28)';
    ctx.lineWidth = 1.4*S;
    for (let i=0; i<6; i++){
      ctx.rotate(Math.PI/3);
      ctx.beginPath();
      ctx.moveTo(r*0.55, 0); ctx.lineTo(r*0.92, 0);
      ctx.stroke();
    }
    ctx.restore();

    // 范围内阴性目标：被灼蚀的金色微粒
    allPlayers().forEach(q=>{
      if (!q || q === lp || q.dead) return;
      if (Math.hypot(q.x - lp.x, q.y - lp.y) > r) return;
      const y = yinOf(q, now);
      if (y <= 0) return;
      const n = Math.max(3, Math.round(3 + 5*y));
      for (let i=0; i<n; i++){
        const ph = ((now/620) + i*0.23) % 1;
        const a = i*2.4 + now/1500;
        const rr = R*1.15 * (1 - ph*0.72);
        const px = q.x + Math.cos(a)*rr;
        const py = q.y + Math.sin(a)*rr*0.8 - R*0.25*ph;
        ctx.fillStyle = 'rgba(255,238,178,' + (0.75*(1-ph)) + ')';
        ctx.beginPath(); ctx.arc(px, py, R*0.085, 0, Math.PI*2); ctx.fill();
      }
      // 光侵蚀描边
      ctx.strokeStyle = 'rgba(255,226,150,' + (0.30 + 0.25*y) + ')';
      ctx.lineWidth = 1.6*S;
      ctx.beginPath(); ctx.arc(q.x, q.y, R*(1.25 + 0.06*Math.sin(now/420)), 0, Math.PI*2); ctx.stroke();
    });
  });
}

function drawElementFx(now){
  drawChargeRings();
  drawWhips();
  drawIceFx(now);
  drawBursts();
  drawWindFx();
  drawFields(now);
  drawProjs();
}

/* 蓄力环：一圈随蓄力增长，满 5 秒变亮 */
function drawChargeRings(){
  const R = UI.R;
  allPlayers().forEach(p=>{
    if (!p || !p.charging) return;
    const k = clamp(p.chargeT / WIND_CHARGE_MAX, 0, 1);
    ctx.save();
    ctx.strokeStyle = 'rgba(56,217,169,' + (0.35 + k*0.45) + ')';
    ctx.lineWidth = (1.5 + k*2.5)*S;
    ctx.beginPath();
    ctx.arc(p.x, p.y, R*(0.9 + k*1.6), 0, Math.PI*2*k - Math.PI/2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(182,255,228,0.35)';
    ctx.lineWidth = 1*S;
    ctx.beginPath(); ctx.arc(p.x, p.y, R*2.4, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  });
}

/* 领域：静电立场 / 焚烬地脉 */
function drawFields(now){
  fields.forEach(f=>{
    if (f.kind === 'bhCollapse'){
      const k = clamp((f.end - now)/1000 / ((f.end - f.born)/1000), 0, 1);
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.scale(1, 0.34);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, f.r);
      g.addColorStop(0, 'rgba(0,0,0,0.92)');
      g.addColorStop(0.42, 'rgba(88,44,150,0.55)');
      g.addColorStop(0.78, 'rgba(150,100,255,0.28)');
      g.addColorStop(1, 'rgba(90,40,180,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, f.r, 0, Math.PI*2); ctx.fill();
      for (let i = 0; i < 10; i++){
        const a = now/400 + i*(Math.PI*2/10);
        ctx.strokeStyle = 'rgba(211,182,255,' + (0.35*k) + ')';
        ctx.lineWidth = 1.6*S;
        ctx.beginPath();
        ctx.arc(0, 0, f.r*(0.25 + 0.7*((i%4)/4)), a, a + 0.7);
        ctx.stroke();
      }
      ctx.restore();
      return;
    }
    if (f.kind === 'lightDomain'){
      const left = Math.max(0, (f.end - now) / 1000);
      const k = clamp(left / ((f.end - f.born)/1000), 0, 1);
      ctx.save();
      ctx.translate(f.x, f.y);

      // 扇形光域：径向渐变裁进扇形
      ctx.save();
      // 扇形基准朝「局部 -y」，+90° 旋转后即为施法者朝向（之前 -90° 会导致向后放置）
      ctx.rotate(f.ang + Math.PI/2);
      const rg = ctx.createRadialGradient(0, 0, f.r*0.08, 0, 0, f.r);
      rg.addColorStop(0, 'rgba(255,255,246,' + (0.55*k) + ')');
      rg.addColorStop(0.45, 'rgba(255,240,190,' + (0.34*k) + ')');
      rg.addColorStop(0.85, 'rgba(255,220,140,' + (0.16*k) + ')');
      rg.addColorStop(1, 'rgba(255,210,120,0)');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, f.r, -Math.PI/2 - f.half, -Math.PI/2 + f.half);
      ctx.closePath();
      ctx.fill();

      // 扇形边界
      ctx.strokeStyle = 'rgba(255,244,206,' + (0.55*k) + ')';
      ctx.lineWidth = 2*S;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, f.r, -Math.PI/2 - f.half, -Math.PI/2 + f.half);
      ctx.lineTo(0, 0);
      ctx.stroke();

      // 内部扫动的光束
      const sweep = ((now/240) % 1);
      for (let i=0; i<7; i++){
        const a = -f.half + (i/6)*f.half*2;
        const reach = f.r * (0.45 + 0.5*((sweep + i*0.13) % 1));
        ctx.strokeStyle = 'rgba(255,250,225,' + (0.22*k) + ')';
        ctx.lineWidth = (1 + 1.6*Math.abs(Math.sin(now/300 + i)))*S;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a - Math.PI/2)*reach, Math.sin(a - Math.PI/2)*reach);
        ctx.stroke();
      }
      ctx.restore();

      // 施法点亮核
      const core = ctx.createRadialGradient(0, 0, 0, 0, 0, f.r*0.22);
      core.addColorStop(0, 'rgba(255,255,255,' + (0.75*k) + ')');
      core.addColorStop(1, 'rgba(255,226,150,0)');
      ctx.fillStyle = core;
      ctx.beginPath(); ctx.arc(0, 0, f.r*0.22, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      return;
    }
    if (f.kind === 'lightPillar'){
      const R = UI.R;
      if (now < f.strikeAt){
        // 预警：地面光圈脉动 + 内圈旋转刻度 + 中心坠落光点
        const k = clamp((now - f.born) / Math.max(1, f.strikeAt - f.born), 0, 1);
        const pulse = 0.55 + 0.45 * Math.sin(now/90);
        ctx.save();
        ctx.strokeStyle = 'rgba(255,232,160,' + (0.45 + 0.4*k*pulse) + ')';
        ctx.lineWidth = (2 + 2*k)*S;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,246,214,' + (0.35*k) + ')';
        ctx.lineWidth = 1.4*S;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r*0.62, 0, Math.PI*2); ctx.stroke();
        for (let i=0; i<12; i++){
          const a = now/220 + i*Math.PI/6;
          const rr = f.r * (0.72 + 0.22*Math.sin(now/160 + i));
          ctx.strokeStyle = 'rgba(255,238,180,' + (0.4*k) + ')';
          ctx.lineWidth = 1.2*S;
          ctx.beginPath();
          ctx.moveTo(f.x + Math.cos(a)*rr, f.y + Math.sin(a)*rr);
          ctx.lineTo(f.x + Math.cos(a)*(rr + f.r*0.16), f.y + Math.sin(a)*(rr + f.r*0.16));
          ctx.stroke();
        }
        const falling = (now - f.born) % 160 / 160;
        ctx.fillStyle = 'rgba(255,255,246,' + (0.35 + 0.5*falling) + ')';
        ctx.beginPath(); ctx.arc(f.x, f.y - (UI.H*0.55) * (1 - falling), f.r*0.10, 0, Math.PI*2); ctx.fill();
        const cg = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
        cg.addColorStop(0, 'rgba(255,250,225,' + (0.28*k) + ')');
        cg.addColorStop(1, 'rgba(255,230,150,0)');
        ctx.fillStyle = cg;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
        ctx.restore();
        return;
      }
      // 光柱本体：从画面顶部垂落到落点
      const k = clamp((f.end - now) / Math.max(1, f.end - f.strikeAt), 0, 1);
      const w = f.r * 1.85;
      ctx.save();
      const bg = ctx.createLinearGradient(f.x - w, 0, f.x + w, 0);
      bg.addColorStop(0, 'rgba(255,214,120,0)');
      bg.addColorStop(0.22, 'rgba(255,236,170,' + (0.72*k) + ')');
      bg.addColorStop(0.5, 'rgba(255,255,250,' + (0.98*k) + ')');
      bg.addColorStop(0.78, 'rgba(255,236,170,' + (0.72*k) + ')');
      bg.addColorStop(1, 'rgba(255,214,120,0)');
      ctx.fillStyle = bg;
      ctx.fillRect(f.x - w, 0, w*2, f.y);
      // 内芯
      const ig = ctx.createLinearGradient(f.x - w*0.32, 0, f.x + w*0.32, 0);
      ig.addColorStop(0, 'rgba(255,255,255,' + (0.6*k) + ')');
      ig.addColorStop(0.5, 'rgba(255,255,255,' + (1*k) + ')');
      ig.addColorStop(1, 'rgba(255,255,255,' + (0.6*k) + ')');
      ctx.fillStyle = ig;
      ctx.fillRect(f.x - w*0.32, 0, w*0.64, f.y);
      // 落点亮斑 + 冲击环
      const gp = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r*2.2);
      gp.addColorStop(0, 'rgba(255,255,255,' + (1*k) + ')');
      gp.addColorStop(0.35, 'rgba(255,240,180,' + (0.75*k) + ')');
      gp.addColorStop(1, 'rgba(255,220,140,0)');
      ctx.fillStyle = gp;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r*2.2, 0, Math.PI*2); ctx.fill();
      const t = (now - f.strikeAt) / 320;
      if (t < 1){
        ctx.strokeStyle = 'rgba(255,250,225,' + (0.85*(1-t)) + ')';
        ctx.lineWidth = 3*S*(1-t) + 1;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r*(1 + t*3.4), 0, Math.PI*2); ctx.stroke();
      }
      // 上升的光粒
      for (let i=0; i<14; i++){
        const up = ((now/380 + i*0.09) % 1);
        const px = f.x + Math.sin(i*2.1 + now/300) * f.r*(0.4 + 0.5*(i%3)/3);
        const py = f.y - up * UI.H*0.5;
        ctx.fillStyle = 'rgba(255,250,220,' + (0.55*k*(1-up)) + ')';
        ctx.beginPath(); ctx.arc(px, py, f.r*0.055, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
      return;
    }
    if (f.kind === 'darkMist' || f.kind === 'darkBurn'){
      const isBurn = f.kind === 'darkBurn';
      ctx.save();
      const base = isBurn ? '255,110,60' : '60,26,110';
      const ga = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
      ga.addColorStop(0, 'rgba(' + base + ',' + (isBurn ? 0.55 : 0.5) + ')');
      ga.addColorStop(0.6, 'rgba(' + base + ',' + (isBurn ? 0.3 : 0.28) + ')');
      ga.addColorStop(1, 'rgba(' + base + ',0)');
      ctx.fillStyle = ga;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();

      if (isBurn){
        for (let i=0; i<10; i++){
          const a = now/1600 + i*1.7;
          const rr = f.r * (0.25 + 0.62*((i%5)/5));
          const ph = Math.sin(now/260 + i*1.3);
          ctx.fillStyle = 'rgba(255,' + Math.round(140 + 70*Math.abs(ph)) + ',80,' + (0.35 + 0.2*Math.abs(ph)) + ')';
          ctx.beginPath();
          ctx.ellipse(f.x + Math.cos(a)*rr, f.y + Math.sin(a)*rr*0.8 - ph*f.r*0.12,
                      f.r*0.13, f.r*0.24, 0, 0, Math.PI*2);
          ctx.fill();
        }
      } else {
        ctx.strokeStyle = 'rgba(150,110,240,0.34)';
        ctx.lineWidth = 1.6*S;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r*0.92, 0, Math.PI*2); ctx.stroke();
        for (let i=0; i<8; i++){
          const a = -now/1200 + i*Math.PI/4;
          const rr = f.r * (0.3 + 0.55*Math.sin(now/700 + i));
          ctx.fillStyle = 'rgba(140,100,240,0.28)';
          ctx.beginPath();
          ctx.arc(f.x + Math.cos(a)*rr, f.y + Math.sin(a)*rr*0.75, f.r*0.10, 0, Math.PI*2);
          ctx.fill();
        }
      }
      ctx.restore();
      return;
    }
    if (f.kind === 'elec'){
      const left = Math.max(0, (f.end - now) / 1000);
      ctx.save();
      ctx.translate(f.x, f.y);
      const a = 0.28 + 0.18*Math.sin(now/120);
      ctx.fillStyle = 'rgba(150,110,255,' + a*0.35 + ')';
      ctx.beginPath(); ctx.arc(0, 0, f.r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(210,180,255,' + (0.55 + 0.2*Math.sin(now/90)) + ')';
      ctx.lineWidth = 2*S;
      ctx.beginPath(); ctx.arc(0, 0, f.r, 0, Math.PI*2); ctx.stroke();
      ctx.strokeStyle = 'rgba(230,210,255,0.35)';
      ctx.lineWidth = 1.2*S;
      ctx.beginPath(); ctx.arc(0, 0, f.r*0.72, 0, Math.PI*2); ctx.stroke();
      // 电弧
      for (let i=0; i<8; i++){
        const ang = now/300 + i*Math.PI/4;
        const r1 = f.r*0.35, r2 = f.r*(0.95 + 0.05*Math.sin(now/70 + i));
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.beginPath();
        ctx.moveTo(Math.cos(ang)*r1, Math.sin(ang)*r1);
        ctx.lineTo(Math.cos(ang+0.1)*r2, Math.sin(ang+0.1)*r2);
        ctx.stroke();
      }
      ctx.restore();
    } else if (f.kind === 'water'){
      if (f.mode === 'ring'){
        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.fillStyle = 'rgba(110,200,255,0.10)';
        ctx.beginPath(); ctx.arc(0, 0, f.r, 0, Math.PI*2); ctx.fill();
        const sh = f.shield > 0 ? 0.85 : 0.45;
        ctx.strokeStyle = 'rgba(160,225,255,' + sh + ')';
        ctx.lineWidth = (f.shield > 0 ? 3 : 2)*S;
        ctx.beginPath(); ctx.arc(0, 0, f.r, 0, Math.PI*2); ctx.stroke();
        for (let i=0; i<3; i++){
          const a0 = now/380 + i*2.1;
          ctx.strokeStyle = 'rgba(200,240,255,0.45)';
          ctx.lineWidth = 1.6*S;
          ctx.beginPath(); ctx.arc(0, 0, f.r*(0.45 + i*0.18), a0, a0 + 1.5); ctx.stroke();
        }
        ctx.restore();
      } else {
        ctx.save();
        ctx.translate(f.x, f.y);
        const kw = clamp((now - f.born)/300, 0, 1);
        const g3 = ctx.createRadialGradient(0, 0, 0, 0, 0, f.r);
        g3.addColorStop(0, 'rgba(90,190,255,' + (0.30*kw) + ')');
        g3.addColorStop(0.7, 'rgba(60,150,235,' + (0.18*kw) + ')');
        g3.addColorStop(1, 'rgba(30,90,160,0)');
        ctx.fillStyle = g3;
        ctx.beginPath(); ctx.arc(0, 0, f.r, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = 'rgba(150,220,255,0.55)';
        ctx.lineWidth = 2*S;
        ctx.beginPath(); ctx.arc(0, 0, f.r*0.95, 0, Math.PI*2); ctx.stroke();
        for (let i=0; i<5; i++){
          const a0 = (now/250) * (i%2 ? -1 : 1) + i*1.26;
          ctx.strokeStyle = 'rgba(200,240,255,0.5)';
          ctx.lineWidth = 1.4*S;
          ctx.beginPath(); ctx.arc(0, 0, f.r*(0.25 + i*0.14), a0, a0 + 1.4); ctx.stroke();
        }
        ctx.restore();
      }
    } else if (f.kind === 'fire'){
      const k = clamp((now - f.born) / 400, 0, 1);
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
      const fi = 0.42 + 0.12*Math.sin(now/110);
      g.addColorStop(0, 'rgba(255,190,90,' + (fi*0.9*k) + ')');
      g.addColorStop(0.55, 'rgba(255,110,40,' + (fi*0.55*k) + ')');
      g.addColorStop(1, 'rgba(120,30,10,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,150,70,0.45)';
      ctx.lineWidth = 2*S;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r*0.94, 0, Math.PI*2); ctx.stroke();
      for (let i=0; i<7; i++){
        const ang = now/500 + i*0.9;
        const rr = f.r*(0.2 + 0.6*((i%3)/3));
        ctx.fillStyle = 'rgba(255,200,120,' + (0.25 + 0.15*Math.sin(now/90 + i)) + ')';
        ctx.beginPath(); ctx.arc(f.x + Math.cos(ang)*rr, f.y + Math.sin(ang)*rr*0.7, 3*S, 0, Math.PI*2); ctx.fill();
      }
    }
  });
}

/* 风·蓄力冲击波 */
function drawWindFx(){
  const R = UI.R;
  windFx.forEach(f=>{
    const k = f.t / f.dur;
    const a = 1 - k;
    ctx.save();
    ctx.translate(f.x, f.y);
    const rr = f.full ? Math.max(W, H)*0.55 : f.reach;
    ctx.strokeStyle = 'rgba(182,255,228,' + (0.55*a) + ')';
    ctx.lineWidth = (2 + 5*a)*S;
    ctx.beginPath();
    ctx.arc(0, 0, rr*(0.35 + 0.65*k), f.ang - f.arc, f.ang + f.arc);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(56,217,169,' + (0.35*a) + ')';
    ctx.beginPath();
    ctx.arc(0, 0, rr*(0.2 + 0.5*k), f.ang - f.arc*0.8, f.ang + f.arc*0.8);
    ctx.stroke();
    // 风线
    for (let i=0; i<6; i++){
      const aa = f.ang + (i/5 - 0.5) * f.arc * 1.6;
      ctx.strokeStyle = 'rgba(220,255,242,' + (0.28*a) + ')';
      ctx.lineWidth = 1.4*S;
      ctx.beginPath();
      ctx.moveTo(Math.cos(aa)*rr*0.25, Math.sin(aa)*rr*0.25);
      ctx.lineTo(Math.cos(aa)*rr*(0.55 + k*0.4), Math.sin(aa)*rr*(0.55 + k*0.4));
      ctx.stroke();
    }
    ctx.restore();
  });
}

/* ========================= 结算 ========================= */
function overBtns(){
  const bw = Math.min(W*0.24, 240*S), bh = Math.round(54*S);
  const gap = Math.round(14*S);
  const total = 2*bw + gap;
  const x0 = W/2 - total/2;
  const y = H*0.5 + Math.round(44*S);
  return [
    { id:'again', label:'再来一局', x:x0, y, w:bw, h:bh },
    { id:'reselect', label:'重新选元素', x:x0+bw+gap, y, w:bw, h:bh }
  ];
}
function drawOver(now){
  ctx.fillStyle = 'rgba(4,6,12,0.8)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  const winner = overWin === 1 ? p1 : (overWin === 2 ? p2 : p3);
  const winEl = winner ? ELEM[winner.elem] : null;
  font(13, 600); ctx.fillStyle = 'rgba(160,178,210,0.9)';
  ctx.fillText(mode === 'ffa' ? '三 人 混 战 结 束' : '对 决 结 束', W/2, H*0.5 - 76*S);
  font(30); ctx.fillStyle = winEl ? winEl.color : '#eaf1ff';
  ctx.fillText('P' + overWin + ' 获胜', W/2, H*0.5 - 34*S);
  if (winEl){
    font(12, 500); ctx.fillStyle = 'rgba(190,205,230,0.85)';
    ctx.fillText(winEl.kind + ' · ' + winEl.name + '元素', W/2, H*0.5 - 8*S);
  }
  font(10, 600); ctx.fillStyle = 'rgba(190,170,235,0.95)';
  ctx.fillText('三人混战胜场 ' + WINSTAT.data.ffa + ' / 200　·　累计 ' + WINSTAT.total() + ' 胜',
               W/2, H*0.5 + 18*S);
  overBtns().forEach(b=>{
    rrPath(b.x, b.y, b.w, b.h, b.h/2);
    ctx.fillStyle = 'rgba(38,48,70,0.95)'; ctx.fill();
    ctx.strokeStyle = 'rgba(110,140,185,0.7)'; ctx.lineWidth = 1.2*S; ctx.stroke();
    font(13); ctx.fillStyle = '#dfe8f8';
    ctx.fillText(b.label, b.x + b.w/2, b.y + b.h*0.62);
  });
}

/* ========================= 暂停 ========================= */
function pauseBtns(){
  const n = 5;
  const bw = Math.min(W*0.165, 190*S), bh = Math.round(56*S);
  const gap = Math.round(12*S);
  const total = n*bw + (n-1)*gap;
  const x0 = W/2 - total/2;
  const y = H/2 + Math.round(10*S);
  return [
    { id:'resume', label:'继续', x:x0+0*(bw+gap), y, w:bw, h:bh },
    { id:'restart', label:'重置位置', x:x0+1*(bw+gap), y, w:bw, h:bh },
    { id:'reselect', label:'重新选元素', x:x0+2*(bw+gap), y, w:bw, h:bh },
    { id:'home', label:'主菜单', x:x0+3*(bw+gap), y, w:bw, h:bh },
    { id:'flip', label: portrait ? (flipped ? '翻转：左握' : '翻转：右握') : '翻转屏幕', x:x0+4*(bw+gap), y, w:bw, h:bh }
  ];
}
function drawPause(){
  drawBattle(performance.now());
  ctx.fillStyle = 'rgba(4,6,12,0.82)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  font(22); ctx.fillStyle = '#eaf1ff';
  ctx.fillText('已暂停', W/2, H/2 - 40*S);
  font(11, 500); ctx.fillStyle = 'rgba(150,168,200,0.85)';
  ctx.fillText('音乐：' + (musicOn ? '开' : '关'), W/2, H/2 - 18*S);
  pauseBtns().forEach(b=>{
    rrPath(b.x, b.y, b.w, b.h, b.h/2);
    ctx.fillStyle = 'rgba(38,48,70,0.95)'; ctx.fill();
    ctx.strokeStyle = 'rgba(110,140,185,0.7)'; ctx.lineWidth = 1.2*S; ctx.stroke();
    font(12); ctx.fillStyle = '#dfe8f8';
    ctx.fillText(b.label, b.x + b.w/2, b.y + b.h*0.62);
  });
}

/* ========================= 输入 ========================= */
const pointers = new Map();
function getPt(e){
  const r = cvs.getBoundingClientRect();
  return toLogic(e.clientX - r.left, e.clientY - r.top);
}
cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  audioInit();
  const pt = getPt(e);
  pointers.set(e.pointerId, pt);
  handleDown(pt.x, pt.y, e.pointerId);
}, { passive:false });
cvs.addEventListener('pointermove', e => {
  e.preventDefault();
  if (!pointers.has(e.pointerId)) return;
  const pt = getPt(e);
  pointers.set(e.pointerId, pt);
  handleMove(pt.x, pt.y, e.pointerId);
}, { passive:false });
function upHandler(e){
  pointers.delete(e.pointerId);
  if (selDrag && selDrag.id === e.pointerId){
    if (selDrag.moved < 8 && selTap && selTap.id === e.pointerId) onSelectTap(selTap.x, selTap.y);
    selDrag = null; selTap = null;
    return;
  }
  if (scDrag && scDrag.id === e.pointerId){ scDrag = null; }
  allPlayers().forEach(pl=>{
    if (pl && pl.charging && pl.chargeId === e.pointerId){
      pl.chargeId = null;
      windChargeRelease(pl, performance.now());
    }
  });
  if (p1 && p1.joyId === e.pointerId){ p1.joyId = null; p1.jx = 0; p1.jy = 0; }
  if (p2 && p2.joyId === e.pointerId){ p2.joyId = null; p2.jx = 0; p2.jy = 0; }
}
cvs.addEventListener('pointerup', upHandler);
cvs.addEventListener('pointercancel', upHandler);
cvs.addEventListener('contextmenu', e => e.preventDefault());

function toast(msg){ toastMsg = msg; toastT = 1.4; }

function switchMap(){
  mapId = (mapId === 'ruins') ? 'arena' : 'ruins';
  const e3 = p3 ? p3.elem : null;
  startBattle(p1.elem, p2.elem, e3);
  toast(MAP.name === '试验场' ? '已切换：试验场（空场练手）' : '已切换：元素遗迹（石砖地面）');
  blip(560, 0.08, 0.16);
}

function handleMove(x, y, id){
  if (selDrag && selDrag.id === id){
    const L = selL || selectLayout();
    const dy = y - selDrag.y0;
    selDrag.moved = Math.max(selDrag.moved, Math.abs(dy), Math.abs(x - selTap.x));
    const mx = selDrag.side === 1 ? L.max1 : L.max2;
    const ns = clamp(selDrag.s0 - dy, 0, mx);
    if (selDrag.side === 1) selScroll1 = ns; else selScroll2 = ns;
    return;
  }
  if (scDrag && scDrag.id === id){
    noticeScroll = clamp(scDrag.s0 - (y - scDrag.y0) * 1.35, 0, noticeMaxScroll);
    return;
  }
  if (st !== ST.BATTLE && st !== ST.PAUSE) return;
  allPlayers().forEach(pl => {
    if (!pl || pl.joyId !== id) return;
    const cx = (pl.i === 1 ? UI.jx1 : W - UI.jx1);
    let vx = x - cx, vy = y - UI.jy;
    const len = Math.hypot(vx, vy);
    if (len > UI.jr){ vx = vx/len*UI.jr; vy = vy/len*UI.jr; }
    pl.jx = vx / UI.jr;
    pl.jy = vy / UI.jr;
  });
}
function handleDown(x, y, id){
  if (tutOpen){
    const card = tutRect();
    const b1 = { x: card.x + card.w - 96*S, y: card.y + card.h - 40*S, w: 82*S, h: 28*S };
    const b0 = { x: card.x + 14*S, y: card.y + card.h - 40*S, w: 60*S, h: 28*S };
    if (inRect(x, y, b1.x, b1.y, b1.w, b1.h)){
      if (tutPage < 1){ tutPage = 1; blip(700,0.05,0.1); }
      else closeTut();
      return;
    }
    if (tutPage > 0 && inRect(x, y, b0.x, b0.y, b0.w, b0.h)){ tutPage = 0; return; }
    return;
  }
  if (st === ST.INTRO){
    const b = introBtn();
    if (inRect(x, y, b.x, b.y, b.w, b.h)){
      blip(760,0.10,0.22); st = ST.HOME; return;
    }
    introGhostBtns().forEach(g=>{
      if (!inRect(x,y,g.x,g.y,g.w,g.h)) return;
      if (g.id === 'codex'){ codexFrom = ST.INTRO; codexIdx = 0; st = ST.CODEX; }
      else toast(g.label + '尚未开发');
    });
    return;
  }
  if (st === ST.CODEX){
    const L = codexLayout();
    for (const it of L.items){
      if (inRect(x, y, it.x, it.y, it.w, it.h)){ codexIdx = it.i; blip(700,0.04,0.08); return; }
    }
    if (inRect(x, y, L.back.x, L.back.y, L.back.w, L.back.h)){ st = codexFrom; blip(520,0.05,0.1); }
    return;
  }
  if (st === ST.SOLO){
    const L = soloLayout();
    for (const c of L.cards){
      if (inRect(x, y, c.x, c.y, c.w, c.h)){
        soloPick = c.key; blip(700,0.07,0.14); return;
      }
    }
    for (const d of L.diffs){
      if (inRect(x, y, d.x, d.y, d.w, d.h)){
        if (d.id === 'nightmare' && !soloNightmareUnlocked){
          soloHintMs = performance.now() + 2600;
          toast('噩梦未解锁：先通关困难难度');
          blip(380,0.06,0.12); return;
        }
        soloDiff = d.id; blip(660,0.06,0.12); return;
      }
    }
    const b = L.start;
    if (inRect(x, y, b.x, b.y, b.w, b.h)){
      if (!soloPick){ toast('请先选择元素'); return; }
      const pool = ALL_KEYS.filter(k=>k !== soloPick && !elemLocked(k));
      const ai = pool.length ? pool[Math.floor(Math.random()*pool.length)] : (soloPick === 'fire' ? 'ice' : 'fire');
      startBattle(soloPick, ai);
      const cfg = SOLO_DIFF[soloDiff] || SOLO_DIFF.normal;
      p2.ai = true; p2.aiCfg = cfg; p2.think = 0;
      blip(760,0.10,0.22);
      return;
    }
    const bk = L.back;
    if (inRect(x, y, bk.x, bk.y, bk.w, bk.h)){ st = ST.HOME; blip(520,0.06,0.12); }
    return;
  }
  if (st === ST.HOME){
    if (previewOpen){
      for (const b of previewBtns()){
        if (inRect(x, y, b.x, b.y, b.w, b.h)){
          if (b.id === 'prev'){ previewPage = Math.max(0, previewPage-1); blip(620,0.06,0.14); }
          else if (b.id === 'next'){ previewPage = Math.min(PREVIEW_CHAPTERS.length-1, previewPage+1); blip(700,0.06,0.14); }
          else if (b.id === 'close'){ previewOpen = false; blip(540,0.06,0.14); }
          return;
        }
      }
      return;
    }
    if (panelOpen){
      for (const b of settingsBtns()){
        if (inRect(x, y, b.x, b.y, b.w, b.h)){
          if (b.id === 'music'){
            musicOn = !musicOn;
            if (bgmGain) bgmGain.gain.value = musicOn ? 0.9 : 0;
          } else {
            panelOpen = false;
          }
          blip(600,0.07,0.14);
          return;
        }
      }
      const p = settingsRect();
      if (noticeRect && inRect(x, y, noticeRect.x, noticeRect.y, noticeRect.w, noticeRect.h)){
        scDrag = { id, y0: y, s0: noticeScroll, moved: 0 };
        return;
      }
      if (!inRect(x, y, p.x, p.y, p.w, p.h)) panelOpen = false;
      return;
    }
    const g = gearBtnPos();
    if (inCircle(x, y, g.x, g.y, g.r*1.6)){ panelOpen = true; blip(600,0.07,0.14); return; }
    for (const b of modeBtns()){
      if (inRect(x, y, b.x, b.y, b.w, b.h)){
        mode = b.id; sel = {p1:null,p2:null,p3:null};
        try { localStorage.setItem('ed_mode', mode); } catch(e){}
        blip(720, 0.08, 0.16);
        if (b.id === 'solo'){ soloPick = null; soloDiff = 'normal'; st = ST.SOLO; }
        return;
      }
    }
    const pb2 = previewBtnRect();
    if (inRect(x, y, pb2.x, pb2.y, pb2.w, pb2.h)){
      toast('预告入口暂未开放 · 下个大版本点亮'); blip(420,0.06,0.12); return;
    }
    const cb = codeBtnRect();
    if (inRect(x, y, cb.x, cb.y, cb.w, cb.h)){ blip(700,0.08,0.16); openCode(); return; }
    const xb = codexBtnRect();
    if (inRect(x, y, xb.x, xb.y, xb.w, xb.h)){ blip(700,0.07,0.14); codexFrom = ST.HOME; codexIdx = 0; st = ST.CODEX; return; }
    if (inCircle(x, y, W/2, homeBtnY(), homeBtnR())){
      blip(660,0.1,0.2);
      if (mode === 'solo'){ soloPick = null; soloDiff = 'normal'; st = ST.SOLO; }
      else { st = ST.SELECT; sel = {p1:null,p2:null,p3:null}; }
    }
    return;
  }
  if (st === ST.SELECT){
    const side = x < W/2 ? 1 : 2;
    selDrag = { id, y0:y, s0:(side === 1 ? selScroll1 : selScroll2), side, moved:0 };
    selTap = { id, x, y };
    return;
  }
  if (st === ST.OVER){
    for (const b of overBtns()){
      if (inRect(x, y, b.x, b.y, b.w, b.h)){
        if (b.id === 'again') resetBattle();
        else { st = mode === 'solo' ? ST.SOLO : ST.SELECT; sel = {p1:null,p2:null,p3:null}; selScroll1 = 0; selScroll2 = 0; }
        blip(600,0.07,0.14);
        return;
      }
    }
    return;
  }
  if (st === ST.PAUSE){
    for (const b of pauseBtns()){
      if (inRect(x, y, b.x, b.y, b.w, b.h)){
        if (b.id === 'resume') st = ST.BATTLE;
        else if (b.id === 'restart'){ resetBattle(); return; }
        else if (b.id === 'reselect'){ st = mode === 'solo' ? ST.SOLO : ST.SELECT; sel = {p1:null,p2:null,p3:null}; }
        else if (b.id === 'home'){ st = ST.HOME; panelOpen = false; sel = {p1:null,p2:null,p3:null}; }
        else if (b.id === 'flip'){ flipped = !flipped; syncCodeOrient(); }
        blip(600,0.07,0.14);
        return;
      }
    }
    return;
  }
  if (st !== ST.BATTLE) return;

  const bkr = bhKillRect();
  if (inRect(x, y, bkr.x, bkr.y, bkr.w, bkr.h)){ toggleBhKill(); return; }
  if (inRect(x, y, UI.mapX, UI.mapY, UI.mapW, UI.mapH)){ switchMap(); return; }
  if (inCircle(x, y, UI.musicX, UI.musicY, UI.btnR*1.25)){
    musicOn = !musicOn;
    if (bgmGain) bgmGain.gain.value = musicOn ? 0.9 : 0;
    return;
  }
  if (inCircle(x, y, UI.pauseX, UI.pauseY, UI.btnR*1.25)){ st = ST.PAUSE; return; }

  // 格挡键（大招下方）
  if (inRect(x, y, Math.round(18*S), UI.guardY, UI.guardW, UI.guardH)){
    if (p1 && !p1.dead && startGuard(p1, performance.now())) blip(700, 0.06, 0.12);
    return;
  }
  if (inRect(x, y, W - Math.round(18*S) - UI.guardW, UI.guardY, UI.guardW, UI.guardH)){
    if (p2 && !p2.dead && !p2.ai && startGuard(p2, performance.now())) blip(700, 0.06, 0.12);
    return;
  }

  const gap0 = Math.round(8*S);
  const slotW3b = UI.slotW*4 + gap0*3;
  const sidesB = [
    { p:p1, x0: Math.round(18*S) },
    { p:p2, x0: W - Math.round(18*S) - slotW3b }
  ];
  for (const s2 of sidesB){
    if (!s2.p) continue;
    if (s2.p.ai) continue;          // 单人模式：AI 的技能键不响应玩家点击
    if (!inRect(x, y, s2.x0, UI.slotY, slotW3b, UI.slotH)) continue;
    const idx2 = Math.floor((x - s2.x0) / (UI.slotW + gap0));
    if (idx2 === 0 && ELEM[s2.p.elem].atk){
      const atk = ELEM[s2.p.elem].atk;
      if (atk.kind === 'charge'){
        if (!s2.p.dead && windChargeStart(s2.p)) s2.p.chargeId = id;
      } else if (!s2.p.dead){
        fireShot(s2.p, performance.now());
      }
    } else if (idx2 === 1){
      if (ELEM[s2.p.elem].skill){
        if (useSkill(s2.p, performance.now())) blip(760, 0.08, 0.14);
      } else {
        toast('该元素一技能待设计');
        blip(320, 0.05, 0.12);
      }
    } else if (idx2 === 2){
      if (ELEM[s2.p.elem].skill2){
        if (useSkill2(s2.p, performance.now())) blip(700, 0.09, 0.16);
        else blip(320, 0.05, 0.12);
      } else {
        toast('该元素二技能待设计');
        blip(320, 0.05, 0.12);
      }
    } else {
      if (ELEM[s2.p.elem].ult){
        if (useUlt(s2.p, performance.now())) blip(700, 0.09, 0.16);
        else blip(320, 0.05, 0.12);
      } else {
        toast('大招待设计');
        blip(320, 0.05, 0.12);
      }
    }
    return;
  }

  if (p1.joyId === null && inCircle(x, y, UI.jx1, UI.jy, UI.jr*1.25)){
    p1.joyId = id; p1.jx = 0; p1.jy = 0; return;
  }
  if (!p2.ai && p2.joyId === null && inCircle(x, y, W - UI.jx1, UI.jy, UI.jr*1.25)){
    p2.joyId = id; p2.jx = 0; p2.jy = 0; return;
  }

}
function rollPick(side){
  // 均等概率：在「可选池」里均匀抽一个（P2 还要排除 P1 已选的元素）
  const exclude = side === 1 ? sel.p2 : sel.p1;
  const pool = ALL_KEYS.filter(k => k !== exclude && !elemLocked(k));
  if (!pool.length) return null;
  return pool[Math.floor(Math.random() * pool.length)];
}

function randomForSide(side){
  const k = rollPick(side);
  if (!k) return;
  if (side === 1) sel.p1 = k; else sel.p2 = k;
  toast((side === 1 ? 'P1' : 'P2') + ' 随机：' + ELEM[k].name + '元素');
  blip(700, 0.09, 0.18);
}

let skinTapAt = 0, skinTapKey = '';
function onSelectTap(x, y){
  const L = selL;
  if (!L) return;
  if (inRect(x, y, L.rand1.x, L.rand1.y, L.rand1.w, L.rand1.h)){ randomForSide(1); return; }
  if (inRect(x, y, L.rand2.x, L.rand2.y, L.rand2.w, L.rand2.h)){ randomForSide(2); return; }
  // 冰元素皮肤：双击卡片切换（先于选择逻辑判定，避免第一击选完后切到另一侧面板）
  for (const side of [1, 2]){
    const cs = side === 1 ? L.cards1 : L.cards2;
    const scr = side === 1 ? selScroll1 : selScroll2;
    for (const c of cs){
      if (c.key !== 'ice') continue;
      if (!inRect(x, y, c.x, c.y - scr, c.w, c.h)) continue;
      const nowT = performance.now();
      if (skinTapKey === 'ice' && nowT - skinTapAt < 420){ skinTapKey=''; skinTapAt=0; toggleIceSkin(); return; }
      skinTapKey = 'ice'; skinTapAt = nowT;
      break;
    }
  }
  const picking = !sel.p1 ? 1 : (!sel.p2 ? 2 : 0);
  if (picking){
    const cards = picking === 1 ? L.cards1 : L.cards2;
    const scr = picking === 1 ? selScroll1 : selScroll2;
    for (const c of cards){
      if (inRect(x, y, c.x, c.y - scr, c.w, c.h)){
        if (elemLocked(c.key)){
          toast(ELEM[c.key].name + '元素未解锁：三人混战胜场 ' + elemLockText(c.key));
          blip(200,0.06,0.14);
          return;
        }
        if (picking === 2 && c.key === sel.p1){ toast('不能和 P1 选同一个元素'); blip(240,0.06,0.15); return; }
        if (picking === 1) sel.p1 = c.key; else sel.p2 = c.key;
        blip(760, 0.09, 0.16);
        return;
      }
    }
  }
  if (sel.p1 && sel.p2 && inRect(x, y, L.start.x, L.start.y, L.start.w, L.start.h)){
    const e3 = mode === 'ffa' ? randomElem() : null;
    startBattle(sel.p1, sel.p2, e3);
    blip(560, 0.12, 0.3);
  }
}

/* ================= 雷·环雷崩涡 ================= */
/* 折线闪电：确定性抖动，避免每帧乱跳 */
function drawBolt(x1, y1, x2, y2, segs, jitter, seed, color, width, glow){
  const px = -(y2 - y1), py = (x2 - x1);
  const len = Math.hypot(px, py) || 1;
  const nr = (i)=>{
    const v = Math.sin(seed * 97.3 + i * 311.7) * 43758.5453;
    return (v - Math.floor(v)) - 0.5;
  };
  ctx.beginPath();
  for (let i = 0; i <= segs; i++){
    const k = i / segs;
    const nx = x1 + (x2 - x1) * k, ny = y1 + (y2 - y1) * k;
    const off = (i === 0 || i === segs) ? 0 : nr(i) * jitter;
    const cx = nx + (px / len) * off, cy = ny + (py / len) * off;
    if (i === 0) ctx.moveTo(cx, cy); else ctx.lineTo(cx, cy);
  }
  if (glow){ ctx.strokeStyle = glow; ctx.lineWidth = width * 3; ctx.stroke(); }
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
}

/* 阶段1~4 的低层：焦痕 / 雾环 / 电弧 / 火花（都在菱形本体之下） */
function drawLeiLow(now){
  const R = UI.R;
  leiStorms.forEach(s=>{
    const t = now - s.t0;
    if (t < 0 || t >= LEI_STORM.dur) return;
    const rad = leiRadius(s, t);
    const spin = -now/1000 * LEI_STORM.spin * Math.PI*2;
    const cyc = Math.floor(now / 16);           // 16ms 一档，控制抖动刷新
    ctx.save();

    /* ---------- 地面焦痕（最底层，360ms 后生成并淡出） ---------- */
    if (t >= LEI_STORM.p3){
      const fade = 1 - clamp((t - LEI_STORM.p3) / (LEI_STORM.dur - LEI_STORM.p3), 0, 1);
      ctx.save();
      ctx.translate(s.x, s.y + R*0.98);
      ctx.scale(1, 0.34);
      const rg0 = R * 2.3;
      const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, rg0);
      gg.addColorStop(0, 'rgba(34,17,68,' + (0.85 * fade) + ')');
      gg.addColorStop(0.6, 'rgba(34,17,68,' + (0.45 * fade) + ')');
      gg.addColorStop(1, 'rgba(34,17,68,0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(0, 0, rg0, 0, Math.PI*2); ctx.fill();
      // 简化菱形闪电纹路
      ctx.strokeStyle = 'rgba(200,170,255,' + (0.5 * fade) + ')';
      ctx.lineWidth = 1.6*S;
      ctx.beginPath();
      ctx.moveTo(0, -R*1.3); ctx.lineTo(R*0.8, 0); ctx.lineTo(0, R*1.3); ctx.lineTo(-R*0.8, 0); ctx.closePath();
      ctx.stroke();
      ctx.strokeStyle = 'rgba(160,120,255,' + (0.35 * fade) + ')';
      ctx.beginPath();
      ctx.moveTo(-R*0.6, -R*0.4); ctx.lineTo(R*0.3, 0); ctx.lineTo(-R*0.2, R*0.5);
      ctx.stroke();
      ctx.restore();
    }

    /* ---------- 阶段1：菱核充能 ---------- */
    if (t < LEI_STORM.p1){
      const k = clamp(t / LEI_STORM.p1, 0, 1);
      // 收缩光球（22px → 8px）
      const orb = (22 - 14 * k) * S;
      const og = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, orb * 2.6);
      og.addColorStop(0, 'rgba(255,255,255,' + (0.55 + 0.45*k) + ')');
      og.addColorStop(0.35, 'rgba(200,170,255,' + (0.5 + 0.3*k) + ')');
      og.addColorStop(1, 'rgba(54,136,255,0)');
      ctx.fillStyle = og;
      ctx.beginPath(); ctx.arc(s.x, s.y, orb * 2.6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,' + (0.75 + 0.25*k) + ')';
      ctx.beginPath(); ctx.arc(s.x, s.y, orb, 0, Math.PI*2); ctx.fill();

      // 四顶点预放电弧（10~14 根，6~14px，按 2~3 帧刷新）
      const vts = leiVertices(s.x, s.y, R);
      const seedBase = Math.floor(now / 40);
      vts.forEach((v, vi)=>{
        const n = 10 + (vi % 3);
        for (let i = 0; i < n; i++){
          const rr = ((seedBase * 7 + i * 13 + vi * 29) % 100) / 100;
          const rr2 = ((seedBase * 11 + i * 17 + vi * 31) % 100) / 100;
          const ang = (rr - 0.5) * 1.9 + (vi === 0 ? -Math.PI/2 : vi === 1 ? 0 : vi === 2 ? Math.PI/2 : Math.PI);
          const len = (6 + rr2 * 8) * S;
          const ex = v.x + Math.cos(ang) * len, ey = v.y + Math.sin(ang) * len;
          drawBolt(v.x, v.y, ex, ey, 3, 2.2*S, seedBase + i*3 + vi, 'rgba(200,170,255,0.9)', 1.2*S, 'rgba(54,136,255,0.35)');
        }
      });

      // 电离微尘：沿四条棱向外飘
      const edges = [[0,1],[1,2],[2,3],[3,0]];
      for (let i = 0; i < 35; i++){
        const ph = ((t / 900) + i * 0.029) % 1;
        const e = edges[i % 4];
        const a0 = vts[e[0]], a1 = vts[e[1]];
        const kk = ((i * 0.37) % 1);
        const bx = a0.x + (a1.x - a0.x) * kk, by = a0.y + (a1.y - a0.y) * kk;
        const nx = (bx - s.x), ny = (by - s.y);
        const nl = Math.hypot(nx, ny) || 1;
        const px = bx + (nx/nl) * ph * R*1.5;
        const py = by + (ny/nl) * ph * R*1.5 - ph*R*0.25;
        ctx.fillStyle = 'rgba(200,220,255,' + (0.55 * (1 - ph)) + ')';
        ctx.beginPath(); ctx.arc(px, py, (1 + (i%3)) * S * 0.6, 0, Math.PI*2); ctx.fill();
      }
    }

    /* ---------- 阶段2/3：三层涡环（雾 → 电弧），菱形本体稍后由 drawPlayer 压在上面 ---------- */
    if (t >= LEI_STORM.p1 && t < LEI_STORM.p3 + 40){
      // ① 电离雾环：厚度 24px，逆时针转，透明度 0.28
      if (rad > 8){
        const thick = LEI_STORM.thick * S;
        const fadeK = (t >= LEI_STORM.p3) ? (1 - clamp((t - LEI_STORM.p3)/40, 0, 1)) : 1;
        ctx.save();
        ctx.strokeStyle = 'rgba(200,170,255,' + (LEI_STORM.fogAlpha * fadeK) + ')';
        ctx.lineWidth = thick;
        ctx.beginPath(); ctx.arc(s.x, s.y, rad, 0, Math.PI*2); ctx.stroke();
        // 流动噪点
        for (let i = 0; i < 26; i++){
          const a = spin * 1.6 + i * (Math.PI*2/26) + Math.sin(now/500 + i)*0.06;
          const rr = rad + ((i % 3) - 1) * thick * 0.35;
          ctx.fillStyle = 'rgba(232,222,255,' + (0.10 + 0.10 * Math.abs(Math.sin(now/700 + i))) + ')';
          ctx.beginPath(); ctx.arc(s.x + Math.cos(a)*rr, s.y + Math.sin(a)*rr, (2 + (i%3))*S*0.7, 0, Math.PI*2); ctx.fill();
        }
        ctx.restore();
      }

      // ② 环形分形电弧：主环锯齿 + 半圈甩出的外伸分支
      if (rad > 10){
        const jit = (s.ice ? 4 : 8) * S;
        const arcsN = s.wet ? 34 : 26;
        for (let i = 0; i < arcsN; i++){
          const a0 = spin + i * (Math.PI*2/arcsN);
          const a1 = spin + (i+1) * (Math.PI*2/arcsN);
          const p0 = { x:s.x + Math.cos(a0)*rad, y:s.y + Math.sin(a0)*rad };
          const p1 = { x:s.x + Math.cos(a1)*rad, y:s.y + Math.sin(a1)*rad };
          drawBolt(p0.x, p0.y, p1.x, p1.y, 4, jit, cyc + i*5, 'rgba(54,136,255,0.95)', 4*S/2, 'rgba(54,136,255,0.30)');
        }
        // 外伸分支：每半圈 3~6 根（遇水翻倍）
        const branchN = (s.wet ? 10 : 5) * 2;
        for (let i = 0; i < branchN; i++){
          const phase = ((now/1000 * LEI_STORM.spin) % 1 + i / branchN) % 1;
          const a = spin * 1 + (i / branchN) * Math.PI*2;
          const bx = s.x + Math.cos(a) * rad, by = s.y + Math.sin(a) * rad;
          const len = (15 + ((i*13 + cyc) % 20)) * S;
          const ex = s.x + Math.cos(a) * (rad + len), ey = s.y + Math.sin(a) * (rad + len);
          drawBolt(bx, by, ex, ey, 3, 4*S, cyc + i*7 + 3, 'rgba(153,68,255,0.9)', 1.8*S, 'rgba(153,68,255,0.28)');
        }
      }

      // ③ 链式电弧：菱形顶点 → 敌人，离场延迟 4 帧断开
      const vts = leiVertices(s.x, s.y, R);
      enemiesOf(s.owner).forEach(q=>{
        if (q.dead) return;
        const inR = Math.hypot(q.x - s.x, q.y - s.y) <= rad + R*0.9;
        s.links = s.links || {};
        if (inR) s.links[q.i] = now + 4*16.7;
        const until = s.links[q.i] || 0;
        if (now > until) return;
        // 最近的顶点
        let best = vts[0], bd = 1e9;
        vts.forEach(v=>{ const d = Math.hypot(v.x - q.x, v.y - q.y); if (d < bd){ bd = d; best = v; } });
        drawBolt(best.x, best.y, q.x, q.y, 7, 9*S, cyc + q.i*11, 'rgba(54,136,255,0.95)', 3*S, 'rgba(200,170,255,0.35)');
        // 次级紫弧：贴敌轮廓 2~4 根
        const n2 = s.wet ? 4 : 3;
        for (let k = 0; k < n2; k++){
          const a = (k/n2) * Math.PI*2 + now/240;
          const ex = q.x + Math.cos(a) * R*1.1, ey = q.y + Math.sin(a) * R*1.1 * 0.8;
          drawBolt(q.x + Math.cos(a)*R*0.3, q.y + Math.sin(a)*R*0.3*0.8, ex, ey, 3, 3*S, cyc + k*5 + q.i, 'rgba(153,68,255,0.85)', 1.5*S, null);
        }
      });
    }

    /* ---------- 阶段3 高潮：主雷击 + 4 道对角放射 ---------- */
    if (t >= LEI_STORM.p3 && t < LEI_STORM.p3 + 150){
      const k = 1 - clamp((t - LEI_STORM.p3) / 150, 0, 1);
      const vts = leiVertices(s.x, s.y, R);
      // 主雷击：上顶点向上 120px
      const top = vts[0];
      drawBolt(top.x, top.y, top.x, top.y - 120*S, 8, (s.ice ? 8 : 18)*S, cyc + 101,
               'rgba(255,255,255,0.96)', (8*S) * (0.5 + 0.5*k), 'rgba(54,136,255,0.55)');
      // 4 道对角放射 70px
      for (let i = 0; i < 4; i++){
        const a = (i === 0 ? -Math.PI*0.25 : i === 1 ? Math.PI*0.25 : i === 2 ? Math.PI*0.75 : Math.PI*1.25);
        const v = vts[i];
        const ex = v.x + Math.cos(a) * 70 * S, ey = v.y + Math.sin(a) * 70 * S;
        drawBolt(v.x, v.y, ex, ey, 5, 8*S, cyc + i*13 + 77, 'rgba(220,236,255,0.95)', 3.2*S, 'rgba(54,136,255,0.45)');
        // 末端火花簇
        for (let kk = 0; kk < 6; kk++){
          const aa = a + (kk - 2.5) * 0.22;
          ctx.fillStyle = 'rgba(255,248,170,' + (0.8*k) + ')';
          ctx.beginPath(); ctx.arc(ex, ey, (2 + (kk%3))*S, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(ex + Math.cos(aa)*8*S, ey + Math.sin(aa)*8*S, 1.6*S, 0, Math.PI*2); ctx.fill();
        }
      }
      // 感电目标 → 顶点 ↔ 敌人 跳电 2 次（深紫）
      enemiesOf(s.owner).forEach((q, qi)=>{
        if (q.dead || !(q.elecEnd > now)) return;
        let best = vts[0], bd = 1e9;
        vts.forEach(v=>{ const d = Math.hypot(v.x - q.x, v.y - q.y); if (d < bd){ bd = d; best = v; } });
        for (let j = 0; j < 2; j++){
          drawBolt(best.x, best.y, q.x + (j?R*0.4:-R*0.4), q.y + (j?-R*0.3:R*0.3), 6, 12*S, cyc + 200 + qi*9 + j,
                   'rgba(150,60,255,1)', 3.4*S, 'rgba(200,120,255,0.5)');
        }
      });
    }

    /* ---------- 阶段4：细丝残留 ---------- */
    if (t >= LEI_STORM.p3 + 60){
      const k = clamp(1 - (t - (LEI_STORM.p3+60)) / (LEI_STORM.dur - (LEI_STORM.p3+60)), 0, 1);
      const vts = leiVertices(s.x, s.y, R);
      ctx.save();
      for (let i = 0; i < 4; i++){
        const v = vts[i], v2 = vts[(i+1)%4];
        const short = 0.25 + 0.35*k;
        const ex = v.x + (v2.x - v.x) * short, ey = v.y + (v2.y - v.y) * short;
        drawBolt(v.x, v.y, ex, ey, 3, 2.5*S, cyc + i*17 + 301, 'rgba(200,170,255,' + (0.65*k*k) + ')', 1.2*S, null);
      }
      // 上浮微尘
      for (let i = 0; i < 16; i++){
        const ph = ((now/1400) + i*0.06) % 1;
        const a = i * Math.PI/8;
        ctx.fillStyle = 'rgba(210,215,225,' + (0.35 * (1 - ph)) + ')';
        ctx.beginPath();
        ctx.arc(s.x + Math.cos(a)*R*0.9, s.y + Math.sin(a)*R*0.9 - ph*R*2.2, (1 + (i%3))*S*0.55, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }

    /* ---------- 火花 & 爆发粒子（在电弧之上、菱形之下） ---------- */
    s.sparks.forEach(sp=>{
      const a = 1 - sp.t / sp.life;
      ctx.fillStyle = 'rgba(255,248,170,' + (0.85 * a) + ')';
      ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r * (0.6 + 0.4*a), 0, Math.PI*2); ctx.fill();
    });
    s.parts.forEach(sp=>{
      const a = 1 - sp.t / sp.life;
      ctx.globalAlpha = 0.9 * a;
      ctx.fillStyle = sp.col;
      ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r * (0.5 + 0.5*a), 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    });

    /* ---------- 感电标记：脚下旋转淡紫环 ---------- */
    enemiesOf(s.owner).forEach(q=>{
      if (q.dead || !(q.elecEnd > now)) return;
      ctx.save();
      ctx.translate(q.x, q.y + R*0.92);
      ctx.scale(1, 0.4);
      ctx.strokeStyle = 'rgba(200,170,255,0.75)';
      ctx.lineWidth = 2*S;
      const rot = now/300;
      for (let i = 0; i < 3; i++){
        ctx.beginPath();
        ctx.arc(0, 0, R*1.15, rot + i*2.1, rot + i*2.1 + 1.1);
        ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(153,68,255,0.4)';
      ctx.beginPath(); ctx.arc(0, 0, R*1.35, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    });

    ctx.restore();
  });
}

/* 高层：菱形晶中心 bloom + 全局闪白（压在角色之上） */
function drawLeiHigh(now){
  const R = UI.R;
  leiStorms.forEach(s=>{
    const t = now - s.t0;
    if (t < 0 || t >= LEI_STORM.dur) return;
    ctx.save();
    // 16ms 脉冲 bloom
    const pulse = 0.5 + 0.5 * Math.sin(now / 16);
    let bloom = 0;
    if (t < LEI_STORM.p1) bloom = 0.25 + 0.55 * clamp(t / LEI_STORM.p1, 0, 1);
    else if (t < LEI_STORM.p3) bloom = 0.55 + 0.45 * pulse;
    else if (t < LEI_STORM.p3 + 140) bloom = 1.0;
    else bloom = Math.max(0, 1 - (t - (LEI_STORM.p3+140)) / (LEI_STORM.dur - (LEI_STORM.p3+140)));
    const br = R * (1.1 + 0.35 * bloom);
    const bg = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, br);
    bg.addColorStop(0, 'rgba(255,255,255,' + (0.35 + 0.45*bloom) + ')');
    bg.addColorStop(0.45, 'rgba(200,170,255,' + (0.25 * bloom) + ')');
    bg.addColorStop(1, 'rgba(54,136,255,0)');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(s.x, s.y, br, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // 全局闪白：360ms 起 6 帧
    const ft = t - LEI_STORM.p3;
    if (ft >= 0 && ft < 100){
      const a = LEI_STORM.flash * (1 - ft/100) * (s.ice ? 0.55 : 1);
      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  });
}

function leiEaseOut(k){ return 1 - Math.pow(1 - k, 2); }

/* ================= 雷·大招：天罚·紫雷星狱 ================= */
/* 总长 3400ms 四阶段；四个结算点满吃合计 27+12+18+3 = 60 */
const LEI_PRISON = {
  dur:3400,
  p1:400, p2:1600, p3:2200, p4:2800,
  dmg:[27, 12, 18, 3],
  rad:[5.2, 5.2, 3.6, 3.0],      // 各阶段判定半径（球）
  falloff:0.4,                   // 跑出外环的伤害衰减系数
  suppressMax:6, suppressSlow:0.08
};
let leiPrisons = [];

function ultBoostMs(p){
  const kind = (ELEM[p.elem] && ELEM[p.elem].ult && ELEM[p.elem].ult.kind) || '';
  if (kind === 'bhUlt')      return BH_ULT.dur;
  if (kind === 'nsUlt')      return NS_ULT.dur;
  if (kind === 'lightSpectrum') return LIGHT_ULT.dur;
  if (kind === 'darkTrack')  return DARK_ULT.dur;
  if (kind === 'windTrack')  return WIND_TRACK.dur;
  if (kind === 'rockPlate')  return ROCK_PLATE.dur;
  if (kind === 'wildFire')   return WILDFIRE.dur;
  if (kind === 'tideWave')   return TIDE.dur;
  if (kind === 'leiPrison')  return LEI_PRISON.dur;
  if (kind === 'iceField')   return ICE_FIELD.dur;
  if (kind === 'elemField')  return (ELEM[p.elem].ult.dur || 3600);
  return 3200;
}

function useUlt(p, now){
  const ok = useUltCore(p, now);
  if (ok){                              // 大招进行中：五倍伤害
    p.ultBoostEnd = now + ultBoostMs(p);
    pushFloat(p.x, p.y - UI.R*2.0, '大招 · 伤害 ×5', '#ffe8a8', true);
  }
  return ok;
}

function useUltCore(p, now){
  if (!p || p.dead) return false;
  const ult = ELEM[p.elem].ult;
  if (!ult) return false;
  if (now < (p.ultEnd || 0)) return false;
  if (p.ultActive) return false;

  if (ult.kind === 'bhUlt') return useBHUlt(p, now, ult);
  if (ult.kind === 'nsUlt') return useNSUlt(p, now, ult);
  if (ult.kind === 'lightSpectrum') return useLightUlt(p, now, ult);
  if (ult.kind === 'darkTrack') return useDarkUlt(p, now, ult);
  if (ult.kind === 'windTrack') return useWindTrack(p, now, ult);
  if (ult.kind === 'rockPlate') return useRockPlate(p, now, ult);
  if (ult.kind === 'wildFire') return useWildFire(p, now, ult);
  if (ult.kind === 'tideWave') return useTide(p, now, ult);

  if (ult.kind === 'elemField') return useElemField(p, now, ult);

  if (ult.kind === 'leiPrison'){
    p.ultActive = true;
    p.ultStart = now;
    p.ultEnd = now + ult.cd * 1000;
    p.ultDone = {};
    leiPrisons.push({ owner:p, x:p.x, y:p.y, t0:now, done:{} });
    pushFloat(p.x, p.y - UI.R*2.3, '天罚 · 紫雷星狱', '#dcb8ff', true);
    blip(160, 0.14, 0.42);
    return true;
  }

  if (ult.kind === 'iceField'){
    const R = UI.R;
    let wet = !!(p.wetEnd > now), thunder = false, fire = false;
    enemiesOf(p).forEach(q=>{
      if (q.dead) return;
      if (q.wetEnd > now) wet = true;
      if (q.elem === 'thunder' || q.elecEnd > now) thunder = true;
      if (q.elem === 'fire' || q.burnEnd > now) fire = true;
    });
    /* 冰锥落点：全图完全随机（不再限制在冰域内） */
    const impacts = [];
    const padX = R * 1.2;
    const bandTop = UI.top, bandBot = UI.bottom;
    const padY = Math.min(R * 1.2, (bandBot - bandTop) * 0.12);
    const yTop = bandTop + padY, yBot = bandBot - padY;
    for (let i = 0; i < ICE_FIELD.burstCount; i++){
      impacts.push({
        x: padX + Math.random() * Math.max(1, W - padX*2),
        y: yTop + Math.random() * Math.max(1, yBot - yTop)
      });
    }
    iceFields.push({ owner:p, x:p.x, y:p.y, t0:now, ticks:{}, burstDone:0,
                     waves:[], caps:[], shards:[], bursts:[], impacts,
                     wet, thunder, fire });
    p.ultActive = true;
    p.ultStart = now;
    p.ultEnd = now + ult.cd * 1000;
    // 元素反应：遇雷 → 当场小型冰爆 + 清空寒霜
    if (thunder){
      enemiesOf(p).forEach(q=>{
        if (q.dead) return;
        hitEnemy(p, q, now, { type:'ice', dmg:6 });
        frostClear(q, now);
      });
      bursts.push({ x:p.x, y:p.y, r:R, to:R*3.4, t:0, life:0.4, col:'#8fe4ff', ring:true });
      pushFloat(p.x, p.y - R*2.1, '雷 → 冰爆 · 寒霜清空', '#8fe4ff', true);
    }
    pushFloat(p.x, p.y - R*2.3, '永寂冰原', '#d6f7ff', true);
    blip(200, 0.14, 0.42);
    return true;
  }
  return false;
}

function updateLeiPrisons(now, dt){
  const R = UI.R;
  for (let i = leiPrisons.length - 1; i >= 0; i--){
    const s = leiPrisons[i];
    const p = s.owner;
    const t = now - s.t0;
    if (t >= LEI_PRISON.dur || !p || p.dead){
      if (p) p.ultActive = false;
      if (p) enemiesOf(p).forEach(q=>{ q.prisonStacks = 0; });
      leiPrisons.splice(i, 1);
      continue;
    }

    /* 引导期间自身全程不可移动 */
    p.jx = 0; p.jy = 0; p.knockX = 0; p.knockY = 0;

    /* 四个结算点：命中判定按距离，外环衰减 */
    const marks = [[LEI_PRISON.p1,0], [LEI_PRISON.p2,1], [LEI_PRISON.p3,2], [LEI_PRISON.p4,3]];
    for (const mk of marks){
      const at = mk[0], idx = mk[1];
      if (t < at || s.done[idx]) continue;
      s.done[idx] = 1;
      enemiesOf(p).forEach(q=>{
        const d = Math.hypot(q.x - s.x, q.y - s.y);
        const inside = d <= LEI_PRISON.rad[idx] * R;
        const mul = inside ? 1 : LEI_PRISON.falloff;
        hitEnemy(p, q, now, { type:'thunder', dmg: LEI_PRISON.dmg[idx] * mul });
        if (!inside) pushFloat(q.x, q.y - R*1.5, '外环 · 衰减', '#c8aaff', true);
      });
      bursts.push({ x:s.x, y:s.y, r:R*0.6, to:R*LEI_PRISON.rad[idx], t:0,
                    life: idx === 2 ? 0.5 : 0.38,
                    col: idx === 2 ? '#ff8ef0' : '#a765ff', ring:true });
      blip(idx === 2 ? 120 : 200, 0.12, 0.36);
    }

    /* 星狱压制：进入阶段后持续叠层（上限 6）并挂减速 */
    if (t >= LEI_PRISON.p1 && t < LEI_PRISON.p4){
      const n = Math.min(LEI_PRISON.suppressMax, Math.floor((t - LEI_PRISON.p1) / 350) + 1);
      enemiesOf(p).forEach(q=>{
        q.prisonStacks = Math.max(q.prisonStacks || 0, n);
        q.mildSlowEnd = Math.max(q.mildSlowEnd || 0, now + 260);
      });
    }
    if (t >= LEI_PRISON.p4){
      enemiesOf(p).forEach(q=>{ q.prisonStacks = 0; });
    }
  }
}

/* 低层：地面法阵 / 环墙 / 放射电弧（压在菱形本体之下） */
function drawPrisonLow(now){
  const R = UI.R;
  leiPrisons.forEach(s=>{
    const t = now - s.t0;
    if (t < 0 || t >= LEI_PRISON.dur) return;
    const cyc = Math.floor(now / 16);

    /* ---------- 地面法阵（全程存在，起手渐显、收尾渐隐） ---------- */
    const fadeIn = clamp(t / 400, 0, 1);
    const fadeOut = clamp(1 - (t - LEI_PRISON.p4) / (LEI_PRISON.dur - LEI_PRISON.p4), 0, 1);
    const a0 = Math.min(fadeIn, fadeOut);
    ctx.save();
    ctx.translate(s.x, s.y + R*0.95);
    ctx.scale(1, 0.36);
    const rg = R * LEI_PRISON.rad[0] * 1.02;
    const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, rg);
    gg.addColorStop(0, 'rgba(58,22,110,' + (0.72 * a0) + ')');
    gg.addColorStop(0.62, 'rgba(38,14,80,' + (0.42 * a0) + ')');
    gg.addColorStop(1, 'rgba(24,8,58,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(0, 0, rg, 0, Math.PI*2); ctx.fill();
    // 双层旋转法阵刻度
    const rot1 = now / 900, rot2 = -now / 1400;
    ctx.strokeStyle = 'rgba(200,170,255,' + (0.5 * a0) + ')';
    ctx.lineWidth = 1.8 * S;
    for (let ring = 0; ring < 2; ring++){
      const rr = R * (LEI_PRISON.rad[0] * (ring ? 0.72 : 0.98));
      ctx.beginPath(); ctx.arc(0, 0, rr, 0, Math.PI*2); ctx.stroke();
      const n = ring ? 6 : 12;
      for (let i = 0; i < n; i++){
        const a = (ring ? rot2 : rot1) + i * (Math.PI*2 / n);
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * rr * 0.94, Math.sin(a) * rr * 0.94);
        ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
        ctx.stroke();
      }
    }
    ctx.restore();

    /* ---------- 阶段0 蓄力 0~400：向内收束的光环 + 逆向汇聚电弧 ---------- */
    if (t < LEI_PRISON.p1){
      const k = clamp(t / LEI_PRISON.p1, 0, 1);
      for (let i = 0; i < 3; i++){
        const rr = R * (LEI_PRISON.rad[0] * (1 - k * 0.8) + i * 0.55);
        ctx.save();
        ctx.strokeStyle = 'rgba(200,170,255,' + (0.55 * k) + ')';
        ctx.lineWidth = 2.4 * S;
        ctx.beginPath(); ctx.arc(s.x, s.y, rr, 0, Math.PI*2); ctx.stroke();
        ctx.restore();
      }
      for (let i = 0; i < 8; i++){
        const a = i * (Math.PI*2/8) + now / 700;
        const rr0 = R * LEI_PRISON.rad[0] * 0.86;
        const bx = s.x + Math.cos(a) * rr0 * (1 - k*0.55);
        const by = s.y + Math.sin(a) * rr0 * (1 - k*0.55);
        drawBolt(bx, by, s.x, s.y, 4, 7*S, cyc + i*9, 'rgba(210,186,255,0.85)', 1.6*S, 'rgba(120,70,255,0.3)');
      }
      // 汇聚微尘
      for (let i = 0; i < 22; i++){
        const a = i * (Math.PI*2/22) + now/500;
        const ph = ((now/600) + i * 0.045) % 1;
        const rr = R * LEI_PRISON.rad[0] * (1 - ph);
        ctx.fillStyle = 'rgba(226,212,255,' + (0.7 * (1 - ph)) + ')';
        ctx.beginPath(); ctx.arc(s.x + Math.cos(a)*rr, s.y + Math.sin(a)*rr, (1.4 + (i%3)) * S * 0.6, 0, Math.PI*2); ctx.fill();
      }
    }

    /* ---------- 阶段1 环形雷压 400~1600：环墙 + 12 道对地雷柱 ---------- */
    if (t >= LEI_PRISON.p1 && t < LEI_PRISON.p2){
      const k = clamp((t - LEI_PRISON.p1) / 320, 0, 1);
      const rr = R * LEI_PRISON.rad[0] * (0.5 + 0.5 * leiEaseOut(k));
      const pulse = 0.5 + 0.5 * Math.sin(now / 220);
      // 环墙（贴在球面高度上）
      ctx.save();
      ctx.strokeStyle = 'rgba(167,101,255,' + (0.85 - 0.25 * pulse) + ')';
      ctx.lineWidth = 5 * S;
      ctx.beginPath(); ctx.arc(s.x, s.y, rr, 0, Math.PI*2); ctx.stroke();
      ctx.strokeStyle = 'rgba(220,200,255,' + (0.5 + 0.4 * pulse) + ')';
      ctx.lineWidth = 2 * S;
      ctx.beginPath(); ctx.arc(s.x, s.y, rr + 6 * S, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
      // 12 道雷柱：从环上向下劈到地面
      for (let i = 0; i < 12; i++){
        const a = i * (Math.PI*2/12) + now / 2600;
        const hx = s.x + Math.cos(a) * rr;
        const hy = s.y + Math.sin(a) * rr * 0.9;
        drawBolt(hx, hy - R*1.9, hx, hy + R*0.95, 6, 9*S, cyc + i*11,
                 'rgba(200,170,255,0.9)', 2.4*S, 'rgba(120,70,255,0.32)');
        // 落点火花
        const sp = ((now/180) + i*0.13) % 1;
        ctx.fillStyle = 'rgba(255,248,180,' + (0.85 * (1 - sp)) + ')';
        ctx.beginPath(); ctx.arc(hx, hy + R*0.95, (3 + 4 * (1 - sp)) * S, 0, Math.PI*2); ctx.fill();
      }
    }

    /* ---------- 阶段2 雷星过载 1600~2200：星核鼓胀 + 旋转切割电弧 ---------- */
    if (t >= LEI_PRISON.p2 && t < LEI_PRISON.p3){
      const k = (t - LEI_PRISON.p2) / (LEI_PRISON.p3 - LEI_PRISON.p2);
      const sr = R * (1.2 + 1.9 * k);
      ctx.save();
      const stg = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, sr);
      stg.addColorStop(0, 'rgba(255,255,255,' + (0.6 + 0.3*k) + ')');
      stg.addColorStop(0.32, 'rgba(200,170,255,' + (0.45 + 0.3*k) + ')');
      stg.addColorStop(0.72, 'rgba(120,60,240,' + (0.22 * k) + ')');
      stg.addColorStop(1, 'rgba(80,30,180,0)');
      ctx.fillStyle = stg;
      ctx.beginPath(); ctx.arc(s.x, s.y, sr, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      // 星芒：6 条绕轴旋转的直芒
      for (let i = 0; i < 6; i++){
        const a = now / 180 + i * (Math.PI/3);
        const len = sr * (0.95 + 0.12 * Math.sin(now/160 + i));
