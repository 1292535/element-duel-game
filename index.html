    if (wl.spikeDone && now - wl.born < ROCK_WALL.p2 + 420){
      ctx.strokeStyle = 'rgba(255,240,200,0.8)';
      ctx.lineWidth = 2*S;
      for (let i = 0; i < 3; i++){
        const yy = wl.y - wl.h/2 + wl.h*(i+0.5)/3;
        ctx.beginPath();
        ctx.moveTo(wl.x, yy); ctx.lineTo(wl.x + wl.dir*wl.w*0.42, yy - 6*S);
        ctx.stroke();
      }
    }
    ctx.restore();
  });

  // 裂岩突刺：地面岩缝
  rockSpikes.forEach(sp=>{
    ctx.save();
    const k = clamp((now - sp.born) / ROCK_SPIKE.p1, 0, 1);
    ctx.strokeStyle = 'rgba(80,66,50,' + (0.85*k) + ')';
    ctx.lineWidth = 1.6*S;
    for (let i = 0; i < 8; i++){
      const a = Math.PI*2*i/8;
      ctx.beginPath();
      ctx.moveTo(sp.x, sp.y);
      ctx.lineTo(sp.x + Math.cos(a)*R*(1.2 + 0.5*k), sp.y + Math.sin(a)*R*(0.8 + 0.4*k));
      ctx.stroke();
    }
    ctx.restore();
  });

  // 地台沉陆：方形岩台
  rockPlates.forEach(pl=>{
    const t = now - pl.t0;
    const side = ROCK_PLATE.side * S;
    const half = side/2;
    const a = t < ROCK_PLATE.p1 ? clamp(t/ROCK_PLATE.p1, 0, 1)
             : (t > ROCK_PLATE.p4 ? clamp(1 - (t - ROCK_PLATE.p4)/320, 0, 1) : 1);
    const sink = t >= ROCK_PLATE.p3 ? clamp((t - ROCK_PLATE.p3)/(ROCK_PLATE.p4 - ROCK_PLATE.p3), 0, 1) : 0;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(74,60,46,0.55)';
    ctx.fillRect(pl.x - half, pl.y - half, side, side);
    const g = ctx.createLinearGradient(pl.x, pl.y - half, pl.x, pl.y + half);
    g.addColorStop(0, '#B49F7E');
    g.addColorStop(1, '#7A684F');
    ctx.globalAlpha = a * (1 - 0.35*sink);
    ctx.fillStyle = g;
    ctx.fillRect(pl.x - half, pl.y - half + sink*side*0.35, side, side*(1 - 0.35*sink));
    // 岩层纹路
    ctx.globalAlpha = a * (0.35 + 0.5*sink);
    ctx.strokeStyle = 'rgba(74,60,46,0.8)';
    ctx.lineWidth = 1.2*S;
    for (let i = 1; i < 4; i++){
      ctx.beginPath();
      ctx.moveTo(pl.x - half, pl.y - half + side*i/4 + sink*side*0.35);
      ctx.lineTo(pl.x + half, pl.y - half + side*i/4 + sink*side*0.35);
      ctx.stroke();
    }
    ctx.restore();
  });
}

function drawRockSkillsHigh(now){
  const R = UI.R;
  // 岩锥
  rockSpikes.forEach(sp=>{
    const t = now - sp.born;
    for (let i = 0; i < ROCK_SPIKE.strikes.length; i++){
      const at = ROCK_SPIKE.strikes[i];
      if (t < at) continue;
      const k = clamp((t - at) / 160, 0, 1);
      const hgt = R * (1.5 + i*0.55) * k;
      const wid = R * (0.55 + i*0.12);
      ctx.save();
      const g = ctx.createLinearGradient(sp.x, sp.y - hgt, sp.x, sp.y);
      g.addColorStop(0, '#FFFFFF');
      g.addColorStop(0.35, '#A99674');
      g.addColorStop(1, '#584838');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(sp.x - wid, sp.y);
      ctx.lineTo(sp.x, sp.y - hgt);
      ctx.lineTo(sp.x + wid, sp.y);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(228,216,196,0.75)';
      ctx.lineWidth = 1.2*S; ctx.stroke();
      ctx.restore();
    }
  });

  // 岩台：岩锁节点 / 断岩块 / 落石 / 岩花 / 闪光
  rockPlates.forEach(pl=>{
    const t = now - pl.t0;
    const side = ROCK_PLATE.side * S;
    const half = side/2;
    // 岩栓（板面弹出）
    if (t >= ROCK_PLATE.p1 && t < ROCK_PLATE.p3){
      pl.nodes.forEach(nd=>{
        if (!nd.at || now - nd.at > 260) return;
        const k = clamp((now - nd.at)/220, 0, 1);
        const hh = R*1.1*k;
        ctx.fillStyle = 'rgba(122,104,79,0.95)';
        ctx.fillRect(nd.x - R*0.22, nd.y - hh, R*0.44, hh);
      });
    }
    // 断岩块预警 + 砸落
    if (t >= ROCK_PLATE.p3 && t < ROCK_PLATE.p4){
      const k = clamp((t - ROCK_PLATE.p3) / (ROCK_PLATE.p4 - ROCK_PLATE.p3), 0, 1);
      for (let i = 0; i < 6; i++){
        const px = pl.x + ((i%2) ? 1 : -1) * half * 0.55;
        const py = pl.y + ((i<3) ? -1 : 1) * half * 0.5;
        ctx.strokeStyle = 'rgba(201,184,150,0.7)';
        ctx.lineWidth = 1.4*S;
        ctx.strokeRect(px - side*0.12, py - side*0.12, side*0.24, side*0.24);
        ctx.fillStyle = 'rgba(122,104,79,0.9)';
        const yy = py - (1-k) * side * 0.9;
        ctx.beginPath();
        ctx.moveTo(px - side*0.11, yy);
        ctx.lineTo(px, yy - side*0.14);
        ctx.lineTo(px + side*0.11, yy);
        ctx.closePath(); ctx.fill();
      }
    }
    // 岩花 + 碎屑
    if (pl.collapse){
      const k = clamp((now - pl.flashAt) / 420, 0, 1);
      ctx.save();
      ctx.globalAlpha = 1 - k;
      for (let i = 0; i < 6; i++){
        const a = Math.PI*2*i/6 + 0.3;
        ctx.fillStyle = i%2 ? 'rgba(201,184,150,0.9)' : 'rgba(180,159,126,0.9)';
        ctx.beginPath();
        ctx.ellipse(pl.x + Math.cos(a)*side*0.22, pl.y + Math.sin(a)*side*0.18,
                    side*0.16, side*0.09, a, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
      pl.shards.forEach(s2=>{
        const a2 = 1 - s2.t/s2.life;
        ctx.fillStyle = 'rgba(226,215,194,' + (0.9*a2) + ')';
        ctx.beginPath(); ctx.arc(s2.x, s2.y, s2.r*a2, 0, Math.PI*2); ctx.fill();
      });
      if (now - pl.flashAt < 90){
        ctx.save();
        ctx.fillStyle = 'rgba(201,184,150,0.24)';
        ctx.fillRect(0, 0, W, H);
        ctx.restore();
      }
    }
  });
}

/* ================= 黑洞·虚空汲引 / 视界阱 / 虚空折跃 / 史瓦西沉渊 ================= */
const BH_WELL = { dur:570, p1:130, p2:370, r:62, tickGap:140, dmg:9, pull:2.4, cd:11 };
let bhWells = [];

const BH_RIFT = { dur:650, p1:160, p2:420, anchorLife:220, dmg:26, hitR:1.45, cd:11 };
let bhRifts = [];

const BH_ULT = { dur:3750, p1:450, p2:1900, p3:2480, p4:3150, maxR:172,
                 tickGap:215, tickDmg:11, burst:50, cd:42, name:'史瓦西沉渊' };
let bhUlts = [];

const NS_BEAM = { dur:560, p1:125, p2:365, width:54, tickGap:120, dmg:8, cd:11 };
let nsBeams = [];

const NS_TRACK = { dur:640, p1:150, p2:400, tickGap:130, dmg:8, side:132, cd:11 };
let nsTracks = [];

const NS_ULT = { dur:3680, p1:435, p2:1860, p3:2430, p4:3080, angle:110, r:180,
                 tickGap:180, tickDmg:9, burst:55, cd:42, name:'星核坍耀' };
let nsUlts = [];

function bhAimPoint(p, distBalls){
  const R = UI.R;
  const foes = enemiesOf(p).filter(q=>!q.dead);
  if (foes.length){
    let best = foes[0], bd = 1e9;
    foes.forEach(q=>{ const d = Math.hypot(q.x-p.x, q.y-p.y); if (d<bd){ bd=d; best=q; } });
    return { x:clamp(best.x, R, W-R), y:clamp(best.y, UI.top+R, UI.bottom-R), ang:Math.atan2(best.y-p.y, best.x-p.x) };
  }
  const dir = p.face > 0 ? 1 : -1;
  return { x:clamp(p.x + dir*R*distBalls, R, W-R), y:p.y, ang: dir>0 ? 0 : Math.PI };
}

/* 一技能：视界阱 */
function useBHWell(p, now, sk){
  const aim = bhAimPoint(p, 4.6);
  bhWells.push({ owner:p, x:aim.x, y:aim.y, t0:now, end:now + BH_WELL.dur,
                 next:now, done:{} });
  p.skill1End = now + (sk.cd || BH_WELL.cd) * 1000;
  p.swing = 0.2;
  pushFloat(p.x, p.y - UI.R*1.8, sk.name, '#c9a8ff', true);
  blip(150, 0.14, 0.32);
  return true;
}

function updateBHWells(now, dt){
  const R = UI.R;
  for (let i = bhWells.length - 1; i >= 0; i--){
    const wl = bhWells[i];
    if (now >= wl.end){ bhWells.splice(i,1); continue; }
    const t = now - wl.t0;
    if (t < BH_WELL.p1 || t > BH_WELL.p2) continue;
    const r = R * (BH_WELL.r / R) / 1;             // 62px 半径
    const rr = BH_WELL.r * S;
    enemiesOf(wl.owner).forEach(q=>{
      if (q.dead) return;
      const dx = wl.x - q.x, dy = wl.y - q.y;
      const d = Math.hypot(dx, dy);
      if (d > rr*1.9) return;
      // 拽向阱心（只拉拽，不锁技能）
      const pull = (BH_WELL.pull * S) * dt * (d > 2 ? 1 : 0);
      q.x += (dx/(d||1)) * pull; q.y += (dy/(d||1)) * pull;
      if (d <= rr){
        const key = 'q'+(q.i||0);
        if (!wl.done[key] || now - wl.done[key] >= BH_WELL.tickGap){
          wl.done[key] = now;
          hitEnemy(wl.owner, q, now, { type:'blackhole', dmg: BH_WELL.dmg });
          markAdd(q, now, 'collapse', 1);
        }
      }
    });
    // 敌方弹道被偏折
    if (typeof projs !== 'undefined'){
      projs.forEach(pr=>{
        if (!pr || pr.owner === wl.owner) return;
        const d = Math.hypot(pr.x - wl.x, pr.y - wl.y);
        if (d > rr*1.8) return;
        const a = Math.atan2(wl.y - pr.y, wl.x - pr.x);
        pr.vx = Math.cos(a) * Math.hypot(pr.vx, pr.vy) * 0.85;
        pr.vy = Math.sin(a) * Math.hypot(pr.vx, pr.vy) * 0.85;
        pr.x += (wl.x - pr.x) * 0.12; pr.y += (wl.y - pr.y) * 0.12;
      });
    }
  }
}

/* 二技能：虚空折跃 */
function useBHRift(p, now, sk2){
  const aim = bhAimPoint(p, 5.2);
  bhRifts.push({ owner:p, x0:p.x, y0:p.y, x1:aim.x, y1:aim.y, t0:now,
                 end:now + BH_RIFT.dur, done:{}, moved:false });
  p.skill2End = now + (sk2.cd || BH_RIFT.cd) * 1000;
  p.swing = 0.2;
  pushFloat(p.x, p.y - UI.R*1.8, sk2.name, '#b48cff', true);
  blip(240, 0.12, 0.28);
  return true;
}

function updateBHRifts(now, dt){
  const R = UI.R;
  for (let i = bhRifts.length - 1; i >= 0; i--){
    const rf = bhRifts[i];
    if (now >= rf.end){ bhRifts.splice(i,1); continue; }
    const t = now - rf.t0;
    if (!rf.moved && t >= BH_RIFT.p2){
      rf.moved = true;
      // 空间切割：沿连线判定
      const dx = rf.x1 - rf.x0, dy = rf.y1 - rf.y0;
      const len = Math.hypot(dx, dy) || 1;
      enemiesOf(rf.owner).forEach(q=>{
        if (q.dead) return;
        const u = clamp(((q.x-rf.x0)*dx + (q.y-rf.y0)*dy) / (len*len), 0, 1);
        const px = rf.x0 + dx*u, py = rf.y0 + dy*u;
        if (Math.hypot(q.x-px, q.y-py) > R*BH_RIFT.hitR) return;
        hitEnemy(rf.owner, q, now, { type:'blackhole', dmg: BH_RIFT.dmg });
        markAdd(q, now, 'collapse', 1);
        bursts.push({ x:q.x, y:q.y, r:R*0.3, to:R*1.4, t:0, life:0.3, col:'#8a5cff', ring:true });
      });
      rf.owner.x = rf.x1; rf.owner.y = rf.y1;
      rf.owner.hitFlash = Math.max(rf.owner.hitFlash||0, 0.12);
      blip(90, 0.18, 0.5);
    }
    // 起点锚点残余引力
    if (rf.moved && t < BH_RIFT.p2 + BH_RIFT.anchorLife){
      enemiesOf(rf.owner).forEach(q=>{
        if (q.dead) return;
        const dx = rf.x0 - q.x, dy = rf.y0 - q.y, d = Math.hypot(dx,dy);
        const rr = R*2.4;
        if (d > rr) return;
        q.x += (dx/(d||1)) * 34*S*dt; q.y += (dy/(d||1)) * 34*S*dt;
      });
    }
  }
}

/* 大招：史瓦西沉渊 */
function useBHUlt(p, now, ult){
  const aim = bhAimPoint(p, 3.8);
  bhUlts.push({ owner:p, x:aim.x, y:aim.y, t0:now, dur:BH_ULT.dur, last:{},
                burst:false, flashAt:0, shards:[], tick:now });
  p.ultEnd = now + (ult.cd || BH_ULT.cd) * 1000;
  p.ultActive = false;
  pushFloat(p.x, p.y - UI.R*2.2, BH_ULT.name, '#d3b6ff', true);
  blip(70, 0.20, 0.5);
  return true;
}

function bhUltRadius(bt, t){
  const R = UI.R;
  const maxR = BH_ULT.maxR * S;
  if (t < BH_ULT.p1) return 0;
  if (t < BH_ULT.p2) return maxR * ((t - BH_ULT.p1) / (BH_ULT.p2 - BH_ULT.p1));
  return maxR;
}

function updateBHUlts(now, dt){
  const R = UI.R;
  for (let i = bhUlts.length - 1; i >= 0; i--){
    const bu = bhUlts[i];
    const t = now - bu.t0;
    if (t >= bu.dur){ bhUlts.splice(i,1); continue; }
    const rad = bhUltRadius(bu.t0, t);
    const owner = bu.owner;
    // 持续结算
    if (t >= BH_ULT.p1 && t < BH_ULT.p3){
      enemiesOf(owner).forEach(q=>{
        if (q.dead) return;
        if (Math.hypot(q.x - bu.x, q.y - bu.y) > rad) return;
        q.collapseSrc = { x:bu.x, y:bu.y };      // 坍缩标记把目标绑向奇点
        q.collapseBoost = (q.irradStacks > 0) ? 2 : 1;
        q.collapseEnd = Math.max(q.collapseEnd || 0, now + 900);   // 视界内标记不衰减
        const key = 'q'+(q.i||0);
        if (!bu.last[key] || now - bu.last[key] >= BH_ULT.tickGap){
          bu.last[key] = now;
          hitEnemy(owner, q, now, { type:'blackhole', dmg: BH_ULT.tickDmg });
          markAdd(q, now, 'collapse', 1);
        }
      });
    }
    // 阶段4：光堕湮灭
    if (t >= BH_ULT.p4 && !bu.burst){
      bu.burst = true; bu.flashAt = now;
      enemiesOf(owner).forEach(q=>{
        if (q.dead) return;
        const d = Math.hypot(q.x - bu.x, q.y - bu.y) / Math.max(rad, 1);
        if (d > 1.25) return;
        const fall = clamp(1 - d*0.85, 0.15, 1);
        hitEnemy(owner, q, now, { type:'blackhole', dmg: BH_ULT.burst * fall });
      });
      for (let k = 0; k < 24; k++){
        const a = Math.random()*Math.PI*2;
        bu.shards.push({ x:bu.x, y:bu.y, vx:Math.cos(a)*rnd(60,190)*S, vy:Math.sin(a)*rnd(60,190)*S,
                         r:rnd(2,8)*S, t:0, life:0.8 });
      }
      blip(60, 0.22, 0.55);
    }
    bu.shards.forEach(s2=>{
      s2.t += dt;
      s2.x += s2.vx*dt; s2.y += s2.vy*dt;
      // 残余引力拖回奇点
      s2.vx += (bu.x - s2.x) * 2.2 * dt; s2.vy += (bu.y - s2.y) * 2.2 * dt;
      s2.vx *= 0.985; s2.vy *= 0.985;
    });
    bu.shards = bu.shards.filter(s2=> s2.t < s2.life);
  }
}

/* 辐照传导：相邻带辐照标记的敌人之间互相传导（受黑洞引力时暂停） */
let irradCondAt = 0;
function updateIrradConduction(now){
  if (now - irradCondAt < 350) return;
  irradCondAt = now;
  const list = allPlayers().filter(q=> q && !q.dead && q.irradStacks > 0 && now > (q.irradStopEnd || 0));
  if (list.length < 2) return;
  const R = UI.R;
  for (let a = 0; a < list.length; a++){
    for (let b = a+1; b < list.length; b++){
      const A = list[a], B = list[b];
      if (Math.hypot(A.x-B.x, A.y-B.y) > R*3.6) continue;      // 传导距离
      if (now < (A.irradLockEnd || 0) || now < (B.irradLockEnd || 0)) continue;
      if (A.irradStacks >= MARK.irrad.max || B.irradStacks >= MARK.irrad.max) continue;
      A.irradStacks = Math.min(MARK.irrad.max, A.irradStacks + 1);
      B.irradStacks = Math.min(MARK.irrad.max, B.irradStacks + 1);
      markFx.push({ x:(A.x+B.x)/2, y:(A.y+B.y)/2 - R*0.3, vx:0, vy:-10*S,
                    r:3*S, t:0, life:0.4, kind:'irrad' });
      if (A.irradStacks >= MARK.irrad.max) markProc(A, now, 'irrad');
      if (B.irradStacks >= MARK.irrad.max) markProc(B, now, 'irrad');
    }
  }
}

/* ================= 中子星·辐照淬核 / 脉冲耀斑 / 磁层锁轨 / 星核坍耀 ================= */
function useNSBeam(p, now, sk){
  const aim = bhAimPoint(p, 6.0);
  nsBeams.push({ owner:p, x:p.x, y:p.y, ang:aim.ang, t0:now, end:now + NS_BEAM.dur,
                 last:{}, done:{} });
  p.skill1End = now + (sk.cd || NS_BEAM.cd) * 1000;
  p.swing = 0.2;
  pushFloat(p.x, p.y - UI.R*1.8, sk.name, '#bfe8ff', true);
  blip(900, 0.10, 0.22);
  return true;
}

function updateNSBeams(now, dt){
  const R = UI.R;
  for (let i = nsBeams.length - 1; i >= 0; i--){
    const bm = nsBeams[i];
    if (now >= bm.end){ nsBeams.splice(i,1); continue; }
    const t = now - bm.t0;
    if (t < NS_BEAM.p1 || t > NS_BEAM.p2) continue;
    const reach = W + H;
    const hw = NS_BEAM.width * S / 2;
    enemiesOf(bm.owner).forEach(q=>{
      if (q.dead) return;
      const dx = q.x - bm.x, dy = q.y - bm.y;
      const proj = dx*Math.cos(bm.ang) + dy*Math.sin(bm.ang);
      if (proj < 0 || proj > reach) return;
      const perp = Math.abs(-dx*Math.sin(bm.ang) + dy*Math.cos(bm.ang));
      if (perp > hw + R*0.9) return;
      const key = 'q'+(q.i||0);
      if (!bm.done[key] || now - bm.done[key] >= NS_BEAM.tickGap){
        bm.done[key] = now;
        hitEnemy(bm.owner, q, now, { type:'neutron', dmg: NS_BEAM.dmg });
        markAdd(q, now, 'irrad', 1);
      }
    });
  }
}

function useNSTrack(p, now, sk2){
  const aim = bhAimPoint(p, 4.2);
  nsTracks.push({ owner:p, x:aim.x, y:aim.y, t0:now, end:now + NS_TRACK.dur,
                  done:{}, next:now });
  p.skill2End = now + (sk2.cd || NS_TRACK.cd) * 1000;
  p.swing = 0.2;
  pushFloat(p.x, p.y - UI.R*1.8, sk2.name, '#bfe8ff', true);
  blip(760, 0.10, 0.24);
  return true;
}

function updateNSTracks(now, dt){
  const R = UI.R;
  for (let i = nsTracks.length - 1; i >= 0; i--){
    const tk = nsTracks[i];
    if (now >= tk.end){ nsTracks.splice(i,1); continue; }
    const t = now - tk.t0;
    if (t < NS_TRACK.p1 || t > NS_TRACK.p2) continue;
    const rr = NS_TRACK.side * S;
    enemiesOf(tk.owner).forEach(q=>{
      if (q.dead) return;
      if (Math.hypot(q.x - tk.x, q.y - tk.y) > rr*0.78) return;
      q.mildSlowEnd = Math.max(q.mildSlowEnd || 0, now + 220);        // 磁场内减速
      const key = 'q'+(q.i||0);
      if (!tk.done[key] || now - tk.done[key] >= NS_TRACK.tickGap){
        tk.done[key] = now;
        hitEnemy(tk.owner, q, now, { type:'neutron', dmg: NS_TRACK.dmg });
        markAdd(q, now, 'irrad', 1);
      }
    });
  }
}

function useNSUlt(p, now, ult){
  const aim = bhAimPoint(p, 4.0);
  nsUlts.push({ owner:p, x:p.x, y:p.y, ang:aim.ang, t0:now, dur:NS_ULT.dur,
                last:{}, next:now, burst:false, flashAt:0, shards:[] });
  p.ultEnd = now + (ult.cd || NS_ULT.cd) * 1000;
  p.ultActive = false;
  pushFloat(p.x, p.y - UI.R*2.2, NS_ULT.name, '#d8e6ff', true);
  blip(880, 0.18, 0.42);
  return true;
}

function nsInFan(ux, uy, ang, x, y){
  const dx = x - ux, dy = y - uy;
  const d = Math.hypot(dx, dy);
  if (d > NS_ULT.r * S * 1.15) return 0;
  const a = Math.atan2(dy, dx);
  let diff = Math.abs(((a - ang + Math.PI*3) % (Math.PI*2)) - Math.PI);
  if (diff > NS_ULT.angle*Math.PI/360) return 0;
  return d;
}

function updateNSUlts(now, dt){
  const R = UI.R;
  for (let i = nsUlts.length - 1; i >= 0; i--){
    const nu = nsUlts[i];
    const t = now - nu.t0;
    if (t >= nu.dur){ nsUlts.splice(i,1); continue; }
    const owner = nu.owner;
    if (t >= NS_ULT.p1 && t < NS_ULT.p3){
      enemiesOf(owner).forEach(q=>{
        if (q.dead) return;
        const d = nsInFan(nu.x, nu.y, nu.ang, q.x, q.y);
        if (!d) return;
        q.irradEnd = Math.max(q.irradEnd || 0, now + 900);
        const key = 'q'+(q.i||0);
        if (!nu.last[key] || now - nu.last[key] >= NS_ULT.tickGap){
          nu.last[key] = now;
          hitEnemy(owner, q, now, { type:'neutron', dmg: NS_ULT.tickDmg });
          markAdd(q, now, 'irrad', 1);
        }
      });
    }
    if (t >= NS_ULT.p4 && !nu.burst){
      nu.burst = true; nu.flashAt = now;
      enemiesOf(owner).forEach(q=>{
        if (q.dead) return;
        const d = nsInFan(nu.x, nu.y, nu.ang, q.x, q.y);
        if (!d) return;
        const fall = clamp(1 - 0.62*(d/(NS_ULT.r*S)), 0.2, 1);   // 靠星核最高，远端衰减
        hitEnemy(owner, q, now, { type:'neutron', dmg: NS_ULT.burst * fall });
      });
      for (let k = 0; k < 26; k++){
        const a = nu.ang + rnd(-0.75, 0.75);
        nu.shards.push({ x:nu.x, y:nu.y, ang:a, sp:rnd(230,540)*S, r:rnd(2,8)*S, t:0, life:0.75 });
      }
      blip(980, 0.18, 0.5);
    }
    nu.shards.forEach(s2=>{
      s2.t += dt;
      s2.x = (s2.x || nu.x) + Math.cos(s2.ang)*s2.sp*dt;
      s2.y = (s2.y || nu.y) + Math.sin(s2.ang)*s2.sp*dt;
    });
    nu.shards = nu.shards.filter(s2=> s2.t < s2.life);
  }
}

/* ---------- 黑洞 / 中子星：特效绘制 ---------- */
function drawSingularLow(now){
  const R = UI.R;
  // 黑洞·引力阱
  bhWells.forEach(wl=>{
    const t = now - wl.t0;
    const rr = BH_WELL.r * S;
    const a = t < BH_WELL.p1 ? t/BH_WELL.p1 : clamp(1 - (t - BH_WELL.p2)/(BH_WELL.dur - BH_WELL.p2), 0, 1);
    ctx.save();
    ctx.globalAlpha = 0.85 * a;
    ctx.translate(wl.x, wl.y);
    ctx.scale(1, 0.52);
    const g = ctx.createRadialGradient(0,0,0,0,0,rr*1.15);
    g.addColorStop(0, 'rgba(3,0,8,0.95)');
    g.addColorStop(0.55, 'rgba(27,5,48,0.85)');
    g.addColorStop(1, 'rgba(61,16,94,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,rr*1.15,0,Math.PI*2); ctx.fill();
    for (let i = 0; i < 3; i++){
      ctx.strokeStyle = 'rgba(61,16,94,0.8)';
      ctx.lineWidth = 1.6*S;
      ctx.beginPath(); ctx.arc(0,0, rr*(0.4 + i*0.28)*(1 + 0.08*Math.sin(now/160 + i)), 0, Math.PI*2); ctx.stroke();
    }
    ctx.restore();
  });

  // 黑洞·折跃路径与锚点
  bhRifts.forEach(rf=>{
    ctx.save();
    ctx.strokeStyle = 'rgba(36,7,64,0.9)';
    ctx.lineWidth = 3*S;
    ctx.beginPath(); ctx.moveTo(rf.x0, rf.y0);
    ctx.lineTo(rf.x0 + (rf.x1-rf.x0)*0.5, rf.y0 + (rf.y1-rf.y0)*0.5 - 8*S);
    ctx.lineTo(rf.x1, rf.y1); ctx.stroke();
    ctx.fillStyle = 'rgba(10,0,20,0.9)';
    ctx.beginPath(); ctx.arc(rf.x0, rf.y0, R*0.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(rf.x1, rf.y1, R*0.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  });

  // 黑洞·视界区域（暗紫偏移 + 虚空纹路）
  bhUlts.forEach(bu=>{
    const t = now - bu.t0;
    const rad = bhUltRadius(bu.t0, t);
    if (rad <= 1) return;
    const out = clamp(1 - (t - BH_ULT.p4)/260, 0, 1);
    ctx.save();
    ctx.globalAlpha = out;
    const g = ctx.createRadialGradient(bu.x, bu.y, 0, bu.x, bu.y, rad);
    g.addColorStop(0, 'rgba(2,0,6,0.96)');
    g.addColorStop(0.35, 'rgba(33,6,56,0.72)');
    g.addColorStop(0.78, 'rgba(82,26,120,0.34)');
    g.addColorStop(1, 'rgba(2,0,4,0.06)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(bu.x, bu.y, rad, 0, Math.PI*2); ctx.fill();
    // 虚空纹路
    ctx.strokeStyle = 'rgba(2,0,4,0.85)';
    ctx.lineWidth = 1.2*S;
    for (let i = 0; i < 10; i++){
      const a0 = i*Math.PI/5 + now/2400;
      ctx.beginPath();
      ctx.moveTo(bu.x + Math.cos(a0)*rad*0.2, bu.y + Math.sin(a0)*rad*0.2);
      ctx.lineTo(bu.x + Math.cos(a0+0.5)*rad*0.62, bu.y + Math.sin(a0+0.5)*rad*0.62);
      ctx.lineTo(bu.x + Math.cos(a0)*rad*0.98, bu.y + Math.sin(a0)*rad*0.98);
      ctx.stroke();
    }
    ctx.restore();
  });

  // 中子星·扇形辐照区
  nsUlts.forEach(nu=>{
    const t = now - nu.t0;
    if (t < NS_ULT.p1) return;
    const aIn = clamp((t - NS_ULT.p1)/300, 0, 1);
    const aOut = clamp(1 - (t - NS_ULT.p4)/380, 0, 1);
    const half = NS_ULT.angle*Math.PI/360;
    ctx.save();
    ctx.globalAlpha = aIn*aOut;
    const g = ctx.createRadialGradient(nu.x, nu.y, 0, nu.x, nu.y, NS_ULT.r*S);
    g.addColorStop(0, 'rgba(255,255,255,0.30)');
    g.addColorStop(0.42, 'rgba(176,204,255,0.22)');
    g.addColorStop(1, 'rgba(48,80,132,0.02)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(nu.x, nu.y);
    ctx.arc(nu.x, nu.y, NS_ULT.r*S, nu.ang - half, nu.ang + half);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  });
}

function drawSingularHigh(now){
  const R = UI.R;
  // 重力阱：视界环 + 内旋暗尘
  bhWells.forEach(wl=>{
    const t = now - wl.t0;
    const rr = BH_WELL.r * S;
    const fade = clamp(1 - (t - BH_WELL.p2)/(BH_WELL.dur - BH_WELL.p2), 0, 1);
    ctx.save();
    ctx.globalAlpha = fade;
    // 视界环
    for (let i = 0; i < 2; i++){
      ctx.strokeStyle = i ? 'rgba(61,16,94,0.95)' : 'rgba(138,92,255,0.7)';
      ctx.lineWidth = (i?2.2:1.4)*S;
      ctx.beginPath(); ctx.arc(wl.x, wl.y, rr*(1 - i*0.06), 0, Math.PI*2); ctx.stroke();
    }
    // 内旋暗尘
    for (let i = 0; i < 12; i++){
      const ph = ((now/520) + i/12) % 1;
      const ang = i*0.52 + now/240;
      const r2 = rr*1.15*(1-ph);
      ctx.fillStyle = 'rgba(71,24,107,' + (0.75*(1-ph)) + ')';
      ctx.beginPath();
      ctx.arc(wl.x + Math.cos(ang)*r2, wl.y + Math.sin(ang)*r2, (1.4 + ph*1.6)*S, 0, Math.PI*2);
      ctx.fill();
    }
    // 阱心
    ctx.fillStyle = 'rgba(0,0,0,0.95)';
    ctx.beginPath(); ctx.arc(wl.x, wl.y, rr*0.36, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(180,140,255,0.55)';
    ctx.lineWidth = 1.2*S;
    ctx.beginPath(); ctx.arc(wl.x, wl.y, rr*0.4, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  });

  // 折跃裂隙 + 碎屑
  bhRifts.forEach(rf=>{
    const t = now - rf.t0;
    const closeK = clamp(t/BH_RIFT.dur, 0, 1);
    ctx.save();
    ctx.strokeStyle = 'rgba(58,18,87,' + (1 - closeK*0.6) + ')';
    ctx.lineWidth = 1.6*S;
    ctx.beginPath();
    ctx.moveTo(rf.x0, rf.y0);
    const mx = (rf.x0+rf.x1)/2, my = (rf.y0+rf.y1)/2;
    const nx = -(rf.y1-rf.y0), ny = (rf.x1-rf.x0);
    const nl = Math.hypot(nx,ny)||1;
    ctx.quadraticCurveTo(mx + nx/nl*10*S*(1-closeK), my + ny/nl*10*S*(1-closeK), rf.x1, rf.y1);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(138,92,255,' + (0.5*(1-closeK)) + ')';
    ctx.lineWidth = 3*S;
    ctx.beginPath(); ctx.moveTo(rf.x0, rf.y0); ctx.lineTo(rf.x1, rf.y1); ctx.stroke();
    ctx.restore();
  });

  // 黑洞大招：四层视界圈层 / 吸积流 / 奇点 / 湮灭冲击波 / 暗物质碎片 / 闪光
  bhUlts.forEach(bu=>{
    const t = now - bu.t0;
    const rad = bhUltRadius(bu.t0, t);
    const out = clamp(1 - (t - BH_ULT.p4)/300, 0, 1);
    ctx.save();
    ctx.globalAlpha = out;
    // 四层圈层（向内旋转）
    for (let i = 0; i < 4; i++){
      const r2 = rad*(0.28 + i*0.20);
      const spin = now/1000 * (1.1 + i*0.5);
      ctx.strokeStyle = 'rgba(82,26,120,' + (0.55 + 0.12*i) + ')';
      ctx.lineWidth = (2.4 - i*0.3)*S;
      ctx.beginPath();
      ctx.arc(bu.x, bu.y, r2, spin, spin + Math.PI*1.5);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(138,92,255,0.30)';
      ctx.lineWidth = 1.2*S;
      ctx.beginPath(); ctx.arc(bu.x, bu.y, r2, spin+Math.PI, spin+Math.PI*2.35); ctx.stroke();
    }
    // 吸积流螺旋
    for (let i = 0; i < 18; i++){
      const ph = ((now/900) + i/18) % 1;
      const ang = i*0.35 + now/300;
      const r2 = rad*1.02*(1-ph);
      ctx.fillStyle = 'rgba(66,21,102,' + (0.85*(1-ph)) + ')';
      ctx.beginPath(); ctx.arc(bu.x + Math.cos(ang)*r2, bu.y + Math.sin(ang)*r2*0.9, (1.2+ph*2)*S, 0, Math.PI*2); ctx.fill();
    }
    // 奇点核心
    const cr = rad*0.2 + R*0.16;
    const cg = ctx.createRadialGradient(bu.x, bu.y, 0, bu.x, bu.y, cr);
    cg.addColorStop(0, '#000000');
    cg.addColorStop(0.7, '#050108');
    cg.addColorStop(1, 'rgba(41,8,66,0.9)');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(bu.x, bu.y, cr, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(211,182,255,0.75)';
    ctx.lineWidth = 2*S;
    ctx.beginPath(); ctx.arc(bu.x, bu.y, cr*1.08, 0, Math.PI*2); ctx.stroke();
    // 湮灭冲击波（沿切线扫出）
    if (bu.burst){
      const bk = clamp((now - bu.flashAt)/620, 0, 1);
      for (let i = 0; i < 2; i++){
        const rr2 = rad*(0.5 + 0.9*bk + i*0.35);
        ctx.strokeStyle = 'rgba(138,92,255,' + (0.55*(1-bk)) + ')';
        ctx.lineWidth = (18*S)*(1-bk) + 1;
        ctx.beginPath(); ctx.arc(bu.x, bu.y, rr2, 0, Math.PI*2); ctx.stroke();
      }
      bu.shards.forEach(s2=>{
        const a2 = 1 - s2.t/s2.life;
        ctx.fillStyle = 'rgba(66,21,102,' + (0.9*a2) + ')';
        ctx.beginPath(); ctx.arc(s2.x, s2.y, s2.r*a2, 0, Math.PI*2); ctx.fill();
      });
      if (now - bu.flashAt < 90){
        ctx.fillStyle = 'rgba(59,10,96,0.23)';
        ctx.fillRect(0, 0, W, H);
      }
    }
    ctx.restore();
  });

  // 中子星一技能：磁轴标线 + 定向脉冲耀斑
  nsBeams.forEach(bm=>{
    const t = now - bm.t0;
    const k = clamp((t - NS_BEAM.p1)/(NS_BEAM.p2 - NS_BEAM.p1), 0, 1);
    const out = clamp(1 - (t - NS_BEAM.p2)/(NS_BEAM.dur - NS_BEAM.p2), 0, 1);
    const reach = W + H;
    const hw = NS_BEAM.width*S/2;
    ctx.save();
    ctx.globalAlpha = out;
    ctx.translate(bm.x, bm.y); ctx.rotate(bm.ang);
    // 星痕基底
    ctx.strokeStyle = 'rgba(66,104,160,0.85)';
    ctx.lineWidth = 1.4*S;
    ctx.setLineDash([8*S, 8*S]);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(reach,0); ctx.stroke();
    ctx.setLineDash([]);
    // 光束
    const g = ctx.createLinearGradient(0,0,reach,0);
    g.addColorStop(0, 'rgba(255,255,255,0.95)');
    g.addColorStop(0.25, 'rgba(136,180,255,0.85)');
    g.addColorStop(1, 'rgba(136,180,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, -hw*(0.6 + 0.4*t/NS_BEAM.p2), reach, hw*2*(0.6 + 0.4*t/NS_BEAM.p2));
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 2.4*S;
    ctx.beginPath(); ctx.moveTo(0,-hw*0.55); ctx.lineTo(reach, -hw*0.55); ctx.stroke();
    // 星屑
    for (let i = 0; i < 16; i++){
      const ph = ((now/420) + i/16) % 1;
      const px = reach*ph*0.9, py = rnd(-hw, hw);
      ctx.fillStyle = 'rgba(208,226,255,' + (0.85*(1-ph)) + ')';
      ctx.beginPath(); ctx.arc(px, py, (1.5 + ph*2)*S, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  });

  // 中子星二技能：三角磁轨 + 磁束弹射
  nsTracks.forEach(tk=>{
    const t = now - tk.t0;
    if (t < NS_TRACK.p1) return;
    const out = clamp(1 - (t - NS_TRACK.p2)/(NS_TRACK.dur - NS_TRACK.p2), 0, 1);
    const rr = NS_TRACK.side*S;
    const pts = [];
    for (let i = 0; i < 3; i++){
      const a = -Math.PI/2 + i*Math.PI*2/3 + Math.PI/3;
      pts.push({ x:tk.x + Math.cos(a)*rr*0.78, y:tk.y + Math.sin(a)*rr*0.62 });
    }
    ctx.save();
    ctx.globalAlpha = out;
    // 磁场填充
    ctx.fillStyle = 'rgba(114,164,255,0.16)';
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y); ctx.lineTo(pts[1].x, pts[1].y); ctx.lineTo(pts[2].x, pts[2].y);
    ctx.closePath(); ctx.fill();
    // 磁丝
    for (let i = 0; i < 3; i++){
      const p0 = pts[i], p1 = pts[(i+1)%3], p2 = pts[(i+2)%3];
      ctx.strokeStyle = 'rgba(152,192,255,0.95)';
      ctx.lineWidth = 2*S;
      ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();
      ctx.strokeStyle = 'rgba(114,164,255,0.6)';
      ctx.lineWidth = 1.4*S;
      ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
    }
    // 弹射磁束
    const bounce = (now/220) % 1;
    const from = pts[Math.floor(now/440) % 3], to = pts[(Math.floor(now/440)+1) % 3];
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(from.x + (to.x-from.x)*bounce, from.y + (to.y-from.y)*bounce, 4*S, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });

  // 中子星大招：脉冲节点 / 磁脉冲 / 超耀光层 / 星屑 / 闪光
  nsUlts.forEach(nu=>{
    const t = now - nu.t0;
    const out = clamp(1 - (t - NS_ULT.p4)/320, 0, 1);
    const half = NS_ULT.angle*Math.PI/360;
    ctx.save();
    ctx.globalAlpha = out;
    // 五组脉冲节点
    for (let i = 0; i < 5; i++){
      const a = nu.ang + (i - 2)*half/3.2;
      const dist = NS_ULT.r*S*(0.35 + 0.16*i);
      const px = nu.x + Math.cos(a)*dist, py = nu.y + Math.sin(a)*dist;
      const pulse = 0.5 + 0.5*Math.abs(Math.sin(now/260 + i*1.2));
      const g = ctx.createRadialGradient(px, py, 0, px, py, R*0.75);
      g.addColorStop(0, 'rgba(255,255,255,' + (0.85*pulse) + ')');
      g.addColorStop(0.5, 'rgba(122,168,255,' + (0.5*pulse) + ')');
      g.addColorStop(1, 'rgba(122,168,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(px, py, R*0.75, 0, Math.PI*2); ctx.fill();
      // 节点向外脉冲束
      if (t > NS_ULT.p1 && t < NS_ULT.p3){
        ctx.strokeStyle = 'rgba(176,204,255,0.55)';
        ctx.lineWidth = 2*S;
        ctx.beginPath(); ctx.moveTo(nu.x + Math.cos(a)*dist*0.9, nu.y + Math.sin(a)*dist*0.9);
        ctx.lineTo(nu.x + Math.cos(a)*NS_ULT.r*S, nu.y + Math.sin(a)*NS_ULT.r*S); ctx.stroke();
      }
    }
    // 超耀光层
    if (nu.burst){
      const bk = clamp((now - nu.flashAt)/520, 0, 1);
      ctx.fillStyle = 'rgba(176,204,255,' + (0.5*(1-bk)) + ')';
      ctx.beginPath(); ctx.moveTo(nu.x, nu.y);
      ctx.arc(nu.x, nu.y, NS_ULT.r*S*(0.7 + 0.3*bk), nu.ang-half, nu.ang+half);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.6*(1-bk)) + ')';
      ctx.lineWidth = 3*S;
      ctx.beginPath(); ctx.moveTo(nu.x, nu.y);
      ctx.arc(nu.x, nu.y, NS_ULT.r*S, nu.ang-half, nu.ang+half); ctx.closePath(); ctx.stroke();
      nu.shards.forEach(s2=>{
        const a2 = 1 - s2.t/s2.life;
        ctx.fillStyle = 'rgba(216,230,255,' + (0.9*a2) + ')';
        ctx.beginPath(); ctx.arc(s2.x || nu.x, s2.y || nu.y, s2.r*a2, 0, Math.PI*2); ctx.fill();
      });
      if (now - nu.flashAt < 90){
        ctx.fillStyle = 'rgba(176,204,255,0.25)';
        ctx.fillRect(0, 0, W, H);
      }
    }
    ctx.restore();
  });
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=> setTimeout(resize, 120));
resize();
requestAnimationFrame(frame);
</script>
</body>
