        const g2 = ctx.createLinearGradient(s.x, s.y, s.x + Math.cos(a)*len, s.y + Math.sin(a)*len);
        g2.addColorStop(0, 'rgba(255,255,255,0.9)');
        g2.addColorStop(1, 'rgba(190,120,255,0)');
        ctx.save();
        ctx.strokeStyle = g2; ctx.lineWidth = 3 * S;
        ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + Math.cos(a)*len, s.y + Math.sin(a)*len); ctx.stroke();
        ctx.restore();
      }
      // 切割电弧：连向范围内敌人
      enemiesOf(s.owner).forEach(q=>{
        if (q.dead) return;
        const d = Math.hypot(q.x - s.x, q.y - s.y);
        if (d > R * LEI_PRISON.rad[1]) return;
        drawBolt(s.x, s.y, q.x, q.y, 8, 12*S, cyc + q.i*13, 'rgba(210,186,255,0.95)', 3*S, 'rgba(140,80,255,0.4)');
        for (let kk = 0; kk < 3; kk++){
          const a2 = (kk/3)*Math.PI*2 + now/260;
          drawBolt(q.x, q.y, q.x + Math.cos(a2)*R*0.9, q.y + Math.sin(a2)*R*0.7, 3, 4*S, cyc + kk*7 + q.i, 'rgba(220,200,255,0.8)', 1.4*S, null);
        }
      });
    }

    /* ---------- 阶段3 紫雷星陨爆发 2200~2800：全向紫雷喷射 ---------- */
    if (t >= LEI_PRISON.p3 && t < LEI_PRISON.p4){
      const k = (t - LEI_PRISON.p3) / (LEI_PRISON.p4 - LEI_PRISON.p3);
      const rr = R * LEI_PRISON.rad[2];
      // 爆散光环
      ctx.save();
      ctx.globalAlpha = 0.9 * (1 - k * 0.55);
      ctx.strokeStyle = '#ff8ef0';
      ctx.lineWidth = (7 - 5*k) * S;
      ctx.beginPath(); ctx.arc(s.x, s.y, rr * (0.55 + 0.45 * leiEaseOut(k)), 0, Math.PI*2); ctx.stroke();
      ctx.restore();
      // 18 道紫雷喷射
      for (let i = 0; i < 18; i++){
        const a = i * (Math.PI*2/18) + now / 4000;
        const len = rr * (0.72 + 0.3 * Math.sin(now/120 + i*1.7));
        const ex = s.x + Math.cos(a) * len, ey = s.y + Math.sin(a) * len;
        drawBolt(s.x, s.y, ex, ey, 7, 14*S, cyc + i*17 + 401,
                 'rgba(255,142,240,' + (0.95 - 0.4*k) + ')', 3.2*S, 'rgba(255,80,220,0.35)');
        if (i % 3 === 0){
          for (let kk = 0; kk < 4; kk++){
            const aa = a + (kk - 1.5) * 0.18;
            ctx.fillStyle = 'rgba(255,220,255,' + (0.85 * (1 - k)) + ')';
            ctx.beginPath(); ctx.arc(ex + Math.cos(aa)*10*S, ey + Math.sin(aa)*10*S, (2 + kk%3) * S, 0, Math.PI*2); ctx.fill();
          }
        }
      }
      // 地面炸痕（菱形纹路）
      ctx.save();
      ctx.globalAlpha = 0.8 * (1 - k);
      ctx.strokeStyle = 'rgba(255,142,240,0.8)';
      ctx.lineWidth = 2 * S;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y - R*1.6); ctx.lineTo(s.x + R*1.5, s.y);
      ctx.lineTo(s.x, s.y + R*1.6); ctx.lineTo(s.x - R*1.5, s.y); ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }

    /* ---------- 阶段4 余雷收束 2800~3400：环收缩 + 余电飘散 ---------- */
    if (t >= LEI_PRISON.p4){
      const k = (t - LEI_PRISON.p4) / (LEI_PRISON.dur - LEI_PRISON.p4);
      ctx.save();
      ctx.globalAlpha = (1 - k) * 0.85;
      ctx.strokeStyle = '#c9a8ff'; ctx.lineWidth = 2.6 * S;
      ctx.beginPath(); ctx.arc(s.x, s.y, R * LEI_PRISON.rad[3] * (1 - k * 0.75), 0, Math.PI*2); ctx.stroke();
      ctx.restore();
      for (let i = 0; i < 10; i++){
        const a = i * (Math.PI*2/10);
        const rr2 = R * LEI_PRISON.rad[3] * (0.9 - 0.7 * k);
        drawBolt(s.x + Math.cos(a)*rr2, s.y + Math.sin(a)*rr2,
                 s.x + Math.cos(a)*rr2*0.6, s.y + Math.sin(a)*rr2*0.6 - R*0.5*k,
                 3, 3*S, cyc + i*5 + 501, 'rgba(200,170,255,' + (0.6*(1-k)) + ')', 1.2*S, null);
      }
    }

    /* ---------- 星狱压制：敌人脚下的压制刻环 ---------- */
    enemiesOf(s.owner).forEach(q=>{
      const n = q.prisonStacks || 0;
      if (!n) return;
      ctx.save();
      ctx.translate(q.x, q.y + R*0.92);
      ctx.scale(1, 0.4);
      ctx.strokeStyle = 'rgba(167,101,255,0.75)';
      ctx.lineWidth = 2 * S;
      ctx.beginPath(); ctx.arc(0, 0, R*1.3, 0, Math.PI*2); ctx.stroke();
      for (let i = 0; i < n; i++){
        const a = (Math.PI*2*i)/LEI_PRISON.suppressMax - Math.PI/2;
        ctx.fillStyle = 'rgba(220,200,255,0.95)';
        ctx.beginPath(); ctx.arc(Math.cos(a)*R*1.3, Math.sin(a)*R*1.3, 3.2*S, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    });
  });
}

/* 高层：菱形晶爆光 + 爆发瞬间全屏紫闪（压在角色之上） */
function drawPrisonHigh(now){
  const R = UI.R;
  leiPrisons.forEach(s=>{
    const t = now - s.t0;
    if (t < 0 || t >= LEI_PRISON.dur) return;
    let bloom = 0;
    if (t < LEI_PRISON.p1) bloom = 0.25 + 0.55 * clamp(t / LEI_PRISON.p1, 0, 1);
    else if (t < LEI_PRISON.p2) bloom = 0.6 + 0.3 * (0.5 + 0.5 * Math.sin(now / 200));
    else if (t < LEI_PRISON.p3) bloom = 0.9;
    else if (t < LEI_PRISON.p4) bloom = 1.0;
    else bloom = Math.max(0, 1 - (t - LEI_PRISON.p4) / (LEI_PRISON.dur - LEI_PRISON.p4));

    const br = R * (1.35 + 0.9 * bloom);
    const bg = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, br);
    bg.addColorStop(0, 'rgba(255,255,255,' + (0.35 + 0.4 * bloom) + ')');
    bg.addColorStop(0.42, 'rgba(210,170,255,' + (0.3 * bloom) + ')');
    bg.addColorStop(1, 'rgba(120,60,240,0)');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(s.x, s.y, br, 0, Math.PI*2); ctx.fill();

    // 阶段3 起手全屏紫闪 120ms
    const ft = t - LEI_PRISON.p3;
    if (ft >= 0 && ft < 120){
      ctx.save();
      ctx.fillStyle = 'rgba(255,142,240,' + (0.30 * (1 - ft/120)) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    // 阶段2 起手轻微紫雾泛光
    const ft2 = t - LEI_PRISON.p2;
    if (ft2 >= 0 && ft2 < 160){
      ctx.save();
      ctx.fillStyle = 'rgba(160,101,255,' + (0.16 * (1 - ft2/160)) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  });
}

function leiEaseIn(k){ return k * k; }

/* ================= 冰·被动：霜凝积寒 ================= */
const ICE_FROST = { max:5, dur:3200, slowPer:0.07, freezeMs:1100, thLockMs:800, dmgPer:0.08 };
let frostShards = [], frostPuffs = [];

function frostAdd(def, now, n){
  if (!def || def.dead) return;
  if (now < (def.frostLockEnd || 0)) return;      // 被雷劈过：0.8s 内无法叠加
  if (now < (def.frostFreezeEnd || 0)) return;    // 凝霜期间不再叠加
  const rate = (def.wetEnd > now) ? 2 : 1;        // 与水接触：叠加速度翻倍
  def.frostStacks = Math.min(ICE_FROST.max, (def.frostStacks || 0) + (n || 1) * rate);
  def.frostEnd = now + ICE_FROST.dur;
  if (def.frostStacks >= ICE_FROST.max){
    const extra = (def.wetEnd > now) ? 400 : 0;   // 遇水凝霜延长 0.4s
    def.frostFreezeEnd = now + ICE_FROST.freezeMs + extra;
    def.frostShellAt = now;
    // 凝霜瞬间：22 片冰晶碎片向外迸发
    for (let i = 0; i < 22; i++){
      const a = Math.random() * Math.PI * 2;
      const sp = 24 + Math.random() * 44;
      frostShards.push({ x:def.x, y:def.y - UI.R*0.1,
                         vx:Math.cos(a)*sp*S, vy:Math.sin(a)*sp*S*0.7,
                         r:(1 + Math.random()*1.5)*S, t:0, life:0.45 });
    }
    pushFloat(def.x, def.y - UI.R*1.6, '凝霜', '#87cef8', true);
    blip(880, 0.08, 0.18);
  }
}

function frostClear(def, now){
  if (!def) return;
  def.frostStacks = 0; def.frostEnd = 0; def.frostFreezeEnd = 0;
  def.frostLockEnd = now + ICE_FROST.thLockMs;
}

function updateFrost(now, dt){
  allPlayers().forEach(p=>{
    if (!p) return;
    if (p.frostStacks){
      if (p.frostStacks >= ICE_FROST.max && now >= (p.frostFreezeEnd || 0)){
        p.frostStacks = 0; p.frostEnd = 0;       // 凝霜结束 → 清空全部标记
      } else if (now > (p.frostEnd || 0)){
        p.frostStacks = 0; p.frostEnd = 0;       // 3.2s 到期
      }
    }
    // 冰晶本体持续飘霜花粒子（每帧 ≤6，仅待机特效、无伤害）
    if (p.elem === 'ice' && !p.dead && frostPuffs.length < 240){
      for (let i = 0; i < 6; i++){
        frostPuffs.push({ x:p.x + (Math.random()-0.5)*UI.R*1.7,
                          y:p.y - UI.R*0.55 + Math.random()*UI.R*0.5,
                          vy:(9 + Math.random()*13)*S, sw:Math.random()*Math.PI*2,
                          r:(1 + Math.random())*S, t:0, life:1.1 + Math.random()*0.7 });
      }
    }
  });
  frostShards.forEach(s=>{ s.x += s.vx*dt; s.y += s.vy*dt; s.vx *= 0.93; s.vy *= 0.93; s.t += dt; });
  frostShards = frostShards.filter(s=> s.t < s.life);
  frostPuffs.forEach(f=>{ f.t += dt; f.y += f.vy*dt; f.x += Math.sin(f.t*3 + f.sw)*9*S*dt; });
  frostPuffs = frostPuffs.filter(f=> f.t < f.life);
}

/* 寒霜印记 / 凝霜六边形冰壳 / 霜花 / 碎片（角色之上） */
function drawFrostFx(now){
  const R = UI.R;
  frostPuffs.forEach(f=>{
    const a = 1 - f.t / f.life;
    ctx.fillStyle = 'rgba(' + iceRgb(240,252,255) + ',' + (0.7*a) + ')';
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
  });
  frostShards.forEach(s=>{
    const a = 1 - s.t / s.life;
    ctx.fillStyle = 'rgba(' + iceRgb(214,247,255) + ',' + (0.9*a) + ')';
    ctx.beginPath();
    ctx.moveTo(s.x, s.y - s.r); ctx.lineTo(s.x + s.r*0.6, s.y);
    ctx.lineTo(s.x, s.y + s.r); ctx.lineTo(s.x - s.r*0.6, s.y);
    ctx.closePath(); ctx.fill();
  });
  allPlayers().forEach(p=>{
    if (!p || p.dead) return;
    const st = p.frostStacks || 0;
    if (!st) return;
    for (let i = 0; i < st; i++){
      const a = -Math.PI/2 + i * (Math.PI*2/ICE_FROST.max);
      const hx = p.x + Math.cos(a)*R*1.3, hy = p.y + Math.sin(a)*R*1.08;
      ctx.strokeStyle = 'rgba(' + iceRgb(135,206,248) + ',0.95)';
      ctx.lineWidth = 1.5*S;
      ctx.beginPath();
      for (let k = 0; k < 6; k++){
        const ang = a + k*Math.PI/3 + now/900;
        const px = hx + Math.cos(ang)*4*S, py = hy + Math.sin(ang)*4*S;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.stroke();
    }
    if (now < (p.frostFreezeEnd || 0)){
      const t = now - (p.frostShellAt || now);
      const grow = clamp(t / 160, 0, 1);
      ctx.save();
      ctx.globalAlpha = 0.65 * grow;
      ctx.translate(p.x, p.y);
      const hr = R*1.75;
      ctx.beginPath();
      for (let k = 0; k < 6; k++){
        const ang = -Math.PI/2 + k*Math.PI/3;
        const px = Math.cos(ang)*hr, py = Math.sin(ang)*hr*0.92;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      const ig = ctx.createRadialGradient(0, 0, 0, 0, 0, hr);
      ig.addColorStop(0, 'rgba(' + iceRgb(214,247,255) + ',0.10)');
      ig.addColorStop(0.72, 'rgba(' + iceRgb(82,168,216) + ',0.55)');
      ig.addColorStop(1, 'rgba(' + iceRgb(214,247,255) + ',0.78)');
      ctx.fillStyle = ig; ctx.fill();
      ctx.strokeStyle = 'rgba(' + iceRgb(240,252,255) + ',0.95)'; ctx.lineWidth = 2*S; ctx.stroke();
      for (let k = 0; k < 6; k++){
        const ang = -Math.PI/2 + k*Math.PI/3;
        const bx = Math.cos(ang)*hr, by = Math.sin(ang)*hr*0.92;
        ctx.beginPath();
        ctx.moveTo(bx - Math.sin(ang)*4*S, by + Math.cos(ang)*4*S);
        ctx.lineTo(bx + Math.cos(ang)*9*S, by + Math.sin(ang)*9*S);
        ctx.lineTo(bx + Math.sin(ang)*4*S, by - Math.cos(ang)*4*S);
        ctx.closePath();
        ctx.fillStyle = 'rgba(' + iceRgb(240,252,255) + ',0.9)'; ctx.fill();
      }
      ctx.strokeStyle = 'rgba(' + iceRgb(82,168,216) + ',0.55)';
      ctx.lineWidth = 1.2*S;
      for (let k = 0; k < 7; k++){
        const ang = k * 0.9 + t*0.001;
        const rr = hr * clamp((t - k*30) / 260, 0, 1);
        if (rr <= 1) continue;
        ctx.beginPath();
        for (let seg = 1; seg <= 5; seg++){
          const px = Math.cos(ang + seg*0.13) * rr * (seg/5);
          const py = Math.sin(ang + seg*0.13) * rr * (seg/5) * 0.92;
          if (seg === 1) ctx.moveTo(0, 0);
          ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  });
}

/* ================= 冰·大招：永寂冰原 ================= */
const ICE_FIELD = {
  dur:3700, p1:450, p2:1900, p3:2500, p4:3100,
  r:3.4,
  tickStart:450, tickEnd:1900, tick:210, tickDmg:3,
  burstStart:2500, burstCount:40, burstGap:14, burstDmg:9.5, hitR:1.75, warnMs:80
};
let iceFields = [];

function ultDurOf(def){
  if (!def) return 0;
  if (def.kind === 'leiPrison') return LEI_PRISON.dur;
  if (def.kind === 'iceField') return ICE_FIELD.dur;
  if (def.kind === 'elemField') return def.dur || 3600;
  return 0;
}

function iceBaseRadius(f){ return ICE_FIELD.r * UI.R * (f.wet ? 1.07 : 1); }

function iceRadius(f, now){
  const t = now - f.t0;
  const base = iceBaseRadius(f);
  if (t < ICE_FIELD.p1){
    const k = clamp(t / ICE_FIELD.p1, 0, 1);
    return base * (f.wet ? Math.pow(k, 0.7) : k);
  }
  if (t < ICE_FIELD.p4) return base;
  const k = clamp((t - ICE_FIELD.p4) / (ICE_FIELD.dur - ICE_FIELD.p4), 0, 1);
  return base * (1 - (f.fire ? Math.pow(k, 0.7) : k));
}

function updateIceFields(now, dt){
  const R = UI.R;
  for (let i = iceFields.length - 1; i >= 0; i--){
    const f = iceFields[i];
    const p = f.owner;
    const t = now - f.t0;
    if (t >= ICE_FIELD.dur || !p || p.dead){
      if (p) p.ultActive = false;
      iceFields.splice(i, 1);
      continue;
    }
    p.jx = 0; p.jy = 0;
    const rad = iceRadius(f, now);

    /* 阶段2：每 210ms 结算一次冰伤（伤害入口里统一叠 1 层寒霜） */
    if (t >= ICE_FIELD.tickStart && t < ICE_FIELD.tickEnd){
      const slot = Math.round((t - ICE_FIELD.tickStart) / ICE_FIELD.tick);
      const key = 'k' + slot;
      if (!f.ticks[key]){
        f.ticks[key] = 1;
        enemiesOf(p).forEach(q=>{
          if (Math.hypot(q.x - f.x, q.y - f.y) <= rad + R*0.6){
            hitEnemy(p, q, now, { type:'ice', dmg: ICE_FIELD.tickDmg * (f.fire ? 0.78 : 1), frostPause:true });
          }
        });
        f.bursts.push({ x:f.x + (Math.random()-0.5)*rad, y:f.y + (Math.random()-0.5)*rad*0.8, t:0, life:0.07 });
      }
    }

    /* 阶段4：8 根巨型冰棱依次砸落，落点范围衰减 */
    if (t >= ICE_FIELD.burstStart){
      const need = Math.min(ICE_FIELD.burstCount, Math.floor((t - ICE_FIELD.burstStart) / ICE_FIELD.burstGap) + 1);
      while (f.burstDone < need){
        const pt = f.impacts[f.burstDone];
        f.burstDone++;
        f.waves.push({ x:pt.x, y:pt.y, r:R*0.3, to:R*2.4, t:0, life:0.42 });
        f.caps.push({ x:pt.x, y:pt.y, r:R*0.35, t:0, life:0.7 });
        for (let k = 0; k < 12; k++){
          const a = Math.random()*Math.PI*2, sp = 40 + Math.random()*90;
          f.shards.push({ x:pt.x, y:pt.y, vx:Math.cos(a)*sp*S, vy:Math.sin(a)*sp*S*0.7,
                          r:(1 + Math.random()*2.5)*S, t:0, life:0.55 });
        }
        enemiesOf(p).forEach(q=>{
          const dd = Math.hypot(q.x - pt.x, q.y - pt.y);
          const hitR = ICE_FIELD.hitR * R;
          if (dd > hitR) return;                       // 只有落点范围内才吃伤害
          const fall = 1 - 0.45 * (dd / hitR);
          hitEnemy(p, q, now, { type:'ice', dmg: ICE_FIELD.burstDmg * fall * (f.fire ? 0.78 : 1), frostPause:true });
        });
        blip(120, 0.14, 0.4);
      }
    }

    f.waves.forEach(w=>{ w.t += dt; w.r = w.r + (w.to - w.r) * Math.min(1, dt*7); });
    f.waves = f.waves.filter(w=> w.t < w.life);
    f.caps.forEach(c=> c.t += dt);
    f.caps = f.caps.filter(c=> c.t < c.life);
    f.shards.forEach(s=>{ s.x += s.vx*dt; s.y += s.vy*dt; s.vx *= 0.9; s.vy *= 0.9; s.t += dt; });
    f.shards = f.shards.filter(s=> s.t < s.life);
    f.bursts = f.bursts.filter(b=>{ b.t += dt; return b.t < b.life; });
  }
}

/* 冰原低层：冰面冰格 → 寒雾 → 冰棱 → 暴雪/碎片 → 冰花 → 冲击波 */
function drawIceLow(now){
  const R = UI.R;
  iceFields.forEach(f=>{
    const t = now - f.t0;
    if (t < 0 || t >= ICE_FIELD.dur) return;
    const rad = iceRadius(f, now);
    const base = iceBaseRadius(f);
    const cyc = Math.floor(now/16);

    /* 1. 地面冰面 + 六边形冰格 */
    ctx.save();
    ctx.translate(f.x, f.y + R*0.95);
    ctx.scale(1, 0.36);
    const fade = 1 - clamp((t - ICE_FIELD.p4) / (ICE_FIELD.dur - ICE_FIELD.p4), 0, 1);
    const ig = ctx.createRadialGradient(0, 0, 0, 0, 0, rad + 4*S);
    ig.addColorStop(0, 'rgba(' + iceRgb(148,216,240) + ',' + (0.30*fade) + ')');
    ig.addColorStop(0.78, 'rgba(' + iceRgb(64,158,199) + ',' + (0.26*fade) + ')');
    ig.addColorStop(1, 'rgba(' + iceRgb(36,107,145) + ',0)');
    ctx.fillStyle = ig;
    ctx.beginPath(); ctx.arc(0, 0, rad + 4*S, 0, Math.PI*2); ctx.fill();
    // 缓慢流动的冰格
    ctx.strokeStyle = 'rgba(' + iceRgb(230,248,255) + ',' + (0.32*fade) + ')';
    ctx.lineWidth = 1.3*S;
    const gridStep = R*0.62;
    const off = (now/1000) % gridStep;
    for (let gx = -rad; gx <= rad; gx += gridStep){
      ctx.beginPath();
      ctx.moveTo(gx + off, -rad); ctx.lineTo(gx + off, rad); ctx.stroke();
    }
    for (let gy = -rad; gy <= rad; gy += gridStep){
      ctx.beginPath();
      ctx.moveTo(-rad, gy + off); ctx.lineTo(rad, gy + off); ctx.stroke();
    }
    // 放射冰裂纹
    const crackA = clamp(t / 700, 0, 1);
    ctx.strokeStyle = 'rgba(' + iceRgb(36,107,145) + ',' + (0.85 * crackA * (t < ICE_FIELD.p3 ? 0.8 : 1)) + ')';
    ctx.lineWidth = 2*S;
    for (let i = 0; i < 9; i++){
      const a = i * (Math.PI*2/9) + 0.2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*R*0.3, Math.sin(a)*R*0.3);
      let px = 0, py = 0;
      for (let seg = 1; seg <= 4; seg++){
        px = Math.cos(a + (seg%2 ? 0.12 : -0.1)) * rad * (seg/4);
        py = Math.sin(a + (seg%2 ? 0.12 : -0.1)) * rad * (seg/4);
        ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.restore();

    /* 2. 寒雾层 + 大型雪片 */
    const fogA = 0.22 * clamp(1 - (t - ICE_FIELD.p3)/900, 0, 1);
    if (fogA > 0.01){
      ctx.save();
      ctx.fillStyle = 'rgba(' + iceRgb(198,232,247) + ',' + fogA + ')';
      ctx.fillRect(f.x - base*1.5, f.y - base*1.7 - (t - ICE_FIELD.p3 > 0 ? (t-ICE_FIELD.p3)*3*S : 0),
                   base*3, base*1.1);
      for (let i = 0; i < 16; i++){
        const sx = f.x + ((i*137 + now/40) % (base*2.6)) - base*1.3;
        const sy = f.y - base*1.5 + ((i*53 + now/26) % (base*1.4));
        ctx.fillStyle = 'rgba(' + iceRgb(230,248,255) + ',0.5)';
        ctx.beginPath(); ctx.arc(sx, sy, (4 + (i%3))*S*0.6, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }

    /* 3. 旋转冰棱 / 坠落冰棱 */
    const nSpike = f.wet ? 12 : 8;
    const spin = now/1000 * 1.8 * Math.PI*2;      // 每秒 1.8 圈
    const shrinkStage = t >= ICE_FIELD.p3 && t < ICE_FIELD.p4
      ? clamp((t - ICE_FIELD.p3) / (ICE_FIELD.p4 - ICE_FIELD.p3), 0, 1) : 0;
    const spikeR = t < ICE_FIELD.p4 ? rad*0.82 * (1 - shrinkStage*0.55) : 0;
    const spikeW = R*0.22 * (1 + shrinkStage*0.3);  // 收拢时宽度 +30%
    for (let i = 0; i < nSpike; i++){
      const a = spin + i * (Math.PI*2/nSpike);
      const sx = f.x + Math.cos(a) * spikeR, sy = f.y + Math.sin(a) * spikeR * 0.86;
      const h = R*0.85 * (1 + shrinkStage*0.4);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(sx, sy - h);
      ctx.lineTo(sx + spikeW, sy);
      ctx.lineTo(sx, sy + h*0.55);
      ctx.lineTo(sx - spikeW, sy);
      ctx.closePath();
      ctx.fillStyle = 'rgba(' + iceRgb(148,216,240) + ',0.55)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(' + iceRgb(230,248,255) + ',0.9)'; ctx.lineWidth = 1.6*S; ctx.stroke();
      // 折射高光，每 350ms 闪一次
      if (Math.floor(now/350) % 2 === 0){
        ctx.fillStyle = 'rgba(' + iceRgb(255,255,255) + ',0.55)';
        ctx.beginPath(); ctx.arc(sx, sy - h*0.35, 2.2*S, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }

    /* 3b. 坠落预警圈 + 坠落冰棱 */
    if (t >= ICE_FIELD.burstStart - ICE_FIELD.warnMs && t < ICE_FIELD.p4){
      for (let i = f.burstDone; i < Math.min(ICE_FIELD.burstCount, f.burstDone + 7); i++){
        const pt = f.impacts[i];
        const k = clamp((t - (ICE_FIELD.burstStart + i*ICE_FIELD.burstGap - ICE_FIELD.warnMs)) / ICE_FIELD.warnMs, 0, 1);
        ctx.save();
        ctx.strokeStyle = 'rgba(' + iceRgb(255,255,255) + ',' + (0.85*k) + ')';
        ctx.lineWidth = 2*S;
        ctx.beginPath(); ctx.arc(pt.x, pt.y + R*0.95, R*0.62, 0, Math.PI*2); ctx.stroke();
        ctx.restore();
      }
    }
    if (t >= ICE_FIELD.burstStart && t < ICE_FIELD.p4 + 60){
      for (let i = 0; i < f.burstDone; i++){
        const pt = f.impacts[i];
        const dt2 = t - (ICE_FIELD.burstStart + i*ICE_FIELD.burstGap);
        if (dt2 < 0 || dt2 > 140) continue;
        const k = dt2 / 140;
        const len = R*4.2 * (1 - k*0.85);
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(pt.x, pt.y - R*0.95 - len);
        ctx.lineTo(pt.x + R*0.3, pt.y - R*0.95);
        ctx.lineTo(pt.x, pt.y - R*0.95 + R*0.25);
        ctx.lineTo(pt.x - R*0.3, pt.y - R*0.95);
        ctx.closePath();
        ctx.fillStyle = 'rgba(' + iceRgb(64,158,199) + ',0.85)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(' + iceRgb(230,248,255) + ',0.95)'; ctx.lineWidth = 2*S; ctx.stroke();
        ctx.restore();
      }
    }

    /* 4. 暴雪粒子（上边界落下）+ 飞溅碎片 */
    const cap = t >= ICE_FIELD.p3 && t < ICE_FIELD.p4 ? 110 : 75;
    for (let i = 0; i < cap; i++){
      const seed = i * 71;
      const fall = ((now/1000) * (t >= ICE_FIELD.p3 ? 1.35 : 1) + (seed % 220)/220) % 1;
      if (fall > (t > ICE_FIELD.p4 ? 0 : 1)) continue;
      const sx = f.x + (((seed % 200) - 100) / 100) * rad * (1 - fall*0.15) + Math.sin(now/700 + i)*6*S;
      const sy = f.y - base*1.5 + fall * (base*2.1);
      if (Math.hypot(sx - f.x, (sy - f.y)/0.36) > rad + 8*S) continue;
      if (t >= ICE_FIELD.p4) continue;
      ctx.fillStyle = 'rgba(' + iceRgb(230,248,255) + ',' + (0.65 * (1 - fall*0.5)) + ')';
      ctx.beginPath(); ctx.arc(sx, sy, (1 + (i%4)*0.8)*S, 0, Math.PI*2); ctx.fill();
    }
    f.shards.forEach(s=>{
      const a = 1 - s.t / s.life;
      ctx.fillStyle = 'rgba(' + iceRgb(230,248,255) + ',' + (0.85*a) + ')';
      ctx.beginPath();
      ctx.moveTo(s.x, s.y - s.r); ctx.lineTo(s.x + s.r*0.6, s.y);
      ctx.lineTo(s.x, s.y + s.r); ctx.lineTo(s.x - s.r*0.6, s.y);
      ctx.closePath(); ctx.fill();
    });

    /* 5. 冰花绽放（多层交错冰晶瓣，由内向外逐层展开） */
    if (t >= ICE_FIELD.burstStart + ICE_FIELD.burstCount*ICE_FIELD.burstGap){
      const k = clamp((t - (ICE_FIELD.burstStart + ICE_FIELD.burstCount*ICE_FIELD.burstGap)) / 260, 0, 1);
      ctx.save();
      ctx.translate(f.x, f.y);
      for (let layer = 0; layer < 3; layer++){
        const lk = clamp(k - layer*0.22, 0, 1);
        if (lk <= 0) continue;
        const rr = R * (1.2 + layer*1.1) * lk;
        const petals = 6 + layer*2;
        for (let i = 0; i < petals; i++){
          const a = i * (Math.PI*2/petals) + layer*0.3 + now/9000;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(a - 0.16) * rr * 0.55, Math.sin(a - 0.16) * rr * 0.55);
          ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
          ctx.lineTo(Math.cos(a + 0.16) * rr * 0.55, Math.sin(a + 0.16) * rr * 0.55);
          ctx.closePath();
          ctx.fillStyle = 'rgba(' + iceRgb(214,247,255) + ',' + (0.5 - layer*0.1) + ')';
          ctx.fill();
        }
      }
      ctx.restore();
    }

    /* 6. 冰冲击波 + 厚冰壳 */
    f.waves.forEach(w=>{
      const a = 1 - w.t / w.life;
      ctx.save();
      ctx.strokeStyle = 'rgba(' + iceRgb(230,248,255) + ',' + (0.85*a) + ')';
      ctx.lineWidth = 18*S * 0.5;
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    });
    f.caps.forEach(c=>{
      const a = 1 - c.t / c.life;
      ctx.fillStyle = 'rgba(' + iceRgb(64,158,199) + ',' + (0.5*a) + ')';
      ctx.beginPath(); ctx.arc(c.x, c.y + R*0.95, c.r, 0, Math.PI*2); ctx.fill();
    });
  });
}

/* 冰原高层：冰晶本体 bloom + 绽放峰值淡蓝闪光蒙版 + 冷调滤镜 */
function drawIceHigh(now){
  iceFields.forEach(f=>{
    const t = now - f.t0;
    if (t < 0 || t >= ICE_FIELD.dur) return;
    const R = UI.R;
    let bloom = 0.35;
    if (t >= ICE_FIELD.p3) bloom = 0.8;
    if (t >= ICE_FIELD.burstStart) bloom = 1;
    if (t >= ICE_FIELD.p4) bloom = Math.max(0.15, 1 - (t - ICE_FIELD.p4)/600);
    const br = R * (1.5 + bloom);
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, br);
    g.addColorStop(0, 'rgba(' + iceRgb(255,255,255) + ',' + (0.30 + 0.35*bloom) + ')');
    g.addColorStop(0.45, 'rgba(' + iceRgb(148,216,240) + ',' + (0.22*bloom) + ')');
    g.addColorStop(1, 'rgba(' + iceRgb(64,158,199) + ',0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(f.x, f.y, br, 0, Math.PI*2); ctx.fill();

    // 绽放峰值：淡蓝闪光蒙版 0.28，5 帧
    const peak = ICE_FIELD.burstStart + ICE_FIELD.burstCount*ICE_FIELD.burstGap;
    if (t >= peak && t < peak + 84){
      ctx.save();
      ctx.fillStyle = 'rgba(' + iceRgb(148,216,240) + ',' + (0.28 * (1 - (t-peak)/84)) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    // 全图蓝色渐变覆盖：阶段1 渐入，阶段2~4 常驻，阶段5（3.1~3.7s）渐出后完全消失
    {
      const inK = clamp(t / 450, 0, 1);
      const outK = clamp(1 - (t - ICE_FIELD.p4) / (ICE_FIELD.dur - ICE_FIELD.p4), 0, 1);
      const a = 0.20 * Math.min(inK, outK) * (f.fire ? 0.75 : 1);
      if (a > 0){
        ctx.save();
        const vg = ctx.createLinearGradient(0, 0, 0, H);
        vg.addColorStop(0, 'rgba(' + iceRgb(198,232,247) + ',' + a + ')');
        vg.addColorStop(0.45, 'rgba(' + iceRgb(148,216,240) + ',' + (a * 0.85) + ')');
        vg.addColorStop(1, 'rgba(' + iceRgb(36,107,145) + ',' + (a * 0.75) + ')');
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, W, H);
        // 四周加深的冷色晕边
        const rgv = ctx.createRadialGradient(W*0.5, H*0.5, Math.min(W,H)*0.30, W*0.5, H*0.5, Math.max(W,H)*0.78);
        rgv.addColorStop(0, 'rgba(' + iceRgb(36,107,145) + ',0)');
        rgv.addColorStop(1, 'rgba(' + iceRgb(36,107,145) + ',' + (a * 1.1) + ')');
        ctx.fillStyle = rgv;
        ctx.fillRect(0, 0, W, H);
        ctx.restore();
      }
    }
    // 阶段2 起：轻微冷调偏移
    if (t >= ICE_FIELD.p1 && t < ICE_FIELD.p4 + 200){
      const a = 0.05 + 0.03 * (0.5 + 0.5*Math.sin(now/350));
      ctx.save();
      ctx.fillStyle = 'rgba(' + iceRgb(120,190,230) + ',' + a + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  });
}

function leiRadius(s, t){
  const rmax = LEI_STORM.r * S * (s.wet ? LEI_STORM.wetR : 1);
  if (t < LEI_STORM.p1) return 0;
  if (t < LEI_STORM.p2){
    const k = (t - LEI_STORM.p1) / (LEI_STORM.p2 - LEI_STORM.p1);
    return rmax * (0.45 + 0.55 * leiEaseOut(k));
  }
  if (t < LEI_STORM.p3){
    const k = (t - LEI_STORM.p2) / (LEI_STORM.p3 - LEI_STORM.p2);
    return rmax * (1 - 0.78 * leiEaseIn(k));
  }
  return rmax * 0.22;
}

/* 菱形四顶点（相对菱形中心，与 bodyPath 的 thunder 菱形一致） */
function leiVertices(x, y, R){
  return [
    { x: x,                y: y - R*1.24 },
    { x: x + R*0.72,       y: y },
    { x: x,                y: y + R*1.04 },
    { x: x - R*0.72,       y: y }
  ];
}

function updateLeiStorms(now, dt){
  const R = UI.R;
  for (let i = leiStorms.length - 1; i >= 0; i--){
    const s = leiStorms[i];
    const t = now - s.t0;
    if (s.owner && !s.owner.dead){ s.x = s.owner.x; s.y = s.owner.y; }
    if (t >= LEI_STORM.dur - 1){ leiStorms.splice(i, 1); continue; }

    // 阶段2：每 0.12s 一次伤害 + 感电标记
    if (t >= LEI_STORM.p1 && t < LEI_STORM.p3 && now - s.lastTick >= LEI_STORM.tick){
      s.lastTick = now;
      const r = leiRadius(s, t);
      enemiesOf(s.owner).forEach(q=>{
        if (q.dead) return;
        if (Math.hypot(q.x - s.x, q.y - s.y) > r + R*0.8) return;
        if (stealthImmune(q, now)){ pushFloat(q.x, q.y - R*1.2, '潜行 · 免伤', '#c4a6ff', true); return; }
        const mul = elemMul('thunder', q.elem);
        const d = LEI_STORM.dmg * mul;
        q.hp -= d;
        q.hitFlash = Math.max(q.hitFlash || 0, 0.12);
        q.elecEnd = Math.max(q.elecEnd || 0, now + LEI_STORM.shock + (s.wet ? LEI_STORM.wetShock : 0));
        pushFloat(q.x + rnd(-8,8), q.y - R*0.7, elemMulMark(mul) + fmtDmg(d), '#dcb8ff', false);
        checkKO(q, now);
      });
    }

    // 阶段3：360ms 雷击爆发（范围扩大，火过载再扩）
    if (t >= LEI_STORM.p3 && !s.burstDone){
      s.burstDone = true;
      const rB = leiRadius(s, LEI_STORM.p3) * LEI_STORM.burstR * (s.fire ? LEI_STORM.fireR : 1);
      enemiesOf(s.owner).forEach(q=>{
        if (q.dead) return;
        if (Math.hypot(q.x - s.x, q.y - s.y) > rB + R*0.8) return;
        if (stealthImmune(q, now)) return;
        const mul = elemMul('thunder', q.elem);
        const d = LEI_STORM.burstDmg * mul;
        q.hp -= d;
        q.defDownEnd = Math.max(q.defDownEnd || 0, now + 4000);
        q.hitFlash = 0.24;
        pushFloat(q.x, q.y - R*1.5, '崩涡 ' + elemMulMark(mul) + fmtDmg(d), '#fff8aa', true);
        bursts.push({ x:q.x, y:q.y, r:R*0.5, to:R*3.0, t:0, life:0.4, col:'#c8aaff', ring:true });
        checkKO(q, now);
      });
      // 120 颗粒子
      for (let k = 0; k < 120; k++){
        const a = Math.random()*Math.PI*2;
        const sp = (60 + Math.random()*420) * S;
        s.parts.push({ x:s.x, y:s.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
                       r:(1 + Math.random()*5)*S, life:0.35 + Math.random()*0.5, t:0,
                       col: Math.random() < 0.3 ? '#FFF8AA' : '#3688FF' });
      }
      if (s.fire){
        for (let k = 0; k < 20; k++){
          const a = Math.random()*Math.PI*2, sp = (80 + Math.random()*160)*S;
          s.parts.push({ x:s.x, y:s.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
                         r:(2 + Math.random()*4)*S, life:0.4, t:0, col:'#FF8A3C' });
        }
      }
      blip(180, 0.16, 0.4);
    }

    // 阶段2 持续甩火花（遇水更多）
    if (t >= LEI_STORM.p1 && t < LEI_STORM.p3){
      const r = leiRadius(s, t);
      const n = s.wet ? 6 : 4;
      const spin = -now/1000 * LEI_STORM.spin * Math.PI*2;   // 逆时针
      for (let k = 0; k < n; k++){
        const a = spin + Math.random()*Math.PI*2;
        const sp = (90 + Math.random()*150)*S;
        s.sparks.push({ x:s.x + Math.cos(a)*r, y:s.y + Math.sin(a)*r,
                        vx: -Math.sin(a)*sp, vy: Math.cos(a)*sp + 40*S,
                        r:(2 + Math.random()*2)*S, life:0.07, t:0 });
      }
      while (s.sparks.length > 220) s.sparks.shift();
    }

    // 粒子推进
    const step = (dt > 0.05 ? 0.05 : dt);
    s.sparks.forEach(sp=>{ sp.t += step; sp.x += sp.vx*step; sp.y += sp.vy*step; sp.vy += 620*S*step; });
    s.parts.forEach(sp=>{ sp.t += step; sp.x += sp.vx*step; sp.y += sp.vy*step; sp.vy += 320*S*step; });
    s.sparks = s.sparks.filter(sp=> sp.t < sp.life);
    s.parts = s.parts.filter(sp=> sp.t < sp.life);
  }
}

/* ---------------- 格挡 ---------------- */
function startGuard(p, now){
  if (!p || p.dead) return false;
  if (now < (p.guardCdEnd || 0)) return false;
  if (p.guardEnd > now) return false;
  p.guardStart = now;
  p.guardEnd = now + GUARD.window;
  blip(520, 0.05, 0.10);
  return true;
}

/* 被命中时的格挡倍率：1 为未格挡 */
function guardMul(def, now){
  if (!def || def.dead) return 1;
  if (!(def.guardEnd > now)) return 1;
  const el = now - def.guardStart;
  if (el >= GUARD.perfectFrom && el <= GUARD.perfectTo) return 0;
  if (el > GUARD.perfectTo) return GUARD.normalMul;
  return GUARD.startMul;
}

function resolveGuard(def, att, now, perfect){
  def.guardEnd = 0;
  def.guardCdEnd = now + GUARD.cd;
  if (perfect){
    def.guardPfEnd = now + 700;
    bursts.push({ x:def.x, y:def.y, r:UI.R*0.7, to:UI.R*4.2, t:0, life:0.5, col:'#fff8dc', ring:true });
    bursts.push({ x:def.x, y:def.y, r:UI.R*0.4, to:UI.R*2.2, t:0, life:0.34, col:'#ffffff', ring:false });
    pushFloat(def.x, def.y - UI.R*1.8, '完美格挡', '#fff3c4', true);
    blip(980, 0.12, 0.22);
    if (att && !att.dead){
      const a = Math.atan2(att.y - def.y, att.x - def.x);
      att.knockX = (att.knockX || 0) + Math.cos(a) * GUARD.kickPush * S;
      att.knockY = (att.knockY || 0) + Math.sin(a) * GUARD.kickPush * S;
      att.slowEnd = Math.max(att.slowEnd || 0, now + GUARD.attackerSlow);
      pushFloat(att.x, att.y - UI.R*1.2, '被震开', '#ffe9a8', true);
    }
  } else {
    def.guardNfEnd = now + 400;
    bursts.push({ x:def.x, y:def.y, r:UI.R*0.35, to:UI.R*1.8, t:0, life:0.28, col:'#bfe6ff', ring:true });
    pushFloat(def.x, def.y - UI.R*1.6, '格挡', '#cdeaff', true);
    blip(680, 0.07, 0.14);
  }
}

/* 暗·幽影潜行：隐身结束在原地留下黑雾（踩进去减速） */
/* 潜行免伤：隐身期间不吃任何伤害；唯一例外是施法前已被光粒挂上【显影】 */
function stealthImmune(def, now){
  return !!(def && !def.dead && def.stealthEnd > now && !(def.revealEnd > now));
}

function breakStealth(p, now, reason){
  if (!p || p.stealthEnd <= now) return false;
  p.stealthEnd = 0;
  p.stealthPrev = 0;
  p.stealthAmp = false;
  if (reason) pushFloat(p.x, p.y - UI.R*1.6, reason, '#ffe9a8', true);
  bursts.push({ x:p.x, y:p.y, r:UI.R*0.4, to:UI.R*2.2, t:0, life:0.35, col:'#fff2c8', ring:true });
  return true;
}

/* 噬影突袭：沿朝向短距突进，穿透路径上对手，终点再爆；撞到光柱/光域会被打断 */
function updateDash(p, now){
  if (!p || p.dead) return;
  if (!p.dashEnd) return;
  const sk2 = ELEM[p.elem].skill2 || {};
  const R = UI.R;

  if (p.dashEnd > now){
    const k = clamp((now - p.dashStart) / Math.max(1, (p.dashEnd - p.dashStart)), 0, 1);
    p.x = p.dashFrom.x + (p.dashTo.x - p.dashFrom.x) * k;
    p.y = p.dashFrom.y + (p.dashTo.y - p.dashFrom.y) * k;
    p.blink = Math.max(p.blink || 0, 26);
    dashTouchFire(p, now);

    // 撞光（光柱 / 耀光结界）→ 技能直接失效
    for (const f of fields){
      if (f.kind !== 'lightPillar' && f.kind !== 'lightDomain') continue;
      if (Math.hypot(p.x - f.x, p.y - f.y) < (f.r || 0) + R*0.6){
        p.dashEnd = 0; p.dashDone = true; p.dashHits = null;
        bursts.push({ x:p.x, y:p.y, r:R*0.6, to:R*3.2, t:0, life:0.45, col:'#fff6d8', ring:true });
        pushFloat(p.x, p.y - R*1.7, '突进被光打断 · 技能失效', '#fff2c8', true);
        blip(700, 0.12, 0.3);
        return;
      }
    }

    // 穿透伤害（每目标一次）
    enemiesOf(p).forEach(q=>{
      if (q.dead || !p.dashHits || p.dashHits[q.i]) return;
      if (dist(p, q) > R * (sk2.shaveR || DARK_DASH.shaveR)) return;
      p.dashHits[q.i] = true;
      if (stealthImmune(q, now)){
        pushFloat(q.x, q.y - R*1.3, '潜行 · 免伤', '#c4a6ff', true);
        return;
      }
      const ms2 = darkSkillMul('s2', q.elem);
      const d = (sk2.dmg || DARK_DASH.dmg) * ms2;
      q.hp -= d; q.hitFlash = 0.2;
      pushFloat(q.x, q.y - R*0.9, elemMulMark(ms2) + fmtDmg(d), '#a982ff', false);
      bursts.push({ x:q.x, y:q.y, r:R*0.5, to:R*2.2, t:0, life:0.3, col:'#3a1f6e', ring:false });

      // 引爆蚀影
      if (q.shadowEnd > now && p.dashHits['x'+q.i] !== true){
        p.dashHits['x'+q.i] = true;
        q.shadowEnd = 0; q.shadowStacks = 0;
        const mB = darkSkillMul('s2', q.elem);
        const dB = (sk2.burst || DARK_DASH.burst) * mB;
        q.hp -= dB;
        q.slowEnd = Math.max(q.slowEnd || 0, now + (sk2.slowMs || DARK_DASH.slowMs));
        pushFloat(q.x, q.y - R*1.7, '噬影引爆 ' + elemMulMark(mB) + fmtDmg(dB), '#c8a2ff', true);
        bursts.push({ x:q.x, y:q.y, r:R*0.7, to:R*3.6, t:0, life:0.5, col:'#8f5cff', ring:true });
        blip(420, 0.14, 0.3);
      }
      checkKO(q, now);
    });
  } else if (!p.dashDone){
    // 终点收势：钉到终点，再爆一次
    if (p.dashTo){ p.x = p.dashTo.x; p.y = p.dashTo.y; }
    p.dashDone = true;
    const R2 = R * (sk2.endR || DARK_DASH.endR);
    bursts.push({ x:p.x, y:p.y, r:R*0.6, to:R2*1.4, t:0, life:0.5, col:'#5a2fae', ring:true });
    // 终点黑雾爆散：三团错开大小/延迟的雾，向外散开
    bursts.push({ x:p.x, y:p.y, r:R*0.5, to:R2*1.1, t:0, life:0.62, col:'#2a1246', ring:false });
    bursts.push({ x:p.x, y:p.y, r:R*0.35, to:R2*0.85, t:0.1, life:0.55, col:'#3a1f6e', ring:false });
    bursts.push({ x:p.x, y:p.y, r:R*0.7, to:R2*1.35, t:0.05, life:0.7, col:'#6b3fc0', ring:false });
    enemiesOf(p).forEach(q=>{
      if (q.dead) return;
      if (Math.hypot(q.x - p.x, q.y - p.y) > R2 + R*0.5) return;
      if (stealthImmune(q, now)) return;
      const mE = darkSkillMul('s2', q.elem);
      const d = (sk2.endDmg || DARK_DASH.endDmg) * mE;
      q.hp -= d; q.hitFlash = 0.2;
      pushFloat(q.x + rnd(-8,8), q.y - R*1.0, elemMulMark(mE) + fmtDmg(d), '#a982ff', false);
      checkKO(q, now);
    });
    p.dashEnd = 0;
    p.dashHits = null;
  }
}

/* 突进穿过火池 → 带上灼烧 */
function dashTouchFire(p, now){
  if (!p || !p.dashEnd) return;
  fields.forEach(f=>{
    if (f.kind !== 'fire') return;
    if (Math.hypot(p.x - f.x, p.y - f.y) < (f.r || 0) + UI.R*0.4) p.burnEnd = Math.max(p.burnEnd || 0, now + 2400);
  });
}

function updateStealth(now){
  allPlayers().forEach(p=>{
    if (!p || p.dead) return;
    if (p.stealthPrev > 0 && p.stealthEnd <= now){
      // 自然结束：留雾
      fields.push({ kind:'darkMist', owner:p, x:p.x, y:p.y, r:UI.R*DARK_STEALTH.mistR,
                    end: now + DARK_STEALTH.mistLife, tick:180, last: now-180,
                    slowMs: DARK_STEALTH.slowMs });
      bursts.push({ x:p.x, y:p.y, r:UI.R*0.5, to:UI.R*DARK_STEALTH.mistR*1.4, t:0, life:0.6, col:'#3a1f6e', ring:false });
      pushFloat(p.x, p.y - UI.R*1.5, '残留黑雾', '#8f6bd8', true);
      p.stealthPrev = 0;
    }
    if (p.stealthEnd > now) p.stealthPrev = p.stealthEnd;
  });
}

/* 光明元素·被动「圣光灼蚀」：阴性元素靠近光就被持续扣血 */
function yinOf(p, now){
  if (!p) return 0;
  let y = ELEM_YIN[p.elem] || 0;
  if (p.elem === 'water' && p.hotWaterEnd > now) y = 0;   // 烫水不算阴性
  return y;
}

function updateLightAura(dt, now){
  allPlayers().forEach(lp=>{
    if (!lp || lp.dead || lp.elem !== 'light') return;
    const r = UI.R * LIGHT_AURA.r;
    allPlayers().forEach(q=>{
      if (!q || q === lp || q.dead) return;
      if (Math.hypot(q.x - lp.x, q.y - lp.y) > r) return;
      const y = yinOf(q, now);
      if (y <= 0) return;
      if (q.lightImmuneEnd > now) return;
      if (q.stealthEnd > now) breakStealth(q, now, '圣光 · 破除隐身');
      const dps = LIGHT_AURA.dps * y;
      q.hp -= dps * dt;
      q.hitFlash = Math.max(q.hitFlash || 0, 0.07);
      q.lightAcc = (q.lightAcc || 0) + dt;
      if (q.lightAcc >= LIGHT_AURA.tick){
        q.lightAcc = 0;
        pushFloat(q.x + rnd(-8, 8), q.y - UI.R*1.05,
                  '圣光灼蚀 -' + fmtDmg(dps * LIGHT_AURA.tick), '#ffe9a8', true);
      }
      checkKO(q, now);
    });
  });
}

/* ========================= 更新 ========================= */
function update(dt, now){
  if (toastT > 0) toastT -= dt;
  allPlayers().forEach(me => {
    if (me.ai && !me.dead) aiThink(me, dt, now);
    // 风·蓄力计时（蓄力时移速减半）
    if (me.charging){
      me.chargeT = Math.min(WIND_CHARGE_MAX, me.chargeT + dt);
      me.jx *= 0.5; me.jy *= 0.5;
    }
    if (!me) return;
    // 麻痹：雷附着每 2 秒触发 0.5 秒，完全无法移动（原地不动，不做位移修正）
    if (now < me.paralyzeEnd) return;

    // 冻结：不能移动，摇杆越用力挣扎越快（满摇杆约 2.2 秒挣脱）
    if (now < me.freezeEnd){
      const mag = Math.hypot(me.jx || 0, me.jy || 0);
      if (mag > 0.55) me.struggle += dt * 0.46;
      else if (mag > 0.2) me.struggle += dt * 0.18;
      if (me.struggle >= 1){
        me.freezeEnd = 0; me.struggle = 0;
        pushFloat(me.x, me.y - UI.R*1.2, '挣脱', '#cdf4ff', true);
        blip(880, 0.06, 0.14);
      }
      return;
    }

    // 冰·蓄力前刺：短暂突进（带冰痕）
    if (me.dash && me.dash.t < me.dash.dur){
      const dash = me.dash;
      dash.t += dt;
      me.x += Math.cos(dash.ang) * dash.speed * dt;
      me.y += Math.sin(dash.ang) * dash.speed * dt;
      iceFx.push({ kind:'trail', x:me.x, y:me.y, r:UI.R*0.55, t:0, life:0.4, hit:false, dmg:2, owner:me });
      // 角色间最小间距是 2R，阈值必须大于 2R；每个目标只吃一次突进伤害
      dash.hits = dash.hits || {};
      enemiesOf(me).forEach(q=>{
        if (!dash.hits[q.i] && dist(me, q) <= UI.R*2.45){
          dash.hits[q.i] = 1;
          strikeEnemy(me, q, now, { type:'ice', dmg: dash.dmg, freeze:true });
        }
      });
      if (dash.t >= dash.dur) me.dash = null;
    }

    // 大招引导期间 / 凝霜期间锁定移动（凝霜不封锁技能释放）
    const frozen = (now < (me.frostFreezeEnd || 0));
    const vx = (me.ultActive || frozen) ? 0 : (me.jx || 0),
          vy = (me.ultActive || frozen) ? 0 : (me.jy || 0);
    const len = Math.hypot(vx, vy);
    if (len > 0.12){
      let spdMul = (me.wetEnd > now && me.elem === 'fire') ? 0.72 : 1;
      if (now < me.slowEnd) spdMul *= 0.62;
      if (now < me.mildSlowEnd) spdMul *= 0.82;
      if (me.frostStacks) spdMul *= Math.max(0.3, 1 - ICE_FROST.slowPer * me.frostStacks);
      if (me.waterStacks) spdMul *= Math.max(0.4, 1 - MARK.soak.slowPer * me.waterStacks);
      if (me.collapseStacks) spdMul *= Math.max(0.35, 1 - MARK.collapse.slowPer * me.collapseStacks);
      if (me.soakStunEnd > now) spdMul *= 0.35;      // 浸滞：大幅减速
      me.x += vx / Math.max(len,1) * UI.speed * spdMul * dt;
      me.y += vy / Math.max(len,1) * UI.speed * spdMul * dt;
      if (Math.abs(vx) > 0.15) me.face = vx > 0 ? 1 : -1;
    }
    const R = UI.R;
    me.x = clamp(me.x, R + 10*S, W - R - 10*S);
    me.y = clamp(me.y, UI.top + R + 10*S, UI.bottom - R - 6*S);
    // 风·击退余速
    if (me.knockX || me.knockY){
      me.x += me.knockX * dt; me.y += me.knockY * dt;
      const decay = Math.pow(0.12, dt);
      me.knockX *= decay; me.knockY *= decay;
      if (Math.abs(me.knockX) < 6) me.knockX = 0;
      if (Math.abs(me.knockY) < 6) me.knockY = 0;
      me.x = clamp(me.x, R + 10*S, W - R - 10*S);
      me.y = clamp(me.y, UI.top + R + 10*S, UI.bottom - R - 6*S);
    }
    // 坍缩标记的持续单向引力：每层把目标拽向暗涡晶核
    if (me.collapseStacks && me.collapseSrc && now < (me.collapseEnd || 0)){
      const gx = me.collapseSrc.x - me.x, gy = me.collapseSrc.y - me.y;
      const gd = Math.hypot(gx, gy) || 1;
      const force = 22 * S * me.collapseStacks * (me.collapseBoost || 1) * dt;
      me.x += gx/gd * force; me.y += gy/gd * force;
      me.x = clamp(me.x, R + 10*S, W - R - 10*S);
      me.y = clamp(me.y, UI.top + R + 10*S, UI.bottom - R - 6*S);
    }
    resolvePillars(me);
    resolveRockSolid(me);
  });

  updateStealth(now);
  allPlayers().forEach(pl=>{ updateDash(pl, now); dashTouchFire(pl, now); });
  updateLightAura(dt, now);
  updateLightGlows(dt);
  {
    const list = allPlayers().filter(pl => !pl.dead);
    const minD = UI.R * 2.0;
    for (let a=0; a<list.length; a++){
      for (let b=a+1; b<list.length; b++){
        const A = list[a], B = list[b];
        const d = dist(A, B);
        if (d < minD && d > 0.01){
          const dx = (A.x - B.x)/d, dy = (A.y - B.y)/d;
          const push = (minD - d) * 0.5;
          A.x += dx*push; A.y += dy*push;
          B.x -= dx*push; B.y -= dy*push;
        }
      }
    }
    list.forEach(resolvePillars);
    list.forEach(resolveRockSolid);
  }

  updateCombat(dt, now);

  allPlayers().forEach(p=>{
    if (!p) return;
    p.hpShow += (p.hp - p.hpShow) * Math.min(1, dt*8);
    if (p.hitFlash > 0) p.hitFlash -= dt;
    if (p.swing > 0) p.swing -= dt;
  });
}

/* ================= 光·光谱分序 / 暗·熵影溯轨（v0.8.7） ================= */
const LIGHT_ULT = { dur:3720, p1:440, p2:1840, p3:2440, p4:3120, maxR:172,
                    tickGap:205, tickDmg:6, burst:145, cd:42, name:'光谱分序' };
let lightUlts = [];

const DARK_ULT = { dur:3700, p1:430, p2:1830, p3:2420, p4:3100,
                   tickGap:130, tickDmg:2.6, burst:61, cd:42, name:'熵影溯轨' };
let darkUlts = [];

/* 近期位移轨迹：供暗大招回溯复刻 */
function updatePlayerTrails(now){
  allPlayers().forEach(p=>{
    if (!p) return;
    if (!p.trail) p.trail = [];
    const lastPt = p.trail[p.trail.length-1];
    if (!lastPt || now - lastPt.t >= 150){
      p.trail.push({ x:p.x, y:p.y, t:now });
      while (p.trail.length > 22) p.trail.shift();
    }
  });
}

function lightUltRadius(t){
  const maxR = LIGHT_ULT.maxR * S;
  if (t < LIGHT_ULT.p1) return 0;
  if (t < LIGHT_ULT.p2) return maxR * ((t - LIGHT_ULT.p1) / (LIGHT_ULT.p2 - LIGHT_ULT.p1));
  return maxR;
}
function lightInDiamond(lu, q, rad){
  const dx = Math.abs(q.x - lu.x), dy = Math.abs(q.y - lu.y);
  return (dx + dy) <= rad;
}

function useLightUlt(p, now, ult){
  const aim = bhAimPoint(p, 3.2);
  lightUlts.push({ owner:p, x:p.x, y:p.y, t0:now, dur:LIGHT_ULT.dur,
                   aim:{x:aim.x,y:aim.y}, last:{}, burst:false, flashAt:0,
                   shards:[], nodes:[] });
  p.ultEnd = now + (ult.cd || LIGHT_ULT.cd) * 1000;
  p.ultActive = false;
  pushFloat(p.x, p.y - UI.R*2.2, LIGHT_ULT.name, '#fff4d6', true);
  blip(1180, 0.16, 0.42);
  return true;
}

function updateLightUlts(now, dt){
  const R = UI.R;
  for (let i = lightUlts.length - 1; i >= 0; i--){
    const lu = lightUlts[i];
    const t = now - lu.t0;
    if (t >= lu.dur){ lightUlts.splice(i,1); continue; }
    const rad = lightUltRadius(t);
    if (t >= LIGHT_ULT.p1 && t < LIGHT_ULT.p3){
      enemiesOf(lu.owner).forEach(q=>{
        if (q.dead) return;
        if (!lightInDiamond(lu, q, rad)) return;
        q.spectrumEnd = Math.max(q.spectrumEnd || 0, now + 900);   // 网格内标记不衰减
        const key = 'q'+(q.i||0);
        if (!lu.last[key] || now - lu.last[key] >= LIGHT_ULT.tickGap){
          lu.last[key] = now;
          const s2 = q.spectrumStacks || 0;
          hitEnemy(lu.owner, q, now, { type:'light', dmg: LIGHT_ULT.tickDmg * (1 + 0.05*s2) });
          q.spectrumStacks = Math.min(5, s2 + 1);
        }
      });
    }
    if (t >= LIGHT_ULT.p4 && !lu.burst){
      lu.burst = true; lu.flashAt = now;
      enemiesOf(lu.owner).forEach(q=>{
        if (q.dead) return;
        const dx = Math.abs(q.x-lu.x), dy = Math.abs(q.y-lu.y);
        const dNorm = (dx+dy) / Math.max(rad, 1);
        if (dNorm > 1.3) return;
        const fall = clamp(1 - 0.62*dNorm, 0.3, 1);       // 网格交汇核心最痛
        const s2 = q.spectrumStacks || 0;
        hitEnemy(lu.owner, q, now, { type:'light', dmg: LIGHT_ULT.burst * fall * (1 + 0.06*s2) });
        q.spectrumEnd = now + 650;
      });
      for (let k = 0; k < 26; k++){
        const a = rnd(0, Math.PI*2);
        lu.shards.push({ x:lu.x, y:lu.y, vx:Math.cos(a)*rnd(40,150)*S, vy:Math.sin(a)*rnd(40,150)*S,
                         r:rnd(2,8)*S, t:0, life:rnd(0.7,1.1),
                         c:['#FFD772','#72D8FF','#B888FF','#FFF2CC'][k%4] });
      }
      blip(1250, 0.2, 0.5);
    }
    lu.shards.forEach(sh=>{
      sh.t += dt; sh.x += sh.vx*dt; sh.y += sh.vy*dt;
      sh.vx *= 0.97; sh.vy *= 0.97;
    });
    lu.shards = lu.shards.filter(sh=> sh.t < sh.life);
  }
  allPlayers().forEach(q=>{
    if (q && (q.spectrumStacks||0) > 0 && now >= (q.spectrumEnd||0)) q.spectrumStacks = 0;
  });
}

/* ---------------- 暗大招 ---------------- */
function darkTrackFromTrail(q){
  const pts = [];
  const tr = (q.trail || []).slice(-16);
  if (tr.length >= 4){
    tr.forEach(pt=> pts.push({ x:pt.x, y:pt.y }));
  } else {
    const dir = q.face >= 0 ? 1 : -1;
    for (let i = 4; i >= 0; i--) pts.push({ x:q.x - dir*i*38*S, y:q.y + Math.sin(i*0.9)*10*S });
  }
  return pts;
}

function useDarkUlt(p, now, ult){
  const tracks = [];
  enemiesOf(p).forEach(q=>{
    if (q.dead) return;
    const base = darkTrackFromTrail(q);
    tracks.push({ pts:base, qId:q.i||0, ph:Math.random()*2 });
    // 同源偏移影轨（交错复刻）
    const off = { pts: base.map(pt=>({ x:pt.x + 34*S*Math.sin(pt.y*0.02 + 1), y:pt.y - 30*S })), qId:q.i||0, ph:Math.random()*2 };
    tracks.push(off);
  });
  if (!tracks.length) tracks.push({ pts:[{x:p.x,y:p.y},{x:p.x+120*S,y:p.y}], qId:0, ph:0 });
  darkUlts.push({ owner:p, x:p.x, y:p.y, t0:now, dur:DARK_ULT.dur,
                  tracks, last:{}, burst:false, flashAt:0, shards:[] });
  p.ultEnd = now + (ult.cd || DARK_ULT.cd) * 1000;
  p.ultActive = false;
  pushFloat(p.x, p.y - UI.R*2.2, DARK_ULT.name, '#c4a6ff', true);
  blip(60, 0.16, 0.44);
  return true;
}

function darkDistToTrack(track, x, y){
  let best = 1e9;
  const pts = track.pts;
  for (let i = 0; i < pts.length; i++){
    const a = pts[i], b = pts[i+1] || pts[i];
    const dx = b.x-a.x, dy = b.y-a.y;
    const len2 = dx*dx + dy*dy || 1;
    const u = clamp(((x-a.x)*dx + (y-a.y)*dy)/len2, 0, 1);
    const px = a.x + dx*u, py = a.y + dy*u;
    const d = Math.hypot(x-px, y-py);
    if (d < best) best = d;
  }
  return best;
}

function updateDarkUlts(now, dt){
  const R = UI.R;
  for (let i = darkUlts.length - 1; i >= 0; i--){
    const du = darkUlts[i];
    const t = now - du.t0;
    if (t >= du.dur){ darkUlts.splice(i,1); continue; }
    const hitR = 34*S;
    if (t >= DARK_ULT.p1 && t < DARK_ULT.p3){
      enemiesOf(du.owner).forEach(q=>{
        if (q.dead) return;
        let near = false;
        du.tracks.forEach(tr=>{ if (darkDistToTrack(tr, q.x, q.y) <= hitR) near = true; });
        if (!near) return;
        q.entropyEnd = Math.max(q.entropyEnd || 0, now + 900);
        if (t >= DARK_ULT.p2 && t < DARK_ULT.p3){    // 阶段3：影链锁在轨迹上
          q.slowEnd = Math.max(q.slowEnd || 0, now + 260);
        }
        const key = 'q'+(q.i||0);
        if (!du.last[key] || now - du.last[key] >= DARK_ULT.tickGap){
          du.last[key] = now;
          const s2 = q.entropyStacks || 0;
          hitEnemy(du.owner, q, now, { type:'dark', dmg: DARK_ULT.tickDmg * (1 + 0.05*s2) });
          q.entropyStacks = Math.min(5, s2 + 1);
        }
      });
    }
    if (t >= DARK_ULT.p4 && !du.burst){
      du.burst = true; du.flashAt = now;
      enemiesOf(du.owner).forEach(q=>{
        if (q.dead) return;
        let best = 1e9;
        du.tracks.forEach(tr=>{ const d2 = darkDistToTrack(tr, q.x, q.y); if (d2 < best) best = d2; });
        if (best > hitR*2.2) return;
        const fall = clamp(1 - best/(hitR*2.2)*0.6, 0.35, 1);   // 轨迹上最痛，离轨衰减
        const s2 = q.entropyStacks || 0;
        hitEnemy(du.owner, q, now, { type:'dark', dmg: DARK_ULT.burst * fall * (1 + 0.06*s2) });
        q.entropyEnd = now + 620;
      });
      for (let k = 0; k < 24; k++){
        const tr = du.tracks[k % du.tracks.length];
        const pt = tr.pts[Math.floor(Math.random()*tr.pts.length)] || {x:du.x,y:du.y};
        du.shards.push({ x:pt.x, y:pt.y, vx:rnd(-90,90)*S, vy:rnd(-90,90)*S,
                         r:rnd(2,8)*S, t:0, life:rnd(0.7,1.1) });
      }
      blip(50, 0.22, 0.5);
    }
    du.shards.forEach(sh=>{ sh.t += dt; sh.x += sh.vx*dt; sh.y += sh.vy*dt; sh.vx*=0.97; sh.vy*=0.97; });
    du.shards = du.shards.filter(sh=> sh.t < sh.life);
  }
  allPlayers().forEach(q=>{
    if (q && (q.entropyStacks||0) > 0 && now >= (q.entropyEnd||0)) q.entropyStacks = 0;
  });
}

/* ---- 光大招绘制 ---- */
function drawLightSpectrumLow(now){
  const R = UI.R;
  lightUlts.forEach(lu=>{
    const t = now - lu.t0;
    if (t < 0 || t >= LIGHT_ULT.dur) return;
    const rad = lightUltRadius(t);
    const out = clamp(1 - (t - LIGHT_ULT.p4)/500, 0, 1);
    if (rad <= 0) return;
    ctx.save();
    ctx.translate(lu.x, lu.y);
    // 低层柔光雾
    const fog = ctx.createRadialGradient(0, 0, rad*0.2, 0, 0, rad*1.25);
    fog.addColorStop(0, 'rgba(255,248,230,0.10)');
    fog.addColorStop(1, 'rgba(255,248,230,0)');
    ctx.fillStyle = fog;
    ctx.beginPath(); ctx.arc(0, 0, rad*1.25, 0, Math.PI*2); ctx.fill();
    // 菱形光栅网格（三色基色交错）
    const step = Math.max(24*S, rad/4.2);
    const cols = ['#FFD772','#72D8FF','#B888FF'];
    for (let k = -6; k <= 6; k++){
      const off = k*step;
      const lim = rad - Math.abs(off);
      if (lim <= 0) continue;
      ctx.strokeStyle = k % 3 === 0 ? 'rgba(255,255,255,0.42)' : (cols[Math.abs(k)%3] + '66');
      ctx.lineWidth = 1.2*S;
      ctx.globalAlpha = 0.55 + 0.25*Math.sin(now/420 + k);
      ctx.beginPath();
      ctx.moveTo(off - lim, -lim); ctx.lineTo(off + lim, lim); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(off - lim, lim); ctx.lineTo(off + lim, -lim); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // 外框
    ctx.strokeStyle = 'rgba(248,248,255,' + (0.5*Math.max(out,0.4)) + ')';
    ctx.lineWidth = 1.6*S;
    ctx.beginPath();
    ctx.moveTo(0, -rad); ctx.lineTo(rad, 0); ctx.lineTo(0, rad); ctx.lineTo(-rad, 0); ctx.closePath(); ctx.stroke();
    // 光尘
    for (let i = 0; i < 26; i++){
      const a = i*2.4 + now/1400;
      const rr = rad * ((i%7)+1)/8;
      const px = Math.cos(a)*rr, py = Math.sin(a)*rr*0.9;
      ctx.fillStyle = 'rgba(255,242,204,' + (0.35 + 0.3*Math.abs(Math.sin(now/500+i))) + ')';
      ctx.beginPath(); ctx.arc(px, py, (1 + (i%3))*S, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  });
}

function drawLightSpectrumHigh(now){
  lightUlts.forEach(lu=>{
    const t = now - lu.t0;
    if (t < 0 || t >= LIGHT_ULT.dur) return;
    const rad = lightUltRadius(t);
    if (rad <= 0) return;
    // 分光节点：沿光路往复滑动
    const tPhase = (t >= LIGHT_ULT.p3) ? 1 : (t - LIGHT_ULT.p1)/(LIGHT_ULT.p3 - LIGHT_ULT.p1);
    const nodes = [];
    for (let k = 0; k < 7; k++){
      const ang = (-Math.PI*2/3) + k*(Math.PI/3) + Math.sin(now/1200 + k)*0.1;
      const rr = rad * (0.42 + 0.5*Math.abs(Math.sin(now/620 + k*1.7)));
      nodes.push({ x:lu.x + Math.cos(ang)*rr, y:lu.y + Math.sin(ang)*rr*0.92, k });
    }
    nodes.forEach(nd=>{
      const c = ['#FFD772','#72D8FF','#B888FF'][nd.k%3];
      const g = ctx.createRadialGradient(nd.x, nd.y, 0, nd.x, nd.y, 14*S);
      g.addColorStop(0, 'rgba(255,255,255,0.95)');
      g.addColorStop(0.35, c + 'CC');
      g.addColorStop(1, c + '00');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(nd.x, nd.y, 14*S, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(248,248,255,0.8)';
      ctx.lineWidth = 1.4*S;
      ctx.beginPath(); ctx.arc(nd.x, nd.y, 5*S, 0, Math.PI*2); ctx.stroke();
    });
    // 阶段4：横向分光断层
    if (t >= LIGHT_ULT.p4){
      const k = clamp((t - LIGHT_ULT.p4)/620, 0, 1);
      const bw = rad * 2.1;
      const y = lu.y + (k - 0.5) * rad * 1.2;
      const gh = ctx.createLinearGradient(0, y - 26*S, 0, y + 26*S);
      gh.addColorStop(0, 'rgba(255,255,255,0)');
      gh.addColorStop(0.42, 'rgba(255,255,255,0.55)');
      gh.addColorStop(0.5, 'rgba(255,255,255,0.95)');
      gh.addColorStop(0.58, 'rgba(255,255,255,0.55)');
      gh.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gh;
      ctx.fillRect(lu.x - bw/2, y - 26*S, bw, 52*S);
      // 色散光痕
      ['#FFD772','#72D8FF','#B888FF'].forEach((c, i)=>{
        ctx.fillStyle = c + '55';
        ctx.fillRect(lu.x - bw/2, y + (i-1)*7*S, bw, 3*S);
      });
      // 白闪
      if (now - lu.flashAt < 90){
        ctx.fillStyle = 'rgba(255,255,255,0.24)';
        ctx.fillRect(0, UI.top, W, UI.bottom - UI.top);
      }
    }
    // 光屑碎片
    lu.shards.forEach(sh=>{
      const a = 1 - sh.t / sh.life;
      ctx.fillStyle = sh.c + Math.round(200*a).toString(16).padStart(2,'0');
      ctx.beginPath(); ctx.arc(sh.x, sh.y, sh.r*(0.6+a*0.4), 0, Math.PI*2); ctx.fill();
    });
  });
}

/* ---- 暗大招绘制 ---- */
function drawDarkTrackLow(now){
  darkUlts.forEach(du=>{
    const t = now - du.t0;
    if (t < 0 || t >= DARK_ULT.dur) return;
    const out = clamp(1 - (t - DARK_ULT.p4)/520, 0, 1);
    ctx.save();
    // 晦雾
    const fog = ctx.createRadialGradient(du.x, du.y, 10*S, du.x, du.y, 260*S);
    fog.addColorStop(0, 'rgba(34,12,51,0.30)');
    fog.addColorStop(1, 'rgba(34,12,51,0)');
    ctx.fillStyle = fog;
    ctx.beginPath(); ctx.arc(du.x, du.y, 260*S, 0, Math.PI*2); ctx.fill();
    // 回溯影轨
    du.tracks.forEach(tr=>{
      const pts = tr.pts;
      if (pts.length < 2) return;
      ctx.strokeStyle = 'rgba(48,16,72,' + (0.75*Math.max(out,0.3)) + ')';
      ctx.lineWidth = 15*S;
      ctx.beginPath(); pts.forEach((pt,i)=> i? ctx.lineTo(pt.x,pt.y) : ctx.moveTo(pt.x,pt.y)); ctx.stroke();
      ctx.strokeStyle = 'rgba(22,6,34,' + (0.9*Math.max(out,0.3)) + ')';
      ctx.lineWidth = 7*S;
      ctx.beginPath(); pts.forEach((pt,i)=> i? ctx.lineTo(pt.x,pt.y) : ctx.moveTo(pt.x,pt.y)); ctx.stroke();
      // 暗纹
      ctx.strokeStyle = 'rgba(11,4,18,0.85)';
      ctx.lineWidth = 1.2*S;
      ctx.beginPath(); pts.forEach((pt,i)=> i? ctx.lineTo(pt.x,pt.y) : ctx.moveTo(pt.x,pt.y)); ctx.stroke();
      // 影尘
      for (let i = 0; i < 14; i++){
        const pt = pts[(i*3)%pts.length];
        const ox = Math.sin(now/900 + i)*8*S, oy = Math.cos(now/760 + i*1.3)*8*S;
        ctx.fillStyle = 'rgba(58,20,80,' + (0.5 + 0.3*Math.abs(Math.sin(now/500+i))) + ')';
        ctx.beginPath(); ctx.arc(pt.x + ox, pt.y + oy, (1 + i%3)*S, 0, Math.PI*2); ctx.fill();
      }
    });
    ctx.restore();
  });
}

function drawDarkTrackHigh(now){
  darkUlts.forEach(du=>{
    const t = now - du.t0;
    if (t < 0 || t >= DARK_ULT.dur) return;
    // 滑行节点
    du.tracks.forEach(tr=>{
      const pts = tr.pts;
      if (pts.length < 2) return;
      const seg = pts.length - 1;
      const speed = (t >= DARK_ULT.p2) ? 0.0 : 0.55;      // 阶段3起节点停在轨迹终点
      pts.forEach((pt, i)=>{
        const near = i / Math.max(1, seg);
        const a = Math.sin(now/700 + tr.ph + i*0.6);
        const px = pt.x + Math.cos(a)*3*S;
        const py = pt.y + Math.sin(a)*3*S;
        const c = 'rgba(202,168,255,' + (0.65 + 0.3*a) + ')';
        ctx.fillStyle = c;
        ctx.beginPath(); ctx.arc(px, py, 3.4*S, 0, Math.PI*2); ctx.fill();
      });
      // 阶段3：影链收紧
      if (t >= DARK_ULT.p2 && t < DARK_ULT.p4){
        ctx.strokeStyle = 'rgba(48,16,72,0.8)';
        ctx.lineWidth = 2*S;
        ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); ctx.lineTo(pts[pts.length-1].x, pts[pts.length-1].y); ctx.stroke();
      }
    });
    // 阶段4：逆向熵冲击
    if (t >= DARK_ULT.p4){
      const k = clamp((t - DARK_ULT.p4)/500, 0, 1);
      du.tracks.forEach(tr=>{
        const pts = tr.pts;
        const idx = Math.max(0, Math.min(pts.length-1, Math.floor((1-k)*pts.length)));
        const pt = pts[idx];
        const g = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, 40*S);
        g.addColorStop(0, 'rgba(0,0,0,0.55)');
        g.addColorStop(0.4, 'rgba(34,12,51,0.45)');
        g.addColorStop(1, 'rgba(22,6,34,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, 40*S, 0, Math.PI*2); ctx.fill();
      });
      if (now - du.flashAt < 90){
        ctx.fillStyle = 'rgba(60,20,90,0.23)';
        ctx.fillRect(0, UI.top, W, UI.bottom - UI.top);
      }
    }
    // 暗影碎片
    du.shards.forEach(sh=>{
      const a = 1 - sh.t / sh.life;
      ctx.fillStyle = 'rgba(58,20,80,' + (0.8*a) + ')';
      ctx.beginPath(); ctx.arc(sh.x, sh.y, sh.r*(0.5+a*0.5), 0, Math.PI*2); ctx.fill();
    });
  });
}

/* 冰皮肤：柔和粉覆盖（让冰系技能与环绕冰块偏粉，压低亮度） */
function drawIceSkinVeil(now){
  const R = UI.R;
  const pulse = 0.9 + 0.1*Math.sin(now/900);
  // 大招冰域：整片染粉
  iceFields.forEach(f=>{
    const t = now - f.t0;
    if (t < 0 || t >= ICE_FIELD.dur) return;
    const rad = iceRadius(f, now);
    if (rad <= 0) return;
    const g = ctx.createRadialGradient(f.x, f.y, rad*0.25, f.x, f.y, rad*1.05);
    g.addColorStop(0, 'rgba(255,214,236,0.26)');
    g.addColorStop(0.7, 'rgba(255,186,222,0.18)');
    g.addColorStop(1, 'rgba(255,170,214,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(f.x, f.y, rad*1.05, 0, Math.PI*2); ctx.fill();
  });
  // 冰元素本体与环绕冰块：局部柔粉
  allPlayers().forEach(p=>{
    if (!p || p.dead || p.elem !== 'ice') return;
    const g = ctx.createRadialGradient(p.x, p.y, R*0.5, p.x, p.y, R*2.5);
    g.addColorStop(0, 'rgba(255,220,240,' + (0.16*pulse) + ')');
    g.addColorStop(0.5, 'rgba(255,196,228,' + (0.10*pulse) + ')');
    g.addColorStop(1, 'rgba(255,170,214,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, R*2.5, 0, Math.PI*2); ctx.fill();
  });
}

function codexLayout(){
  const listX = Math.round(16*S), listW = Math.round(158*S);
  const listY = Math.round(56*S), itemH = Math.round(26*S), gap = Math.round(4*S);
  const items = ALL_KEYS.map((k,i)=>({
    key:k, i, x:listX, y:listY + i*(itemH+gap), w:listW, h:itemH
  }));
  const px = listX + listW + Math.round(14*S);
  const panel = { x:px, y:listY, w:W - px - Math.round(16*S), h:H - listY - Math.round(40*S) };
  const back = { x: W - Math.round(106*S), y: Math.round(16*S), w: Math.round(90*S), h: Math.round(26*S) };
  return { items, panel, back, listY, itemH };
}

/* ========================= 主循环 ========================= */
let last = 0;
function frame(ts){
  if (!last) last = ts;
  let dt = (ts - last)/1000; last = ts;
  dt = Math.min(dt, 0.05);
  const now = performance.now();

  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cvs.width,cvs.height);
  applyView();

  try {
  if (st === ST.INTRO){ drawIntro(ts/1000); }
  else if (st === ST.CODEX){ drawCodex(ts/1000); }
  else if (st === ST.SOLO){ drawSolo(ts/1000); }
  else if (st === ST.HOME){ drawHome(ts/1000); if (panelOpen) drawSettings(); if (previewOpen) drawPreview(); }
  else if (st === ST.SELECT){ selL = selectLayout(); drawSelect(); }
  else if (st === ST.BATTLE){ update(dt, now); drawBattle(now); }
  else if (st === ST.PAUSE){ drawPause(); }
  else if (st === ST.OVER){ const n2 = performance.now(); drawBattle(n2); drawOver(n2); }
  } catch(err){
    // 单帧绘制异常不再中断 RAF，下帧自动恢复
    if (!window.__edErr){ window.__edErr = 1; console.error('frame error', err); }
    ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1; last = 0;
  }

  if (tutOpen){ try { drawTut(ts/1000); } catch(e){} }
  ctx.globalAlpha = 1;                       // 兜底：避免某次绘制漏了 restore 导致后续全透明
  requestAnimationFrame(frame);
}

function markStackOf(def, kind){ const M = MARK[kind]; return (def && def[M.stacks]) || 0; }

function markClear(def, kind){
  const M = MARK[kind];
  if (!def) return;
  def[M.stacks] = 0; def[M.end] = 0;
}

function markAdd(def, now, kind, n){
  const M = MARK[kind];
  if (!def || def.dead) return;
  if (now < (def[M.lock] || 0)) return;
  if (def.dead) return;
  let rate = 1;
  if (kind === 'burn' && def.elecEnd > now) rate = 2;   // 遇雷（感电）：叠加翻倍
  if (kind === 'wind'){                                  // 遇雷 / 水 / 冰标记：叠加翻倍并向外扩散
    if (def.elecEnd > now || def.thunderStacks > 0 || def.waterStacks > 0 || def.frostStacks > 0) rate = 2;
  }
  if (kind === 'soak' && def.soakBoostEnd > now) rate = 2;                          // 受雷：叠加翻倍
  if (kind === 'rock' && (def.burnEnd > now || def.wetEnd > now || def.frostStacks > 0)) rate = 2;   // 触火/水/冰：叠速翻倍
  if (kind === 'collapse' && def.irradStacks > 0) rate = 2;    // 触中子星辐照：叠速翻倍
  if (kind === 'irrad' && (def.thunderStacks > 0 || def.elecEnd > now)) rate = 2;   // 触雷：叠速翻倍
  if (!def[M.acc]) def[M.acc] = now;
  def[M.stacks] = Math.min(M.max, (def[M.stacks] || 0) + (n || 1) * rate);
  if (kind === 'wind') windTracePush(def, now);        // 每层标记留下风迹，供风刃折射 / 斩节点偏轨
  def[M.end] = now + M.dur;
  if (def[M.stacks] >= M.max) markProc(def, now, kind);
}

    }
    bursts.push({ x:def.x, y:def.y, r:R*0.5, to:R*1.7, t:0, life:0.32, col:'#94B8FF', ring:true });
    pushFloat(def.x, def.y - R*1.6, '星爆辐照', '#94B8FF', true);
    blip(1050, 0.10, 0.28);
  } else if (kind === 'rock'){
    def.rockRuptureEnd = now + MARK.rock.ruptureMs;
    def.rockRuptureAt = now;
    for (let i = 0; i < 22; i++){
      const a = Math.random()*Math.PI*2;
      markFx.push({ x:def.x + rnd(-14,14), y:def.y - R*0.4 + rnd(-10,10),
                    vx: Math.cos(a)*rnd(30,90)*S, vy: (-30 + rnd(-30,30))*S,
                    r:(3 + Math.random()*4)*S, t:0, life:0.5, kind:'rock' });
    }
    bursts.push({ x:def.x, y:def.y, r:R*0.5, to:R*1.8, t:0, life:0.35, col:'#C9B896', ring:true });
    pushFloat(def.x, def.y - R*1.6, '岩崩', '#C9B896', true);
    blip(200, 0.12, 0.30);
  } else {
    def.soakStunEnd = now + 1200;      // 滞潮：水膜包裹大幅减速，不封技能
    def.soakFilmAt = now;
    markRings.push({ x:def.x, y:def.y, r:R*0.4, to:R*2.0, t:0, life:0.5, kind:'soak' });
    for (let i = 0; i < 24; i++){

    if ((def.elem === 'ice' || def.frostStacks > 0) && Math.random() < 0.5){

      markFx.push({ x:def.x, y:def.y - R*0.1,
                    vx:Math.cos(a)*sp, vy:Math.sin(a)*sp*0.82,
                    r:(2 + Math.random()*4)*S, t:0, life:0.48, kind:'wind', ang:a, spun:Math.random()*3 });

  def[M.stacks] = 0;
  def[M.end] = 0;

function updateMarks(now, dt){
  const R = UI.R;
  allPlayers().forEach(p=>{
    if (!p) return;
    /* 标记倒计时 / 灼烧持续伤害 */
    ['burn','soak','wind','rock','collapse','irrad'].forEach(kind=>{
      const M = MARK[kind];
      const n = p[M.stacks] || 0;
      if (!n || p.dead) return;
      if (now >= p[M.end]) { p[M.stacks] = 0; return; }
      if (M.dot > 0){
        if (!p[M.acc]) p[M.acc] = now;
        if (now - p[M.acc] >= M.dotGap){
          p[M.acc] = now;
          const dmg = M.dot * n;
          p.hp -= dmg;
          p.hitFlash = Math.max(p.hitFlash || 0, 0.10);
          pushFloat(p.x + rnd(-9, 9), p.y - R*0.95, fmtDmg(dmg), '#ffb066', true);
          if (p.hp <= 0) checkKO(p, now);
        }
      }
    });
    /* 紊裂：气流撕扯持续掉血（只掉血，不封技能） */
    if (!p.dead && p.windRuptureEnd > now){
      if (now - (p.windRuptureAt || 0) >= MARK.wind.ruptureGap){
        p.windRuptureAt = now;
        const dmg = MARK.wind.ruptureDmg * Math.max(1, p.windStacks || 1);
        p.hp -= dmg;
        p.hitFlash = Math.max(p.hitFlash || 0, 0.08);
        pushFloat(p.x + rnd(-9, 9), p.y - R*0.95, fmtDmg(dmg), '#a8f4ff', true);
        if (p.hp <= 0) checkKO(p, now);
      }
    }
    /* 本体待机粒子：火向上飘火星，水向下沉水沫，风螺旋飘散风絮 */
    if (!p.dead){
      if (p.elem === 'fire'){
        let n = 7;
        while (n-- > 0){
          if (Math.random() < 0.35) continue;
          markFx.push({ x:p.x + rnd(-R*0.7, R*0.7), y:p.y + rnd(-R*0.3, R*0.5),
                        vx:rnd(-6,6)*S, vy:(-24 - Math.random()*30)*S,
                        r:(1 + Math.random()*2)*S, t:0, life:0.9 + Math.random()*0.5, kind:'burnIdle' });
        }
      } else if (p.elem === 'water'){
        let n2 = 6;
        while (n2-- > 0){
          if (Math.random() < 0.4) continue;
          markFx.push({ x:p.x + rnd(-R*0.7, R*0.7), y:p.y - R*0.2,
                        vx:rnd(-5,5)*S, vy:(10 + Math.random()*22)*S,
                        r:(1 + Math.random()*1.4)*S, t:0, life:0.9 + Math.random()*0.5, kind:'soakIdle' });
        }
      } else if (p.elem === 'wind'){
        let n3 = 6;
        const baseA = now/420 + (p.spawnSeed || 0);
        while (n3-- > 0){
          if (Math.random() < 0.35) continue;
          const a0 = baseA + n3*1.05 + Math.random()*0.3;
          markFx.push({ x:p.x + Math.cos(a0)*R*0.55, y:p.y + Math.sin(a0)*R*0.4,
                        vx:Math.cos(a0+1.5)*(14 + Math.random()*18)*S,
                        vy:Math.sin(a0+1.5)*(14 + Math.random()*18)*S - 6*S,
                        r:(1 + Math.random()*1.2)*S, t:0, life:0.85 + Math.random()*0.6, kind:'windIdle' });
        }
      }
    }
  });

  /* 粒子推进 */
  markFx.forEach(f=>{
    f.x += f.vx * dt; f.y += f.vy * dt; f.t += dt;
    if (f.kind === 'burn'){ f.vx *= 0.90; f.vy = f.vy * 0.90 - 26*S*dt; }
    else if (f.kind === 'soak'){ f.vx *= 0.90; f.vy *= 0.90; }
    else if (f.kind === 'wind'){ f.vx *= 0.94; f.vy *= 0.94; f.spun = (f.spun || 0) + dt*9; }
    else if (f.kind === 'collapse'){ f.vx *= 0.90; f.vy *= 0.90; }
    else if (f.kind === 'irrad'){ f.vx *= 0.93; f.vy *= 0.93; }
    else if (f.kind === 'windIdle'){ f.vx += Math.cos(f.t*6)*18*S*dt; f.vy += Math.sin(f.t*7)*14*S*dt; }
  });
  markFx = markFx.filter(f=> f.t < f.life);
  if (markFx.length > 320) markFx.splice(0, markFx.length - 320);

  markRings.forEach(r2=>{ r2.t += dt; r2.r += (r2.to - r2.r) * Math.min(1, dt*10); });
  markRings = markRings.filter(r2=> r2.t < r2.life);
}

/* 标记层绘制：层数指示 / 水膜 / 焦痕 / 焚爆冲击波 / 粒子 */
