let CW = 0, CH = 0, DPR = 1;
let W = 0, H = 0;
let S = 1;
let portrait = false;
let flipped = false;

function resize(){
  CW = window.innerWidth; CH = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  cvs.width  = Math.round(CW * DPR);
  cvs.height = Math.round(CH * DPR);
  cvs.style.width  = CW + 'px';
  cvs.style.height = CH + 'px';
  portrait = CH > CW * 1.02;
  if (portrait){ W = CH; H = CW; } else { W = CW; H = CH; }
  S = Math.max(0.5, Math.min(W / 880, H / 420));
  layoutUI();
}
function applyView(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!portrait) return;
  if (!flipped){ ctx.translate(CW, 0); ctx.rotate(Math.PI / 2); }
  else { ctx.translate(0, CH); ctx.rotate(-Math.PI / 2); }
}
function toLogic(px, py){
  if (!portrait) return { x: px, y: py };
  if (!flipped)  return { x: py, y: CW - px };
  return { x: CH - py, y: px };
}

/* ---------- 程序化 BGM ---------- */
let actx = null, bgmGain = null, musicOn = true, schedTimer = null, nextNote = 0, stepIdx = 0;
const PROG = [
  [220.00, 277.18, 329.63, 277.18],
  [174.61, 220.00, 261.63, 220.00],
  [261.63, 329.63, 392.00, 329.63],
  [196.00, 246.94, 293.66, 246.94]
];
function audioInit(){
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    actx = new AC();
    bgmGain = actx.createGain();
    bgmGain.gain.value = musicOn ? 0.9 : 0;
    bgmGain.connect(actx.destination);
    nextNote = actx.currentTime + 0.1;
    schedTimer = setInterval(schedBGM, 100);
  } catch(e){ actx = null; }
}
function tone(freq, at, dur, vol, type){
  if (!actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'triangle';
    o.frequency.setValueAtTime(freq, at);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(bgmGain);
    o.start(at); o.stop(at + dur + 0.05);
  } catch(e){}
}
function schedBGM(){
  if (!actx || !musicOn) return;
  const now = actx.currentTime;
  if (nextNote < now) nextNote = now + 0.05;
  while (nextNote < now + 0.6){
    const bar = PROG[Math.floor(stepIdx / 8) % PROG.length];
    tone(bar[stepIdx % 4], nextNote, 0.24, 0.100, 'triangle');
    tone(bar[(stepIdx + 2) % 4] * 1.5, nextNote, 0.16, 0.045, 'sine');
    if (stepIdx % 4 === 0){
      tone(72, nextNote, 0.14, 0.07, 'sine');           // 低频脉冲
      tone(bar[0] * 0.5, nextNote, 1.9, 0.055, 'sine');
    }
    if (stepIdx % 8 === 4){
      tone(bar[2] * 0.5, nextNote + 0.55, 1.1, 0.038, 'sine');
    }
    nextNote += 0.23; stepIdx++;
  }
}
function blip(freq, vol, dur){
  if (!actx) return;
  const now = actx.currentTime;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(vol || 0.06, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + (dur || 0.12));
    o.connect(g); g.connect(actx.destination);
    o.start(now); o.stop(now + (dur || 0.12) + 0.03);
  } catch(e){}
}

const ELEM_BEATS = { water:'fire', fire:'ice', ice:'rock', rock:'wind', wind:'thunder', thunder:'water',

const ELEM_BEATS_MORE = { dark:['fire','thunder','rock'] };
const ELEM_ADV_MUL = 1.35;     // 克制方伤害倍率
const ELEM_DIS_MUL = 0.78;     // 被克制方伤害倍率
const ELEM_RING_TEXT = '水→火→冰→岩→风→雷→水　｜　光→暗　｜　暗→火/雷/岩';

function beatsList(k){
  const out = [];
  if (ELEM_BEATS[k]) out.push(ELEM_BEATS[k]);
  (ELEM_BEATS_MORE[k] || []).forEach(t=>{ if (out.indexOf(t) < 0) out.push(t); });
  return out;
}
function beatenByList(k){
  const out = [];
  for (const a in ELEM_BEATS){ if (ELEM_BEATS[a] === k) out.push(a); }
  for (const a in ELEM_BEATS_MORE){ if (ELEM_BEATS_MORE[a].indexOf(k) >= 0) out.push(a); }
  return out;
}
function elemMul(attElem, defElem){
  if (!attElem || !defElem || attElem === defElem) return 1;
  if (ELEM_BEATS[attElem] === defElem) return ELEM_ADV_MUL;          // 我克你（主链）
  if (ELEM_BEATS[defElem] === attElem) return ELEM_DIS_MUL;          // 我被你克（主链）
  if (beatsList(attElem).indexOf(defElem) >= 0) return ELEM_ADV_MUL; // 我克你（一对多：暗克阳）
  if (beatsList(defElem).indexOf(attElem) >= 0) return ELEM_DIS_MUL; // 我被你克（一对多）
  return 1;
}
function elemMulMark(m){ return m > 1 ? '▲' : (m < 1 ? '▽' : ''); }
function elemBeats(k){
  const list = beatsList(k);
  return list.length ? list.map(t => ELEM[t].name).join('/') : '—';
}

const rnd = (a,b)=> a + Math.random()*(b-a);

function hash(n){ const x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); }
function rrPath(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function inRect(px,py,x,y,w,h){ return px>=x && px<=x+w && py>=y && py<=y+h; }
function inCircle(px,py,cx,cy,r){ return (px-cx)*(px-cx)+(py-cy)*(py-cy) <= r*r; }

function buildMap(){
  MAP.id = mapId;
  _floorCache = null; _floorKey = '';
  MAP.pillars = [];
  MAP.decals = [];
  if (mapId === 'arena'){
    // 试验场：无障碍空场，只做地面与边界提示
    MAP.name = '试验场';
    return;
  }
  // 元素遗迹：石砖地面（纯装饰，没有任何阻挡物，场地全程连通）+ 静态符文
  MAP.name = '元素遗迹';
  const top = UI.top, bot = UI.bottom;
  const cx = W * 0.5, cy = (top + bot) / 2;
  MAP.pillars = [];                     // 石柱已移除：不再分割场地，也不再挡弹体
  // 符文：坐标一次算死，绘制时不掺任何随机（原来每帧随机会闪）
  MAP.decals = [
    { x:cx, y:cy, s:UI.R * 2.6, kind:'rune' },
    { x:cx, y:top + (bot - top) * 0.10, s:UI.R * 1.15, kind:'rune' },
    { x:cx, y:bot - (bot - top) * 0.10, s:UI.R * 1.15, kind:'rune' },
    { x:cx - W * 0.34, y:cy, s:UI.R * 1.0, kind:'rune' },
    { x:cx + W * 0.34, y:cy, s:UI.R * 1.0, kind:'rune' }
  ];
}
function pillarAt(x, y, rad){
  for (const o of MAP.pillars){
    if (Math.hypot(x-o.x, y-o.y) < o.r + rad) return o;
  }
  return null;
}
function resolveRockSolid(pl){
  const R = UI.R;
  const solids = [];
  if (rockCols) rockCols.forEach(c=>{ if (c.solid) solids.push(c); });
  if (typeof rockWalls !== 'undefined' && rockWalls) rockWalls.forEach(c=> solids.push(c));
  for (const c of solids){
    const halfW = c.w/2, rad = R*0.92;
    if (pl.x + rad <= c.x - halfW || pl.x - rad >= c.x + halfW) continue;
    if (pl.y + rad <= c.y0 || pl.y - rad >= c.y1) continue;
    // 水平方向顶出（岩墙竖立，从两侧推开最自然）
    const pushL = (c.x - halfW) - (pl.x + rad);
    const pushR = (c.x + halfW) - (pl.x - rad);
    if (Math.abs(pushL) < Math.abs(pushR)) pl.x = c.x - halfW - rad;
    else pl.x = c.x + halfW + rad;
  }
}

function resolvePillars(pl){
  MAP.pillars.forEach(o=>{
    const d = Math.hypot(pl.x-o.x, pl.y-o.y);
    const min = o.r + UI.R*0.95;
    if (d < min){
      // 正好重合时（d≈0）按朝向反向退出，避免卡在柱心
      const nx = d > 0.01 ? (pl.x-o.x)/d : (pl.face > 0 ? -1 : 1);
      const ny = d > 0.01 ? (pl.y-o.y)/d : 0;
      pl.x = o.x + nx*min; pl.y = o.y + ny*min;
    }
  });
}

function otherOf(p){
  const list = enemiesOf(p);
  if (!list.length) return null;
  let best = list[0], bd = Infinity;
  for (const q of list){
    const d = Math.hypot(q.x-p.x, q.y-p.y);
    if (d < bd){ bd = d; best = q; }
  }
  return best;
}

function randomElem(){
  const pool = ALL_KEYS.filter(k => ELEM[k].atk && ELEM[k].atk.kind !== 'none' && !elemLocked(k));   // 电脑不选「待设计 / 未解锁」元素
  return pool[Math.floor(Math.random()*pool.length)] || 'fire';

function basicAttack(p, now){
  if (!p || p.dead) return false;
  const a = ELEM[p.elem].atk;
  if (!a) return false;
  if (now < p.atkEnd) return false;
  if (a.kind === 'none'){
    p.atkEnd = now + 500;
    pushFloat(p.x, p.y - UI.R*1.6, ELEM[p.elem].name + '·普攻待设计', '#b9c8e8', true);
    return false;
  }            // 有间隔（水球是唯一带冷却的普攻）

  if (a.kind === 'whip') return whipAttack(p, now, a);
  if (a.kind === 'combo') return iceCombo(p, now, a);
  if (a.kind === 'rockCombo') return rockCombo(p, now, a);
  if (a.kind === 'charge') return false;      // 风：必须长按蓄力，不支持点按

  const gapMs = (a.interval !== undefined ? a.interval : a.cd) * 1000;
  p.atkEnd = now + gapMs;
  p.swing = 0.2;

  const R = UI.R;
  const q = otherOf(p);
  const faceAng = p.face > 0 ? 0 : Math.PI;
  let ang = faceAng;
  if (q && !q.dead){
    const base = Math.atan2(q.y - p.y, q.x - p.x);
    let diff = base - faceAng;
    while (diff > Math.PI) diff -= Math.PI*2;
    while (diff < -Math.PI) diff += Math.PI*2;
    ang = faceAng + clamp(diff, -(a.turnAim || 0.45), (a.turnAim || 0.45));  // 轻微锁敌
  }

  // 火被水附着：攻击伤害 -1
  let dmg = a.dmg;
  if (p.wetEnd > now && p.elem === 'fire') dmg = Math.max(1, dmg - 1);
  // 冰被水打中后冻成冰块，冰甲期间攻击 +1
  if (p.iceArmorEnd > now && p.elem === 'ice') dmg += 1;
  // 幽影潜行：隐身后下一发影蚀强化
  const stealthAmp = !!(p.elem === 'dark' && p.stealthAmp && p.stealthEnd > now);
  if (stealthAmp){
    dmg *= DARK_STEALTH.ampMul;     // 一技能：强化 1.5 倍（阴阳加成只作用于二技能）
    p.stealthAmp = false;
  }

  const speed = (a.speed || 300) * S;
  projs.push({
    x: p.x + Math.cos(ang) * R * 0.85,
    y: p.y + Math.sin(ang) * R * 0.85,
    vx: Math.cos(ang) * speed,
    vy: Math.sin(ang) * speed,
    owner: p,
    ox: p.x, oy: p.y,                            // 施法者中心，用于射程判定
    travelled: 0,
    maxDist: a.noRange ? Infinity : R * a.rangeBalls,
    life: a.noRange ? 4.6 : 1.4,
    r: R * (p.elem === 'water' ? 0.36
            : (p.elem === 'light' ? 0.20 : (p.elem === 'dark' ? 0.34 : 0.30))),
    type: p.elem,
    dmg: dmg,
    stealthAmp,
    turn: (a.homing || 0.9)                      // 弧度/秒：水球中度追踪，火苗更轻
  });
  return true;
}
function fireShot(p, now){ return basicAttack(p, now); }

/* ========================= 风·蓄力普攻 ========================= */
function windChargeStart(p){
  if (!p || p.dead || p.elem !== 'wind') return false;
  p.charging = true; p.chargeT = 0;
  return true;
}
function windChargeRelease(p, now){
  if (!p || !p.charging) return false;
  p.charging = false;
  const t = Math.min(p.chargeT, WIND_CHARGE_MAX);
  const a = ELEM.wind.atk;
  const dmg = WIND_DMG_BASE + WIND_DMG_PER_SEC * t;
  const full = t >= WIND_CHARGE_MAX - 0.05;

  // 方向：摇杆优先，其次朝向
  let ang;
  if (Math.hypot(p.jx || 0, p.jy || 0) > 0.25) ang = Math.atan2(p.jy, p.jx);
  else ang = p.face > 0 ? 0 : Math.PI;
  p.face = Math.cos(ang) >= 0 ? 1 : -1;

  const R = UI.R;
  // 蓄满 5 秒：覆盖半张地图；未满：随蓄力拉长
  const reach = full ? Math.max(W, H) * 0.55 : R * (4.2 + t * 2.4);
  const arc = full ? Math.PI * 0.55 : 0.5 + t * 0.1;

  enemiesOf(p).forEach(q=>{
    const d = Math.hypot(q.x - p.x, q.y - p.y);
    const toQ = Math.atan2(q.y - p.y, q.x - p.x);
    if (full || (d <= reach && angDiff(toQ, ang) <= arc)){
      strikeEnemy(p, q, now, { type:'wind', dmg: dmg });
      // 击退：从施法者指向敌人方向
      const push = a.push * S * (0.5 + t / WIND_CHARGE_MAX);
      q.knockX = (q.knockX || 0) + Math.cos(toQ) * push;
      q.knockY = (q.knockY || 0) + Math.sin(toQ) * push;
      if (full) q.knockX = q.knockX;   // 满蓄同样按方向推开
      spreadAttach(q, now);            // 风·扩散：把身上的附着传给附近单位
    }
  });

  p.atkEnd = now + a.interval * 1000;
  p.swing = 0.25;
  windFx.push({ x:p.x, y:p.y, ang, reach, arc, t:0, dur:0.45, full, dmg });
  for (let i=0; i<10 + Math.round(t*4); i++){
    const aa = ang + rnd(-arc, arc);
    sparkBetween({x:p.x, y:p.y}, {x:p.x + Math.cos(aa)*reach*0.9, y:p.y + Math.sin(aa)*reach*0.9}, 1);
  }
  blip(full ? 520 : 640, 0.09, 0.18);
  pushFloat(p.x, p.y - R*1.5, '风·蓄力 ' + t.toFixed(1) + 's', ELEM.wind.glow, true);
  p.chargeT = 0;
  return true;
}

  return sk.name;
}

function skillReady(p, now){ return !!(p && !p.dead && ELEM[p.elem].skill && now >= p.skill1End); }

function useSkill(p, now){
  if (!p || p.dead) return false;
  const sk = ELEM[p.elem].skill;
  if (!sk || now < p.skill1End) return false;

  const R = UI.R;
  let ang;
  if (Math.hypot(p.jx || 0, p.jy || 0) > 0.25) ang = Math.atan2(p.jy, p.jx);
  else ang = p.face > 0 ? 0 : Math.PI;
  p.face = Math.cos(ang) >= 0 ? 1 : -1;

  if (sk.kind === 'bhWell')  return useBHWell(p, now, sk);
  if (sk.kind === 'nsBeam')  return useNSBeam(p, now, sk);

  if (sk.kind === 'iceSpike'){
    // 一次三根冰刺：中间一根，左右各偏 9°。同一目标 0.45s 内只吃一发全额，其余按 40% 结算
    const n = 3;
    for (let i=0; i<n; i++){
      const off = ((i - (n-1)/2) * 0.16);
      const a2 = ang + off;
      const side = (i - (n-1)/2) * R*0.42;
      projs.push({
        x: p.x + Math.cos(ang)*R*1.0 + Math.cos(ang + Math.PI/2)*side,
        y: p.y + Math.sin(ang)*R*1.0 + Math.sin(ang + Math.PI/2)*side,
        ox: p.x, oy: p.y,
        vx: Math.cos(a2) * 920*S, vy: Math.sin(a2) * 920*S,
        r: R*0.55, dmg: sk.dmg, type: 'iceSpike', owner: p,
        travelled: 0, maxDist: R*11, life: sk.life, turn: 0.22,
        slow: sk.slow, meltMul: sk.meltMul, hits: {}, spread: true
      });
    }
    pushFloat(p.x, p.y - R*1.5, '冰棱刺 ×3', '#bff0ff', true);
    blip(880, 0.06, 0.12);
  } else if (sk.kind === 'cyclone'){
    projs.push({
      x: p.x + Math.cos(ang)*R*1.3, y: p.y + Math.sin(ang)*R*1.3,
      ox: p.x, oy: p.y,
      vx: Math.cos(ang) * 180*S, vy: Math.sin(ang) * 180*S,
      r: R*1.45, dmg: sk.dmg, type: 'cyclone', owner: p,
      travelled: 0, maxDist: R*24, life: sk.life, turn: 0.55,
      hitGap: (sk.hitGap || 0.5) * 1000, slow: sk.slow || 2500,
      hits: {}, spin: 0, spreadR: sk.spreadR
    });
    blip(600, 0.10, 0.16);
  }

  if (sk.kind === 'waterDual'){
    const R0 = UI.R;
    if (p.waterMode === 'A'){
      // 版本 A：在敌人脚下生成水涡（脱手标记，不是飞弹）
      const foe = otherOf(p);
      const tx = foe ? foe.x : p.x + (p.face > 0 ? 1 : -1) * R0 * 3;
      const ty = foe ? foe.y : p.y;
      fields.push({ kind:'water', mode:'vortex', owner:p, x:tx, y:ty,
                    r: R0*sk.r, end: now + sk.life*1000,
                    tick: sk.tick*1000, last: now, dmg: sk.dmg, born: now });
      pushFloat(tx, ty - R0*1.2, '水旋桎梏', '#7fd2ff', true);
      blip(680, 0.10, 0.16);
    } else {
      // 版本 B：自身水环，挡一次远程弹道
      fields.push({ kind:'water', mode:'ring', owner:p, x:p.x, y:p.y,
                    r: R0*sk.ringR, end: now + sk.ringLife*1000,
                    tick: 250, last: now - 250, dmg: 0, born: now,
                    shield: sk.shield });
      pushFloat(p.x, p.y - R0*1.4, '回澜水环', '#a8e8ff', true);
      blip(760, 0.10, 0.16);
    }
    p.waterPending = (p.waterMode === 'A') ? 'B' : 'A';   // 冷却结束后切换形态
    p.skill1End = now + sk.cd * 1000;
    p.swing = 0.22;
    return true;
  }

  if (sk.kind === 'lightDomain'){
    // 先判暗：扇形内若有暗元素，光暗立刻抵消，技能湮灭
    const rr0 = R * (sk.r || LIGHT_DOMAIN.r);
    let killed = false;
    enemiesOf(p).forEach(q=>{
      if (killed || q.dead) return;
      const d = Math.hypot(q.x - p.x, q.y - p.y);
      const da = Math.abs(angDiff(Math.atan2(q.y - p.y, q.x - p.x), ang));
      if (d <= rr0 + R*0.6 && da <= (sk.half || LIGHT_DOMAIN.half) && q.elem === 'dark'){
        killed = true;
        bursts.push({ x:(p.x + q.x)/2, y:(p.y + q.y)/2, r:R*0.6, to:R*4.2, t:0, life:0.55, col:'#cfd6ff', ring:true });
        bursts.push({ x:(p.x + q.x)/2, y:(p.y + q.y)/2, r:R*0.6, to:R*3.4, t:0, life:0.6, col:'#3a1f6e', ring:false });
        pushFloat(p.x, p.y - R*1.6, '光暗湮灭 · 结界消散', '#cbb8ff', true);
        blip(300, 0.14, 0.3);
      }
    });
    if (killed){
      p.skill1End = now + sk.cd * 1000;
      p.swing = 0.22;
      return true;
    }
    // 冰折射：扇形里有冰元素 → 半径扩大
    let expand = 1;
    enemiesOf(p).forEach(q=>{
      if (q.dead) return;
      const d = Math.hypot(q.x - p.x, q.y - p.y);
      const da = Math.abs(angDiff(Math.atan2(q.y - p.y, q.x - p.x), ang));
      if (d <= rr0*0.9 && da <= (sk.half || LIGHT_DOMAIN.half) && q.elem === 'ice'){
        expand = LIGHT_DOMAIN.iceExpand;
        pushFloat(q.x, q.y - R*1.5, '强光折射 · 范围扩大', '#bff0ff', true);
      }
    });
    fields.push({ kind:'lightDomain', owner:p, x:p.x, y:p.y, ang, half:(sk.half || LIGHT_DOMAIN.half),
                  r: R*(sk.r || LIGHT_DOMAIN.r)*expand, end: now + (sk.life||LIGHT_DOMAIN.life)*1000,
                  tick: 220, last: now - 220, blindMs:(sk.blind||LIGHT_DOMAIN.blindMs), burst:(sk.burst||LIGHT_DOMAIN.burst),
                  born: now });
    pushFloat(p.x, p.y - R*1.6, '耀光结界', '#fff2c8', true);
    blip(720, 0.10, 0.2);
    p.skill1End = now + sk.cd * 1000;
    p.swing = 0.22;
    return true;
  }

  if (sk.kind === 'darkStealth'){
    p.stealthEnd = now + (sk.life || DARK_STEALTH.life) * 1000;
    p.stealthPrev = p.stealthEnd;
    p.stealthAmp = true;      // 下一发影蚀强化
    bursts.push({ x:p.x, y:p.y, r:UI.R*0.4, to:UI.R*2.8, t:0, life:0.45, col:'#3a1f6e', ring:false });
    pushFloat(p.x, p.y - R*1.6, '幽影潜行', '#b592ff', true);
    blip(340, 0.12, 0.22);
    p.skill1End = now + sk.cd * 1000;
    p.swing = 0.22;
    return true;
  }

  if (sk.kind === 'bhCollapse'){
    fields.push({ kind:'bhCollapse', owner:p, x:p.x, y:p.y + R*0.9, r:R*(sk.pull || 2.4),
                  end: now + (sk.life || 1.3)*1000, tick:380, last:now,
                  dmg:sk.dmg || 5, born:now, pull:sk.pull || 2.4 });
    blip(120, 0.14, 0.40);
  }

  if (sk.kind === 'elecRing'){
    fields.push({ kind:'elec', owner:p, r: R*sk.r, end: now + sk.life*1000,
                  tick: sk.tick*1000, last: now, dmg: sk.dmg,
                  chain: R*sk.chain, defDown: sk.defDown });
    blip(720, 0.10, 0.16);
  } else if (sk.kind === 'rockWall'){
    return useRockWall(p, now, sk);
  } else if (sk.kind === 'firePool'){
    fields.push({ kind:'fire', owner:p, x: p.x + Math.cos(ang)*R*sk.forward,
                  y: p.y + Math.sin(ang)*R*sk.forward, r: R*sk.r,
                  end: now + sk.life*1000, tick: sk.tick*1000, last: now,
                  dmg: sk.dmg, born: now });
    blip(520, 0.12, 0.18);
  }

  p.skill1End = now + sk.cd * 1000;
  p.swing = 0.22;
  pushFloat(p.x, p.y - R*1.5, skillLabel(p), ELEM[p.elem].glow, true);
  return true;
}

/* ========================= 领域结算 ========================= */
function updateFields(now, dt){
  for (let i = fields.length-1; i>=0; i--){
    const f = fields[i];
    if (now >= f.end){ fields.splice(i,1); continue; }

    if (f.kind === 'bhCollapse'){
      if (f.owner && !f.owner.dead){ f.x = f.owner.x; f.y = f.owner.y + UI.R*0.9; }
      if (now - f.last < f.tick) continue;
      f.last = now;
      enemiesOf(f.owner).forEach(q=>{
        if (q.dead) return;
        const d = Math.hypot(q.x - f.x, q.y - f.y);
        if (d > f.r*2.4) return;
        const k = Math.min(0.16, (f.r*2.4 - d) / (f.r*2.4) * 0.18);
        q.x += (f.x - q.x) * k;
        q.y += (f.y - q.y) * k;
        if (d <= f.r) hitEnemy(f.owner, q, now, { type:'blackhole', dmg: f.dmg });
      });
    } else if (f.kind === 'elec'){
      // 贴身环域：跟着施法者走
      if (f.owner && !f.owner.dead){ f.x = f.owner.x; f.y = f.owner.y; }
      else if (f.owner && f.owner.dead){ fields.splice(i,1); continue; }

      if (now - f.last < f.tick) continue;
      f.last = now;
      enemiesOf(f.owner).forEach(q=>{
        const d = Math.hypot(q.x - f.x, q.y - f.y);
        if (d > f.r + UI.R*0.9) return;
        if (q.elem === 'thunder'){          // 雷免疫感电
          pushFloat(q.x, q.y - UI.R*1.2, '雷·免疫感电', '#dcb8ff', true);
          return;
        }
        if (ELEM[q.elem].noAttach){
          pushFloat(q.x, q.y - UI.R*1.2, ELEM[q.elem].immuneText, '#b6ffe4', true);
          return;
        }
        const hasWet = q.wetEnd > now;
        const hasIce = (q.freezeEnd > now) || q.elem === 'ice' || (q.iceArmorEnd > now);

        const mulT = elemMul(f.owner.elem, q.elem);
        if (!stealthImmune(q, now)) q.hp -= f.dmg * mulT * DMG_SCALE; q.hitFlash = 0.2;
        pushFloat(q.x + rnd(-8,8), q.y - UI.R*0.6, elemMulMark(mulT) + fmtDmg(f.dmg * mulT * DMG_SCALE), '#dcb8ff', false);

        if (hasWet){
          // 连锁感电：往外围再传一圈感电
          q.elecEnd = Math.max(q.elecEnd, now + 3500);
          pushFloat(q.x, q.y - UI.R*1.2, '连锁感电', '#e4ccff', true);
          enemiesOf(f.owner).forEach(o=>{
            if (o === q || o.elem === 'thunder' || ELEM[o.elem].noAttach) return;
            if (Math.hypot(o.x - q.x, o.y - q.y) <= f.chain){
              o.elecEnd = Math.max(o.elecEnd, now + 3000);
              if (!stealthImmune(o, now)) o.hp -= 1 * DMG_SCALE; o.hitFlash = 0.16;
              pushFloat(o.x, o.y - UI.R*1.2, '感电', '#dcb8ff', true);
            }
          });
        } else if (hasIce){
          // 超导：同一目标 1.5 秒内只爆一次，其余时间维持减防
          if (!(q.scEnd > now)){
            superconduct(q.x, q.y, f.owner, q, now);
            q.scEnd = now + 1500;
            pushFloat(q.x, q.y - UI.R*1.2, '超导 · 减防', '#d8c4ff', true);
          }
          q.defDownEnd = Math.max(q.defDownEnd, now + f.defDown);
        } else {
          q.elecEnd = Math.max(q.elecEnd, now + 3000);
          pushFloat(q.x, q.y - UI.R*1.2, '感电', '#dcb8ff', true);
        }
      });
    } else if (f.kind === 'water'){
      if (f.mode === 'ring'){
        if (f.owner && !f.owner.dead){ f.x = f.owner.x; f.y = f.owner.y; }
        else { fields.splice(i,1); continue; }
        if (f.shield > 0){
          for (let j = projs.length-1; j>=0; j--){
            const pr2 = projs[j];
            if (!pr2.owner || pr2.owner === f.owner) continue;
            if (Math.hypot(pr2.x - f.x, pr2.y - f.y) <= f.r + pr2.r){
              projs.splice(j,1); f.shield--;
              pushFloat(f.x, f.y - UI.R*1.3, '水环 · 挡下弹道', '#a8e8ff', true);
              blip(520, 0.08, 0.14);
              break;
            }
          }
        }
        if (now - f.last < f.tick) continue;
        f.last = now;
        enemiesOf(f.owner).forEach(q=>{
          if (Math.hypot(q.x - f.x, q.y - f.y) > f.r + UI.R*0.9) return;
          if (ELEM[q.elem].noAttach) return;
          q.wetEnd = Math.max(q.wetEnd, now + 2500);
          q.mildSlowEnd = Math.max(q.mildSlowEnd, now + 1200);
        });
      } else {
        // 水涡：踩在涡里持续潮湿 + 小幅减速
        if (now - f.last < f.tick) continue;
        f.last = now;
        enemiesOf(f.owner).forEach(q=>{
          if (Math.hypot(q.x - f.x, q.y - f.y) > f.r + UI.R*0.8) return;
          if (ELEM[q.elem].noAttach) return;
          const mulW = elemMul(f.owner.elem, q.elem);
          if (!stealthImmune(q, now)) q.hp -= f.dmg * mulW * DMG_SCALE; q.hitFlash = 0.18;
          pushFloat(q.x + rnd(-8,8), q.y - UI.R*0.6, elemMulMark(mulW) + fmtDmg(f.dmg * mulW * DMG_SCALE), '#7fd2ff', false);
          q.wetEnd = Math.max(q.wetEnd, now + 3000);
          q.mildSlowEnd = Math.max(q.mildSlowEnd, now + 1500);

          const hasIce = (q.freezeEnd > now) || q.elem === 'ice' || (q.iceArmorEnd > now);
          const hasElec = (q.elecEnd > now) || q.elem === 'thunder';
          const hasBurn = (q.burnEnd > now) || q.elem === 'fire';
          if (hasIce){
            if (!(q.freezeEnd > now)) applyFreeze(q, now);   // 内部已带冷却判定与提示
          } else if (hasElec){
            q.elecEnd = Math.max(q.elecEnd, now + 3000);
            pushFloat(q.x, q.y - UI.R*1.2, '感电', '#dcb8ff', true);
          } else if (hasBurn){
            if (!stealthImmune(q, now)) q.hp -= f.dmg * mulW * DMG_SCALE; q.burnEnd = 0;
            pushFloat(q.x, q.y - UI.R*1.2, '蒸发 +' + fmtDmg(f.dmg * mulW * DMG_SCALE), '#ffd0a8', true);
          }
        });
      }
    } else if (f.kind === 'fire'){
      if (now - f.last < f.tick) continue;
      f.last = now;
      const owner = f.owner;
      enemiesOf(owner).forEach(q=>{
        const d = Math.hypot(q.x - f.x, q.y - f.y);
        if (d > f.r + UI.R*0.8) return;

        const hasWater = (q.elem === 'water') || (q.wetEnd > now);
        const hasIce = (q.freezeEnd > now) || q.elem === 'ice' || (q.iceArmorEnd > now);
        const hasElec = (q.elecEnd > now) || q.elem === 'thunder';

        if (hasWater){
          // 水把火池直接浇灭
          f.end = now - 1;
          pushFloat(f.x, f.y - UI.R*1.2, '火池被水浇灭', '#a8e0ff', true);
          return;
        }
        const mulF = elemMul(f.owner.elem, q.elem);
        if (!stealthImmune(q, now)) q.hp -= f.dmg * mulF * DMG_SCALE; q.hitFlash = 0.2;
        q.burnEnd = Math.max(q.burnEnd, now + 3000);
        pushFloat(q.x + rnd(-8,8), q.y - UI.R*0.6, elemMulMark(mulF) + fmtDmg(f.dmg * mulF * DMG_SCALE), '#ffb066', false);

        if (hasIce){
          if (!stealthImmune(q, now)) q.hp -= f.dmg * 0.5 * mulF * DMG_SCALE;     // 融化增伤
          pushFloat(q.x, q.y - UI.R*1.2, '融化 +' + fmtDmg(f.dmg * 0.5 * mulF * DMG_SCALE), '#ffd08a', true);
        }
        if (hasElec){
          // 超载：爆炸并把敌人击飞
          if (!stealthImmune(q, now)) q.hp -= 10 * DMG_SCALE;
          let a2 = Math.atan2(q.y - f.y, q.x - f.x);
          if (Math.hypot(q.x - f.x, q.y - f.y) < 4) a2 = rnd(0, Math.PI*2);   // 正中时随机方向击飞
          q.knockX = (q.knockX || 0) + Math.cos(a2) * 620*S;
          q.knockY = (q.knockY || 0) + Math.sin(a2) * 620*S;
          bursts.push({ x:q.x, y:q.y, t:0, life:0.4, kind:'overload' });
          q.elecEnd = 0;
          pushFloat(q.x, q.y - UI.R*1.5, '超载 · 击飞', '#ffb0c8', true);
        }
      });
    } else if (f.kind === 'lightDomain'){
      if (now - f.last < f.tick) continue;
      f.last = now;
      enemiesOf(f.owner).forEach(q=>{
        if (q.dead) return;
        const d = Math.hypot(q.x - f.x, q.y - f.y);
        const da = Math.abs(angDiff(Math.atan2(q.y - f.y, q.x - f.x), f.ang));
        if (d > f.r + UI.R*0.4 || da > f.half) return;

        // 碰到暗：光暗抵消，结界自身湮灭
        if (q.elem === 'dark'){
          f.end = now - 1;
          bursts.push({ x:f.x + Math.cos(f.ang)*f.r*0.5, y:f.y + Math.sin(f.ang)*f.r*0.5,
                        r:UI.R*0.5, to:f.r*0.9, t:0, life:0.5, col:'#cfd6ff', ring:true });
          pushFloat(q.x, q.y - UI.R*1.3, '光暗湮灭 · 结界消散', '#cbb8ff', true);
          return;
        }
        // 致盲
        if (q.blindEnd < now){
          q.blindEnd = now + f.blindMs;
          pushFloat(q.x, q.y - UI.R*1.35, '致盲', '#fff6d8', true);
        }
        // 兑现显影：额外爆发光伤，标记消耗
        if (q.revealEnd > now){
          q.revealEnd = 0;
          const dB = f.burst * elemMul('light', q.elem) * DMG_SCALE;
          if (!stealthImmune(q, now)) q.hp -= dB;
          bursts.push({ x:q.x, y:q.y, r:UI.R*0.5, to:UI.R*2.8, t:0, life:0.4, col:'#fff4cc', ring:true });
          pushFloat(q.x, q.y - UI.R*1.75, '显影爆发 ' + elemMulMark(elemMul('light', q.elem)) + fmtDmg(dB), '#fff2c8', true);
          blip(880, 0.08, 0.16);
          checkKO(q, now);
        }
      });
    } else if (f.kind === 'lightPillar'){
      if (!f.hitDone && now >= f.strikeAt){
        f.hitDone = true;
        enemiesOf(f.owner).forEach(q=>{
          if (q.dead) return;
          if (Math.hypot(q.x - f.x, q.y - f.y) > f.r + UI.R*0.5) return;   // 走位躲开了
          if (q.stealthEnd > now) breakStealth(q, now, '光柱 · 破除隐身');
          if (stealthImmune(q, now)){ pushFloat(q.x, q.y - UI.R*1.3, '潜行 · 免伤', '#c4a6ff', true); return; }
          const mL = lightSkillMul(q.elem);      // 越阴越痛（与主链克制取大，不叠乘）
          let dB = f.dmg * mL * DMG_SCALE;
          let judged = false;
          if (q.revealEnd > now){        // 显影 → 追加审判
            q.revealEnd = 0;
            dB += f.judge * mL * DMG_SCALE;
            judged = true;
          }
          q.hp -= dB;
          q.hitFlash = 0.24;
          q.blink = Math.max(q.blink || 0, 18);
          const mk = elemMulMark(mL);
          pushFloat(q.x, q.y - UI.R*1.55, (judged ? '审判 ' : '') + mk + fmtDmg(dB), '#fff2c8', true);
          if (judged){
            bursts.push({ x:q.x, y:q.y, r:UI.R*0.5, to:UI.R*4.0, t:0, life:0.6, col:'#fff0b8', ring:true });
            bursts.push({ x:q.x, y:q.y, r:UI.R*0.3, to:UI.R*2.4, t:0, life:0.4, col:'#ffffff', ring:false });
            blip(920, 0.10, 0.2);
          }
          checkKO(q, now);
        });
      }
    } else if (f.kind === 'darkMist'){
      if (now - f.last < f.tick) continue;
      f.last = now;
      enemiesOf(f.owner).forEach(q=>{
        if (q.dead) return;
        if (Math.hypot(q.x - f.x, q.y - f.y) > f.r + UI.R*0.7) return;

        // 碰到火：黑雾被点燃 → 变成持续灼烧区域
        const burning = (q.elem === 'fire') || (q.burnEnd > now);
        if (burning){
          f.kind = 'darkBurn';
          f.dmg = DARK_STEALTH.burnDmg;
          f.r = f.r * 1.05;
          bursts.push({ x:f.x, y:f.y, r:UI.R*0.6, to:f.r*1.2, t:0, life:0.5, col:'#ff7a3c', ring:false });
          pushFloat(f.x, f.y - UI.R*1.3, '黑雾被点燃 · 灼烧区', '#ff9a5a', true);
          return;
        }
        // 减速
        q.slowEnd = Math.max(q.slowEnd || 0, now + f.slowMs);
        if (q.blindEnd < now - 2000) pushFloat(q.x, q.y - UI.R*1.25, '黑雾 · 减速', '#a98ce0', true);
      });
    } else if (f.kind === 'darkBurn'){
      if (now - f.last < f.tick) continue;
      f.last = now;
      enemiesOf(f.owner).forEach(q=>{
        if (q.dead) return;
        if (Math.hypot(q.x - f.x, q.y - f.y) > f.r + UI.R*0.7) return;
        const mulF = elemMul('dark', q.elem) * 1.0;
        if (!stealthImmune(q, now)) q.hp -= (f.dmg || DARK_STEALTH.burnDmg) * mulF * DMG_SCALE;
        q.burnEnd = Math.max(q.burnEnd, now + 2000);
        q.hitFlash = 0.15;
        pushFloat(q.x + rnd(-6,6), q.y - UI.R*0.7, elemMulMark(mulF) + fmtDmg((f.dmg||DARK_STEALTH.burnDmg)*mulF*DMG_SCALE), '#ff9a5a', false);
        checkKO(q, now);
      });
    }
  }
}

/* 扩散：把源身上的元素附着传给附近对手（风自身不附着） */
function spreadAttach(src, now){
  if (!src) return;
  const R = UI.R * (ELEM.wind.atk.spreadR || 3.2);
  const tags = [];
  if (src.burnEnd > now) tags.push('burn');
  if (src.wetEnd > now) tags.push('wet');
  if (src.elecEnd > now) tags.push('elec');
  if (src.freezeEnd > now) tags.push('frozen');
  if (src.iceArmorEnd > now) tags.push('ice');
  if (!tags.length) return;
  enemiesOf(src).forEach(q=>{
    if (Math.hypot(q.x - src.x, q.y - src.y) > R) return;
    tags.forEach(tag=>{
      if (tag === 'burn' && !ELEM[q.elem].burnImmune && !ELEM[q.elem].noAttach){
        q.burnEnd = Math.max(q.burnEnd, now + 3000);
        pushFloat(q.x, q.y - UI.R*1.2, '扩散·灼烧', '#ffb066', true);
      }
      if (tag === 'wet' && !ELEM[q.elem].noAttach){
        q.wetEnd = Math.max(q.wetEnd, now + 3000);
        pushFloat(q.x, q.y - UI.R*1.2, '扩散·水', '#a8e0ff', true);
      }
      if (tag === 'elec' && q.elem !== 'thunder' && !ELEM[q.elem].noAttach){
        q.elecEnd = Math.max(q.elecEnd, now + 4000);
        pushFloat(q.x, q.y - UI.R*1.2, '扩散·雷', '#dcb8ff', true);
      }
      if (tag === 'frozen' && !ELEM[q.elem].noAttach && q.elem !== 'ice'){
        if (now < (q.freezeLockEnd || 0)){
          pushFloat(q.x, q.y - UI.R*1.2, '扩散·冻结冷却中', '#9fb4d8', true);
        } else {
          q.freezeEnd = Math.max(q.freezeEnd, now + 2500);
          q.freezeLockEnd = now + FREEZE_LOCK_MS;
          pushFloat(q.x, q.y - UI.R*1.2, '扩散·冻结', '#ccf7ff', true);
        }
      }
      if (tag === 'ice'){
        q.iceArmorEnd = Math.max(q.iceArmorEnd, now + 3000);
        pushFloat(q.x, q.y - UI.R*1.2, '扩散·冰甲', '#ccf7ff', true);
      }
    });
  });
}

/* 角度差（0~π） */
function angDiff(a, b){
  let d = a - b;
  while (d > Math.PI) d -= Math.PI*2;
  while (d < -Math.PI) d += Math.PI*2;
  return Math.abs(d);
}

/* ============ 雷：雷鞭（手动方向、无追踪） ============ */
function whipAttack(p, now, a){
  p.atkEnd = now + a.interval * 1000;
  p.swing = 0.2;

  // 方向由摇杆决定；摇杆没推时沿用朝向
  let ang;
  const mag = Math.hypot(p.jx || 0, p.jy || 0);
  if (mag > 0.32) ang = Math.atan2(p.jy, p.jx);
  else ang = p.face > 0 ? 0 : Math.PI;
  if (Math.abs(Math.cos(ang)) > 0.25) p.face = Math.cos(ang) > 0 ? 1 : -1;

  const R = UI.R;
  whips.push({ x:p.x, y:p.y, ang, t:0, life:0.24, reach:R*a.reach, owner:p,
               seed: Math.random()*100 });

  // 正面扇区判定：近身抽击，不发飞行物
  enemiesOf(p).forEach(q=>{
    const d = dist(p, q);
    const toQ = Math.atan2(q.y - p.y, q.x - p.x);
    if (d <= R * a.reach && angDiff(toQ, ang) <= a.arc){
      strikeEnemy(p, q, now, { type:'thunder', dmg:a.dmg });
    }
  });
  blip(520, 0.05, 0.11);
  return true;
}

/* ============ 冰：冰霜长剑三段 ============ */
function makeRockShape(){
  // 每次进局重新随机构形：石块大小固定（R 的 0.18~0.26），只变形状
  const R = UI.R;
  const arr = [];
  for (let i=0; i<7; i++){
    const n = 5 + Math.floor(Math.random()*3);
    const rr = R * (0.18 + Math.random()*0.08);
    const pts = [];
    for (let k=0; k<n; k++){
      const aa = (k/n) * Math.PI*2 + Math.random()*0.18;
      const rv = rr * (0.72 + Math.random()*0.36);
      pts.push([Math.cos(aa)*rv, Math.sin(aa)*rv]);
    }
    arr.push({ pts, rr, ang: (i/7)*Math.PI*2 + Math.random()*0.5,
               rad: R*(1.05 + Math.random()*0.5), bob: Math.random()*Math.PI*2 });
  }
  return arr;
}

function rockCombo(p, now, a){
  const stage = (p.rockStage > 0 && now < p.rockUntil) ? (p.rockStage % 3) + 1 : 1;
  p.rockStage = stage;
  p.rockUntil = now + 1100;
  p.atkEnd = now + 500;
  p.swing = 0.22;

  const R = UI.R;
  const dir = p.face > 0 ? 1 : -1;
  const addCol = (x, y0, y1, w, dmg, falling)=>{
    rockCols.push({ x, y0, y1, w, dmg, fall: falling ? 250 : 0, born: now,
                    life: falling ? 1800 : 1500, owner: p, struck: false });
  };

  if (stage === 1){
    addCol(p.x + dir * R*1.9, p.y - R*2.2, p.y + R*2.2, R*1.5, 8, false);
    blip(520, 0.10, 0.22);
  } else if (stage === 2){
    addCol(p.x + dir * R*4.0, p.y - R*2.3, p.y + R*2.3, R*1.4, 10, true);
    blip(440, 0.12, 0.26);
  } else {
    // 三段：立起真正有碰撞体积的岩墙，能挡住走位
    addCol(p.x + dir * R*4.4, p.y - R*2.6, p.y + R*2.6, R*2.1, 13, false);
    rockCols[rockCols.length-1].solid = true;
    rockCols[rockCols.length-1].life = 2400;
    blip(360, 0.14, 0.30);
  }
  pushFloat(p.x + dir * R*1.2, p.y - R*1.6,
    '岩柱 · ' + (stage === 1 ? '一段' : stage === 2 ? '二段' : '三段'), ELEM.rock.glow, true);
  return true;
}

function updateRockCols(now){
  for (let i=rockCols.length-1; i>=0; i--){
    const c = rockCols[i];
    if (now - c.born > c.life){ rockCols.splice(i,1); continue; }
    if (c.struck) continue;
    if (c.fall && now - c.born < c.fall) continue;
    c.struck = true;
    const left = Math.min(c.x - c.w/2, c.x + c.w/2);
    const right = Math.max(c.x - c.w/2, c.x + c.w/2);
    enemiesOf(c.owner).forEach(q=>{
      const qr = q.r || UI.R * 0.9;              // 玩家没有 .r 字段，必须给默认体半径，否则判定失效变成全图伤害
      if (q.x + qr < left || q.x - qr > right) return;
      if (q.y + qr < c.y0 || q.y - qr > c.y1) return;
      strikeEnemy(c.owner, q, now, { type:'rock', dmg: c.dmg });
      pushFloat(q.x, q.y - UI.R*1.3, String(c.dmg), ELEM.rock.glow, false);
    });
    bursts.push({ x:c.x, y:(c.y0+c.y1)/2, t:0, life:0.35, kind:'rock' });
    blip(c.fall ? 300 : 380, 0.10, 0.22);
  }
}

function drawRockCols(now){
  const R = UI.R;
  rockCols.forEach(c=>{
    const age = now - c.born;
    if (c.fall && age < c.fall){
      const k = clamp(age / c.fall, 0, 1);
      ctx.save();
      ctx.strokeStyle = 'rgba(201,162,39,0.8)';
      ctx.lineWidth = 2*S;
      ctx.beginPath(); ctx.ellipse(c.x, (c.y0+c.y1)/2, c.w*1.15, R*0.5, 0, 0, Math.PI*2); ctx.stroke();
      const yy = (c.y0+c.y1)/2 - (1-k) * ((UI.bottom - UI.top) || 240) * 0.95;
      ctx.globalAlpha = 0.92;
      const g = ctx.createLinearGradient(c.x, yy - R*2.2, c.x, yy + R*2.2);
      g.addColorStop(0, '#5a4a20'); g.addColorStop(0.55, '#c9a227'); g.addColorStop(1, '#3a2c0c');
      ctx.fillStyle = g;
      rrPath(c.x - c.w/2, yy - R*2.2, c.w, R*4.4, 3*S); ctx.fill();
      ctx.strokeStyle = 'rgba(240,215,138,0.9)';
      ctx.lineWidth = 1.6*S;
      rrPath(c.x - c.w/2, yy - R*2.2, c.w, R*4.4, 3*S); ctx.stroke();
      ctx.restore();
      return;
    }
    const h = c.y1 - c.y0;
    const fade = clamp((c.life - age) / 260, 0, 1);
    ctx.save();
    ctx.globalAlpha = fade;
    const g2 = ctx.createLinearGradient(c.x - c.w/2, 0, c.x + c.w/2, 0);
    g2.addColorStop(0, 'rgba(58,44,12,0.95)');
    g2.addColorStop(0.35, 'rgba(201,162,39,0.95)');
    g2.addColorStop(0.62, 'rgba(150,116,32,0.95)');
    g2.addColorStop(1, 'rgba(40,30,8,0.95)');
    ctx.fillStyle = g2;
    rrPath(c.x - c.w/2, c.y0, c.w, h, 3*S); ctx.fill();
    ctx.strokeStyle = 'rgba(240,215,138,0.85)';
    ctx.lineWidth = 1.6*S;
    rrPath(c.x - c.w/2, c.y0, c.w, h, 3*S); ctx.stroke();
    for (let i=0; i<4; i++){
      const ty = c.y0 + h * ((i+0.7)/4.4);
      ctx.strokeStyle = 'rgba(30,22,6,0.55)';
      ctx.lineWidth = 1.2*S;
      ctx.beginPath();
      ctx.moveTo(c.x - c.w*0.36, ty);
      ctx.lineTo(c.x + c.w*0.30, ty + R*0.35);
      ctx.stroke();
    }
    ctx.restore();
  });
}

/* ========================= 冰·二技能：霜极巨剑 ========================= */
function anyGiantActive(now){
  return allPlayers().some(p => p && !p.dead && p.iceGiantEnd > now);
}

function useSkill2(p, now){
  if (!p || p.dead) return false;
  const sk2 = ELEM[p.elem].skill2;
  if (!sk2) return false;
  if (now < (p.skill2End || 0)) return false;
  if (sk2.kind === 'rockSpikes') return useRockSpikes(p, now, sk2);
  if (sk2.kind === 'fireSeeds') return useFireSeeds(p, now, sk2);
  if (sk2.kind === 'waterTether') return useWaterTether(p, now, sk2);

  if (sk2.kind === 'bhRift') return useBHRift(p, now, sk2);
  if (sk2.kind === 'nsTrack') return useNSTrack(p, now, sk2);

  if (sk2.kind === 'windBlades'){
    return useWindBlades(p, now, sk2);
  }

  if (sk2.kind === 'vortex'){
    const cfg = VORTEX[p.elem];
    if (!cfg) return false;
    const R = UI.R;
    vortexes.push({ owner:p, x:p.x, y:p.y, t0:now, cfg, lastTick:now, burst:false });
    pushFloat(p.x, p.y - R*1.8, sk2.name, cfg.core, true);
    p.skill2End = now + sk2.cd * 1000;
    p.swing = 0.2;
    blip(cfg.warm ? 260 : 380, 0.10, 0.26);
    return true;
  }

  if (sk2.kind === 'leiStorm'){
    const R = UI.R;
    const wet = !!(p.wetEnd > now);
    let ice = false, fire = false;
    enemiesOf(p).forEach(q=>{
      if (q.dead) return;
      if (q.elem === 'ice' || q.freezeEnd > now || q.iceArmorEnd > now) ice = true;
      if (q.elem === 'fire' || q.burnEnd > now) fire = true;
    });
    leiStorms.push({ owner:p, x:p.x, y:p.y, t0:now, wet, ice, fire,
                     lastTick: now, burstDone:false, sparks:[], parts:[], trail:[] });
    pushFloat(p.x, p.y - R*1.8, '环雷崩涡', '#c8aaff', true);
    blip(260, 0.10, 0.26);
    p.skill2End = now + sk2.cd * 1000;
    p.swing = 0.2;
    return true;
  }

  if (sk2.kind === 'darkDash'){
    const ang = p.face > 0 ? 0 : Math.PI;
    const R = UI.R;
    p.dashFrom = { x:p.x, y:p.y };
    const tx = clamp(p.x + Math.cos(ang) * R * (sk2.dist || DARK_DASH.dist), R, UI.W - R);
    const ty = clamp(p.y + Math.sin(ang) * R * (sk2.dist || DARK_DASH.dist), R, UI.H - R);
    p.dashTo = { x:tx, y:ty };
    p.dashStart = now;
    p.dashEnd = now + (sk2.dur || DARK_DASH.dur);
    p.dashDone = false;
    p.dashHits = {};
    p.skill2End = now + sk2.cd * 1000;
    p.swing = 0.2;
    pushFloat(p.x, p.y - R*1.6, '噬影突袭', '#8b63d8', true);
    bursts.push({ x:p.x, y:p.y, r:R*0.5, to:R*2.4, t:0, life:0.4, col:'#3a1f6e', ring:false });
    blip(300, 0.10, 0.28);
    return true;
  }

  if (sk2.kind === 'lightPillar'){
    const R = UI.R;
    const q = enemiesOf(p)[0];
    if (!q) return false;
    const tx = q.x, ty = q.y;

    // 光柱扫过暗雾 / 影蚀区域 → 直接清除
    for (let i = fields.length - 1; i >= 0; i--){
      const f = fields[i];
      if ((f.kind === 'darkMist' || f.kind === 'darkBurn') && Math.hypot(f.x - tx, f.y - ty) < R * 3.2){
        bursts.push({ x:f.x, y:f.y, r:f.r, to:f.r*1.5, t:0, life:0.35, col:'#fff2c8', ring:true });
        fields.splice(i, 1);
        pushFloat(f.x, f.y - R*1.2, '暗雾被净化', '#fff2c8', false);
      }
    }
    // 冰附着 → 折射扩大
    const iceOn = (q.elem === 'ice') || (q.iceArmorEnd > now) || (q.iceSlowEnd > now);
    const r = R * (sk2.r || LIGHT_PILLAR.r) * (iceOn ? (sk2.iceExpand || LIGHT_PILLAR.iceExpand) : 1);
    if (iceOn) pushFloat(tx, ty - R*1.7, '光柱折射 · 范围扩大', '#bff0ff', true);

    fields.push({ kind:'lightPillar', owner:p, x:tx, y:ty, r,
                  born: now, strikeAt: now + (sk2.warn || LIGHT_PILLAR.warn),
                  end: now + (sk2.warn || LIGHT_PILLAR.warn) + (sk2.dur || LIGHT_PILLAR.dur),
                  dmg:(sk2.dmg || LIGHT_PILLAR.dmg), judge:(sk2.judge || LIGHT_PILLAR.judge), hitDone:false });
    pushFloat(p.x, p.y - R*1.6, '曜断光柱', '#fff2c8', true);
    p.skill2End = now + sk2.cd * 1000;
    p.swing = 0.2;
    blip(600, 0.10, 0.35);
    return true;
  }

  if (sk2.kind === 'iceGiant'){
    p.iceGiantEnd = now + sk2.dur * 1000;          // 巨剑存在 10 秒
    p.skill2End = p.iceGiantEnd + sk2.cd * 1000;   // 剑消失后才进 15 秒 CD
    p.giantStage = 0; p.comboStage = 0;
    pushFloat(p.x, p.y - UI.R*1.8, '霜极巨剑 · 10s', '#cdf4ff', true);
    bursts.push({ x:p.x, y:p.y, r:UI.R*0.5, to:UI.R*7, t:0, life:0.9, col:'#9fe8ff', ring:true });
    blip(520, 0.14, 0.5);
    return true;
  }
  return false;
}

/* 巨剑三段：横劈（大扇面）→ 竖劈（贯穿的竖线）→ 万剑（全 X 全 Y） */
function iceGiantCombo(p, now, a, stage){
  const sk2 = ELEM.ice.skill2;
  p.giantStage = stage;
  p.atkEnd = now + (stage === 3 ? 0.95 : 0.42) * 1000;
  p.swing = 0.26;

  const R = UI.R;
  const ang = p.face > 0 ? 0 : Math.PI;

  if (stage === 1){
    iceFx.push({ kind:'giantH', x:p.x, y:p.y, ang, t:0, life:0.36, owner:p });
    enemiesOf(p).forEach(q=>{
      const d = dist(p, q);
      const toQ = Math.atan2(q.y - p.y, q.x - p.x);
      if (d <= R*3.9 && angDiff(toQ, ang) <= 1.45){
        strikeEnemy(p, q, now, { type:'ice', dmg: sk2.hDmg, freeze:true });
      }
    });
    blip(470, 0.10, 0.30);
  } else if (stage === 2){
    iceFx.push({ kind:'giantV', x:p.x, y:p.y, ang, t:0, life:0.42, owner:p });
    enemiesOf(p).forEach(q=>{
      const forward = (p.face > 0 ? (q.x - p.x) : (p.x - q.x));
      const dy = Math.abs(q.y - p.y);
      if (forward > -R*0.6 && dy <= R*0.62){
        strikeEnemy(p, q, now, { type:'ice', dmg: sk2.vDmg, freeze:true });
      }
    });
    blip(400, 0.12, 0.40);
  } else {
    const n = sk2.rushCount;
    const span = UI.bottom - UI.top;
    for (let i=0; i<n; i++){
      const yy = UI.top + span * (i/(n-1));
      iceFx.push({ kind:'iceSword', x: p.face > 0 ? -R*1.6 : W + R*1.6, y: yy, ang, t:0,
                   life:0.62, delay: i*0.05, len: R*2.6 });
    }
    enemiesOf(p).forEach(q=>{
      strikeEnemy(p, q, now, { type:'ice', dmg: sk2.rushDmg, freeze:true });
    });
    pushFloat(W/2, UI.top + span*0.5, '霜极 · 万剑归雪', '#e5faff', true);
    blip(280, 0.18, 0.62);
  }
  return true;
}

function iceCombo(p, now, a){
  // 连段：窗口内继续则进下一段，否则从第一段重新开始
  const stage = (p.comboUntil > now && p.comboStage > 0) ? (p.comboStage % 3) + 1 : 1;
  p.comboStage = stage;
  p.comboUntil = now + 900;

  if (p.iceGiantEnd > now) return iceGiantCombo(p, now, a, stage);

  const armor = p.iceArmorEnd > now ? 1 : 0;
  const baseDmg = stage === 1 ? 5 : (stage === 2 ? 3 : 10);
  const dmg = baseDmg + armor;
  p.atkEnd = now + (stage === 3 ? 0.62 : 0.34) * 1000;
  p.swing = 0.2;

  const R = UI.R;
  const ang = p.face > 0 ? 0 : Math.PI;
  iceFx.push({ kind:'slash', stage, x:p.x, y:p.y, ang, t:0,
               life: stage === 3 ? 0.42 : 0.26, owner:p });

  if (stage === 3){
    // 蓄力前刺：先按长枪突刺判定（2.6 球），再向前突进并留下冰痕
    const reach3 = 3.7, arc3 = 0.58;
    const hits = {};
    enemiesOf(p).forEach(q=>{
      const d = dist(p, q);
      const toQ = Math.atan2(q.y - p.y, q.x - p.x);
      if (d <= R * reach3 && angDiff(toQ, ang) <= arc3){
        strikeEnemy(p, q, now, { type:'ice', dmg: dmg, freeze:true });
        hits[q.i] = 1;                       // 突刺已命中，突进过程不重复结算
      }
    });
    p.dash = { t:0, dur:0.36, ang, speed:800*S, hits, dmg: dmg };
    blip(700, 0.08, 0.16);
  } else {
    const reach = stage === 1 ? 2.85 : 2.95;
    const arc = stage === 1 ? 1.15 : 0.62;      // 横劈横扫更宽，竖劈更窄
    enemiesOf(p).forEach(q=>{
      const d = dist(p, q);
      const toQ = Math.atan2(q.y - p.y, q.x - p.x);
      if (d <= R * reach && angDiff(toQ, ang) <= arc){
        strikeEnemy(p, q, now, { type:'ice', dmg });
      }
    });
    blip(stage === 1 ? 620 : 580, 0.06, 0.12);
  }
  return true;
}

/* 非弹体命中（近战 / 鞭击 / 突进） */
function strikeEnemy(att, def, now, info){
  hitEnemy(att, def, now, { type: info.type, dmg: info.dmg, freeze: !!info.freeze });
}

function hitEnemy(att, def, now, pr){
  let dmg = (pr ? pr.dmg : ELEM[att.elem].atk.dmg) * DMG_SCALE;
  if (att && att.ultBoostEnd > now) dmg *= ULT_BOOST;      // 大招进行中 ×5
  if (att && att.ai && att.aiCfg) dmg *= (att.aiCfg.dmg || 1);   // 单人模式 AI 难度倍率
  /* 岩·凝岩铸甲：岩甲每层抵挡一次敌方攻击 */
  if (def && def.rockArmor > 0 && !(pr && (pr.pierceArmor || pr.type === 'thunder'))){
    def.rockArmor -= 1;
    def.hitFlash = Math.max(def.hitFlash || 0, 0.14);
    pushFloat(def.x, def.y - UI.R*1.35, '岩甲 · 抵挡', '#C9B896', true);
    bursts.push({ x:def.x, y:def.y, r:UI.R*0.8, to:UI.R*1.6, t:0, life:0.26, col:'#C9B896', ring:true });
    blip(420, 0.05, 0.10);
    return;
  }
  /* 冰·霜凝积寒：攻击带寒霜标记的目标，每层标记提升 8% 冰伤害 */
  if (pr && pr.type === 'ice' && def.frostStacks){
    dmg *= 1 + ICE_FROST.dmgPer * def.frostStacks;
  }
  /* 火·焚烬余燎 / 水·浸体濡湿：每层标记提升 7% 对应元素伤害 */
  if (pr && pr.type === 'fire' && def.fireStacks)  dmg *= 1 + MARK.burn.dmgPer * def.fireStacks;
  if (pr && pr.type === 'water' && def.waterStacks) dmg *= 1 + MARK.soak.dmgPer * def.waterStacks;
  if (pr && pr.type === 'wind'  && def.windStacks)  dmg *= 1 + MARK.wind.dmgPer * def.windStacks;
  if (pr && pr.type === 'rock'  && def.rockStacks)  dmg *= 1 + MARK.rock.dmgPer * def.rockStacks;
  if (pr && pr.type === 'blackhole' && def.collapseStacks) dmg *= 1 + MARK.collapse.dmgPer * def.collapseStacks;
  if (pr && pr.type === 'neutron'  && def.irradStacks)   dmg *= 1 + MARK.irrad.dmgPer * def.irradStacks;
  if (def.defDownEnd > now) dmg *= 1.25;     // 超导·减防
  const eMul = elemMul(att.elem, def.elem);   // 元素克制：克制方 ×1.35，被克方 ×0.78
  dmg *= eMul;
  if (pr && pr.type === 'iceSpike'){          // 三根冰刺：同目标 0.45s 内后续只吃 40%，避免三连秒杀
    if (now - (def.lastSpikeAt || 0) < 450) dmg *= 0.4;
    def.lastSpikeAt = now;
  }
  const type = pr ? pr.type : 'fire';
  const freeze = !!(pr && pr.freeze);

  /* 暗·幽影潜行：碰到光直接破除（光粒、耀光结界、圣光灼蚀都算） */
  if (type === 'light' && def.stealthEnd > now) breakStealth(def, now, '光 · 破除隐身');

  /* 潜行期间免伤：打上去只有白闪，不掉血；但施法前被光粒挂过【显影】就能打中 */
  if (type !== 'light' && stealthImmune(def, now)){
    def.hitFlash = Math.max(def.hitFlash || 0, 0.18);
    pushFloat(def.x, def.y - UI.R*1.35, '潜行 · 免伤', '#c4a6ff', true);
    blip(220, 0.05, 0.14);
    return;
  }

  /* 格挡：完美格挡＝整段免伤并震开攻击者；普通格挡＝伤害减半 */
  if (!def.dead && def.guardEnd > now){
    const gm = guardMul(def, now);
    if (gm === 0){
      resolveGuard(def, att, now, true);
      def.hitFlash = Math.max(def.hitFlash || 0, 0.16);
      blip(300, 0.03, 0.08);
      return;
    }
    if (gm < 1){
      resolveGuard(def, att, now, false);
      dmg *= gm;
    }
  }

  /* 黑暗元素·被动「暗球护体」：受到致命伤害时消耗一颗暗球，黑雾裹身无敌；只有光明伤害能穿透 */
  if (def.elem === 'dark' && !def.dead){
    const isLight = (type === 'light') || !!(pr && pr.lightBreak);
    if (def.darkShellEnd > now && !isLight){
      def.hitFlash = 0.10;
      pushFloat(def.x, def.y - UI.R*1.35, '暗罩 · 完全免疫', '#caa8ff', true);
      bursts.push({ x:def.x, y:def.y, r:UI.R*1.2, to:UI.R*2.8, t:0, life:0.34, col:'#8d5cf0', ring:true });
      blip(300, 0.05, 0.10);
      return;
    }
    if (!isLight && def.orbs > 0 && def.darkShellEnd <= now && def.hp - dmg <= 0){
      def.orbs -= 1;
      def.darkShellEnd = now + ((ELEM.dark.passive && ELEM.dark.passive.shellMs) || 2000);
      def.hp = Math.max(def.hp, 1);
      pushFloat(def.x, def.y - UI.R*1.55, '暗球护体 · 剩 ' + def.orbs + ' 球', '#e6d6ff', true);
      bursts.push({ x:def.x, y:def.y, r:UI.R*1.6, to:UI.R*5.0, t:0, life:0.6, col:'#a97bff', ring:true });
      bursts.push({ x:def.x, y:def.y, r:UI.R*0.8, to:UI.R*3.0, t:0, life:0.5, col:'#5a2fa8', ring:false });
      blip(240, 0.16, 0.40);
      return;
    }
  }

  let frozeIce = false;
  // 水球打在冰上：水被冻成冰块，冰反而更强（不附着，冰甲强化）
  if (type === 'water' && def.elem === 'ice') frozeIce = true;

  def.hp -= dmg;
  def.hitFlash = 0.26;
  /* 冰·寒霜标记：冰伤害命中叠一层；雷命中直接清空并封锁 0.8s */
  if (type === 'ice'){
    frostAdd(def, now, 1);
    if (def.fireStacks){ def.fireLockEnd = now + 700; markClear(def, 'burn'); }   // 冰熄灼烧，0.7s 内无法叠加
  } else if (type === 'thunder'){
    if (def.rockArmor){ def.rockArmor = 0; def.rockArmorLockEnd = now + 750; }     // 雷击碎岩甲，0.75s 无法积攒
    if (def.collapseStacks){ markClear(def, 'collapse'); def.collapseLockEnd = now + 800; }   // 雷击清空坍缩
    if (def.frostStacks) frostClear(def, now);                                     // 雷劈清寒霜
    if (def.waterStacks) def.soakBoostEnd = now + 750;                             // 受雷：潮湿叠加翻倍
  }
  if (type === 'fire'){
    markAdd(def, now, 'burn', 1);
    if (def.windStacks){ def.windLockEnd = now + 700; markClear(def, 'wind'); }   // 火吹散紊风，0.7s 内无法叠加
  }
  else if (type === 'water') markAdd(def, now, 'soak', 1);
  else if (type === 'wind') markAdd(def, now, 'wind', 1);
  else if (type === 'blackhole'){
    markAdd(def, now, 'collapse', 1);
    def.collapseSrc = { x: att.x, y: att.y };                 // 单向引力：拉向暗涡晶核
    def.collapseBoost = (def.irradStacks > 0) ? 2 : 1;
  }
  else if (type === 'neutron'){
    markAdd(def, now, 'irrad', 1);
    if (def.collapseStacks > 0) def.irradStopEnd = now + 700;  // 受黑洞引力：传导暂停 0.7s
  }
  else if (type === 'rock'){
    markAdd(def, now, 'rock', 1);
    if ((def.rockStacks || 0) > 0 && att && now >= (att.rockArmorLockEnd || 0)){
      att.rockArmor = Math.min(3, (att.rockArmor || 0) + 1);       // 命中带岩蚀目标 → 攒一层岩甲
    }
  }
  const dcol = type === 'water' ? '#7fd2ff'
             : (type === 'iceSpike' ? '#9fe6ff'
             : (type === 'cyclone' ? '#a9ffe0'
             : (type === 'dark' ? '#b592ff'
             : (type === 'light' ? '#ffe9a8' : '#ffb066'))));
  pushFloat(def.x + rnd(-10,10), def.y - UI.R*0.6, elemMulMark(eMul) + fmtDmg(dmg), dcol, false);

  const dEl = ELEM[def.elem];
  if (type === 'thunder'){
    if (def.elem === 'ice'){                    // 冰：无法附着雷
      pushFloat(def.x, def.y - UI.R*1.3, '无法附着', '#cdf4ff', true);
    } else if (def.elem === 'fire'){            // 火：5% 概率触发超导爆炸
      if (Math.random() < SUPERCONDUCT_RATE){
        superconduct(def.x, def.y, att, def, now);
      } else {
        pushFloat(def.x, def.y - UI.R*1.3, '超导未触发', '#8ea0c4', true);
      }
    } else if (def.elem === 'water'){           // 水：持续电击 1/秒
      def.elecEnd = now + rnd(WET_MIN, WET_MAX);
      def.elecAcc = 0;
      def.thunderEnd = def.elecEnd; def.paralyzeAcc = 0;
      pushFloat(def.x, def.y - UI.R*1.3, '雷附着 · 持续电击', '#c9a6ff', true);
    } else {                                    // 风等：唯一能附着风的元素
      def.thunderEnd = now + rnd(WET_MIN, WET_MAX);
      def.paralyzeAcc = 0;
      pushFloat(def.x, def.y - UI.R*1.3, '雷附着', '#c9a6ff', true);
    }
  } else if (type === 'ice'){
    // 只有蓄力前刺（pr.freeze）才冻结，横劈/竖劈只吃伤害
    if (freeze) applyFreeze(def, now);
  } else if (type === 'iceSpike'){
    // 冰刺：本身挂「冰附着 · 减速」，再按目标身上的元素触发反应
    const hasWet  = def.wetEnd > now;
    const hasBurn = def.burnEnd > now;
    const hasElec = (def.elecEnd > now) || def.elem === 'thunder';
    if (def.elem === 'ice'){
      pushFloat(def.x, def.y - UI.R*1.3, '同源 · 无附着', '#cdf4ff', true);
    } else if (dEl.noAttach){
      pushFloat(def.x, def.y - UI.R*1.3, dEl.immuneText, '#9df0d5', true);
    } else if (hasWet){
      applyFreeze(def, now);
    } else if (hasBurn){
      def.hp -= dmg * ((pr.meltMul || 1.8) - 1);
      pushFloat(def.x, def.y - UI.R*1.3, '融化 ×' + (pr.meltMul || 1.8), '#ffd08a', true);
      def.slowEnd = Math.max(def.slowEnd, now + (pr.slow || 3500));
    } else if (hasElec){
      superconduct(def.x, def.y, att, def, now);
      pushFloat(def.x, def.y - UI.R*1.3, '超导', '#e0c0ff', true);
    } else {
      def.slowEnd = Math.max(def.slowEnd, now + (pr.slow || 3500));
      pushFloat(def.x, def.y - UI.R*1.3, '冰附着 · 减速', '#9fe6ff', true);
    }
  } else if (type === 'cyclone'){
    // 小旋风：风伤 + 只负责扩散别人的附着，自己不留元素
    spreadAttach(def, now);
    def.slowEnd = Math.max(def.slowEnd, now + (pr.slow || 2500));   // 风刃割到就减速
    const push2 = 170 * S;
    const a2 = Math.atan2(def.y - pr.y, def.x - pr.x);
    def.knockX = (def.knockX || 0) + Math.cos(a2) * push2;
    def.knockY = (def.knockY || 0) + Math.sin(a2) * push2;
    pushFloat(def.x, def.y - UI.R*1.3, '风·扩散', '#b6ffe4', true);
  } else if (type === 'fire'){
    if (dEl.burnImmune || dEl.noAttach){
      pushFloat(def.x, def.y - UI.R*1.3, dEl.immuneText, dEl.noAttach ? '#9df0d5' : '#8fd9ff', true);
    } else {
      def.burnEnd = now + rnd(BURN_MIN, BURN_MAX);
    }
    // 水被火烧过 → 变「烫水」10 秒，这 10 秒内不再被圣光灼蚀
    if (def.elem === 'water'){
      def.hotWaterEnd = now + HOT_WATER_MS;
      pushFloat(def.x, def.y - UI.R*1.75, '水被蒸成烫水 10s', '#ffc08a', true);
    }
  } else if (type === 'water'){
    if (dEl.noAttach){                          // 风：无法附着
      pushFloat(def.x, def.y - UI.R*1.3, dEl.immuneText, '#9df0d5', true);
    } else if (def.elem === 'ice'){             // 冰：不附着，水被冻成块，冰反而更强
      def.iceArmorEnd = now + 3000;
      pushFloat(def.x, def.y - UI.R*1.3, '无法附着', '#cdf4ff', true);
      pushFloat(def.x, def.y - UI.R*1.75, '水冻结成块 · 冰势+1', '#8fe8ff', false);
    } else {
      def.wetEnd = now + rnd(WET_MIN, WET_MAX);
      if (def.elem === 'thunder'){
        def.shockEnd = def.wetEnd;              // 雷被水附着 → 感电
        def.shockAcc = 0;
        pushFloat(def.x, def.y - UI.R*1.3, '感电', '#d9b8ff', true);
      } else if (def.elem === 'fire'){
        pushFloat(def.x, def.y - UI.R*1.3, '水附着 · 攻-1 减速', '#8fd9ff', true);
      }
    }
  } else if (type === 'dark'){
    // 影蚀：命中挂【蚀影】；若目标已有【显影】则两者互相对消
    if (def.revealEnd > now){
      def.revealEnd = 0;
      bursts.push({ x:def.x, y:def.y, r:UI.R*0.6, to:UI.R*3.2, t:0, life:0.42, col:'#d8d0ff', ring:true });
      bursts.push({ x:def.x, y:def.y, r:UI.R*0.5, to:UI.R*2.6, t:0, life:0.46, col:'#5f37b8', ring:false });
      pushFloat(def.x, def.y - UI.R*1.45, '显影 × 蚀影 · 互消', '#cbb8ff', true);
      def.hitFlash = 0.3;
      blip(520, 0.06, 0.12);
    } else if (def.elem !== 'dark'){
      def.shadowEnd = now + SHADOW_MS;
      def.shadowStacks = (pr && pr.stealthAmp) ? 2 : 1;
      pushFloat(def.x, def.y - UI.R*1.3, '蚀影 ×' + def.shadowStacks, '#9a74ff', true);
      bursts.push({ x:def.x, y:def.y, r:UI.R*0.35, to:UI.R*1.7, t:0, life:0.38, col:'#3a1f6e', ring:false });
    } else {
      pushFloat(def.x, def.y - UI.R*1.3, '同源 · 无标记', '#b9a6e8', true);
    }
  } else if (type === 'light'){
    // 显影：命中挂【显影】并照亮一小片；若目标已有【蚀影】则互相对消
    if (def.shadowEnd > now){
      def.shadowEnd = 0;
      def.shadowStacks = 0;
      bursts.push({ x:def.x, y:def.y, r:UI.R*0.6, to:UI.R*3.0, t:0, life:0.42, col:'#fff2c8', ring:true });
      bursts.push({ x:def.x, y:def.y, r:UI.R*0.5, to:UI.R*2.4, t:0, life:0.46, col:'#a98a3a', ring:false });
      pushFloat(def.x, def.y - UI.R*1.45, '蚀影 × 显影 · 互消', '#ffe9a8', true);
      def.hitFlash = 0.3;
      blip(660, 0.06, 0.12);
    } else if (def.elem !== 'light'){
      def.revealEnd = now + REVEAL_MS;
      addLightGlow(def.x, def.y, UI.R*2.6, 0.45);
      bursts.push({ x:def.x, y:def.y, r:UI.R*0.3, to:UI.R*1.5, t:0, life:0.3, col:'#fff0bf', ring:true });
      pushFloat(def.x, def.y - UI.R*1.3, '显影', '#ffe9a8', true);
    } else {
      pushFloat(def.x, def.y - UI.R*1.3, '同源 · 无标记', '#e8d79a', true);
    }
  }
  // 霜极巨剑期间：冰元素的一切命中都「强制冻结」（不必等冰附着/水反应，仍受冻结锁限制）
  if (att && att.elem === 'ice' && att.iceGiantEnd > now &&
      def.elem !== 'wind' && def.elem !== 'ice' && !def.dead && def.freezeEnd <= now){
    applyFreeze(def, now);
  }

  blip(type === 'water' ? 660 : 760, 0.05, 0.10);
  checkKO(def, now);
}

/* 超导爆炸：中心 25，外围 10；火与雷都在范围内会各自受伤 */
function superconduct(x, y, att, victim, now){
  const R = UI.R;
  bursts.push({ x, y, t:0, life:0.5 });
  allPlayers().forEach(pl=>{
    if (!pl || pl.dead) return;
    const d = Math.hypot(pl.x - x, pl.y - y);
    if (d <= R * 1.6){
      if (!stealthImmune(pl, now)) pl.hp -= 25;
      pushFloat(pl.x, pl.y - R*0.8, '25', '#ffd166', false);
    } else if (d <= R * 3.2){
      if (!stealthImmune(pl, now)) pl.hp -= 10;
      pushFloat(pl.x, pl.y - R*0.8, '10', '#ffb066', false);
    } else return;
    pl.hitFlash = 0.3;
    checkKO(pl, now);
  });
  pushFloat(x, y - R*1.9, '超导爆炸', '#ffe08a', true);
  blip(180, 0.25, 0.5);
}

/* 冰附着：除风外全部冻结 5 秒，摇杆挣扎可提前挣脱
   平衡：成功冻结一次后，该目标 30 秒内不能再被冻结（伤害/减速/冰附着照常，只锁冻结） */
function applyFreeze(def, now){
  if (def.elem === 'wind'){
    pushFloat(def.x, def.y - UI.R*1.3, '无法附着', '#9df0d5', true);
    return false;
  }
  if (now < (def.freezeLockEnd || 0)){
    const left = Math.ceil((def.freezeLockEnd - now) / 1000);
    pushFloat(def.x, def.y - UI.R*1.3, '冻结冷却中 ' + left + 's', '#9fb4d8', true);
    return false;
  }
  def.freezeEnd = now + FREEZE_MS;
  def.struggle = 0;
  def.jx = 0; def.jy = 0;
  // 霜极巨剑存在期间，冻结锁定缩短为 10 秒一次
  def.freezeLockEnd = now + (anyGiantActive(now) ? FREEZE_LOCK_GIANT_MS : FREEZE_LOCK_MS);
  pushFloat(def.x, def.y - UI.R*1.3, '冻结 5s · 冻结冷却 30s', '#cdf4ff', true);
  return true;
}

function checkKO(p, now){
  if (p.dead || p.hp > 0) return;
  p.hp = 0;
  p.dead = true;
  p.jx = 0; p.jy = 0; p.joyId = null;
  p.burnEnd = 0;
  projs = projs.filter(pr => pr.owner !== p);
  toast('P' + p.i + ' 被击倒');
  blip(300, 0.12, 0.4);
  const left = enemiesOf(p);
  if (left.length <= 1){
    overWin = left.length ? left[0].i : (p.i === 1 ? 2 : 1);
    st = ST.OVER;
    if (!winLock){                       // 三人混战 / 1v1 胜场记数（用于解锁）
      winLock = true;
      WINSTAT.add(mode === 'ffa' ? 'ffa' : 'duel');
      if (mode === 'solo' && overWin === 1 && soloDiff === 'hard' && !soloNightmareUnlocked){
        soloNightmareUnlocked = true;
        try { localStorage.setItem(SOLO_KEY, '1'); } catch(e){}
        toast('困难已通关 · 噩梦难度解锁');
      }
    }
  } else {
    toast('P' + p.i + ' 出局 · 剩余 ' + left.length + ' 人');
  }
}

/* ========================= 电脑 P3 ========================= */
/* 线段是否被石柱挡住（用于电脑绕柱走位） */
function pathBlocked(ax, ay, bx, by, rad){
  const dx = bx-ax, dy = by-ay;
  const len2 = dx*dx + dy*dy || 1;
  for (const o of MAP.pillars){
    let t = ((o.x-ax)*dx + (o.y-ay)*dy) / len2;
    t = Math.max(0.35, Math.min(1, t));   // 忽略起点附近的判定，避免自己贴着柱子时永远算“被挡”
    const px = ax + dx*t, py = ay + dy*t;
    if (Math.hypot(o.x-px, o.y-py) < o.r + rad) return true;
  }
  return false;
}

function aiThink(p, dt, now){
  if (!p || p.dead) return;
  if (now < p.paralyzeEnd || now < p.freezeEnd) return;   // 被控住就原地
  const q = otherOf(p);
  if (!q){ p.jx = 0; p.jy = 0; return; }
  const R = UI.R;
  const atk = ELEM[p.elem].atk;
  if (!atk){ p.jx = 0; p.jy = 0; return; }

  const d = Math.hypot(q.x - p.x, q.y - p.y);
  // 贴身近战必须压到 2.05R（角色最小间距就是 2R），否则永远差一点打不到
  const want = atk.kind === 'combo' ? R*2.05 : (atk.kind === 'whip' ? R*3.6 : R*6.2);
  const ang = Math.atan2(q.y - p.y, q.x - p.x);
  const aiCfg = p.aiCfg || SOLO_DIFF.normal;
  const thinkRange = aiCfg.think || [650, 1150];
  if (!p.aiPlanAt || now >= p.aiPlanAt){
    p.aiPlanAt = now + rnd(thinkRange[0], thinkRange[1]);
    p.aiPlan = Math.random();
    p.aiPlanDone = false;
  }

  if (d > want){
    // 靠近：贴着石柱时先往外+沿切线脱困，否则直线朝目标走
    const touch = MAP.pillars.find(o => Math.hypot(p.x-o.x, p.y-o.y) < o.r + R*1.12);
    if (touch){
      const out = Math.atan2(p.y-touch.y, p.x-touch.x);
      const tan1 = out + Math.PI/2, tan2 = out - Math.PI/2;
      const tan = Math.abs(angDiff(tan1, ang)) < Math.abs(angDiff(tan2, ang)) ? tan1 : tan2;
      // 向外 + 切向混合，避免一直顶着柱子原地摩擦
      const vx = Math.cos(out)*0.85 + Math.cos(tan)*0.55;
      const vy = Math.sin(out)*0.85 + Math.sin(tan)*0.55;
      p.jx = vx; p.jy = vy;
      p.face = q.x > p.x ? 1 : -1;
      return;
    }
    // 前方 1.5R 有柱子就偏转绕行，避免走进死角
    const look = R*1.5;
    let dirOK = ang;
    if (pillarAt(p.x + Math.cos(ang)*look, p.y + Math.sin(ang)*look, R*1.0)){
      for (let k=1; k<=7; k++){
        const a1 = ang + k*0.4, a2 = ang - k*0.4;
        if (!pillarAt(p.x + Math.cos(a1)*look, p.y + Math.sin(a1)*look, R*1.0)){ dirOK = a1; break; }
        if (!pillarAt(p.x + Math.cos(a2)*look, p.y + Math.sin(a2)*look, R*1.0)){ dirOK = a2; break; }
      }
    }
    p.jx = Math.cos(dirOK); p.jy = Math.sin(dirOK);
    p.face = q.x > p.x ? 1 : -1;
    return;
  }

  p.jx = 0; p.jy = 0;
  p.face = q.x > p.x ? 1 : -1;

  // 随机释放二技能 / 大招（CD 未好时调用直接返回 false，不产生副作用）
  if (!p.aiPlanDone && now >= (p.aiSkillAt || 0)){
    p.aiSkillAt = now + rnd(600, 1300);
    const roll = Math.random();
    const skillP = aiCfg.skill || 0.30;
    if (roll < skillP && d < R*7.5) useSkill2(p, now);
    else if (roll < skillP + 0.14 && d < R*8.5) useUlt(p, now);
    p.aiPlanDone = true;
  }

  if (atk.kind === 'charge'){
    // 电脑也会蓄力：蓄到 1.4~2 秒或目标贴近就放
    if (!p.charging) windChargeStart(p);
    else if (p.chargeT >= 1.4 || d < R * 2.2) windChargeRelease(p, now);
    return;
  }
  // 一技能：范围技能贴身/中距离放，直线弹远一点放
  if (ELEM[p.elem].skill && now >= p.skill1End &&
      d < R * (ELEM[p.elem].skill.kind === 'elecRing' ? 2.2 : (ELEM[p.elem].skill.kind === 'firePool' ? 4.2 : 7.5))){
    if (Math.hypot(p.jx, p.jy) < 0.2){ p.jx = q.x - p.x; p.jy = q.y - p.y; }
    useSkill(p, now);
    p.jx = 0; p.jy = 0;
  }
  if (now >= p.atkEnd){
    // 雷鞭需要摇杆方向，临时指向目标
    if (atk.kind === 'whip'){ p.jx = q.x - p.x; p.jy = q.y - p.y; }
    basicAttack(p, now);
    p.jx = 0; p.jy = 0;
  }
}

function updateCombat(dt, now){
  const R = UI.R;
  // 弹体推进
  for (let i = projs.length-1; i>=0; i--){
    const pr = projs[i];
    if (pr.life <= 0){ projs.splice(i,1); continue; }

    // 轻微追踪：发射后向目标缓慢修正角度
    const q = otherOf(pr.owner);
    if (q && !q.dead){
      const want = Math.atan2(q.y - pr.y, q.x - pr.x);
      const cur = Math.atan2(pr.vy, pr.vx);
      let diff = want - cur;
      while (diff > Math.PI) diff -= Math.PI*2;
      while (diff < -Math.PI) diff += Math.PI*2;
      const rate = pr.turn || 0.9;                 // 火苗轻追，水球中度追踪
      const turn = clamp(diff, -rate*dt, rate*dt);
      const spd = Math.hypot(pr.vx, pr.vy);
      const ang = cur + turn;
      pr.vx = Math.cos(ang) * spd;
      pr.vy = Math.sin(ang) * spd;
    }

    const dx = pr.vx*dt, dy = pr.vy*dt;
    pr.x += dx; pr.y += dy;
    pr.travelled += Math.hypot(dx, dy);
    pr.life -= dt;

    // 射程到顶，熄灭（水球无射程限制，只按寿命回收）
    if (pr.travelled >= pr.maxDist){ projs.splice(i,1); continue; }

    // 撞地图石柱
    if (pillarAt(pr.x, pr.y, pr.r)){
      for (let k=0; k<4; k++) sparkBetween({x:pr.x,y:pr.y}, {x:pr.x+rnd(-20,20), y:pr.y+rnd(-20,20)}, 0);
      projs.splice(i,1);
      continue;
    }
    for (const target of enemiesOf(pr.owner)){
      const tDist = Math.hypot(target.x - pr.ox, target.y - pr.oy);
      const inRange = isFinite(pr.maxDist) ? tDist <= pr.maxDist : true;
      if (inRange && dist(pr, target) < R*0.95 + pr.r){
        if (pr.type === 'cyclone'){
          const last = pr.hits[target.i] || -99999;
          if (now - last < (pr.hitGap || 500)) continue;   // 同一目标 0.5s 才吃一次
          pr.hits[target.i] = now;
          hitEnemy(pr.owner, target, now, pr);
          break;                       // 旋风不消失，可以反复割
        }
        hitEnemy(pr.owner, target, now, pr);
        projs.splice(i,1);
        break;
      }
    }
  }

  // 灼烧结算（0.5/秒）
  allPlayers().forEach(p=>{
    if (!p || p.dead) return;
    if (now < p.burnEnd){
      if (!stealthImmune(p, now)) p.hp -= BURN_DPS * dt;
      p.burnAcc += dt;
      if (p.burnAcc >= 0.5){
        p.burnAcc = 0;
        pushFloat(p.x + rnd(-12,12), p.y - R*0.9, '-' + BURN_DPS.toFixed(1), '#ff8a4a', true);
      }
      checkKO(p, now);
    } else {
      p.burnEnd = 0;
    }
  });

  // 水附着过期 & 感电放电
  allPlayers().forEach(p=>{
    if (!p || p.dead) return;
    if (p.wetEnd && now >= p.wetEnd){ p.wetEnd = 0; p.shockEnd = 0; }
    if (now < p.shockEnd){
      p.shockAcc += dt;
      if (p.shockAcc >= 0.5){
        p.shockAcc = 0;
        const q = otherOf(p);
        if (q && !q.dead && dist(p, q) <= R * SHOCK_RADIUS){
          if (!stealthImmune(q, now)) q.hp -= SHOCK_DPS;
          q.hitFlash = 0.22;
          pushFloat(q.x + rnd(-10,10), q.y - R*0.7, '-' + SHOCK_DPS, '#c9a6ff', true);
          sparkBetween(p, q, R);
          blip(980, 0.04, 0.09);
          checkKO(q, now);
        }
      }
    } else {
      p.shockAcc = 0;
    }
  });

  // 雷附着 / 电击 / 冻结计时
  allPlayers().forEach(p=>{
    if (!p || p.dead) return;
    if (p.thunderEnd){
      if (now >= p.thunderEnd){ p.thunderEnd = 0; p.paralyzeAcc = 0; }
      else if (now >= p.paralyzeEnd){
        // 雷附着每满 2 秒，麻痹 0.5 秒无法移动
        p.paralyzeAcc += dt;
        if (p.paralyzeAcc >= 2){
          p.paralyzeAcc -= 2;
          p.paralyzeEnd = now + 500;
          pushFloat(p.x, p.y - UI.R*1.25, '麻痹', '#c9a6ff', true);
          blip(1200, 0.05, 0.1);
        }
      }
    }
    if (p.elecEnd){
      if (now >= p.elecEnd){
        p.elecEnd = 0; p.elecAcc = 0;
      } else {
        p.elecAcc += dt;
        if (p.elecAcc >= 1){                 // 1 点 / 秒
          p.elecAcc -= 1;
          if (!stealthImmune(p, now)) p.hp -= 1;
          p.hitFlash = 0.2;
          pushFloat(p.x + rnd(-10,10), p.y - R*0.75, '-1', '#c9a6ff', true);
          for (let k=0; k<2; k++) sparkBetween({x:p.x + rnd(-R*0.4,R*0.4), y:p.y + rnd(-R*0.4,R*0.4)}, p, R);
          blip(1040, 0.03, 0.07);
          checkKO(p, now);
        }
      }
    }
    if (p.freezeEnd && now >= p.freezeEnd){ p.freezeEnd = 0; p.struggle = 0; }
  });

  // 冰痕（前刺轨迹）伤害
  iceFx.forEach(fx=>{
    if (fx.kind !== 'trail' || fx.hit || fx.t > 0.22) return;
    if (!fx.owner) return;
    enemiesOf(fx.owner).forEach(q=>{
      if (fx.hits && fx.hits[q.i]) return;
      if (Math.hypot(q.x - fx.x, q.y - fx.y) < UI.R*0.8){
        fx.hits = fx.hits || {};
        fx.hits[q.i] = 1;
        strikeEnemy(fx.owner, q, now, { type:'ice', dmg: fx.dmg, freeze:true });
      }
    });
  });

  // 鞭 / 冰 / 爆炸特效计时
  whips.forEach(w=> w.t += dt);
  whips = whips.filter(w=> w.t < w.life);
  iceFx.forEach(fx=> fx.t += dt);
  iceFx = iceFx.filter(fx=> fx.t < fx.life);
  bursts.forEach(b=> b.t += dt);
  updateFields(now, dt);
  updateLeiStorms(now, dt);
  updateLeiPrisons(now, dt);
  updateIceFields(now, dt);
  updateFrost(now, dt);
  updateMarks(now, dt);
  updateVortexes(now, dt);
  updateElemFields(now, dt);
  updateBHDevour(now, dt);
  updateWindBlades(now, dt);
  updateWindTracks(now, dt);
  updateWindTraces(now);
  updateRockWalls(now, dt);
  updateRockSpikes(now, dt);
  updateRockPlates(now, dt);
  updateBHWells(now, dt); updateBHRifts(now, dt); updateBHUlts(now, dt);
  updateNSBeams(now, dt); updateNSTracks(now, dt); updateNSUlts(now, dt); updateIrradConduction(now);
  updatePlayerTrails(now);
  updateLightUlts(now, dt); updateDarkUlts(now, dt);
  updateFirePts(now, dt);
  updateFireSeeds(now, dt);
  updateWildFires(now, dt);
  updateTethers(now, dt);
  updateTides(now, dt);
  updateRockCols(now);
  [p1,p2,p3].forEach(p=>{
    if (p && p.elem === 'water' && p.waterPending && now >= p.skill1End){
      p.waterMode = p.waterPending; p.waterPending = null;
    }
  });
  windFx.forEach(b=> b.t += dt);
  for (let i=windFx.length-1; i>=0; i--) if (windFx[i].t >= windFx[i].dur) windFx.splice(i,1);
  bursts = bursts.filter(b=> b.t < b.life);

  // 感电弧光
  sparks.forEach(sp=> sp.t += dt);
  sparks = sparks.filter(sp=> sp.t < sp.life);

  // 飘字
  floats.forEach(f=> f.t += dt);
  floats = floats.filter(f=> f.t < f.life);
}

  ctx.beginPath(); ctx.arc(W/2, cy, rr*1.5, t*0.6, t*0.6 + Math.PI*1.2);
  ctx.strokeStyle = 'rgba(80,150,255,0.35)'; ctx.lineWidth = 2*S; ctx.stroke();
  ctx.fillStyle = 'rgba(120,220,255,'+(0.6+0.25*Math.sin(t*2))+')';
  ctx.beginPath(); ctx.arc(W/2, cy, 3.2*S, 0, Math.PI*2); ctx.fill();

  // 开始游戏按钮
  const b = introBtn();
  const pulse = 0.55 + 0.45*Math.sin(t*2.2);
  rrPath(b.x-6*S, b.y-6*S, b.w+12*S, b.h+12*S, (b.h+12*S)/2);
  ctx.fillStyle = 'rgba(70,180,255,'+(0.10+pulse*0.12)+')'; ctx.fill();
  rrPath(b.x, b.y, b.w, b.h, b.h/2);

  grd.addColorStop(0, 'rgba(70,190,255,0.85)');
  grd.addColorStop(1, 'rgba(30,110,220,0.85)');
  ctx.fillStyle = grd; ctx.fill();
  ctx.strokeStyle = 'rgba(190,235,255,'+(0.7+0.3*pulse)+')'; ctx.lineWidth = 1.6*S; ctx.stroke();
  font(22, 700); ctx.fillStyle = '#ffffff';
  ctx.fillText('开始游戏', W/2, b.y + b.h*0.62);
  font(9, 500); ctx.fillStyle = 'rgba(220,240,255,0.8)';
  ctx.fillText('START GAME', W/2, b.y + b.h*0.86);

  // 图鉴已开放，其余入口仍灰
  introGhostBtns().forEach(g=>{
    const on = g.id === 'codex';
    rrPath(g.x, g.y, g.w, g.h, g.h/2);
    ctx.fillStyle = on ? 'rgba(60,130,220,0.20)' : 'rgba(26,32,44,0.85)'; ctx.fill();
    ctx.strokeStyle = on ? 'rgba(160,215,255,0.75)' : 'rgba(90,105,130,0.5)';
    ctx.lineWidth = 1.2*S; ctx.stroke();
    font(11, on ? 600 : 500);
    ctx.fillStyle = on ? '#dcebff' : 'rgba(150,165,185,0.75)';
    ctx.fillText(on ? g.label : g.label + ' · 开发中', g.x + g.w/2, g.y + g.h/2 + 4*S);
  });

  font(9, 500); ctx.fillStyle = 'rgba(110,135,170,0.65)';
  ctx.fillText('点击开始游戏进入主页面', W/2, H*0.70);
}

/* ---------- 首页：单人模式选元素与难度 ---------- */
function soloLayout(){
  const top = UI.hud + Math.round(14*S);
  const cardAreaW = W*0.54;
  const cols = 5, rows = 2;
  const pad = Math.round(16*S);
  const gap = Math.round(9*S);
  const cw = (cardAreaW - pad*2 - gap*(cols-1)) / cols;
  const bodyH = H - top - Math.round(66*S);
  const ch = (bodyH - pad*2 - gap*(rows-1)) / rows;
  const cards = ALL_KEYS.map((k,i)=>({
    key:k,
    x: pad + (i%cols)*(cw+gap),
    y: top + pad + Math.floor(i/cols)*(ch+gap),
    w: cw, h: ch
  }));
  const dx = W*0.60;
  const dw = W - dx - Math.round(16*S);
  const dbH = Math.round(40*S), dgap = Math.round(10*S);
  const dy0 = top + Math.round(28*S);
  const diffs = [
    { id:'simple', x:dx, y:dy0, w:dw, h:dbH },
    { id:'normal', x:dx, y:dy0+dbH+dgap, w:dw, h:dbH },
    { id:'hard',   x:dx, y:dy0+(dbH+dgap)*2, w:dw, h:dbH },
    { id:'nightmare', x:dx, y:dy0+(dbH+dgap)*3, w:dw, h:dbH }
  ];
  return {
    cards, diffs,
    start:{ x: dx, y: H - Math.round(58*S), w: dw, h: Math.round(40*S) },
    back:{ x: W/2 - Math.round(50*S), y: H - Math.round(58*S), w: Math.round(100*S), h: Math.round(40*S) }
  };
}

function drawSolo(t){
  bgGrid(0.18);
  const g = ctx.createRadialGradient(W/2, H*0.4, 0, W/2, H*0.4, Math.max(W,H)*0.6);
  g.addColorStop(0, 'rgba(50,110,200,0.22)');
  g.addColorStop(1, 'rgba(5,7,12,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  const L = soloLayout();
  ctx.textAlign = 'left';
  font(17, 700); ctx.fillStyle = '#eaf2ff';
  ctx.fillText('单人模式', 18*S, UI.hud + 4*S);
  font(9.5, 500); ctx.fillStyle = 'rgba(140,170,215,0.8)';
  ctx.fillText('选择你的元素 · 对战 AI', 18*S, UI.hud + 18*S);

  L.cards.forEach(c=>{
    const el = ELEM[c.key];
    const on = soloPick === c.key;
    rrPath(c.x, c.y, c.w, c.h, 9*S);
    ctx.fillStyle = on ? el.color+'33' : 'rgba(18,25,40,0.92)';
    ctx.fill();
    ctx.strokeStyle = on ? el.color : 'rgba(80,100,135,0.55)';
    ctx.lineWidth = on ? 2*S : 1*S; ctx.stroke();
    const cx = c.x + c.w/2, cy = c.y + c.h*0.36;
    const rr2 = Math.min(c.w, c.h)*0.19;
    const gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, rr2*2);
    gr.addColorStop(0, el.color); gr.addColorStop(1, el.color+'00');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(cx, cy, rr2*2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0b1020'; ctx.beginPath(); ctx.arc(cx, cy, rr2, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = el.color; ctx.lineWidth = 1.6*S; ctx.stroke();
    ctx.textAlign = 'center';
    font(12); ctx.fillStyle = el.color;
    ctx.fillText(el.name, cx, cy + 4*S);
  });

  // 难度标题
  ctx.textAlign = 'left';
  font(12, 700); ctx.fillStyle = 'rgba(200,220,255,0.95)';
  ctx.fillText('AI 难度', L.diffs[0].x, L.diffs[0].y - 10*S);

  L.diffs.forEach(d=>{
    const cfg = SOLO_DIFF[d.id];
    const locked = d.id === 'nightmare' && !soloNightmareUnlocked;
    const on = soloDiff === d.id && !locked;
    rrPath(d.x, d.y, d.w, d.h, 10*S);
    ctx.fillStyle = locked ? 'rgba(26,28,36,0.9)' : (on ? 'rgba(60,110,190,0.55)' : 'rgba(22,30,46,0.9)');
    ctx.fill();
    ctx.strokeStyle = locked ? 'rgba(95,100,120,0.55)' : (on ? 'rgba(160,210,255,0.9)' : 'rgba(90,120,165,0.55)');
    ctx.lineWidth = on ? 1.8*S : 1*S; ctx.stroke();
    ctx.textAlign = 'left';
    font(12, 700); ctx.fillStyle = locked ? 'rgba(150,155,170,0.8)' : '#eaf2ff';
    ctx.fillText((locked ? '🔒 ' : '') + cfg.name, d.x + 12*S, d.y + d.h*0.52);
    font(9, 500); ctx.fillStyle = locked ? 'rgba(135,140,155,0.75)' : 'rgba(165,190,225,0.85)';
    ctx.fillText(locked ? '未解锁' : cfg.tag, d.x + 12*S, d.y + d.h*0.82);
    if (locked){
      // 锁图标
      ctx.strokeStyle = 'rgba(180,190,210,0.7)'; ctx.lineWidth = 1.2*S;
      const lx = d.x + d.w - 22*S, ly = d.y + d.h*0.5;
      rrPath(lx-6*S, ly-2*S, 12*S, 10*S, 2*S); ctx.stroke();
      ctx.beginPath(); ctx.arc(lx, ly-2*S, 4*S, Math.PI, 0); ctx.stroke();
    }
    if (on){
      font(8.5, 600); ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(190,230,255,0.9)';
      ctx.fillText('已选择', d.x + d.w - 10*S, d.y + d.h*0.52);
    }
  });

  if (soloHintMs > performance.now()){
    font(9, 500); ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,200,140,0.9)';
    ctx.fillText('噩梦难度：通关「困难」后自动解锁', L.diffs[0].x, L.diffs[3].y + L.diffs[3].h + 14*S);
  }

  // 开始
  const b = L.start, ready = !!soloPick;
  rrPath(b.x, b.y, b.w, b.h, b.h/2);
  ctx.fillStyle = ready ? 'rgba(70,190,255,0.8)' : 'rgba(48,58,76,0.65)';
  ctx.fill();
  ctx.strokeStyle = ready ? 'rgba(190,235,255,0.9)' : 'rgba(100,115,145,0.6)'; ctx.lineWidth = 1.2*S; ctx.stroke();
  ctx.textAlign = 'center';
  font(14, 700); ctx.fillStyle = '#ffffff';
  ctx.fillText(ready ? '开始对战' : '请先选择元素', b.x + b.w/2, b.y + b.h*0.64);

  // 返回
  const bk = L.back;
  rrPath(bk.x, bk.y, bk.w, bk.h, bk.h/2);
  ctx.fillStyle = 'rgba(30,38,54,0.85)'; ctx.fill();
  ctx.strokeStyle = 'rgba(110,140,180,0.6)'; ctx.lineWidth = 1*S; ctx.stroke();
  font(12, 600); ctx.fillStyle = 'rgba(200,215,240,0.9)';
  ctx.fillText('返回', bk.x + bk.w/2, bk.y + bk.h*0.64);
  ctx.textAlign = 'center';
}

function drawHome(t){
  ctx.fillStyle = '#05070e'; ctx.fillRect(0,0,W,H);
  bgGrid(0.20);
  const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.62);

  g.addColorStop(0.6, 'rgba(30,60,120,0.12)');
  g.addColorStop(1, 'rgba(5,7,12,0)');

  // 扫描线 & 悬浮数据点，提升科技感

    const y = (i*23 + t*14) % H;
    ctx.fillStyle = 'rgba(90,170,255,0.05)';
    ctx.fillRect(0, y, W, 1);
  }
  for (let i=0;i<30;i++){

    ctx.fillStyle = 'rgba(140,205,255,'+(0.12+0.15*Math.abs(Math.sin(t*0.6+i)))+')';
    ctx.fillRect(px, py, 1.5*S, 1.5*S);
  }
  ctx.strokeStyle = 'rgba(90,180,255,0.28)'; ctx.lineWidth = 1*S;
  const mm = 12*S, ln = 20*S;
  [[mm,mm,1,1],[W-mm,mm,-1,1],[mm,H-mm,1,-1],[W-mm,H-mm,-1,-1]].forEach(c=>{
    ctx.beginPath();
    ctx.moveTo(c[0], c[1]+c[3]*ln); ctx.lineTo(c[0], c[1]); ctx.lineTo(c[0]+c[2]*ln, c[1]);
    ctx.stroke();
  });
  ctx.textAlign = 'left';
  font(8.5, 600); ctx.fillStyle = 'rgba(100,185,255,0.55)';
  ctx.fillText('ELEMENTAL CORE · STABLE', mm + 12*S, H - mm - 6*S);

  ctx.textAlign = 'center';
  // 进入提示：放在标题正上方，间距取标题字高的一半左右，不贴不撞

  ctx.fillText('点击进入 · 同屏对战 · 自动横屏', W/2, H*0.22 - 34*S);

  font(44); ctx.fillStyle = '#f4f8ff';
  ctx.fillText('元素对决', W/2, H*0.22);
  font(14, 600); ctx.fillStyle = '#a9dcff';
  ctx.fillText('元初 · 万素始源', W/2, H*0.22 + 26*S);
  font(8.5, 500); ctx.fillStyle = 'rgba(140,165,205,0.82)';
  ctx.fillText('ELEMENTAL DUEL · ORIGIN OF ALL ELEMENTS', W/2, H*0.22 + 42*S);

  const orbsY = H*0.40;
  const gapx = Math.min(W*0.125, 88*S);
  KEYS.forEach((k,i)=>{
    const x = W/2 + (i-2)*gapx;
    const el = ELEM[k];
    const pr = 13*S;
    const bobY = Math.sin(t*1.6 + i*1.2) * 3*S;
    const gr = ctx.createRadialGradient(x, orbsY+bobY, 0, x, orbsY+bobY, pr*2.6);
    gr.addColorStop(0, el.color + 'cc');
    gr.addColorStop(1, el.color + '00');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(x, orbsY+bobY, pr*2.6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0b1020';
    ctx.beginPath(); ctx.arc(x, orbsY+bobY, pr, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = el.color; ctx.lineWidth = 2*S; ctx.stroke();
    font(12); ctx.fillStyle = el.color;
    ctx.fillText(el.name, x, orbsY + bobY + 4.5*S);
  });

  // 预告入口（左上角单独按键）
  const pb = previewBtnRect();
  rrPath(pb.x, pb.y, pb.w, pb.h, pb.h/2);
  ctx.fillStyle = 'rgba(60,66,82,0.55)'; ctx.fill();
  ctx.strokeStyle = 'rgba(110,120,140,0.5)'; ctx.lineWidth = 1.1*S; ctx.stroke();
  font(11.5, 600); ctx.fillStyle = 'rgba(150,160,180,0.8)';
  ctx.fillText('预告 · 下版本开放', pb.x + pb.w/2, pb.y + pb.h/2 + 4*S);

  // 兑换码入口（主页面单独入口）
  const cb = codeBtnRect();
  rrPath(cb.x, cb.y, cb.w, cb.h, cb.h/2);
  ctx.fillStyle = codeUnlocked ? 'rgba(80,200,150,0.18)' : 'rgba(70,120,200,0.14)';
  ctx.fill();
  ctx.strokeStyle = codeUnlocked ? 'rgba(120,240,190,0.75)' : 'rgba(140,190,255,0.55)';
  ctx.lineWidth = 1.2*S; ctx.stroke();
  font(12.5, 600); ctx.fillStyle = codeUnlocked ? '#9df5cf' : '#cfe0ff';
  ctx.fillText(codeUnlocked ? '兑换码 · 黑洞已解锁' : '兑换码', cb.x + cb.w/2, cb.y + cb.h/2 + 4.5*S);

  // 元素图鉴入口
  const xb = codexBtnRect();
  rrPath(xb.x, xb.y, xb.w, xb.h, xb.h/2);
  ctx.fillStyle = 'rgba(80,140,230,0.16)'; ctx.fill();
  ctx.strokeStyle = 'rgba(150,200,255,0.6)'; ctx.lineWidth = 1.2*S; ctx.stroke();
  font(12.5, 600); ctx.fillStyle = '#d7e7ff';
  ctx.fillText('元素图鉴', xb.x + xb.w/2, xb.y + xb.h/2 + 4.5*S);

  const cy = homeBtnY(), R = homeBtnR();
  const pulse = 0.5 + 0.5*Math.sin(t*3);
  ctx.beginPath(); ctx.arc(W/2, cy, R*1.10, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(90,190,255,'+(0.08 + pulse*0.10)+')';
  ctx.lineWidth = 2*S; ctx.stroke();

  const bw = R*1.9, bh = R*1.0;
  const bgr = ctx.createLinearGradient(W/2-bw/2, cy, W/2+bw/2, cy);
  bgr.addColorStop(0, 'rgba(40,120,220,0.30)');
  bgr.addColorStop(0.5, 'rgba(70,190,255,0.55)');
  bgr.addColorStop(1, 'rgba(40,120,220,0.30)');
  rrPath(W/2-bw/2, cy-bh/2, bw, bh, bh/2);
  ctx.fillStyle = bgr; ctx.fill();
  ctx.strokeStyle = 'rgba(150,225,255,0.9)'; ctx.lineWidth = 1.5*S; ctx.stroke();

  const arm = bh*0.30, off = bh*0.26;
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3*S; ctx.lineCap = 'round';
  [-1, 1].forEach(sgn=>{
    const bx = W/2 + sgn*off;
    ctx.beginPath(); ctx.moveTo(bx - sgn*arm, cy); ctx.lineTo(bx + sgn*arm, cy); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(bx + sgn*arm - sgn*arm*0.55, cy - arm*0.55);
    ctx.lineTo(bx + sgn*arm, cy);
    ctx.lineTo(bx + sgn*arm - sgn*arm*0.55, cy + arm*0.55);
    ctx.stroke();
  });

  font(10, 500); ctx.fillStyle = 'rgba(255,180,120,0.8)';
  ctx.fillText('元素遗迹 · 石砖地面 ｜ 左上角可切试验场', W/2, cy + R*1.05);

  modeBtns().forEach(b=>{
    const on = b.id === mode;
    rrPath(b.x, b.y, b.w, b.h, b.h/2);
    ctx.fillStyle = on ? 'rgba(70,120,200,0.55)' : 'rgba(24,31,48,0.85)';
    ctx.fill();
    ctx.strokeStyle = on ? 'rgba(150,205,255,0.9)' : 'rgba(90,110,150,0.5)';
    ctx.lineWidth = on ? 1.6*S : 1*S; ctx.stroke();
    font(12, on ? 700 : 500); ctx.fillStyle = on ? '#ffffff' : 'rgba(165,180,210,0.85)';
    ctx.fillText(b.label, b.x + b.w/2, b.y + b.h*0.66);
  });
  font(9, 500); ctx.fillStyle = 'rgba(120,145,180,0.7)';
  ctx.fillText('元素遗迹 · 1v1 / 三人混战 / 单人挑战', W/2, H*0.955);

  drawGearBtn();
  drawVersionTag();
}
